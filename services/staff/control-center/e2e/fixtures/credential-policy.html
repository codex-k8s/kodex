<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка режима ключей</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { i18n } from "../../src/app/i18n/index";
      import { loadRuntimeConfig } from "../../src/shared/config/runtime";
      import { configureApiClient } from "../../src/shared/api/client";
      import IntegrationCredentialPolicyControl from "../../src/features/integrations/ui/IntegrationCredentialPolicyControl.vue";
      import {
        policyConnection,
        policyDefinition,
      } from "./credential-policy-data";
      import "../../src/app/styles/base.css";
      await loadRuntimeConfig();
      configureApiClient();
      const connection = new URLSearchParams(location.search).has("readonly")
        ? { ...policyConnection, nextActions: ["OPEN"] }
        : policyConnection;
      createApp({
        setup() {
          return () =>
            h("main", { style: "padding:24px;max-width:1000px;margin:auto;" }, [
              h("h1", "Режим ключей synthetic подключения"),
              h(IntegrationCredentialPolicyControl, {
                connection,
                definition: policyDefinition,
              }),
            ]);
        },
      })
        .use(i18n)
        .mount("#app");
    </script>
  </body>
</html>
