<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка карточек каталогов</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { createRouter, createMemoryHistory } from "vue-router";
      import { i18n } from "../../src/app/i18n/index";
      import "../../src/app/styles/base.css";
      import CardsFixture from "./CardsFixture.vue";
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [{ path: "/:pathMatch(.*)*", component: CardsFixture }],
      });
      await router.push("/");
      await router.isReady();
      createApp(CardsFixture).use(router).use(i18n).mount("#app");
    </script>
  </body>
</html>
