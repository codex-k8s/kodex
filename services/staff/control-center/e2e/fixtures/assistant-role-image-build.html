<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка восстановления образа помощника</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { createMemoryHistory, createRouter } from "vue-router";
      import { i18n } from "../../src/app/i18n/index";
      import { configureApiClient } from "../../src/shared/api/client";
      import { loadRuntimeConfig } from "../../src/shared/config/runtime";
      import "../../src/app/styles/base.css";
      import AssistantRoleImageBuildFixture from "./AssistantRoleImageBuildFixture.vue";

      await loadRuntimeConfig();
      configureApiClient();
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [
          {
            path: "/projects/:projectRef/role-images/:recipeRef",
            name: "role-image",
            component: AssistantRoleImageBuildFixture,
          },
        ],
      });
      createApp(AssistantRoleImageBuildFixture)
        .use(router)
        .use(i18n)
        .mount("#app");
    </script>
  </body>
</html>
