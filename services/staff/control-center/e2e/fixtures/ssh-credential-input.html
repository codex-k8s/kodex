<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Однократный ввод SSH-ключа</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import { i18n } from "../../src/app/i18n/index";
      import IntegrationCredentialField from "../../src/features/integrations/ui/IntegrationCredentialField.vue";
      import { usesMultilineSSHCredential } from "../../src/features/integrations/credential-input";
      import "../../src/app/styles/base.css";
      const definition = ref("ssh-managed");
      const value = ref("");
      createApp({
        setup() {
          return () =>
            h("main", { style: "padding:24px;max-width:800px;margin:auto" }, [
              h("label", { for: "synthetic-definition" }, "Профиль ввода"),
              h(
                "select",
                {
                  id: "synthetic-definition",
                  value: definition.value,
                  onChange(event) {
                    definition.value = event.target.value;
                    value.value = "";
                  },
                },
                ["ssh-managed", "ssh-execute", "sentry"].map((key) =>
                  h("option", { value: key }, key),
                ),
              ),
              h(
                "form",
                {
                  onSubmit(event) {
                    event.preventDefault();
                    value.value = "";
                  },
                },
                [
                  h(IntegrationCredentialField, {
                    modelValue: value.value,
                    credentialSecretKey: usesMultilineSSHCredential(
                      definition.value,
                    )
                      ? "private_key"
                      : "api_token",
                    multiline: usesMultilineSSHCredential(definition.value),
                    "onUpdate:modelValue": (next) => {
                      value.value = next;
                    },
                  }),
                  h("button", { type: "submit" }, "Завершить однократный ввод"),
                ],
              ),
            ]);
        },
      })
        .use(i18n)
        .mount("#app");
    </script>
  </body>
</html>
