<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка интерфейса MVP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { createPinia } from "pinia";
      import { createRouter, createMemoryHistory } from "vue-router";
      import { i18n } from "../../src/app/i18n/index";
      import "../../src/app/styles/base.css";
      import UiProofFixture from "./UiProofFixture.vue";
      if (
        new URLSearchParams(location.search).get("fixture") ===
        "integration-terminal"
      ) {
        const { loadRuntimeConfig } =
          await import("../../src/shared/config/runtime");
        await loadRuntimeConfig();
      }
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [{ path: "/:pathMatch(.*)*", component: UiProofFixture }],
      });
      await router.push("/");
      i18n.global.locale.value =
        new URLSearchParams(location.search).get("locale") === "en"
          ? "en"
          : "ru";
      createApp(UiProofFixture)
        .use(createPinia())
        .use(router)
        .use(i18n)
        .mount("#app");
    </script>
  </body>
</html>
