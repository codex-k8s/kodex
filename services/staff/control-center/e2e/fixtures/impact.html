<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка влияния ревизии</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { createPinia } from "pinia";
      import {
        createRouter,
        createMemoryHistory,
        RouterView,
      } from "vue-router";
      import { i18n } from "../../src/app/i18n/index";
      import { loadRuntimeConfig } from "../../src/shared/config/runtime";
      import { configureApiClient } from "../../src/shared/api/client";
      import { resetOwnerRequests } from "../../src/shared/api/owner-lifetime";
      import { useProvidersStore } from "../../src/features/providers/store";
      import { useRealtimeStore } from "../../src/features/realtime/store";
      import "../../src/app/styles/base.css";
      import ImpactFixture from "./ImpactFixture.vue";
      await loadRuntimeConfig();
      configureApiClient();
      document.addEventListener("fixture-owner-reset", resetOwnerRequests);
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [{ path: "/", component: ImpactFixture }],
      });
      await router.push("/");
      const pinia = createPinia();
      // Приложение передаёт готовый initial snapshot; isolated fixture воспроизводит
      // эту границу через mocked API до подключения workspace.
      if (new URLSearchParams(location.search).get("kind") === "provider")
        await useProvidersStore(pinia).load();
      createApp(RouterView).use(pinia).use(router).use(i18n).mount("#app");
      if (new URLSearchParams(location.search).get("realtime") === "1")
        useRealtimeStore(pinia).openPlatform();
    </script>
  </body>
</html>
