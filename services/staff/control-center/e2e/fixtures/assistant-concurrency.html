<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Изоляция параллельных диалогов</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { createPinia } from "pinia";
      import { createRouter, createMemoryHistory } from "vue-router";
      import { i18n } from "../../src/app/i18n/index";
      import { loadRuntimeConfig } from "../../src/shared/config/runtime";
      import { configureApiClient } from "../../src/shared/api/client";
      import "../../src/app/styles/base.css";
      import Fixture from "./AssistantConcurrencyFixture.vue";
      await loadRuntimeConfig();
      configureApiClient();
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [{ path: "/:pathMatch(.*)*", component: Fixture }],
      });
      await router.push("/projects/prj_concurrency_a");
      i18n.global.locale.value =
        new URLSearchParams(location.search).get("locale") === "en"
          ? "en"
          : "ru";
      createApp(Fixture).use(createPinia()).use(router).use(i18n).mount("#app");
    </script>
  </body>
</html>
