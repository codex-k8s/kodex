worker_processes auto;
pid /var/run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream control_api_gateway {
    server control-api-gateway.mattercodex-system.svc:8443;
    keepalive 16;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location ^~ /api/v1/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
      proxy_pass https://control_api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host control-api.mattercodex.local;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_ssl_server_name on;
      proxy_ssl_name control-api.mattercodex.local;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /var/run/config/mattercodex/staff-control-center/control-api-ca/ca.crt;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 3600s;
    }

    location = /config/runtime-config.json {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }

    location = /sw.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }

    location = /readyz {
      access_log off;
      default_type text/plain;
      return 200 "ready\n";
    }

    location ~* \.(?:js|css|woff2)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
