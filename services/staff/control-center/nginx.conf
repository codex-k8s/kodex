worker_processes auto;
pid /var/run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $ssl_client_verify $client_certificate_denied {
    default 1;
    SUCCESS 0;
  }

  upstream control_api_gateway {
    server control-api-gateway.mattercodex-system.svc:8443;
    keepalive 16;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name staff-control-center.mattercodex-system.svc.cluster.local;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /var/run/secrets/mattercodex/staff-control-center/backend-tls/tls.crt;
    ssl_certificate_key /var/run/secrets/mattercodex/staff-control-center/backend-tls/tls.key;
    ssl_client_certificate /var/run/secrets/mattercodex/staff-control-center/ingress-client-tls/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    include /var/run/config/mattercodex/staff-control-center/runtime/security-headers.conf;

    location ^~ /api/v1/ {
      if ($client_certificate_denied) { return 403; }
      add_header Cache-Control "no-store, max-age=0" always;
      proxy_pass https://control_api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host control-api.mattercodex.local;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_ssl_server_name on;
      proxy_ssl_name control-api.mattercodex.local;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /var/run/config/mattercodex/staff-control-center/control-api-ca/ca.crt;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 3600s;
    }

    location = /config/runtime-config.json {
      if ($client_certificate_denied) { return 403; }
      add_header Cache-Control "no-store, max-age=0" always;
      alias /var/run/config/mattercodex/staff-control-center/runtime/runtime-config.json;
    }

    location = /sw.js {
      if ($client_certificate_denied) { return 403; }
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }

    location = /readyz {
      access_log off;
      default_type application/json;
      alias /var/run/config/mattercodex/staff-control-center/runtime/readiness.json;
    }

    location ~* \.(?:js|css|woff2)$ {
      if ($client_certificate_denied) { return 403; }
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      if ($client_certificate_denied) { return 403; }
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
