version: v2
plugins:
  - local: protoc-gen-go
    out: libs/go/internalrpcauth
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/internalrpcauth
    types:
      - internalrpcauthority.v1
  - local: protoc-gen-go-grpc
    out: libs/go/internalrpcauth
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/internalrpcauth
      - require_unimplemented_servers=true
    types:
      - internalrpcauthority.v1
  - local: protoc-gen-go
    out: libs/go/controlplaneapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/controlplaneapi
    types:
      - controlplane.v1
  - local: protoc-gen-go-grpc
    out: libs/go/controlplaneapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/controlplaneapi
      - require_unimplemented_servers=true
    types:
      - controlplane.v1
  - local: protoc-gen-go
    out: libs/go/secretbrokerapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/secretbrokerapi
    types:
      - secretbroker.v1
  - local: protoc-gen-go-grpc
    out: libs/go/secretbrokerapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/secretbrokerapi
      - require_unimplemented_servers=true
    types:
      - secretbroker.v1
  - local: protoc-gen-go
    out: libs/go/sttapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/sttapi
    types:
      - stt.v1
  - local: protoc-gen-go-grpc
    out: libs/go/sttapi
    opt:
      - module=github.com/codex-k8s/kodex/libs/go/sttapi
      - require_unimplemented_servers=true
    types:
      - stt.v1
inputs:
  - directory: contracts/proto
