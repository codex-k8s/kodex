name: Build exact Kodex release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex Git SHA
        required: true
        type: string
      deployment_profile:
        description: Deployment profile
        required: true
        default: web-only
        type: choice
        options:
          - web-only
          - web-with-mattermost

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  build:
    runs-on: kodex-build
    timeout-minutes: 60
    environment: production-build
    steps:
      - name: Validate requested SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid exact source SHA' >&2; exit 1; }
      - name: Checkout exact owner-authorized SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.KODEX_PRODUCTION_WORKFLOW_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout and owner gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ vars.KODEX_PRODUCTION_WORKFLOW_SHA }}
          OWNER_ACTOR_ID: ${{ vars.KODEX_BUILD_OWNER_ACTOR_ID }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          tools/release/verify-github-owner-gate.sh \
            --workflow .github/workflows/build-release.yml --environment production-build \
            --workflow-sha "$WORKFLOW_SHA" --owner-actor-id "$OWNER_ACTOR_ID" \
            --source-sha "$SOURCE_SHA" --mode build --output owner-gate.json
      - name: Install exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and publish immutable images
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILDCTL_PATH: /var/run/kodex-tools/buildctl
          BUILDKIT_HOST: unix:///var/run/buildkit/buildkitd.sock
          REGISTRY_PUSH: ${{ vars.KODEX_REGISTRY_PUSH }}
          NODE_PULL: ${{ vars.KODEX_NODE_PULL }}
          REPOSITORY_PREFIX: ${{ vars.KODEX_REPOSITORY_PREFIX }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          REGISTRY_DOCKER_CONFIG_JSON: ${{ secrets.KODEX_RELEASE_REGISTRY_DOCKER_CONFIG_JSON }}
          HTTPS_PROXY: ${{ vars.KODEX_BUILD_PROXY }}
          HTTP_PROXY: ${{ vars.KODEX_BUILD_PROXY }}
          NO_PROXY: ${{ vars.KODEX_BUILD_NO_PROXY }}
        run: |
          umask 077
          registry_docker_config=$(mktemp -d)
          trap 'rm -rf -- "$registry_docker_config"' EXIT
          test -n "$REGISTRY_DOCKER_CONFIG_JSON"
          printf '%s' "$REGISTRY_DOCKER_CONFIG_JSON" >"$registry_docker_config/config.json"
          export DOCKER_CONFIG="$registry_docker_config"
          arguments=(
            --source-sha "$SOURCE_SHA"
            --build-run-id "$GITHUB_RUN_ID"
            --output release-lock.json
            --registry-push "$REGISTRY_PUSH"
            --node-pull "$NODE_PULL"
            --repository-prefix "${REPOSITORY_PREFIX:-kodex}"
            --profile "$DEPLOYMENT_PROFILE"
          )
          if [[ -n "${HTTPS_PROXY:-}" ]]; then
            arguments+=(--build-proxy "$HTTPS_PROXY" --build-no-proxy "$NO_PROXY")
          fi
          tools/release/build-release.sh "${arguments[@]}"
      - name: Record and validate release lock
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          sha256sum release-lock.json | awk '{print $1}' > release-lock.sha256
          tools/release/validate-release-lock.sh \
            --lock release-lock.json --source-sha "$SOURCE_SHA" \
            --sha256 "$(<release-lock.sha256)" --profile "$DEPLOYMENT_PROFILE"
      - name: Upload exact release lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-lock-${{ inputs.source_sha }}
          path: |
            release-lock.json
            release-lock.sha256
          if-no-files-found: error
          retention-days: 30
