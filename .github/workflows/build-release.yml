name: Build exact release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex Git SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  build:
    runs-on: mattercodex-build
    timeout-minutes: 45
    environment: production-build
    steps:
      - name: Validate requested SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid exact source SHA' >&2; exit 1; }
      - name: Checkout exact owner-authorized SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.MATTERCODEX_PRODUCTION_WORKFLOW_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ vars.MATTERCODEX_PRODUCTION_WORKFLOW_SHA }}
          OWNER_ACTOR_ID: ${{ vars.MATTERCODEX_BUILD_OWNER_ACTOR_ID }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          tools/release/verify-github-owner-gate.sh \
            --workflow .github/workflows/build-release.yml --environment production-build \
            --workflow-sha "$WORKFLOW_SHA" --owner-actor-id "$OWNER_ACTOR_ID" \
            --source-sha "$SOURCE_SHA" --mode build --output owner-gate.json
      - name: Build and publish immutable release
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILDCTL_PATH: /var/run/mattercodex-tools/buildctl
          BUILDKIT_HOST: unix:///var/run/buildkit/buildkitd.sock
          HTTPS_PROXY: http://mattercodex-ci-egress-proxy.mattercodex-ci.svc.cluster.local:8080
          HTTP_PROXY: http://mattercodex-ci-egress-proxy.mattercodex-ci.svc.cluster.local:8080
          NO_PROXY: matter-codex-registry.matter-kodex-prod.svc.cluster.local:5000,localhost,127.0.0.1
        run: tools/release/build-release.sh --source-sha "$SOURCE_SHA" --build-run-id "$GITHUB_RUN_ID" --output release-lock.json
      - name: Record and validate release lock
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          sha256sum release-lock.json | awk '{print $1}' > release-lock.sha256
          tools/release/validate-release-lock.sh --lock release-lock.json --source-sha "$SOURCE_SHA" --sha256 "$(<release-lock.sha256)"
      - name: Upload exact release lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-lock-${{ inputs.source_sha }}
          path: |
            release-lock.json
            release-lock.sha256
          if-no-files-found: error
          retention-days: 30
