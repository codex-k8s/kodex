name: Prepare encrypted installation identity

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex Git SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate requested SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid exact source SHA' >&2; exit 1; }
      - name: Checkout owner-authorized workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.KODEX_PRODUCTION_WORKFLOW_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify owner gate and exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ vars.KODEX_PRODUCTION_WORKFLOW_SHA }}
          OWNER_ACTOR_ID: ${{ vars.KODEX_DEPLOY_OWNER_ACTOR_ID }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          tools/release/verify-github-owner-gate.sh \
            --workflow .github/workflows/prepare-installation-identity.yml \
            --environment production --workflow-sha "$WORKFLOW_SHA" \
            --owner-actor-id "$OWNER_ACTOR_ID" --source-sha "$SOURCE_SHA" \
            --mode prepare-identity --output "$RUNNER_TEMP/owner-gate.json"
      - name: Install pinned age
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output /tmp/age.tar.gz
          echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz' | sha256sum --check --status
          tar -xzf /tmp/age.tar.gz -C /tmp
          install -m 0755 /tmp/age/age "$RUNNER_TEMP/age"
      - name: Generate and encrypt identity material
        shell: bash
        env:
          ADMIN_USERNAME: ${{ vars.KODEX_KEYCLOAK_ADMIN_USERNAME }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.KODEX_KEYCLOAK_ADMIN_INITIAL_PASSWORD }}
          OWNER_USERNAME: ${{ vars.KODEX_OWNER_USERNAME }}
          OWNER_EMAIL: ${{ vars.KODEX_OWNER_EMAIL }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.KODEX_OWNER_INITIAL_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.KODEX_VAULT_RECOVERY_AGE_RECIPIENT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]
          umask 077
          material="$RUNNER_TEMP/material"
          inputs="$RUNNER_TEMP/inputs"
          mkdir -p "$material" "$inputs"
          printf '%s' "$ADMIN_USERNAME" >"$inputs/admin-username"
          printf '%s' "$ADMIN_INITIAL_PASSWORD" >"$inputs/admin-initial-password"
          printf '%s' "$OWNER_USERNAME" >"$inputs/owner-username"
          printf '%s' "$OWNER_EMAIL" >"$inputs/owner-email"
          printf '%s' "$OWNER_INITIAL_PASSWORD" >"$inputs/owner-initial-password"
          tools/deploy/generate-identity-material.sh \
            --material-directory "$material" \
            --admin-username-file "$inputs/admin-username" \
            --admin-initial-password-file "$inputs/admin-initial-password" \
            --owner-username-file "$inputs/owner-username" \
            --owner-email-file "$inputs/owner-email" \
            --owner-initial-password-file "$inputs/owner-initial-password"
          tar --create --format=posix --owner=0 --group=0 --numeric-owner \
            --directory "$material" identity management | \
            "$RUNNER_TEMP/age" --recipient "$AGE_RECIPIENT" \
              --output "$RUNNER_TEMP/kodex-identity-$SOURCE_SHA.tar.age"
          sha256sum "$RUNNER_TEMP/kodex-identity-$SOURCE_SHA.tar.age" \
            >"$RUNNER_TEMP/kodex-identity-$SOURCE_SHA.tar.age.sha256"
          rm -rf -- "$material" "$inputs"
      - name: Upload encrypted owner artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installation-identity-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/kodex-identity-${{ inputs.source_sha }}.tar.age
            ${{ runner.temp }}/kodex-identity-${{ inputs.source_sha }}.tar.age.sha256
            ${{ runner.temp }}/owner-gate.json
          if-no-files-found: error
          retention-days: 1
