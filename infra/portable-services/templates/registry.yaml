{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
  ports: [{name: https, port: 443, targetPort: 8443, protocol: TCP}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-registry
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
      annotations:
        kodex.io/credentials-revision: {{ .Values.credentialsRevision | quote }}
        kodex.io/bootstrap-revision: {{ .Files.Get "files/prepare.py" | sha256sum | quote }}
        kodex.io/config-revision: {{ include (print .Template.BasePath "/registry-config.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-credentials
          image: {{ .Values.images.preparer }}
          command: [python3, -I, -B, /bootstrap/prepare.py]
          args: [registry, --input, /credentials, --output, /prepared, --writer, {{ .Values.registry.writerUsername }}, --reader, {{ .Values.registry.readerUsername }}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: prepared, mountPath: /prepared}
      containers:
        - name: registry
          image: {{ .Values.images.registry }}
          command: [/bin/registry]
          args: [serve, /configuration/registry.json]
          ports: [{name: backend, containerPort: 5443, protocol: TCP}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /configuration, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
        - name: gateway
          image: {{ .Values.images.nginx }}
          command: [/usr/sbin/nginx]
          args: [-g, "daemon off;", -c, /configuration/nginx.conf]
          ports: [{name: https, containerPort: 8443, protocol: TCP}]
          startupProbe:
            exec: {command: [/bin/sh, -ec, "wget -q -O /dev/null http://127.0.0.1:8081/ready"]}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: {command: [/bin/sh, -ec, "wget -q -O /dev/null http://127.0.0.1:8081/ready"]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /configuration, readOnly: true}
            - {name: prepared, mountPath: /prepared, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - {name: bootstrap, configMap: {name: {{ .Release.Name }}-bootstrap}}
        - {name: config, configMap: {name: {{ .Release.Name }}-registry}}
        - {name: credentials, secret: {secretName: {{ .Values.registry.authSecret }}, defaultMode: 0440}}
        - {name: prepared, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: tls, secret: {secretName: {{ .Release.Name }}-registry-tls, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "portable.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.registry.storageClass }}
        storageClassName: {{ .Values.registry.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.registry.size }}}}
{{- end }}
