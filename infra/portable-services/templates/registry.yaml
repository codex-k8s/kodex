{{- if .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "portable.labels" . | nindent 4 }}
data:
  registry.json: |
    {
      "version": 0.1,
      "log": {"level": "warn", "accesslog": {"disabled": true}},
      "storage": {"filesystem": {"rootdirectory": "/data"}, "delete": {"enabled": false}},
      "http": {
        "addr": "127.0.0.1:5443", "relativeurls": true,
        "tls": {"certificate": "/tls/tls.crt", "key": "/tls/tls.key", "minimumtls": "tls1.3"},
        "headers": {"X-Content-Type-Options": ["nosniff"]}
      }
    }
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr crit;
    events { worker_connections 256; }
    http {
      access_log off;
      client_body_temp_path /tmp/body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 4g;
      client_header_timeout 15s;
      client_body_timeout 180s;
      send_timeout 180s;
      map "$remote_user:$request_method" $registry_method_allowed {
        default 1;
        ~^{{ .Values.registry.readerUsername }}:(GET|HEAD)$ 1;
        ~^{{ .Values.registry.readerUsername }}: 0;
        ~^{{ .Values.registry.writerUsername }}:(GET|HEAD|POST|PUT|PATCH|DELETE)$ 1;
      }
      map $request_method $unsupported_method {
        default 1;
        GET 0; HEAD 0; POST 0; PUT 0; PATCH 0; DELETE 0;
      }
      upstream source_registry { server 127.0.0.1:5443; keepalive 8; }
      server {
        listen 8443 ssl;
        server_name _;
        ssl_protocols TLSv1.3;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        auth_basic "Kodex release source";
        auth_basic_user_file /prepared/htpasswd;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /tls/ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name {{ .Release.Name }}-registry.{{ .Release.Namespace }}.svc.cluster.local;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        if ($unsupported_method = 1) { return 405; }
        location = /v2/ {
          if ($registry_method_allowed = 0) { return 403; }
          proxy_pass https://source_registry;
        }
        location /v2/{{ .Values.registry.repositoryPrefix }}/ {
          if ($registry_method_allowed = 0) { return 403; }
          proxy_pass https://source_registry;
        }
        location / { return 404; }
      }
      server {
        listen 127.0.0.1:8081;
        location = /ready {
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /tls/ca.crt;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-registry.{{ .Release.Namespace }}.svc.cluster.local;
          proxy_ssl_protocols TLSv1.3;
          proxy_connect_timeout 2s;
          proxy_read_timeout 2s;
          proxy_pass https://source_registry/v2/;
        }
        location / { return 404; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
  ports: [{name: https, port: 443, targetPort: 8443, protocol: TCP}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-registry
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-registry}
      annotations: {kodex.io/credentials-revision: {{ .Values.credentialsRevision | quote }}}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-credentials
          image: {{ .Values.images.preparer }}
          command: [python3, -I, -B, /bootstrap/prepare.py]
          args: [registry, --input, /credentials, --output, /prepared, --writer, {{ .Values.registry.writerUsername }}, --reader, {{ .Values.registry.readerUsername }}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: prepared, mountPath: /prepared}
      containers:
        - name: registry
          image: {{ .Values.images.registry }}
          command: [/bin/registry]
          args: [serve, /configuration/registry.json]
          ports: [{name: backend, containerPort: 5443, protocol: TCP}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /configuration, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
        - name: gateway
          image: {{ .Values.images.nginx }}
          command: [/usr/sbin/nginx]
          args: [-g, "daemon off;", -c, /configuration/nginx.conf]
          ports: [{name: https, containerPort: 8443, protocol: TCP}]
          startupProbe:
            exec: {command: [/bin/sh, -ec, "wget -q -O /dev/null http://127.0.0.1:8081/ready"]}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: {command: [/bin/sh, -ec, "wget -q -O /dev/null http://127.0.0.1:8081/ready"]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /configuration, readOnly: true}
            - {name: prepared, mountPath: /prepared, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - {name: bootstrap, configMap: {name: {{ .Release.Name }}-bootstrap}}
        - {name: config, configMap: {name: {{ .Release.Name }}-registry}}
        - {name: credentials, secret: {secretName: {{ .Values.registry.authSecret }}, defaultMode: 0440}}
        - {name: prepared, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: tls, secret: {secretName: {{ .Release.Name }}-registry-tls, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "portable.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.registry.storageClass }}
        storageClassName: {{ .Values.registry.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.registry.size }}}}
{{- end }}
