{{- if .Values.storage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-storage}
  ports:
    - {name: s3, port: 443, targetPort: 8333, protocol: TCP}
    {{- if .Values.storage.ui.enabled }}
    - {name: console, port: 23646, targetPort: 23647, protocol: TCP}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-storage
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-storage}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: portable-storage}
      annotations: {kodex.io/credentials-revision: {{ .Values.credentialsRevision | quote }}}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-credentials
          image: {{ .Values.images.preparer }}
          command: [python3, -I, -B, /bootstrap/prepare.py]
          args: [storage, --input, /credentials, --output, /prepared{{ range .Values.storage.trustedProxyCIDRs }}, --trusted-proxy, {{ . | quote }}{{ end }}{{ if .Values.storage.ui.enabled }}, --ui{{ end }}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: prepared, mountPath: /prepared}
        - name: prepare-data
          image: {{ .Values.images.storage }}
          command: [/bin/sh, -ec]
          args: [mkdir -p /data/master /data/volume /data/admin]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: storage
          image: {{ .Values.images.storage }}
          workingDir: /data
          command: [/usr/bin/weed]
          args:
            - -config_dir=/prepared
            - server
            - -dir=/data/volume
            - -master.dir=/data/master
            - -master.peers=none
            - -master.resumeState=true
            - -master.telemetry=false
            - -master.volumeSizeLimitMB=64
            - -volume.max=128
            - -filer
            - -filer.disableDirListing=true
            - -s3
            - -s3.config=/prepared/s3.json
            - -s3.allowDeleteBucketNotEmpty=false
            - -s3.iam=false
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -s3.ip.bind=0.0.0.0
            - -s3.cert.file=/tls/tls.crt
            - -s3.key.file=/tls/tls.key
          ports: [{name: s3, containerPort: 8333, protocol: TCP}]
          startupProbe: {tcpSocket: {port: s3}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: s3}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: s3}, periodSeconds: 10, failureThreshold: 3}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: prepared, mountPath: /prepared, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
        {{- if .Values.storage.ui.enabled }}
        - name: console
          image: {{ .Values.images.storage }}
          workingDir: /data/admin
          command: [/usr/bin/weed]
          args:
            - -config_dir=/prepared
            - admin
            - -port=23646
            - -master=127.0.0.1:9333
            - -dataDir=/data/admin
            - -iceberg.port=0
            {{- if eq .Values.exposure.mode "shared_host" }}
            - -urlPrefix={{ .Values.exposure.storagePrefix }}
            {{- end }}
          ports: [{name: console, containerPort: 23646, protocol: TCP}]
          startupProbe: {tcpSocket: {port: console}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {tcpSocket: {port: console}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: console}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: console-tmp, mountPath: /tmp}
            - {name: prepared, mountPath: /prepared, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
        - name: console-gateway
          image: {{ .Values.images.nginx }}
          command: [/usr/sbin/nginx]
          args: [-g, "daemon off;", -c, /configuration/nginx.conf]
          ports: [{name: console-https, containerPort: 23647, protocol: TCP}]
          startupProbe: {tcpSocket: {port: console-https}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {tcpSocket: {port: console-https}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: console-https}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: console-proxy-tmp, mountPath: /tmp}
            - {name: console-config, mountPath: /configuration, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
        {{- end }}
      volumes:
        - {name: bootstrap, configMap: {name: {{ .Release.Name }}-bootstrap}}
        - {name: credentials, secret: {secretName: {{ .Values.storage.authSecret }}, defaultMode: 0440}}
        - {name: prepared, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: tls, secret: {secretName: {{ .Release.Name }}-storage-tls, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: console-tmp, emptyDir: {sizeLimit: 32Mi}}
        {{- if .Values.storage.ui.enabled }}
        - {name: console-proxy-tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: console-config, configMap: {name: {{ .Release.Name }}-console}}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "portable.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.storage.size }}}}
{{- end }}
