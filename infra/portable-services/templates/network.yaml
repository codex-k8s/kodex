{{- if or .Values.storage.enabled .Values.registry.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-infrastructure
  labels: {{- include "portable.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.ingress.namespace }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Values.ingress.podName }}}}
      ports:
        {{- if .Values.storage.enabled }}
        - {protocol: TCP, port: 8333}
        {{- end }}
        {{- if .Values.storage.ui.enabled }}
        - {protocol: TCP, port: 23647}
        {{- end }}
        {{- if .Values.registry.enabled }}
        - {protocol: TCP, port: 8443}
        {{- end }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
