{{- if or .Values.storage.enabled .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "portable.labels" . | nindent 4 }}
data:
  prepare.py: |
{{ .Files.Get "files/prepare.py" | indent 4 }}
{{- end }}
{{- if .Values.storage.ui.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-console
  labels: {{- include "portable.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/console.pid;
    error_log /dev/stderr crit;
    events { worker_connections 128; }
    http {
      map_hash_bucket_size 512;
      access_log off;
      client_body_temp_path /tmp/body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 1g;
      client_header_timeout 15s;
      client_body_timeout 60s;
      send_timeout 180s;
      map $http_cookie $storage_cookie {
        default "";
        "~(^|;[[:blank:]]*)(?<storage_auth_cookie>admin-session=[^;]*)(;|$)" $storage_auth_cookie;
      }
      map $request_method $safe_method { default 0; GET 1; HEAD 1; OPTIONS 1; }
      map "$safe_method:$http_origin" $origin_allowed {
        default 0;
        ~^1: 1;
        {{- if eq .Values.exposure.mode "shared_host" }}
        "0:https://{{ .Values.exposure.sharedHost }}" 1;
        {{- else if eq .Values.exposure.mode "separate_hosts" }}
        "0:https://{{ .Values.exposure.storageHost }}" 1;
        {{- end }}
        "0:https://{{ .Release.Name }}-storage.{{ .Release.Namespace }}.svc.cluster.local:23646" 1;
      }
      server {
        listen 23647 ssl;
        server_name _;
        ssl_protocols TLSv1.3;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        if ($origin_allowed = 0) { return 403; }
        location / {
          proxy_pass https://127.0.0.1:23646;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /tls/ca.crt;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-storage.{{ .Release.Namespace }}.svc.cluster.local;
          proxy_ssl_protocols TLSv1.3;
          proxy_set_header Host $http_host;
          proxy_set_header Authorization "";
          proxy_set_header Cookie $storage_cookie;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Port 443;
          proxy_hide_header Access-Control-Allow-Origin;
          proxy_hide_header Access-Control-Allow-Credentials;
          add_header X-Content-Type-Options nosniff always;
          add_header X-Frame-Options DENY always;
          add_header Referrer-Policy no-referrer always;
          proxy_cookie_flags ~ secure httponly samesite=strict;
          {{- if eq .Values.exposure.mode "shared_host" }}
          proxy_cookie_path ~^/$ {{ .Values.exposure.storagePrefix }}/;
          {{- end }}
          proxy_redirect off;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_connect_timeout 5s;
          proxy_read_timeout 180s;
          proxy_send_timeout 180s;
        }
      }
    }
{{- end }}
