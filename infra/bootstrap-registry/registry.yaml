apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-codex-registry
  labels:
    app.kubernetes.io/name: matter-codex-registry
    app.kubernetes.io/component: image-registry
    app.kubernetes.io/part-of: mattercodex-release-bootstrap
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-codex-registry
  labels:
    app.kubernetes.io/name: matter-codex-registry
    app.kubernetes.io/component: image-registry
    app.kubernetes.io/part-of: mattercodex-release-bootstrap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-codex-registry
      app.kubernetes.io/component: image-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-codex-registry
        app.kubernetes.io/component: image-registry
        app.kubernetes.io/part-of: mattercodex-release-bootstrap
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5001"}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports:
            - {name: registry, containerPort: 5001, hostPort: 5001, protocol: TCP}
          startupProbe:
            httpGet: {path: /v2/, port: registry, scheme: HTTP}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /v2/, port: registry, scheme: HTTP}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /v2/, port: registry, scheme: HTTP}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: matter-codex-registry}
---
apiVersion: v1
kind: Service
metadata:
  name: matter-codex-registry
  labels:
    app.kubernetes.io/name: matter-codex-registry
    app.kubernetes.io/component: image-registry
    app.kubernetes.io/part-of: mattercodex-release-bootstrap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: matter-codex-registry
    app.kubernetes.io/component: image-registry
  ports:
    - {name: registry, port: 5000, targetPort: registry, protocol: TCP}
