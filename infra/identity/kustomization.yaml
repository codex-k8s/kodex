apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - namespace.yaml
  - certificate.yaml
  - database-tls.yaml
  - postgresql.yaml
  - keycloak.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: mattercodex
      mattercodex.dev/capability: identity
    includeSelectors: false
    includeTemplates: true
