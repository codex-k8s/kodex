apiVersion: v1
kind: Service
metadata:
  name: sso
  labels:
    app.kubernetes.io/name: sso
    app.kubernetes.io/component: identity-provider
spec:
  selector:
    app.kubernetes.io/name: sso
    app.kubernetes.io/component: identity-provider
  ports:
    - { name: https, port: 443, targetPort: https, protocol: TCP }
    - { name: management, port: 9000, targetPort: management, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso
  labels:
    app.kubernetes.io/name: sso
    app.kubernetes.io/component: identity-provider
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: sso
      app.kubernetes.io/component: identity-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso
        app.kubernetes.io/component: identity-provider
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-postgresql
          image: docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
          command: [sh, -ec]
          args:
            [
              until pg_isready -h keycloak-postgresql.identity.svc.cluster.local -U keycloak -d keycloak; do sleep 2; done,
            ]
          env:
            - { name: PGSSLMODE, value: verify-full }
            - {
                name: PGSSLROOTCERT,
                value: /var/run/secrets/mattercodex/database/ca.crt,
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - {
                name: database-tls,
                mountPath: /var/run/secrets/mattercodex/database,
                readOnly: true,
              }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
          imagePullPolicy: IfNotPresent
          args: [start]
          ports:
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: management, containerPort: 9000, protocol: TCP }
          env:
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgresql.identity.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/var/run/secrets/mattercodex/database/ca.crt
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_DB_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: keycloak-bootstrap, key: database-password },
                }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                {
                  secretKeyRef:
                    { name: keycloak-bootstrap, key: admin-username },
                }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: keycloak-bootstrap, key: admin-password },
                }
            - { name: KC_HOSTNAME, value: https://__MATTERCODEX_OIDC_HOST__ }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "false" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_HOST, value: 0.0.0.0 }
            - { name: KC_HTTP_MANAGEMENT_HOST, value: 0.0.0.0 }
            - {
                name: KC_HTTPS_CERTIFICATE_FILE,
                value: /var/run/secrets/mattercodex/sso/tls/tls.crt,
              }
            - {
                name: KC_HTTPS_CERTIFICATE_KEY_FILE,
                value: /var/run/secrets/mattercodex/sso/tls/tls.key,
              }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_CACHE, value: local }
            - {
                name: JAVA_OPTS_KC_HEAP,
                value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30",
              }
          startupProbe:
            httpGet: { path: /health/started, port: management, scheme: HTTPS }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 100
          readinessProbe:
            httpGet: { path: /health/ready, port: management, scheme: HTTPS }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet: { path: /health/live, port: management, scheme: HTTPS }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - {
                name: public-tls,
                mountPath: /var/run/secrets/mattercodex/sso/tls,
                readOnly: true,
              }
            - {
                name: database-tls,
                mountPath: /var/run/secrets/mattercodex/database,
                readOnly: true,
              }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: public-tls
          secret: { secretName: sso-public-tls, defaultMode: 0440 }
        - name: database-tls
          secret:
            secretName: keycloak-postgresql-tls
            defaultMode: 0444
            items: [{ key: ca.crt, path: ca.crt }]
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
      terminationGracePeriodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sso
  annotations:
    cert-manager.io/cluster-issuer: __MATTERCODEX_CLUSTER_ISSUER__
    kubernetes.io/ingress.class: __MATTERCODEX_INGRESS_CLASS__
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serverstransport: identity-sso-public@kubernetescrd
spec:
  ingressClassName: __MATTERCODEX_INGRESS_CLASS__
  tls:
    - hosts: [__MATTERCODEX_OIDC_HOST__]
      secretName: sso-public-tls
  rules:
    - host: __MATTERCODEX_OIDC_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso, port: { name: https } }
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sso-public
spec:
  serverName: __MATTERCODEX_OIDC_HOST__
  insecureSkipVerify: false
