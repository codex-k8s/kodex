apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: identity-deny-all }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: keycloak-postgresql-exact-paths }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgresql
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sso
              app.kubernetes.io/component: identity-provider
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sso-exact-paths }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sso
      app.kubernetes.io/component: identity-provider
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {
              matchLabels:
                {
                  kubernetes.io/metadata.name: __MATTERCODEX_INGRESS_NAMESPACE__,
                },
            }
          podSelector:
            {
              matchLabels:
                { app.kubernetes.io/name: __MATTERCODEX_INGRESS_POD_NAME__ },
            }
      ports: [{ protocol: TCP, port: 8443 }]
    - from:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: mattercodex-system } }
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [control-api-gateway, control-plane]
      ports: [{ protocol: TCP, port: 8443 }]
  egress:
    - to:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-postgresql
              app.kubernetes.io/component: database
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cert-manager-http01-solver }
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {
              matchLabels:
                {
                  kubernetes.io/metadata.name: __MATTERCODEX_INGRESS_NAMESPACE__,
                },
            }
          podSelector:
            {
              matchLabels:
                { app.kubernetes.io/name: __MATTERCODEX_INGRESS_POD_NAME__ },
            }
      ports: [{ protocol: TCP, port: 8089 }]
