apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: { name: vault-ui, namespace: mattercodex-system }
spec:
  serverName: vault.mattercodex-system.svc.cluster.local
  insecureSkipVerify: false
  rootCAsSecrets: [mattercodex-vault-server-tls]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mattercodex-grafana
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: __MATTERCODEX_CLUSTER_ISSUER__
    kubernetes.io/ingress.class: __MATTERCODEX_INGRESS_CLASS__
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: observability-oauth2-grafana-chain@kubernetescrd
spec:
  ingressClassName: __MATTERCODEX_INGRESS_CLASS__
  tls:
    - hosts: [__MATTERCODEX_GRAFANA_HOST__]
      secretName: mattercodex-grafana-public-tls
  rules:
    - host: __MATTERCODEX_GRAFANA_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {
                  name: mattercodex-monitoring-grafana,
                  port: { name: http-web },
                }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mattercodex-vault-ui
  namespace: mattercodex-system
  annotations:
    cert-manager.io/cluster-issuer: __MATTERCODEX_CLUSTER_ISSUER__
    kubernetes.io/ingress.class: __MATTERCODEX_INGRESS_CLASS__
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: mattercodex-system-oauth2-vault-chain@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: mattercodex-system-vault-ui@kubernetescrd
spec:
  ingressClassName: __MATTERCODEX_INGRESS_CLASS__
  tls:
    - hosts: [__MATTERCODEX_VAULT_HOST__]
      secretName: mattercodex-vault-ui-public-tls
  rules:
    - host: __MATTERCODEX_VAULT_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: vault, port: { name: https } }
---
apiVersion: networking.k8s.io/v1
