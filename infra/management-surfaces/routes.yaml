apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  { name: oauth2-control-center-exact-paths, namespace: mattercodex-system }
spec:
  podSelector:
    { matchLabels: { app.kubernetes.io/instance: oauth2-control-center } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {
              matchLabels:
                {
                  kubernetes.io/metadata.name: __MATTERCODEX_INGRESS_NAMESPACE__,
                },
            }
          podSelector:
            {
              matchLabels:
                { app.kubernetes.io/name: __MATTERCODEX_INGRESS_POD_NAME__ },
            }
      ports: [{ protocol: TCP, port: 4180 }]
  egress:
    - to:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: __MATTERCODEX_PUBLIC_IPV4_CIDR__ } }]
      ports: [{ protocol: TCP, port: 443 }]
---
