apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: oauth2-control-center-errors, namespace: mattercodex-system }
spec:
  errors:
    status: ["401-403"]
    service: { name: oauth2-control-center, port: 80 }
    query: /oauth2/sign_in?rd={url}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: oauth2-control-center-auth, namespace: mattercodex-system }
spec:
  forwardAuth:
    address: http://oauth2-control-center.mattercodex-system.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: oauth2-control-center-chain, namespace: mattercodex-system }
spec:
  chain:
    middlewares:
      - { name: oauth2-control-center-errors }
      - { name: oauth2-control-center-auth }
---
