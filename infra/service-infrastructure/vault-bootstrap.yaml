apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kodex-installation-ca
  namespace: kodex-system
spec:
  ca:
    secretName: kodex-installation-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kodex-vault-server
  namespace: kodex-system
spec:
  secretName: kodex-vault-server-tls
  duration: 2160h
  renewBefore: 360h
  commonName: vault.kodex-system.svc.cluster.local
  dnsNames:
    - vault
    - vault.kodex-system
    - vault.kodex-system.svc
    - vault.kodex-system.svc.cluster.local
    - vault-active
    - vault-active.kodex-system
    - vault-active.kodex-system.svc
    - vault-active.kodex-system.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 3072
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: kodex-installation-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kodex-control-api-bootstrap
  namespace: kodex-system
spec:
  secretName: kodex-control-api-bootstrap-tls
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - control-api.kodex.local
  usages:
    - server auth
  issuerRef:
    name: kodex-installation-ca
    kind: Issuer
