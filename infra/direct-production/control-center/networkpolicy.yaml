apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-center-public-bridge}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-center-public-bridge
      app.kubernetes.io/component: public-tls-bridge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kodex-prod}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-public-ingress
              app.kubernetes.io/component: public-web-foundation
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: staff-control-center
              app.kubernetes.io/component: staff-frontend
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: staff-control-center-from-public-bridge}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: staff-control-center
      app.kubernetes.io/component: staff-frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-center-public-bridge
              app.kubernetes.io/component: public-tls-bridge
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-center-cert-manager-http01-solver}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kodex-prod}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-public-ingress
              app.kubernetes.io/component: public-web-foundation
      ports: [{protocol: TCP, port: 8089}]

