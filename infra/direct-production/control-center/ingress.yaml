apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-center-public
  labels:
    app.kubernetes.io/name: control-center-public-bridge
    app.kubernetes.io/component: public-entrypoint
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: kodex-public
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: kodex-public
  tls:
    - hosts: [control.kodex.works]
      secretName: control-center-public-tls
  rules:
    - host: control.kodex.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: control-center-public-bridge, port: {name: http}}

