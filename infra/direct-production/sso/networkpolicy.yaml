apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-deny-all}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keycloak-postgresql}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgresql
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sso
              app.kubernetes.io/component: identity-provider
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sso-exact-paths}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sso
      app.kubernetes.io/component: identity-provider
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mattercodex-system}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-api-gateway
              app.kubernetes.io/component: external-gateway
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-postgresql
              app.kubernetes.io/component: database
      ports: [{protocol: TCP, port: 5432}]
