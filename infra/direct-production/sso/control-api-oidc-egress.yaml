apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-gateway-public-oidc-egress
  namespace: mattercodex-system
  labels:
    app.kubernetes.io/part-of: mattercodex
    mattercodex.dev/profile: direct-production-single-node-prototype
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-api-gateway
      app.kubernetes.io/component: external-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/32}
      ports: [{protocol: TCP, port: 443}]
