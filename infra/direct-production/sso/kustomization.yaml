apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - namespace.yaml
  - postgresql.yaml
  - keycloak.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mattercodex-keycloak-realm
    files:
      - mattercodex-realm.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: mattercodex
    mattercodex.dev/profile: direct-production-single-node-prototype
