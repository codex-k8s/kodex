apiVersion: v1
kind: ConfigMap
metadata: { name: kodex-ci-egress-proxy, namespace: kodex-ci }
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: proxy
          address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: github_proxy
                    route_config:
                      name: github_allowlist
                      virtual_hosts:
                        - name: github
                          domains: ["*"]
                          routes:
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "github.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "api.github.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "codeload.github.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "ghcr.io:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "__RELEASE_REGISTRY_HOST__:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "gcr.io:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "dl.k8s.io:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "registry-1.docker.io:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "auth.docker.io:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "production.cloudfront.docker.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "proxy.golang.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "sum.golang.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "storage.googleapis.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "registry.npmjs.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "dl-cdn.alpinelinux.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "deb.debian.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "security.debian.org:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "get.helm.sh:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "cdn.playwright.dev:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {exact: "playwright.download.prss.microsoft.com:443"}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {safe_regex: {regex: '[A-Za-z0-9-]+\.githubusercontent\.com:443$'}}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {safe_regex: {regex: '[A-Za-z0-9-]+\.actions\.githubusercontent\.com:443$'}}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {safe_regex: {regex: '[A-Za-z0-9-]+\.githubassets\.com:443$'}}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match:
                                connect_matcher: {}
                                headers:
                                  - name: ":authority"
                                    string_match: {safe_regex: {regex: '[a-z0-9]{3,24}\.blob\.core\.windows\.net:443$'}}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                    http_filters:
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config:
                            name: github_dns_cache
                            dns_lookup_family: V4_ONLY
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    upgrade_configs:
                      - upgrade_type: CONNECT
      clusters:
        - name: dynamic_forward_proxy
          connect_timeout: 10s
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config:
                name: github_dns_cache
                dns_lookup_family: V4_ONLY
    admin:
      access_log_path: /dev/null
      address: {socket_address: {address: 0.0.0.0, port_value: 9901}}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: kodex-ci-egress-proxy, namespace: kodex-ci }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kodex-ci-egress-proxy, namespace: kodex-ci }
spec:
  replicas: 1
  selector:
    { matchLabels: { app.kubernetes.io/name: kodex-ci-egress-proxy } }
  template:
    metadata:
      { labels: { app.kubernetes.io/name: kodex-ci-egress-proxy } }
    spec:
      serviceAccountName: kodex-ci-egress-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.35.3@sha256:f9080877fdbaecc788e79e200d912382e57f780b63752160e27dfe34f5d0aa36
          args: [-c, /etc/envoy/envoy.yaml, --log-level, warning]
          ports:
            [
              { name: proxy, containerPort: 8080 },
              { name: admin, containerPort: 9901 },
            ]
          startupProbe:
            {
              httpGet: { path: /ready, port: admin },
              periodSeconds: 2,
              failureThreshold: 30,
            }
          readinessProbe:
            {
              httpGet: { path: /ready, port: admin },
              periodSeconds: 5,
              failureThreshold: 2,
            }
          livenessProbe:
            {
              httpGet: { path: /server_info, port: admin },
              periodSeconds: 10,
              failureThreshold: 3,
            }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: kodex-ci-egress-proxy } }
        - { name: tmp, emptyDir: { sizeLimit: 8Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kodex-ci-egress-proxy, namespace: kodex-ci }
spec:
  selector: { app.kubernetes.io/name: kodex-ci-egress-proxy }
  ports: [{ name: proxy, port: 8080, targetPort: proxy }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: kodex-ci }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dns-egress, namespace: kodex-ci }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: proxy-ingress, namespace: kodex-ci }
spec:
  podSelector:
    { matchLabels: { app.kubernetes.io/name: kodex-ci-egress-proxy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            { matchLabels: { app.kubernetes.io/name: gha-rs-controller } }
        - podSelector: { matchLabels: { kodex.dev/arc-role: listener } }
        - podSelector:
            { matchLabels: { kodex.dev/arc-role: build-runner } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: github-proxy-egress, namespace: kodex-ci }
spec:
  podSelector:
    { matchLabels: { app.kubernetes.io/name: kodex-ci-egress-proxy } }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: scale-set-github-proxy, namespace: kodex-ci }
spec:
  podSelector:
    matchExpressions:
      - key: kodex.dev/arc-role
        operator: In
        values: [listener, build-runner]
  policyTypes: [Egress]
  egress:
    - to:
        [
          {
            podSelector:
              {
                matchLabels:
                  { app.kubernetes.io/name: kodex-ci-egress-proxy },
              },
          },
        ]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: build-registry, namespace: kodex-ci }
spec:
  podSelector: { matchLabels: { kodex.dev/arc-role: build-runner } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: __REGISTRY_NAMESPACE__ } }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-registry
              app.kubernetes.io/component: image-registry
        - { ipBlock: { cidr: "__REGISTRY_SERVICE_CIDR__" } }
        - { ipBlock: { cidr: "__REGISTRY_ENDPOINT_CIDR__" } }
      ports: [{ protocol: TCP, port: 5000 }, { protocol: TCP, port: 5001 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: controller-github-proxy, namespace: kodex-ci }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: gha-rs-controller } }
  policyTypes: [Egress]
  egress:
    - to:
        [
          {
            podSelector:
              {
                matchLabels:
                  { app.kubernetes.io/name: kodex-ci-egress-proxy },
              },
          },
        ]
      ports: [{ protocol: TCP, port: 8080 }]
