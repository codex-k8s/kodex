githubConfigUrl: https://github.com/codex-k8s/matter-codex
githubConfigSecret: mattercodex-github-runner-auth
runnerScaleSetName: mattercodex-deploy
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: mattercodex-ci
  name: mattercodex-arc-gha-rs-controller
template:
  spec:
    serviceAccountName: mattercodex-production-deployer
    automountServiceAccountToken: true
    enableServiceLinks: false
    restartPolicy: Never
    terminationGracePeriodSeconds: 30
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        imagePullPolicy: IfNotPresent
        command: [/home/runner/run.sh]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: tools, mountPath: /var/run/mattercodex-tools}
    volumes:
      - {name: work, emptyDir: {sizeLimit: 2Gi}}
      - {name: tools, emptyDir: {sizeLimit: 64Mi}}
