githubConfigUrl: https://github.com/codex-k8s/kodex
githubConfigSecret: kodex-github-runner-auth
runnerScaleSetName: kodex-deploy
minRunners: 0
maxRunners: 1
listenerTemplate:
  metadata:
    labels: {kodex.dev/arc-role: listener}
  spec:
    containers:
      - name: listener
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        env:
          - {name: HTTPS_PROXY, value: http://kodex-ci-egress-proxy.kodex-ci-deploy.svc.cluster.local:8080}
          - {name: HTTP_PROXY, value: http://kodex-ci-egress-proxy.kodex-ci-deploy.svc.cluster.local:8080}
          - {name: NO_PROXY, value: "__KUBERNETES_API_SERVICE_IP__,kubernetes.default.svc,kubernetes.default.svc.cluster.local,.svc,.svc.cluster.local,localhost,127.0.0.1"}
controllerServiceAccount:
  namespace: kodex-ci-deploy
  name: kodex-arc-deploy-gha-rs-controller
template:
  metadata:
    labels: {kodex.dev/arc-role: deploy-runner}
  spec:
    serviceAccountName: kodex-production-deployer
    automountServiceAccountToken: true
    enableServiceLinks: false
    restartPolicy: Never
    terminationGracePeriodSeconds: 30
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        imagePullPolicy: IfNotPresent
        command: [/home/runner/run.sh]
        env:
          - {name: ACTIONS_RUNNER_HOOK_JOB_STARTED, value: /var/run/kodex-owner-gate/job-started.sh}
          - {name: HTTPS_PROXY, value: http://kodex-ci-egress-proxy.kodex-ci-deploy.svc.cluster.local:8080}
          - {name: HTTP_PROXY, value: http://kodex-ci-egress-proxy.kodex-ci-deploy.svc.cluster.local:8080}
          - {name: NO_PROXY, value: "__KUBERNETES_API_SERVICE_IP__,kubernetes.default.svc,kubernetes.default.svc.cluster.local,.svc,.svc.cluster.local,localhost,127.0.0.1"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: tools, mountPath: /var/run/kodex-tools}
          - {name: owner-gate, mountPath: /var/run/kodex-owner-gate, readOnly: true}
    volumes:
      - {name: work, emptyDir: {sizeLimit: 2Gi}}
      - {name: tools, emptyDir: {sizeLimit: 256Mi}}
      - {name: owner-gate, configMap: {name: kodex-runner-owner-gate, defaultMode: 365}}
