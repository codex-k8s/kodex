apiVersion: batch/v1
kind: Job
metadata:
  name: backup-controller-restore-__RESTORE_ID__
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/component: restore-drill
    kodex.dev/owner-approved: "true"
    kodex.dev/environment: __KODEX_ENVIRONMENT__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-controller
        app.kubernetes.io/component: restore-drill
        kodex.dev/owner-approved: "true"
        kodex.dev/environment: __KODEX_ENVIRONMENT__
    spec:
      serviceAccountName: backup-controller
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: restore-drill
          image: kodex-image-registry.kodex-system.svc.cluster.local:5000/kodex/backup-controller@sha256:__BACKUP_CONTROLLER_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          args: [restore-drill]
          envFrom:
            - configMapRef: {name: backup-controller-runtime}
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['kodex.dev/environment']
            - name: BACKUP_CONTROLLER_RELEASE_REVISION
              value: sha256:__BACKUP_CONTROLLER_IMAGE_DIGEST__
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 160Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: restore-inputs, mountPath: /var/run/secrets/kodex/backup-controller/restore, readOnly: true}
            - {name: tls, mountPath: /var/run/secrets/kodex/backup-controller/tls, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: restore-inputs
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: backup-controller-repository
                  items: [{key: repository.json, path: repository.json}]
              - secret:
                  name: backup-controller-restore-targets
                  items: [{key: targets.json, path: targets.json}]
              - secret:
                  name: backup-controller-restore-approval
                  items: [{key: approval.json, path: approval.json}]
        - name: tls
          configMap:
            name: backup-controller-postgresql-ca
            defaultMode: 0440
            items:
              - {key: ca.pem, path: ca.pem}
        - name: work
          emptyDir: {sizeLimit: 160Gi}
