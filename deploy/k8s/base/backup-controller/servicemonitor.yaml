apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backup-controller
  labels:
    app.kubernetes.io/name: backup-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
  namespaceSelector:
    matchNames: [kodex-system]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
