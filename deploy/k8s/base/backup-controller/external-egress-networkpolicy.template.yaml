apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-controller-exact-external-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: __KODEX_BACKUP_S3_EXACT_CIDR__
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: __KODEX_RESTORE_POSTGRES_EXACT_CIDR__
      ports:
        - {protocol: TCP, port: 5432}
