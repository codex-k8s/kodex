apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-rpc-authority-database-credential-reconciler-client-ca
  annotations: {argocd.argoproj.io/sync-wave: "-9"}
spec:
  sources: [{secret: {name: mattercodex-installation-ca, key: tls.crt}}]
  target:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mattercodex-system}}
    configMap: {key: client-ca.pem}
---
