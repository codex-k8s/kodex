apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mattercodex-postgresql
  labels:
    app.kubernetes.io/name: mattercodex-postgresql
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  serviceName: mattercodex-postgresql
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattercodex-postgresql
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/tls/tls.crt
            - -c
            - ssl_key_file=/var/run/tls/tls.key
            - -c
            - ssl_ca_file=/var/run/tls/ca.crt
            - -c
            - password_encryption=scram-sha-256
            - -c
            - max_connections=240
            - -c
            - hba_file=/var/run/config/pg_hba.conf
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/bootstrap/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --port=5432, --username=postgres, --dbname=postgres, --timeout=2]
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --port=5432, --username=postgres, --dbname=postgres, --timeout=2]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --port=5432, --username=postgres, --dbname=postgres, --timeout=2]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
            - name: bootstrap
              mountPath: /var/run/bootstrap
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: config
              mountPath: /var/run/config
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: mattercodex-postgresql-tls
            defaultMode: 0440
        - name: bootstrap
          secret:
            secretName: mattercodex-postgresql-bootstrap
            defaultMode: 0400
            items:
              - key: password
                path: password
        - name: init
          configMap:
            name: mattercodex-postgresql-init
            defaultMode: 0440
            items:
              - key: 10-bootstrap.sql
                path: 10-bootstrap.sql
        - name: config
          configMap:
            name: mattercodex-postgresql-init
            defaultMode: 0440
            items:
              - key: pg_hba.conf
                path: pg_hba.conf
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mattercodex-postgresql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mattercodex-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-postgresql-rw
spec:
  selector:
    app.kubernetes.io/name: mattercodex-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: internal-rpc-authority-postgresql-rw
spec:
  selector:
    app.kubernetes.io/name: mattercodex-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
