apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kodex-installation-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  ca:
    secretName: kodex-installation-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kodex-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  secretName: kodex-postgresql-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - kodex-postgresql
    - kodex-postgresql.kodex-system.svc
    - kodex-postgresql.kodex-system.svc.cluster.local
    - control-plane-postgresql-rw.kodex-system.svc
    - control-plane-postgresql-rw.kodex-system.svc.cluster.local
    - internal-rpc-authority-postgresql-rw.kodex-system.svc
    - internal-rpc-authority-postgresql-rw.kodex-system.svc.cluster.local
  usages:
    - server auth
  issuerRef:
    name: kodex-installation-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secret-broker-server
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
