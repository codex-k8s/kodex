apiVersion: batch/v1
kind: Job
metadata:
  name: kodex-postgresql-runtime-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kodex-postgresql-runtime-credentials
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reconcile
          image: docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
          command: [/bin/sh, /opt/kodex/reconcile.sh]
          env:
            - {name: PGHOST, value: kodex-postgresql.kodex-system.svc.cluster.local}
            - {name: PGPORT, value: "5432"}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /var/run/tls/ca.crt}
            - {name: PGPASSWORD_FILE, value: /var/run/bootstrap/password}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: script, mountPath: /opt/kodex, readOnly: true}
            - {name: runtime-credentials, mountPath: /var/run/runtime-credentials, readOnly: true}
            - {name: bootstrap, mountPath: /var/run/bootstrap, readOnly: true}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: kodex-postgresql-runtime-credentials, defaultMode: 0550}
        - name: runtime-credentials
          secret: {secretName: kodex-postgresql-runtime-credentials, defaultMode: 0400}
        - name: bootstrap
          secret: {secretName: kodex-postgresql-bootstrap, defaultMode: 0400}
        - name: tls
          secret: {secretName: kodex-postgresql-tls, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 8Mi}

