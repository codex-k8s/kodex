apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kodex-nats
  labels:
    app.kubernetes.io/name: kodex-nats
    app.kubernetes.io/component: broker
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  serviceName: kodex-nats
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kodex-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kodex-nats
        app.kubernetes.io/component: broker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/library/nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
          command: [/var/run/config/render-config.sh]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /var/run/config
              readOnly: true
            - name: credentials
              mountPath: /var/run/credentials
              readOnly: true
            - name: runtime
              mountPath: /var/run/runtime
      containers:
        - name: nats
          image: docker.io/library/nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
          imagePullPolicy: IfNotPresent
          args: [-c, /var/run/runtime/nats.conf]
          ports:
            - name: client-tls
              containerPort: 4222
              protocol: TCP
            - name: monitoring
              containerPort: 8222
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: client-tls
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitoring
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/run/runtime
              readOnly: true
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kodex-nats-config
            defaultMode: 0550
        - name: credentials
          secret:
            secretName: kodex-nats-credentials
            defaultMode: 0440
        - name: runtime
          emptyDir:
            sizeLimit: 1Mi
        - name: tls
          secret:
            secretName: kodex-nats-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kodex-nats
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kodex-nats
  ports:
    - name: client-tls
      port: 4222
      targetPort: client-tls
      protocol: TCP
    - name: monitoring
      port: 8222
      targetPort: monitoring
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app.kubernetes.io/name: kodex-nats
  ports:
    - name: client-tls
      port: 4222
      targetPort: client-tls
      protocol: TCP
