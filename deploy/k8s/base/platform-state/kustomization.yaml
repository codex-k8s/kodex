apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodex-system
resources:
  - certificates.yaml
  - authority-certificates.yaml
  - ca-bundles.yaml
  - authority-ca-bundles.yaml
  - postgresql.yaml
  - postgresql-runtime-credentials.yaml
  - nats.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: kodex-postgresql-init
    files:
      - 10-bootstrap.sql=postgresql/10-bootstrap.sql
      - 20-bootstrap-passwords.sh=postgresql/20-bootstrap-passwords.sh
      - pg_hba.conf=postgresql/pg_hba.conf
  - name: kodex-postgresql-runtime-credentials
    files:
      - reconcile.sh=postgresql/reconcile-runtime-credentials.sh
  - name: kodex-nats-config
    files:
      - nats.conf=nats/nats.conf
      - render-config.sh=nats/render-config.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: authority-certificate-defaults.patch.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: ^(internal-rpc-authority-(publisher|readback-attestor|restore-controller|restore-operator|(role-image-builder|image-admission|image-promotion|automation-scheduler|session-archive|secret-broker|control-api-gateway|control-plane|integration-gateway|interaction-gateway|runtime-controller)-workload)|runtime-controller-callback-server)$
