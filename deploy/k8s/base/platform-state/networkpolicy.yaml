apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgresql-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - control-plane
                  - internal-rpc-authority
                  - kodex-postgresql-runtime-credentials
      ports:
        - protocol: TCP
          port: 5432
  egress: []
