apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgresql-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - automation-scheduler
                  - artifact-retention
                  - backup-controller
                  - session-archive
                  - control-api-gateway
                  - control-plane
                  - integration-gateway
                  - email-bridge
                  - internal-rpc-authority
                  - internal-rpc-authority-publisher
                  - internal-rpc-authority-readback-attestor
                  - internal-rpc-authority-restore-controller
                  - internal-rpc-authority-restore-recovery
                  - kodex-postgresql-runtime-credentials
                  - role-image-builder
                  - runtime-controller
                  - secret-broker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-image-admission
              app.kubernetes.io/component: image-admission
            matchExpressions:
              - key: kodex.dev/image-admission-phase
                operator: In
                values: [claim, admit, promote]
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-nats-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-nats
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
              app.kubernetes.io/component: internal-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
              app.kubernetes.io/component: broker-bootstrap
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-api-gateway
      ports:
        - {protocol: TCP, port: 4222}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-runtime-credentials-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-postgresql-runtime-credentials
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-postgresql
      ports:
        - {protocol: TCP, port: 5432}
