apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgresql-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - automation-scheduler
                  - backup-controller
                  - session-archive
                  - control-api-gateway
                  - control-plane
                  - integration-gateway
                  - internal-rpc-authority
                  - internal-rpc-authority-publisher
                  - internal-rpc-authority-readback-attestor
                  - internal-rpc-authority-restore-controller
                  - internal-rpc-authority-restore-recovery
                  - kodex-postgresql-runtime-credentials
                  - role-image-builder
                  - runtime-controller
      ports:
        - protocol: TCP
          port: 5432
  egress: []
