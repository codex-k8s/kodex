apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgresql-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - control-plane
                  - internal-rpc-authority
                  - vault
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-nats-exact-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-nats
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - control-plane
                  - control-api-gateway
      ports:
        - protocol: TCP
          port: 4222
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-vault-from-csi-provider
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-csi-provider
      ports:
        - protocol: TCP
          port: 8200
