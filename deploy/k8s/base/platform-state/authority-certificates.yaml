# Общие параметры выпуска добавляет authority-certificate-defaults.patch.yaml через Kustomize.
# Имена Secret, SAN, SPIFFE URI и EKU принадлежат конкретному сертификату.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-rpc-authority-publisher
spec:
  secretName: internal-rpc-authority-publisher-tls
  dnsNames:
    - internal-rpc-authority-publisher
    - internal-rpc-authority-publisher.kodex-system.svc
    - internal-rpc-authority-publisher.kodex-system.svc.cluster.local
  uris:
    - spiffe://kodex.local/ns/kodex-system/sa/internal-rpc-authority-publisher
  usages: [server auth, client auth]
---
