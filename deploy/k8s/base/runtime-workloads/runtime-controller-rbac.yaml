apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-controller-workloads
subjects:
  - kind: ServiceAccount
    name: runtime-controller
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-controller

---
# Только контроллер читает requests/allocatable; агенты не получают cluster-wide права.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runtime-controller-capacity-observer
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runtime-controller-capacity-observer
subjects:
  - kind: ServiceAccount
    name: runtime-controller
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runtime-controller-capacity-observer
