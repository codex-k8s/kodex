apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-broker-runtime-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-broker-runtime-secrets
subjects:
  - kind: ServiceAccount
    name: secret-broker
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-broker-runtime-secrets
