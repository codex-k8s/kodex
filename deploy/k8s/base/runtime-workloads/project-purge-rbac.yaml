apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-project-purge
  namespace: kodex-runtime
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-project-purge
  namespace: kodex-runtime
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-project-purge
