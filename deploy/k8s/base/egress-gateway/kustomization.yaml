apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodex-system
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - dashboard.yaml
configMapGenerator:
  - name: egress-gateway-policy
    files:
      - policy.json=policy.json
    options:
      immutable: true
