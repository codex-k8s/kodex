apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: egress-gateway
  labels:
    app.kubernetes.io/name: egress-gateway
    app.kubernetes.io/component: platform-egress
spec:
  groups:
    - name: egress-gateway.availability
      rules:
        - alert: EgressGatewayUnavailable
          expr: absent(up{service="egress-gateway-technical"}) or sum(up{service="egress-gateway-technical"}) < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Egress gateway недоступен
            description: Ни одна реплика platform egress gateway не доступна для scrape.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
        - alert: EgressGatewayNotReady
          expr: max(mattercodex_egress_gateway_readiness) < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Egress gateway не проходит effective readiness
            description: Проверить ACTIVE policy readback и server-owned DNS validation.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
        - alert: EgressGatewayPolicyInactive
          expr: absent(mattercodex_egress_gateway_policy_active) or max(mattercodex_egress_gateway_policy_active) < 1
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Immutable policy egress gateway не активна
            description: Revision либо canonical digest не подтверждены runtime.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
    - name: egress-gateway.security
      rules:
        - alert: EgressGatewayUnsafeDNSAnswers
          expr: sum(rate(mattercodex_egress_gateway_dns_resolutions_total{outcome="rejected",reason="special_address"}[5m])) > 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Egress gateway отклоняет special-purpose DNS answers
            description: Возможен DNS rebinding либо ошибочная внешняя DNS-конфигурация; unsafe cache отсутствует.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
        - alert: EgressGatewayClientHelloRejections
          expr: sum(rate(mattercodex_egress_gateway_connection_attempts_total{outcome="rejected",stage="clienthello"}[5m])) > 0.1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Растёт число ClientHello reject
            description: Проверить mismatch, missing, duplicate SNI и попытки ECH без раскрытия destination.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
        - alert: EgressGatewayLiteralDialFailures
          expr: sum(rate(mattercodex_egress_gateway_external_dials_total{outcome="failure"}[5m])) > 0.1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Растёт число literal dial failures
            description: Проверить внешний TCP/443 path после успешной DNS validation.
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/egress-gateway.md
