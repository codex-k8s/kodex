apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-retention-runtime
data:
  ARTIFACT_RETENTION_TECHNICAL_LISTEN: ":9090"
  ARTIFACT_RETENTION_POSTGRES_TLS_SERVER_NAME: "control-plane-postgresql-rw.kodex-system.svc.cluster.local"
  ARTIFACT_RETENTION_POSTGRES_MAX_CONNECTIONS: "2"
  ARTIFACT_RETENTION_STARTUP_TIMEOUT: "30s"
  ARTIFACT_RETENTION_SHUTDOWN_TIMEOUT: "20s"
  ARTIFACT_RETENTION_OPERATION_TIMEOUT: "20s"
  ARTIFACT_RETENTION_POLL_INTERVAL: "30s"
  ARTIFACT_RETENTION_READINESS_INTERVAL: "10s"
  ARTIFACT_RETENTION_CLAIM_LEASE: "2m"
  ARTIFACT_RETENTION_BATCH_SIZE: "32"
