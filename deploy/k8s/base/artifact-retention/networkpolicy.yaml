apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-retention-deny-all
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: artifact-retention}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-retention-exact-runtime-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artifact-retention
      app.kubernetes.io/component: retention-job
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kodex-postgresql}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/component: object-storage
      ports: [{protocol: TCP, port: 8333}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: opentelemetry-collector}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: sentry-relay}
      ports: [{protocol: TCP, port: 8443}]
