apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattercodex-system
resources:
  - deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: staff-control-center-runtime
    files:
      - runtime-config.json
      - security-headers.conf
      - readiness.json
generatorOptions:
  disableNameSuffixHash: false
  immutable: true
