# Публичность браузерного запроса задаёт exact Ingress; backend по-прежнему
# принимает только удостоверенный ingress transport. SPA fallback запрещён.
location = /manifest.webmanifest {
  if ($client_certificate_denied) { return 403; }
  types { application/manifest+json webmanifest; }
  expires -1;
  try_files $uri =404;
}

location = /logo.png {
  if ($client_certificate_denied) { return 403; }
  expires -1;
  try_files $uri =404;
}
