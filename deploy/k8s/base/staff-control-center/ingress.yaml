apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staff-control-center
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: mattercodex-system/staff-control-center-ingress-client-tls
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "2"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: staff-control-center.mattercodex-system.svc.cluster.local
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [control.kodex.works]
      secretName: staff-control-center-public-tls
  rules:
    - host: control.kodex.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: staff-control-center, port: {name: https}}
