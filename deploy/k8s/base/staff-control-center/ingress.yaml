apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staff-control-center
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [control.mattercodex.local]
      secretName: staff-control-center-public-tls
  rules:
    - host: control.mattercodex.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: staff-control-center, port: {name: http}}
