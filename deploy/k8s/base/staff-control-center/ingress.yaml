apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staff-control-center
  annotations:
    cert-manager.io/cluster-issuer: __MATTERCODEX_CLUSTER_ISSUER__
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/service.serverstransport: mattercodex-system-staff-control-center@kubernetescrd
spec:
  ingressClassName: __MATTERCODEX_INGRESS_CLASS__
  tls:
    - hosts: [__MATTERCODEX_PUBLIC_HOST__]
      secretName: staff-control-center-public-tls
  rules:
    - host: __MATTERCODEX_PUBLIC_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: staff-control-center, port: {name: https}}
