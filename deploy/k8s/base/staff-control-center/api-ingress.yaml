apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staff-control-center-api
  annotations:
    kubernetes.io/ingress.class: __KODEX_INGRESS_CLASS__
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "200"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kodex-system-oauth2-control-center-auth@kubernetescrd
spec:
  ingressClassName: __KODEX_INGRESS_CLASS__
  tls:
    - hosts: [__KODEX_PUBLIC_HOST__]
      secretName: staff-control-center-public-tls
  rules:
    - host: __KODEX_PUBLIC_HOST__
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service: { name: staff-control-center, port: { name: https } }
