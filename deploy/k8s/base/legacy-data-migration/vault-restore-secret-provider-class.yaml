apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: legacy-data-migration-restore
spec:
  provider: vault
  parameters:
    roleName: legacy-data-migration-restore
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "restore-dsn"
        secretPath: "database/static-creds/legacy-data-migration-restore"
        secretKey: "dsn"
        filePermission: 288
