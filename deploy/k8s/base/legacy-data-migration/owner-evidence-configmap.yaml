apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-data-migration-owner-evidence
data:
  # Execution PR заменяет весь документ exact readback-доказательством.
  # Placeholder намеренно не проходит owner materializer и Job остаётся suspend.
  owner-evidence.json: |
    {
      "schemaVersion": "mattercodex.legacy-data-owner-evidence.v1",
      "archive": {
        "storagePrefix": "replace-with-immutable-archive-prefix",
        "storageVersion": "replace-with-version",
        "retentionRef": "replace-with-retention-reference",
        "scanPolicyRevision": 0,
        "scanEvidenceSha256": "replace-with-scan-evidence-sha256",
        "scannerWorkloadId": "replace-with-scanner-workload",
        "scannedAt": "0001-01-01T00:00:00Z"
      },
      "provider": {
        "observedAt": "0001-01-01T00:00:00Z",
        "observationRevision": 0,
        "observedLimit": 0
      },
      "roleImage": {
        "input": {},
        "generation": 0,
        "specSha256": "replace-with-spec-sha256",
        "buildStagingReference": "replace-with-staging-reference",
        "buildManifestDigest": "replace-with-manifest-digest",
        "buildProvenanceSha256": "replace-with-provenance-sha256",
        "promotedReference": "replace-with-promoted-reference",
        "admissionRevision": 0,
        "admissionReceiptSha256": "replace-with-admission-sha256",
        "admissionReceiptManifestDigest": "replace-with-admission-manifest",
        "signatureSha256": "replace-with-signature-sha256",
        "promotionReadbackSha256": "replace-with-promotion-sha256",
        "sbomSha256": "replace-with-sbom-sha256",
        "vulnerabilityEvidenceSha256": "replace-with-vulnerability-sha256",
        "signatureIdentity": "replace-with-signature-identity",
        "promotedAt": "0001-01-01T00:00:00Z"
      }
    }
