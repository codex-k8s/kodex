apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: legacy-data-migration
spec:
  provider: vault
  parameters:
    roleName: legacy-data-migration
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "source-dsn"
        secretPath: "database/static-creds/legacy-data-migration-source"
        secretKey: "dsn"
        filePermission: 288
      - objectName: "target-dsn"
        secretPath: "database/static-creds/legacy-data-migration-target"
        secretKey: "dsn"
        filePermission: 288
      - objectName: "backup-key"
        secretPath: "kv/data/mattercodex/legacy-data-migration/backup"
        secretKey: "key"
        filePermission: 288
