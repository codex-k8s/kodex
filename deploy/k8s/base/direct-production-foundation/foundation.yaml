        - name: config
          configMap: {name: mattercodex-legacy-transport-bridges, items: [{key: mattermost.yaml, path: envoy.yaml}]}
        - {name: tls, secret: {secretName: mattercodex-legacy-mattermost-bridge-tls, defaultMode: 0440}}
