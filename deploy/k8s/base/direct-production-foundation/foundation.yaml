apiVersion: v1
kind: ConfigMap
metadata: {name: mattercodex-legacy-transport-bridges, namespace: mattercodex-system}
data:
  mattermost.yaml: |
    static_resources:
      listeners:
        - name: downstream_mtls
          address: {socket_address: {address: 0.0.0.0, port_value: 8443}}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_params: {tls_minimum_protocol_version: TLSv1_3}
                    tls_certificates:
                      - certificate_chain: {filename: /var/run/tls/tls.crt}
                        private_key: {filename: /var/run/tls/tls.key}
                    validation_context: {trusted_ca: {filename: /var/run/tls/ca.crt}}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: legacy_mattermost
                    route_config:
                      name: legacy_mattermost
                      virtual_hosts:
                        - name: legacy_mattermost
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route:
                                cluster: legacy_mattermost
                                host_rewrite_literal: chat.kodex.works
                    upgrade_configs:
                      - upgrade_type: websocket
                    http_filters:
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              exact-interaction-gateway:
                                permissions: [{any: true}]
                                principals:
                                  - authenticated:
                                      principal_name:
                                        exact: spiffe://mattercodex.local/ns/mattercodex-system/sa/interaction-gateway
                      - {name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}
        - name: readiness
          address: {socket_address: {address: 0.0.0.0, port_value: 9902}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: legacy_mattermost_readiness
                    route_config:
                      name: legacy_mattermost_readiness
                      virtual_hosts:
                        - name: legacy_mattermost_readiness
                          domains: ["*"]
                          routes: [{match: {prefix: "/readyz"}, route: {cluster: legacy_mattermost, prefix_rewrite: "/api/v4/system/ping"}}]
                    http_filters: [{name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}]
      clusters:
        - name: legacy_mattermost
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: legacy_mattermost
            endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: mattermost.matter-kodex-prod.svc.cluster.local, port_value: 8065}}}}]}]
    admin: {access_log_path: /dev/null, address: {socket_address: {address: 0.0.0.0, port_value: 9901}}}
  bot-service.yaml: |
    static_resources:
      listeners:
        - name: downstream_mtls
          address: {socket_address: {address: 0.0.0.0, port_value: 8443}}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_params: {tls_minimum_protocol_version: TLSv1_3}
                    tls_certificates:
                      - certificate_chain: {filename: /var/run/tls/tls.crt}
                        private_key: {filename: /var/run/tls/tls.key}
                    validation_context: {trusted_ca: {filename: /var/run/tls/ca.crt}}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: legacy_bot_service
                    route_config:
                      name: legacy_bot_service
                      virtual_hosts:
                        - name: legacy_bot_service
                          domains: ["*"]
                          routes: [{match: {prefix: "/"}, route: {cluster: legacy_bot_service}}]
                    http_filters:
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              exact-application-clients:
                                permissions: [{any: true}]
                                principals:
                                  - authenticated:
                                      principal_name:
                                        exact: spiffe://mattercodex.local/ns/mattercodex-system/sa/interaction-gateway
                      - {name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}
        - name: readiness
          address: {socket_address: {address: 0.0.0.0, port_value: 9902}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: legacy_bot_service_readiness
                    route_config:
                      name: legacy_bot_service_readiness
                      virtual_hosts:
                        - name: legacy_bot_service_readiness
                          domains: ["*"]
                          routes: [{match: {prefix: "/readyz"}, route: {cluster: legacy_bot_service, prefix_rewrite: "/healthz"}}]
                    http_filters: [{name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}]
      clusters:
        - name: legacy_bot_service
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: legacy_bot_service
            endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: matter-codex-bot-service.matter-kodex-prod.svc.cluster.local, port_value: 8080}}}}]}]
    admin: {access_log_path: /dev/null, address: {socket_address: {address: 0.0.0.0, port_value: 9901}}}
---
apiVersion: apps/v1
kind: Deployment
