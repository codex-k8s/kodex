    internal_rpc_authority_migrator	ira_interaction_gateway_issuer_g1
    internal_rpc_authority_migrator	ira_interaction_gateway_verifier_g1
    internal_rpc_authority_migrator	ira_publisher_g1
    internal_rpc_authority_migrator	ira_publisher_g2
    internal_rpc_authority_migrator	ira_publisher_g3
    internal_rpc_authority_migrator	ira_publisher_g4
    internal_rpc_authority_migrator	ira_publisher_g5
    internal_rpc_authority_migrator	ira_readback_attestor_g1
    internal_rpc_authority_migrator	ira_readback_attestor_g2
    internal_rpc_authority_migrator	ira_readback_attestor_g3
    internal_rpc_authority_migrator	ira_readback_attestor_g4
    internal_rpc_authority_migrator	ira_readback_attestor_g5
    internal_rpc_authority_migrator	ira_restore_controller_g1
    internal_rpc_authority_migrator	ira_runtime_controller_issuer_g1
    internal_rpc_authority_credential_lifecycle_definer	internal_rpc_authority_publisher
    internal_rpc_authority_credential_lifecycle_definer	internal_rpc_authority_readback_attestor
    internal_rpc_authority_credential_lifecycle_definer	ira_publisher_g1
    internal_rpc_authority_credential_lifecycle_definer	ira_publisher_g2
    internal_rpc_authority_credential_lifecycle_definer	ira_publisher_g3
    internal_rpc_authority_credential_lifecycle_definer	ira_publisher_g4
    internal_rpc_authority_credential_lifecycle_definer	ira_publisher_g5
    internal_rpc_authority_credential_lifecycle_definer	ira_readback_attestor_g1
    internal_rpc_authority_credential_lifecycle_definer	ira_readback_attestor_g2
    internal_rpc_authority_credential_lifecycle_definer	ira_readback_attestor_g3
    internal_rpc_authority_credential_lifecycle_definer	ira_readback_attestor_g4
    internal_rpc_authority_credential_lifecycle_definer	ira_readback_attestor_g5
  reconcile.sh: |
    #!/bin/sh
    set -eu
    umask 077
    sql_file=$(mktemp /tmp/principals.sql.XXXXXX)
    principals_file=$(mktemp /tmp/principals.tsv.XXXXXX)
    dollar_quote='$bootstrap$'
    postgres_dsn='host=mattercodex-postgresql dbname=postgres user=postgres sslmode=verify-full sslrootcert=/var/run/tls/ca.crt'
    trap 'rm -f -- "$sql_file" "$principals_file"' EXIT HUP INT TERM
    tr '\t' '|' </var/run/bootstrap/principals.tsv >"$principals_file"
    printf '%s\n' 'SET client_min_messages = warning;' >"$sql_file"
    while IFS= read -r role; do
      [ -n "$role" ] || continue
      case "$role" in (*[!a-z0-9_]*) exit 20 ;; esac
      printf "DO %s BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN CREATE ROLE %s; END IF; END %s;\n" "$dollar_quote" "$role" "$role" "$dollar_quote" >>"$sql_file"
      case "$role" in
        control_plane_role_controller|integration_gateway_role_controller|interaction_gateway_role_controller)
          printf 'ALTER ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB CREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;\n' "$role" >>"$sql_file" ;;
        internal_rpc_authority_credential_lifecycle_definer)
          printf 'ALTER ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB CREATEROLE INHERIT NOREPLICATION NOBYPASSRLS;\n' "$role" >>"$sql_file" ;;
        *) printf 'ALTER ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;\n' "$role" >>"$sql_file" ;;
      esac
    done </var/run/bootstrap/capability-roles.txt
    while IFS='|' read -r principal database memberships create_role; do
      [ -n "$principal" ] || continue
      case "$principal:$database:$create_role" in (*[!a-z0-9_,:\-]*) exit 21 ;; esac
      password=$(cat "/var/run/principals/$principal")
      case "$password" in (*[!a-f0-9]*|'') exit 22 ;; esac
      [ "${#password}" -eq 64 ] || exit 23
      printf "DO %s BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN CREATE ROLE %s; END IF; END %s;\n" "$dollar_quote" "$principal" "$principal" "$dollar_quote" >>"$sql_file"
      if [ "$create_role" = true ]; then role_flag=CREATEROLE; else role_flag=NOCREATEROLE; fi
      case "$principal" in
        ira_publisher_g[1-5]|ira_readback_attestor_g[1-5])
          printf "ALTER ROLE %s PASSWORD '%s' NOSUPERUSER NOCREATEDB %s NOINHERIT NOREPLICATION NOBYPASSRLS;\n" "$principal" "$password" "$role_flag" >>"$sql_file" ;;
        *)
          printf "ALTER ROLE %s LOGIN PASSWORD '%s' NOSUPERUSER NOCREATEDB %s NOINHERIT NOREPLICATION NOBYPASSRLS;\n" "$principal" "$password" "$role_flag" >>"$sql_file" ;;
      esac
      printf 'GRANT CONNECT ON DATABASE %s TO %s;\n' "$database" "$principal" >>"$sql_file"
      if [ "$create_role" = true ]; then
        printf 'GRANT CREATE, TEMP ON DATABASE %s TO %s;\n' "$database" "$principal" >>"$sql_file"
      fi
      # The fenced lifecycle reconciler exclusively owns generation memberships.
      case "$principal" in
        ira_publisher_g[1-5]|ira_readback_attestor_g[1-5]) continue ;;
      esac
      admin_targets_for_principal=$(awk -F '\t' -v principal="$principal" '
        $1 == principal { if (found++) printf ","; printf "%s", $2 }
        END { print "" }
      ' /var/run/bootstrap/admin-memberships.tsv)
      desired_memberships=$memberships
      if [ -n "$admin_targets_for_principal" ]; then
        if [ -n "$desired_memberships" ]; then
          desired_memberships="$desired_memberships,$admin_targets_for_principal"
        else
          desired_memberships=$admin_targets_for_principal
        fi
      fi
      case "$desired_memberships" in (*[!a-z0-9_,]*) exit 30 ;; esac
      printf "DO %s DECLARE membership text; membership_grantor text; BEGIN FOR membership, membership_grantor IN SELECT role.rolname, grantor.rolname FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles role ON role.oid = member.roleid JOIN pg_catalog.pg_roles login ON login.oid = member.member JOIN pg_catalog.pg_roles grantor ON grantor.oid = member.grantor WHERE login.rolname = '%s' AND role.rolname NOT IN (SELECT trim(value) FROM regexp_split_to_table('%s', ',') value) LOOP EXECUTE format('REVOKE %%I FROM %%I GRANTED BY %%I', membership, '%s', membership_grantor); END LOOP; END %s;\n" "$dollar_quote" "$principal" "$desired_memberships" "$principal" "$dollar_quote" >>"$sql_file"
      if [ "$create_role" = true ]; then admin_flag=TRUE; else admin_flag=FALSE; fi
      old_ifs=$IFS; IFS=,
      for membership in $memberships; do
        [ -n "$membership" ] || continue
        printf 'GRANT %s TO %s WITH INHERIT FALSE, SET TRUE, ADMIN %s;\n' "$membership" "$principal" "$admin_flag" >>"$sql_file"
      done
      IFS=$old_ifs
    done <"$principals_file"
    while IFS='	' read -r administrator managed_role; do
      [ -n "$administrator" ] && [ -n "$managed_role" ] || continue
      case "$administrator:$managed_role" in (*[!a-z0-9_:]*) exit 28 ;; esac
      case "$administrator:$managed_role" in
        internal_rpc_authority_credential_lifecycle_definer:internal_rpc_authority_publisher|internal_rpc_authority_credential_lifecycle_definer:internal_rpc_authority_readback_attestor)
          # Preserve an exact capability-admin grant because its dependent
          # generation grants are owned by the fenced lifecycle reconciler.
          # Migrations may repeat this exact grant under their own grantor;
          # remove only those duplicate chains while the canonical owner grant
          # remains active, so dependent grants are not cascaded.
          printf "DO %s DECLARE duplicate_grantor text; BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') OR NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN RAISE EXCEPTION 'bounded lifecycle administrator role is unavailable'; END IF; IF EXISTS (SELECT 1 FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles managed ON managed.oid = member.roleid JOIN pg_catalog.pg_roles administrator ON administrator.oid = member.member WHERE managed.rolname = '%s' AND administrator.rolname = '%s' AND NOT (member.admin_option AND NOT member.inherit_option AND NOT member.set_option)) THEN RAISE EXCEPTION 'dependent lifecycle administrator grant is invalid'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles managed ON managed.oid = member.roleid JOIN pg_catalog.pg_roles administrator ON administrator.oid = member.member JOIN pg_catalog.pg_roles grantor ON grantor.oid = member.grantor WHERE managed.rolname = '%s' AND administrator.rolname = '%s' AND grantor.rolname = 'postgres' AND member.admin_option AND NOT member.inherit_option AND NOT member.set_option) THEN EXECUTE format('GRANT %%I TO %%I WITH INHERIT FALSE, SET FALSE, ADMIN TRUE', '%s', '%s'); END IF; FOR duplicate_grantor IN SELECT grantor.rolname FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles managed ON managed.oid = member.roleid JOIN pg_catalog.pg_roles administrator ON administrator.oid = member.member JOIN pg_catalog.pg_roles grantor ON grantor.oid = member.grantor WHERE managed.rolname = '%s' AND administrator.rolname = '%s' AND grantor.rolname <> 'postgres' LOOP EXECUTE format('REVOKE %%I FROM %%I GRANTED BY %%I', '%s', '%s', duplicate_grantor); END LOOP; END %s;\n" "$dollar_quote" "$managed_role" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$dollar_quote" >>"$sql_file"
          continue ;;
      esac
      if [ "$managed_role" = internal_rpc_authority_credential_lifecycle_definer ]; then
        managed_role_flag=CREATEROLE
      else
        managed_role_flag=NOCREATEROLE
      fi
      printf "DO %s DECLARE admin_grantor text; BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN CREATE ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB %s NOINHERIT NOREPLICATION NOBYPASSRLS; END IF; IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN RAISE EXCEPTION 'bounded administrator role is unavailable'; END IF; FOR admin_grantor IN SELECT grantor.rolname FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles managed ON managed.oid = member.roleid JOIN pg_catalog.pg_roles administrator ON administrator.oid = member.member JOIN pg_catalog.pg_roles grantor ON grantor.oid = member.grantor WHERE managed.rolname = '%s' AND administrator.rolname = '%s' LOOP EXECUTE format('REVOKE %%I FROM %%I GRANTED BY %%I', '%s', '%s', admin_grantor); END LOOP; GRANT %s TO %s WITH INHERIT FALSE, SET FALSE, ADMIN TRUE; END %s;\n" "$dollar_quote" "$managed_role" "$managed_role" "$managed_role_flag" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$managed_role" "$administrator" "$dollar_quote" >>"$sql_file"
    done </var/run/bootstrap/admin-memberships.tsv
    while IFS= read -r principal; do
      [ -n "$principal" ] || continue
      printf "DO %s DECLARE membership text; membership_grantor text; BEGIN IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '%s') THEN FOR membership, membership_grantor IN SELECT role.rolname, grantor.rolname FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles role ON role.oid = member.roleid JOIN pg_catalog.pg_roles login ON login.oid = member.member JOIN pg_catalog.pg_roles grantor ON grantor.oid = member.grantor WHERE login.rolname = '%s' LOOP EXECUTE format('REVOKE %%I FROM %%I GRANTED BY %%I', membership, '%s', membership_grantor); END LOOP; ALTER ROLE %s NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS; PERFORM pg_catalog.pg_terminate_backend(pid) FROM pg_catalog.pg_stat_activity WHERE usename = '%s' AND pid <> pg_catalog.pg_backend_pid(); END IF; END %s;\n" "$dollar_quote" "$principal" "$principal" "$principal" "$principal" "$principal" "$dollar_quote" >>"$sql_file"
    done </var/run/bootstrap/retired-principals.txt
    attempt=0
    until psql "$postgres_dsn" --no-password --tuples-only --command 'SELECT 1' >/dev/null 2>&1; do
      attempt=$((attempt + 1))
      [ "$attempt" -lt 30 ] || exit 27
      sleep 2
    done
    psql "$postgres_dsn" --no-password --set ON_ERROR_STOP=1 --file "$sql_file" >/dev/null
    migration_principals=0
    while IFS='|' read -r principal database memberships create_role; do
      [ "$create_role" = true ] || continue
      migration_principals=$((migration_principals + 1))
      owner_role=${memberships%%,*}
      case "$owner_role" in (*_owner) ;; (*) exit 35 ;; esac
      database_dsn="host=mattercodex-postgresql dbname=$database user=postgres sslmode=verify-full sslrootcert=/var/run/tls/ca.crt"
      psql "$database_dsn" --no-password --set ON_ERROR_STOP=1 \
        --command "SET client_min_messages=warning;
          GRANT USAGE, CREATE ON SCHEMA public TO $owner_role, $principal;
          CREATE TABLE IF NOT EXISTS public.goose_db_version (
            id integer PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY,
            version_id bigint NOT NULL,
            is_applied boolean NOT NULL,
            tstamp timestamp NOT NULL DEFAULT now()
          );
          ALTER TABLE public.goose_db_version OWNER TO $owner_role;
          ALTER SEQUENCE public.goose_db_version_id_seq OWNER TO $owner_role;
          INSERT INTO public.goose_db_version (version_id, is_applied)
          SELECT 0, true
          WHERE NOT EXISTS (SELECT 1 FROM public.goose_db_version);
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.goose_db_version TO $principal;
          GRANT USAGE, SELECT, UPDATE ON SEQUENCE public.goose_db_version_id_seq TO $principal" >/dev/null
      goose_table_count=$(psql "$database_dsn" --no-password --tuples-only --no-align \
        --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM pg_catalog.pg_class WHERE oid = pg_catalog.to_regclass('public.goose_db_version')" | tr -d '[:space:]')
      [ "$goose_table_count" = 1 ] || exit 31
      schema_access=$(psql "$database_dsn" --no-password --tuples-only --no-align \
        --set ON_ERROR_STOP=1 --command "SELECT pg_catalog.has_schema_privilege('$principal', 'public', 'USAGE') AND pg_catalog.has_schema_privilege('$principal', 'public', 'CREATE')" | tr -d '[:space:]')
      [ "$schema_access" = t ] || exit 32
      goose_table_owner=$(psql "$database_dsn" --no-password --tuples-only --no-align \
        --set ON_ERROR_STOP=1 --command "SELECT pg_catalog.pg_get_userbyid(relowner) FROM pg_catalog.pg_class WHERE oid = pg_catalog.to_regclass('public.goose_db_version')" | tr -d '[:space:]')
      [ "$goose_table_owner" = "$owner_role" ] || exit 33
      goose_baseline=$(psql "$database_dsn" --no-password --tuples-only --no-align \
        --set ON_ERROR_STOP=1 --command "SELECT count(*) FILTER (WHERE version_id = 0 AND is_applied) = 1 FROM public.goose_db_version" | tr -d '[:space:]')
      [ "$goose_baseline" = t ] || exit 37
      goose_access=$(psql "$database_dsn" --no-password --tuples-only --no-align \
        --set ON_ERROR_STOP=1 --command "SELECT pg_catalog.has_table_privilege('$principal', 'public.goose_db_version', 'SELECT') AND pg_catalog.has_table_privilege('$principal', 'public.goose_db_version', 'INSERT') AND pg_catalog.has_table_privilege('$principal', 'public.goose_db_version', 'UPDATE') AND pg_catalog.has_table_privilege('$principal', 'public.goose_db_version', 'DELETE') AND pg_catalog.has_sequence_privilege('$principal', 'public.goose_db_version_id_seq', 'USAGE') AND pg_catalog.has_sequence_privilege('$principal', 'public.goose_db_version_id_seq', 'SELECT') AND pg_catalog.has_sequence_privilege('$principal', 'public.goose_db_version_id_seq', 'UPDATE')" | tr -d '[:space:]')
      [ "$goose_access" = t ] || exit 36
    done <"$principals_file"
    [ "$migration_principals" -eq 5 ] || exit 34
    expected=$(wc -l </var/run/bootstrap/principals.tsv | tr -d ' ')
    actual=$(psql "$postgres_dsn" --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN (SELECT trim(value) FROM regexp_split_to_table('$(cut -f1 /var/run/bootstrap/principals.tsv | paste -sd, -)', ',') value) AND NOT rolsuper AND NOT rolcreatedb AND NOT rolreplication AND NOT rolbypassrls" | tr -d '[:space:]')
    [ "$actual" = "$expected" ] || exit 24
    expected_static_login=$(awk -F '\t' '
      $1 !~ /^ira_publisher_g[1-5]$/ && $1 !~ /^ira_readback_attestor_g[1-5]$/ { count++ }
      END { print count + 0 }
    ' /var/run/bootstrap/principals.tsv)
    actual_static_login=$(psql "$postgres_dsn" --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN (SELECT trim(value) FROM regexp_split_to_table('$(cut -f1 /var/run/bootstrap/principals.tsv | paste -sd, -)', ',') value) AND rolname !~ '^ira_publisher_g[1-5]$' AND rolname !~ '^ira_readback_attestor_g[1-5]$' AND rolcanlogin" | tr -d '[:space:]')
    [ "$actual_static_login" = "$expected_static_login" ] || exit 37
    expected_memberships=$(awk -F '\t' '{if ($3 != "") {count=split($3, memberships, ","); total+=count}} END {print total+0}' /var/run/bootstrap/principals.tsv)
    expected_admin_memberships=$(awk -F '\t' '
      NR == FNR { principals[$1] = 1; next }
      $1 in principals { count++ }
      END { print count + 0 }
    ' /var/run/bootstrap/principals.tsv /var/run/bootstrap/admin-memberships.tsv)
    expected_memberships=$((expected_memberships + expected_admin_memberships))
    actual_memberships=$(psql "$postgres_dsn" --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM (SELECT DISTINCT member.roleid, member.member FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles login ON login.oid = member.member WHERE login.rolname IN (SELECT trim(value) FROM regexp_split_to_table('$(cut -f1 /var/run/bootstrap/principals.tsv | paste -sd, -)', ',') value) AND login.rolname !~ '^ira_publisher_g[1-5]$' AND login.rolname !~ '^ira_readback_attestor_g[1-5]$') canonical_memberships" | tr -d '[:space:]')
    [ "$actual_memberships" = "$expected_memberships" ] || exit 25
    while IFS='	' read -r administrator managed_role; do
      actual_admin_membership=$(psql "$postgres_dsn" --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM pg_catalog.pg_auth_members member JOIN pg_catalog.pg_roles administrator ON administrator.oid = member.member JOIN pg_catalog.pg_roles managed ON managed.oid = member.roleid WHERE administrator.rolname = '$administrator' AND managed.rolname = '$managed_role' AND member.admin_option AND NOT member.inherit_option AND NOT member.set_option" | tr -d '[:space:]')
      [ "$actual_admin_membership" = 1 ] || exit 29
    done </var/run/bootstrap/admin-memberships.tsv
    retired_unsafe=$(psql "$postgres_dsn" --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM pg_catalog.pg_roles role WHERE role.rolname IN (SELECT trim(value) FROM regexp_split_to_table('$(paste -sd, /var/run/bootstrap/retired-principals.txt)', ',') value) AND (role.rolcanlogin OR EXISTS (SELECT 1 FROM pg_catalog.pg_auth_members member WHERE member.member = role.oid))" | tr -d '[:space:]')
    [ "$retired_unsafe" = 0 ] || exit 26
    printf 'PostgreSQL principal bootstrap readback completed\n'
---
apiVersion: batch/v1
kind: Job
metadata: {name: mattercodex-postgresql-principal-bootstrap, namespace: mattercodex-system}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: mattercodex-postgresql-principal-bootstrap, app.kubernetes.io/component: database-bootstrap}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: principal-bootstrap
          image: docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
          command: [/var/run/bootstrap/reconcile.sh]
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: mattercodex-postgresql-bootstrap, key: password}}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: bootstrap, mountPath: /var/run/bootstrap, readOnly: true}
            - {name: principals, mountPath: /var/run/principals, readOnly: true}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: bootstrap, configMap: {name: mattercodex-postgresql-principal-bootstrap, defaultMode: 0550}}
        - {name: principals, secret: {secretName: mattercodex-postgresql-principals, defaultMode: 0400}}
        - {name: tls, secret: {secretName: mattercodex-postgresql-tls, defaultMode: 0440}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: mattercodex-nats-config, namespace: mattercodex-system}
data:
  nats.conf: |
    server_name: mattercodex-nats
    port: 4222
    http_port: 8222
    operator: __NATS_OPERATOR_JWT__
    system_account: __NATS_SYSTEM_ACCOUNT__
    resolver: MEMORY
    resolver_preload: {
      __NATS_SYSTEM_ACCOUNT__: __NATS_SYSTEM_ACCOUNT_JWT__,
      __NATS_APPLICATION_ACCOUNT__: __NATS_APPLICATION_ACCOUNT_JWT__
    }
    tls {
      cert_file: "/var/run/tls/tls.crt"
      key_file: "/var/run/tls/tls.key"
      ca_file: "/var/run/tls/ca.crt"
      verify: true
      timeout: 2
    }
    jetstream {
      store_dir: "/data/jetstream"
      max_mem_store: 512Mi
      max_file_store: 8Gi
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mattercodex-nats, namespace: mattercodex-system}
spec:
  serviceName: mattercodex-nats
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: mattercodex-nats}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mattercodex-nats, app.kubernetes.io/component: broker}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: render-config
          image: docker.io/library/nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              operator_jwt=$(cat /var/run/credentials/operator.jwt)
              system_account=$(cat /var/run/credentials/system-account.public)
              system_account_jwt=$(cat /var/run/credentials/system-account.jwt)
              application_account=$(cat /var/run/credentials/account.public)
              application_account_jwt=$(cat /var/run/credentials/account.jwt)
              case "$operator_jwt:$system_account_jwt:$application_account_jwt" in (*[!A-Za-z0-9._:-]*|'') exit 20 ;; esac
              case "$system_account:$application_account" in (*[!A-Z0-9:]*|'') exit 21 ;; esac
              [ "${#system_account}" -eq 56 ] && [ "${#application_account}" -eq 56 ] || exit 22
              sed \
                -e "s|__NATS_OPERATOR_JWT__|$operator_jwt|" \
                -e "s|__NATS_SYSTEM_ACCOUNT__|$system_account|g" \
                -e "s|__NATS_SYSTEM_ACCOUNT_JWT__|$system_account_jwt|" \
                -e "s|__NATS_APPLICATION_ACCOUNT__|$application_account|" \
                -e "s|__NATS_APPLICATION_ACCOUNT_JWT__|$application_account_jwt|" \
                /var/run/config/nats.conf > /var/run/runtime/nats.conf
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: config, mountPath: /var/run/config, readOnly: true}
            - {name: credentials, mountPath: /var/run/credentials, readOnly: true}
            - {name: runtime, mountPath: /var/run/runtime}
      containers:
        - name: nats
          image: docker.io/library/nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
          args: [-c, /var/run/runtime/nats.conf]
          ports: [{name: client-tls, containerPort: 4222}, {name: monitoring, containerPort: 8222}]
          startupProbe: {tcpSocket: {port: client-tls}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: "/healthz?js-enabled-only=true", port: monitoring}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /healthz, port: monitoring}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime, mountPath: /var/run/runtime, readOnly: true}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
      volumes:
        - {name: config, configMap: {name: mattercodex-nats-config}}
        - {name: credentials, secret: {secretName: mattercodex-nats-credentials, defaultMode: 0440}}
        - {name: runtime, emptyDir: {sizeLimit: 1Mi}}
        - {name: tls, secret: {secretName: mattercodex-nats-tls, defaultMode: 0440}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 10Gi}}}
