apiVersion: v1
kind: ResourceQuota
metadata:
  name: direct-production-prototype
  namespace: mattercodex-system
spec:
  hard:
    pods: "80"
    persistentvolumeclaims: "16"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.storage: 160Gi
    limits.memory: 28Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: direct-production-prototype
  namespace: mattercodex-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      default:
        memory: "2Gi"
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mattercodex-prototype-selfsigned
  namespace: mattercodex-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mattercodex-prototype-ca
  namespace: mattercodex-system
spec:
  isCA: true
  commonName: mattercodex-prototype-ca
  secretName: mattercodex-prototype-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: mattercodex-prototype-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mattercodex-prototype-ca
  namespace: mattercodex-system
spec:
  ca:
    secretName: mattercodex-prototype-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mattercodex-postgresql
  namespace: mattercodex-system
spec:
  secretName: mattercodex-postgresql-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - mattercodex-postgresql
    - mattercodex-postgresql.mattercodex-system.svc
    - mattercodex-postgresql.mattercodex-system.svc.cluster.local
    - postgresql.mattercodex-system.svc.cluster.local
    - control-plane-postgresql-rw.mattercodex-system.svc.cluster.local
    - internal-rpc-authority-postgresql-rw.mattercodex-system.svc.cluster.local
    - runtime-controller-postgresql-rw.mattercodex-system.svc.cluster.local
    - interaction-gateway-postgresql-rw.mattercodex-system.svc.cluster.local
    - integration-gateway-postgresql-rw.mattercodex-system.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: mattercodex-prototype-ca, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mattercodex-redis
  namespace: mattercodex-system
spec:
  secretName: mattercodex-redis-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  dnsNames:
    - mattercodex-redis
    - mattercodex-redis.mattercodex-system.svc
    - mattercodex-redis.mattercodex-system.svc.cluster.local
    - redis.mattercodex-system.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: mattercodex-prototype-ca, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mattercodex-nats
  namespace: mattercodex-system
spec:
  secretName: mattercodex-nats-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  dnsNames:
    - mattercodex-nats
    - mattercodex-nats.mattercodex-system.svc
    - mattercodex-nats.mattercodex-system.svc.cluster.local
    - nats.mattercodex-system.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: mattercodex-prototype-ca, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mattercodex-object-store
  namespace: mattercodex-system
spec:
  secretName: mattercodex-object-store-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  dnsNames:
    - mattercodex-object-store
    - mattercodex-object-store.mattercodex-system.svc
    - mattercodex-object-store.mattercodex-system.svc.cluster.local
    - object-store.mattercodex-system.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: mattercodex-prototype-ca, kind: Issuer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mattercodex-postgresql-init
  namespace: mattercodex-system
data:
  10-mattercodex-databases.sh: |
    #!/bin/sh
    set -eu
    psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<EOSQL
    CREATE ROLE control_plane_runtime LOGIN PASSWORD '${CONTROL_PLANE_POSTGRES_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    CREATE ROLE internal_rpc_authority_runtime LOGIN PASSWORD '${INTERNAL_RPC_AUTHORITY_POSTGRES_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    CREATE ROLE runtime_controller_runtime LOGIN PASSWORD '${RUNTIME_CONTROLLER_POSTGRES_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    CREATE ROLE interaction_gateway_runtime LOGIN PASSWORD '${INTERACTION_GATEWAY_POSTGRES_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    CREATE ROLE integration_gateway_runtime LOGIN PASSWORD '${INTEGRATION_GATEWAY_POSTGRES_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    CREATE DATABASE control_plane OWNER control_plane_runtime;
    CREATE DATABASE internal_rpc_authority OWNER internal_rpc_authority_runtime;
    CREATE DATABASE runtime_controller OWNER runtime_controller_runtime;
    CREATE DATABASE interaction_gateway OWNER interaction_gateway_runtime;
    CREATE DATABASE integration_gateway OWNER integration_gateway_runtime;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mattercodex-postgresql
  namespace: mattercodex-system
spec:
  serviceName: mattercodex-postgresql
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: mattercodex-postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mattercodex-postgresql, app.kubernetes.io/component: database}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/tls/tls.crt
            - -c
            - ssl_key_file=/var/run/tls/tls.key
            - -c
            - ssl_ca_file=/var/run/tls/ca.crt
            - -c
            - password_encryption=scram-sha-256
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mattercodex-postgresql-bootstrap, key: password}}
          envFrom:
            - secretRef: {name: mattercodex-postgresql-app-passwords}
          ports: [{name: postgresql, containerPort: 5432, protocol: TCP}]
          startupProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 3Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: mattercodex-postgresql-tls, defaultMode: 0440}
        - name: init
          configMap: {name: mattercodex-postgresql-init, defaultMode: 0550}
        - {name: run, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: mattercodex-postgresql, namespace: mattercodex-system}
spec:
  selector: {app.kubernetes.io/name: mattercodex-postgresql}
  ports: [{name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP}]
