apiVersion: v1
kind: ConfigMap
metadata: {name: mattercodex-redis-config, namespace: mattercodex-system}
data:
  redis.conf: |
    bind 0.0.0.0
    port 0
    tls-port 6379
    tls-cert-file /var/run/tls/tls.crt
    tls-key-file /var/run/tls/tls.key
    tls-ca-cert-file /var/run/tls/ca.crt
    tls-auth-clients no
    appendonly yes
    appendfsync everysec
    requirepass __MATTERCODEX_REDIS_PASSWORD__
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mattercodex-redis, namespace: mattercodex-system}
spec:
  serviceName: mattercodex-redis
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: mattercodex-redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mattercodex-redis, app.kubernetes.io/component: cache}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: render-config
          image: docker.io/library/redis:8.4.5-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              password=$(cat /var/run/credentials/password)
              sed "s/__MATTERCODEX_REDIS_PASSWORD__/$password/" /var/run/config/redis.conf > /var/run/runtime/redis.conf
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: config, mountPath: /var/run/config, readOnly: true}
            - {name: credentials, mountPath: /var/run/credentials, readOnly: true}
            - {name: runtime, mountPath: /var/run/runtime}
      containers:
        - name: redis
          image: docker.io/library/redis:8.4.5-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
          args: [/var/run/runtime/redis.conf]
          env:
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: mattercodex-redis-credentials, key: password}}
          ports: [{name: redis-tls, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, --tls, --cacert, /var/run/tls/ca.crt, -h, 127.0.0.1, ping]}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {tcpSocket: {port: redis-tls}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime, mountPath: /var/run/runtime, readOnly: true}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
      volumes:
        - {name: config, configMap: {name: mattercodex-redis-config}}
        - {name: credentials, secret: {secretName: mattercodex-redis-credentials, defaultMode: 0440}}
        - {name: runtime, emptyDir: {sizeLimit: 8Mi}}
        - {name: tls, secret: {secretName: mattercodex-redis-tls, defaultMode: 0440}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: mattercodex-redis, namespace: mattercodex-system}
spec: {selector: {app.kubernetes.io/name: mattercodex-redis}, ports: [{name: redis-tls, port: 6379, targetPort: redis-tls}]}
---
apiVersion: v1
