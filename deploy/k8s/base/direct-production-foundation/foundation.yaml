apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mattercodex-object-store, namespace: mattercodex-system}
spec:
  serviceName: mattercodex-object-store
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: mattercodex-object-store}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mattercodex-object-store, app.kubernetes.io/component: object-store}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: minio
          image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, --certs-dir, /var/run/certs, --address, ":9000", --console-address, ":9001", /data]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: mattercodex-object-store-credentials, key: username}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: mattercodex-object-store-credentials, key: password}}}
          ports: [{name: s3-tls, containerPort: 9000}]
          startupProbe: {httpGet: {scheme: HTTPS, path: /minio/health/live, port: s3-tls}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /minio/health/ready, port: s3-tls}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /minio/health/live, port: s3-tls}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4}
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 3Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - name: tls
              mountPath: /var/run/certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: mattercodex-object-store-tls
            defaultMode: 0440
            items:
              - {key: tls.crt, path: public.crt}
              - {key: tls.key, path: private.key}
              - {key: ca.crt, path: CAs/ca.crt}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 30Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: mattercodex-object-store, namespace: mattercodex-system}
spec: {selector: {app.kubernetes.io/name: mattercodex-object-store}, ports: [{name: s3-tls, port: 9000, targetPort: s3-tls}]}
---
apiVersion: v1
kind: Service
metadata: {name: object-store, namespace: mattercodex-system}
spec: {selector: {app.kubernetes.io/name: mattercodex-object-store}, ports: [{name: s3-tls, port: 9000, targetPort: s3-tls}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mattercodex-object-store-bootstrap, namespace: mattercodex-system}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: mattercodex-object-store-bootstrap}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mattercodex-object-store-bootstrap, app.kubernetes.io/component: object-store-reconciler}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: mc
          image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: [/bin/sh, -ec]
          args:
            - |
              export MC_HOST_prototype="https://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@mattercodex-object-store.mattercodex-system.svc.cluster.local:9000"
              while true; do
                if mc mb --ignore-existing prototype/mattercodex-instruction-artifacts >/dev/null 2>&1 &&
                   mc mb --ignore-existing prototype/mattercodex-interaction-artifacts >/dev/null 2>&1 &&
                   mc mb --ignore-existing prototype/mattercodex-runtime-artifacts >/dev/null 2>&1 &&
                   mc version enable prototype/mattercodex-instruction-artifacts >/dev/null 2>&1 &&
                   mc version enable prototype/mattercodex-interaction-artifacts >/dev/null 2>&1 &&
                   mc version enable prototype/mattercodex-runtime-artifacts >/dev/null 2>&1; then
                  touch /var/run/status/ready
                else
                  rm -f /var/run/status/ready
                fi
                sleep 60
              done
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: mattercodex-object-store-credentials, key: username}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: mattercodex-object-store-credentials, key: password}}}
            - {name: SSL_CERT_FILE, value: /var/run/ca/ca.crt}
          readinessProbe: {exec: {command: [/bin/sh, -ec, test -f /var/run/status/ready]}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: ca, mountPath: /var/run/ca, readOnly: true}
            - {name: status, mountPath: /var/run/status}
            - {name: config, mountPath: /.mc}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          secret:
            secretName: mattercodex-object-store-tls
            items: [{key: ca.crt, path: ca.crt}]
        - {name: status, emptyDir: {sizeLimit: 1Mi}}
        - {name: config, emptyDir: {sizeLimit: 4Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 8Mi}}
