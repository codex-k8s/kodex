apiVersion: v1
kind: ConfigMap
metadata:
  name: mattercodex-postgresql-init
  namespace: mattercodex-system
data:
  10-mattercodex-databases.sh: |
    #!/bin/sh
    set -eu
    psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<EOSQL
    CREATE ROLE control_plane_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    CREATE ROLE internal_rpc_authority_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    CREATE ROLE runtime_controller_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    CREATE ROLE interaction_gateway_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    CREATE ROLE integration_gateway_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    CREATE DATABASE control_plane OWNER control_plane_owner;
    CREATE DATABASE internal_rpc_authority OWNER internal_rpc_authority_owner;
    CREATE DATABASE runtime_controller OWNER runtime_controller_owner;
    CREATE DATABASE interaction_gateway OWNER interaction_gateway_owner;
    CREATE DATABASE integration_gateway OWNER integration_gateway_owner;
    \connect control_plane
    CREATE EXTENSION IF NOT EXISTS vector;
    EOSQL
  pg_hba.conf: |
    local all all peer
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::/0 reject
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::/0 scram-sha-256
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mattercodex-postgresql
  namespace: mattercodex-system
spec:
  serviceName: mattercodex-postgresql
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: mattercodex-postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mattercodex-postgresql, app.kubernetes.io/component: database}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: postgresql
          image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/tls/tls.crt
            - -c
            - ssl_key_file=/var/run/tls/tls.key
            - -c
            - ssl_ca_file=/var/run/tls/ca.crt
            - -c
            - password_encryption=scram-sha-256
            - -c
            - max_connections=300
            - -c
            - hba_file=/var/run/config/pg_hba.conf
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mattercodex-postgresql-bootstrap, key: password}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mattercodex-postgresql-bootstrap, key: password}}
          ports: [{name: postgresql, containerPort: 5432, protocol: TCP}]
          startupProbe:
            exec: {command: [psql, "host=mattercodex-postgresql hostaddr=127.0.0.1 dbname=postgres user=postgres sslmode=verify-full sslrootcert=/var/run/tls/ca.crt", --no-password, --tuples-only, --command, "SELECT 1"]}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: [psql, "host=mattercodex-postgresql hostaddr=127.0.0.1 dbname=postgres user=postgres sslmode=verify-full sslrootcert=/var/run/tls/ca.crt", --no-password, --tuples-only, --command, "SELECT 1"]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec: {command: [psql, "host=mattercodex-postgresql hostaddr=127.0.0.1 dbname=postgres user=postgres sslmode=verify-full sslrootcert=/var/run/tls/ca.crt", --no-password, --tuples-only, --command, "SELECT 1"]}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 8Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tls, mountPath: /var/run/tls, readOnly: true}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: postgresql-config, mountPath: /var/run/config, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: mattercodex-postgresql-tls, defaultMode: 0440}
        - name: init
          configMap: {name: mattercodex-postgresql-init, defaultMode: 0550}
        - name: postgresql-config
          configMap:
            name: mattercodex-postgresql-init
            items: [{key: pg_hba.conf, path: pg_hba.conf}]
        - {name: run, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: mattercodex-postgresql, namespace: mattercodex-system}
spec:
  selector: {app.kubernetes.io/name: mattercodex-postgresql}
