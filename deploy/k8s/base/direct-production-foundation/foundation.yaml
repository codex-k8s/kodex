  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mattercodex-system}}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [control-plane, runtime-controller, interaction-gateway, mattercodex-object-store-bootstrap]
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: object-store-client-egress, namespace: mattercodex-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [control-plane, runtime-controller, interaction-gateway, mattercodex-object-store-bootstrap]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mattercodex-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: mattercodex-object-store}}
      ports: [{protocol: TCP, port: 9000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-mattermost-bridge-exact-path, namespace: mattercodex-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mattercodex-legacy-mattermost-bridge}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: interaction-gateway}}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: matter-kodex-prod}}
          podSelector: {matchLabels: {app.kubernetes.io/name: mattermost}}
      ports: [{protocol: TCP, port: 8065}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-bot-service-bridge-exact-path, namespace: mattercodex-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mattercodex-legacy-bot-service-bridge}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: interaction-gateway}}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: matter-kodex-prod}}
          podSelector: {matchLabels: {app.kubernetes.io/name: matter-codex-bot-service}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
