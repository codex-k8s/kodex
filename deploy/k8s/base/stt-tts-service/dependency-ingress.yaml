apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-stt-projection-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/component: internal-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: stt-tts-service
              app.kubernetes.io/component: internal-service
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-gateway-stt-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: egress-gateway
      app.kubernetes.io/component: platform-egress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: stt-tts-service
              app.kubernetes.io/component: internal-service
      ports: [{protocol: TCP, port: 8080}]
---
