apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: internal-rpc-authority-role-image-builder-database
spec:
  address: https://vault.mattercodex-system.svc:8200
  tlsServerName: vault.mattercodex-system.svc.cluster.local
  skipTLSVerify: false
  caCertSecretRef: internal-rpc-authority-role-image-builder-workload-tls
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: internal-rpc-authority-role-image-builder-database
spec:
  vaultConnectionRef: internal-rpc-authority-role-image-builder-database
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: internal-rpc-authority-role-image-builder
    serviceAccount: role-image-builder
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: internal-rpc-authority-role-image-builder-issuer-postgresql
spec:
  vaultAuthRef: internal-rpc-authority-role-image-builder-database
  mount: database
  path: static-creds/role-image-builder-issuer-g1
  allowStaticCreds: true
  refreshAfter: 1m
  revoke: false
  rolloutRestartTargets:
    - {kind: Deployment, name: role-image-builder}
  destination:
    create: true
    name: internal-rpc-authority-role-image-builder-issuer-postgresql
    overwrite: false
    transformation:
      excludeRaw: true
      templates:
        username: {text: '{{ get .Secrets "username" }}'}
        dsn:
          text: >-
            postgresql://{{ get .Secrets "username" }}:{{ get .Secrets "password" }}@internal-rpc-authority-postgresql-rw.mattercodex-system.svc.cluster.local:5432/internal_rpc_authority?sslmode=verify-full&sslrootcert=/var/run/config/mattercodex/internal-rpc-authority/postgresql/ca.pem
---
