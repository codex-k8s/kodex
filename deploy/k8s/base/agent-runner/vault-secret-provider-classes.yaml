apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: internal-rpc-authority-agent-runner-manifest-trust}
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-agent-runner
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "bundle.jws"
        secretPath: kv/data/mattercodex/internal-rpc-authority/agent-runner/issuer/manifest-trust
        secretKey: manifest-trust.jws
        filePermission: 288
---
apiVersion: secrets-store.csi.x-k8s.io/v1
