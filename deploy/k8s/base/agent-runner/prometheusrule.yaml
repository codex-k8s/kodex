apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-runner
  labels: {app.kubernetes.io/name: agent-runner}
spec:
  groups:
    - name: agent-runner
      rules:
        - alert: AgentRunnerTurnIncidents
          expr: increase(mattercodex_agent_runner_turns_total{outcome="incident"}[10m]) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: Agent-runner completed a turn without an accepted handoff
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/agent-runner.md
        - alert: AgentRunnerCapacityRetries
          expr: increase(mattercodex_agent_runner_retries_total{class="capacity"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Agent-runner is retrying provider capacity failures frequently
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/agent-runner.md
