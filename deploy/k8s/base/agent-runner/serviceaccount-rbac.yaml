apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-runner-observer}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [agent-runner-handoff-trust]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: agent-runner-observer}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-runner-observer}
