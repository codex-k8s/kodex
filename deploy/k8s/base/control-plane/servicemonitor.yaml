apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  namespaceSelector:
    matchNames:
      - mattercodex-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
