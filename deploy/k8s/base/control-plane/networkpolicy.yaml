apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-deny-all
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-exact-runtime-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/component: internal-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: automation-scheduler
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: session-archive
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: role-image-builder
        - podSelector:
            matchExpressions:
              - key: kodex.dev/image-admission-phase
                operator: In
                values: [claim, admit, promote]
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: runtime-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: integration-gateway
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __KODEX_OIDC_NAMESPACE__
          podSelector:
            matchLabels:
              app.kubernetes.io/name: __KODEX_OIDC_POD_NAME__
              app.kubernetes.io/component: __KODEX_OIDC_POD_COMPONENT__
      ports:
        - protocol: TCP
          port: __KODEX_OIDC_TARGET_PORT__
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentry-relay
      ports:
        - protocol: TCP
          port: 8443
---
