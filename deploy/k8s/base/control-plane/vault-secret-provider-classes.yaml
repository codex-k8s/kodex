apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-plane-postgres-runtime
spec:
  provider: vault
  parameters:
    roleName: control-plane
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "dsn"
        secretPath: "database/static-creds/control-plane-runtime-g1"
        secretKey: "dsn"
        filePermission: 288
---
