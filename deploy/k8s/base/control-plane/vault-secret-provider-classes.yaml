apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-plane-postgres-runtime
spec:
  provider: vault
  parameters:
    roleName: control-plane
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "dsn"
        secretPath: "kv/data/mattercodex/control-plane/postgres-runtime"
        secretKey: "dsn"
        filePermission: 288
---
