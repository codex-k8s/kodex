# Scanner принадлежит Control Plane; TCP listener и журнал содержимого отключены.
Foreground yes
DatabaseDirectory /var/lib/clamav
SelfCheck 60
LocalSocket /run/kodex-skill-scanner/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TemporaryDirectory /tmp
LogFileMaxSize 0
LogClean no
LogVerbose no
LogTime yes
MaxThreads 2
MaxQueue 8
StreamMaxLength 512M
MaxScanSize 768M
MaxFileSize 512M
MaxRecursion 16
MaxFiles 128
AlertExceedsMax yes
AlertEncrypted yes
ScanPDF yes
ScanArchive yes
MaxScanTime 45000
ReadTimeout 20
CommandReadTimeout 10
SendBufTimeout 1000
ExitOnOOM yes
