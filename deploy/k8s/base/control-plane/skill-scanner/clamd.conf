# Scanner принадлежит Control Plane; TCP listener и журнал содержимого отключены.
Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/kodex-skill-scanner/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TemporaryDirectory /tmp
LogFileMaxSize 0
LogClean no
LogVerbose no
LogTime yes
MaxThreads 2
MaxQueue 8
StreamMaxLength 32M
MaxScanSize 64M
MaxFileSize 32M
MaxRecursion 16
MaxFiles 128
ReadTimeout 20
CommandReadTimeout 10
SendBufTimeout 1000
ExitOnOOM yes
