apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-integration-credential-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kodex-integration-credentials"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-integration-credential-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-integration-credential-writer
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: kodex-system
