apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodex-system
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - migration-job.yaml
  - broker-bootstrap-job.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - dashboard.yaml
components:
  - ../../components/internal-rpc-authority-control-plane-verifier
configMapGenerator:
  - name: control-plane-runtime
    literals:
      - CONTROL_PLANE_NATS_STREAM=CONTROL_PLANE
      - CONTROL_PLANE_NATS_MAX_BYTES=34359738368
generatorOptions:
  disableNameSuffixHash: true
patches: null
