apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodex-system
resources:
  - serviceaccount.yaml
  - credential-rbac.yaml
  - email-projection.yaml
  - email-configuration.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - migration-job.yaml
  - broker-bootstrap-job.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - dashboard.yaml
components:
  - ../../components/internal-rpc-authority-control-plane-verifier
  - ../../components/internal-rpc-authority-control-plane-issuer
configMapGenerator:
  - name: control-plane-runtime
    literals:
      - CONTROL_PLANE_NATS_STREAM=CONTROL_PLANE
      # Бюджет 32 GiB минус 512 MiB состояния BFF и 16 MiB отзыва сессий.
      - CONTROL_PLANE_NATS_MAX_BYTES=33806090240
generatorOptions:
  disableNameSuffixHash: true
patches: null
