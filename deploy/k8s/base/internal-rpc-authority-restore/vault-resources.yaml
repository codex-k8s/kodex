apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: internal-rpc-authority-restore-controller
  annotations: {argocd.argoproj.io/sync-wave: "-8"}
spec:
  address: https://vault.kodex-system.svc:8200
  tlsServerName: vault.kodex-system.svc.cluster.local
  skipTLSVerify: false
  caCertSecretRef: internal-rpc-authority-restore-controller-vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: internal-rpc-authority-restore-controller
  annotations: {argocd.argoproj.io/sync-wave: "-7"}
spec:
  vaultConnectionRef: internal-rpc-authority-restore-controller
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: internal-rpc-authority-restore-controller-vso
    serviceAccount: internal-rpc-authority-restore-controller
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: internal-rpc-authority-restore-controller-postgresql
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  vaultAuthRef: internal-rpc-authority-restore-controller
  mount: kv
  type: kv-v2
  path: internal-rpc-authority/restore-controller/postgres
  refreshAfter: 5m
  rolloutRestartTargets:
    - {kind: Deployment, name: internal-rpc-authority-restore-controller}
  destination:
    create: true
    name: internal-rpc-authority-restore-controller-postgresql
    overwrite: false
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        dsn: {text: '{{ get .Secrets "dsn" }}'}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: internal-rpc-authority-restore-role-trust
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  vaultAuthRef: internal-rpc-authority-restore-controller
  mount: kv
  type: kv-v2
  path: internal-rpc-authority/restore/trust
  refreshAfter: 1m
  destination:
    create: true
    name: internal-rpc-authority-restore-role-trust
    overwrite: false
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        restore-role-trust.jws: {text: '{{ get .Secrets "restore-role-trust.jws" }}'}
