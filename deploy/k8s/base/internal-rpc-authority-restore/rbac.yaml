apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-restore-coordination
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [internal-rpc-authority-restore-coordination]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-restore-controller
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-controller
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-recovery
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-pitr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-restore-coordination
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: internal-rpc-authority-restore-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-restore-evidence
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [internal-rpc-authority-restore-evidence]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-restore-evidence-readers
subjects:
  - {kind: ServiceAccount, name: internal-rpc-authority-restore-controller}
  - {kind: ServiceAccount, name: internal-rpc-authority-restore-recovery}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-restore-evidence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-restore-pitr
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [internal-rpc-authority-restore-evidence]
    verbs: [get, update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-restore-pitr
subjects:
  - {kind: ServiceAccount, name: internal-rpc-authority-restore-pitr}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-restore-pitr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: internal-rpc-authority-restore-tokenreview
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-controller
    namespace: mattercodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: internal-rpc-authority-restore-tokenreview
