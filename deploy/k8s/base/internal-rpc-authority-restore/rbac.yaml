apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-restore-coordination
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [internal-rpc-authority-restore-coordination]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-restore-controller
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-controller
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-restore-coordination
