apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-restore-coordination
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [internal-rpc-authority-restore-coordination]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-restore-controller
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-controller
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-restore-coordination
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: internal-rpc-authority-restore-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: internal-rpc-authority-restore-tokenreview
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-restore-controller
    namespace: mattercodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: internal-rpc-authority-restore-tokenreview
