apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-restore-role-trust
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-restore-controller
    audience: vault
    objects: |
      - objectName: "manifest-trust.jws"
        secretPath: "secret/data/internal-rpc-authority/restore/trust"
        secretKey: "manifest-trust.jws"
        filePermission: 292
      - objectName: "restore-role-trust.jws"
        secretPath: "secret/data/internal-rpc-authority/restore/trust"
        secretKey: "restore-role-trust.jws"
        filePermission: 292
      - objectName: "evidence-public.jwk"
        secretPath: "secret/data/internal-rpc-authority/restore/pitr-evidence"
        secretKey: "public.jwk"
        filePermission: 292
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-restore-pitr-evidence-signer
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-restore-pitr
    audience: vault
    objects: |
      - objectName: "evidence-private.jwk"
        secretPath: "secret/data/internal-rpc-authority/restore/pitr-evidence"
        secretKey: "private.jwk"
        filePermission: 292
