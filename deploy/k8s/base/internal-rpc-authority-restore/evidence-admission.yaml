apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: internal-rpc-authority-restore-anchor-forward-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: exact-resource
      expression: >-
        oldObject.metadata.namespace == 'kodex-system' &&
        oldObject.metadata.name == 'internal-rpc-authority-restore-evidence'
    # Namespace garbage collection должна иметь возможность удалить anchor
    # только после начала удаления всего изолированного platform namespace.
    - name: namespace-not-terminating
      expression: >-
        namespaceObject != null &&
        !has(namespaceObject.metadata.deletionTimestamp)
  validations:
    - expression: request.operation == 'UPDATE'
      message: restore evidence deletion is forbidden
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:internal-rpc-authority-restore-pitr'
      message: only the independent PITR executor may update restore evidence
    - expression: >-
        int(object.metadata.annotations['kodex.dev/restore-anchor-revision']) ==
        int(oldObject.metadata.annotations['kodex.dev/restore-anchor-revision']) + 1
      message: restore evidence anchor revision must advance exactly once
    - expression: >-
        int(object.metadata.annotations['kodex.dev/restore-epoch']) >=
        int(oldObject.metadata.annotations['kodex.dev/restore-epoch'])
      message: restore epoch rollback is forbidden
    - expression: >-
        object.metadata.annotations['kodex.dev/restore-predecessor-revision'] ==
        oldObject.metadata.annotations['kodex.dev/restore-anchor-revision'] &&
        object.metadata.annotations['kodex.dev/restore-predecessor-digest-sha256'] ==
        oldObject.metadata.annotations['kodex.dev/restore-evidence-digest-sha256']
      message: restore evidence predecessor must equal served state
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: internal-rpc-authority-restore-anchor-forward-only
spec:
  policyName: internal-rpc-authority-restore-anchor-forward-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: internal-rpc-authority-restore-pitr-cluster-owner
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [clusters]
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:internal-rpc-authority-restore-pitr'
      message: only the independent PITR executor may create restore clusters
    - expression: >-
        object.metadata.namespace == 'kodex-system' &&
        object.metadata.name.startsWith('internal-rpc-authority-restore-') &&
        'kodex.dev/restore-id' in object.metadata.annotations &&
        'kodex.dev/restore-epoch' in object.metadata.annotations &&
        'kodex.dev/restore-intent-digest-sha256' in object.metadata.annotations &&
        'kodex.dev/backup-manifest-digest-sha256' in object.metadata.annotations &&
        'kodex.dev/cnpg-backup-uid' in object.metadata.annotations &&
        'kodex.dev/cnpg-backup-resource-version' in object.metadata.annotations &&
        'kodex.dev/cnpg-backup-id' in object.metadata.annotations &&
        'kodex.dev/cnpg-source-cluster-uid' in object.metadata.annotations &&
        'kodex.dev/cnpg-source-cluster-resource-version' in object.metadata.annotations
      message: PITR cluster must carry the exact restore intent projection
    - expression: >-
        object.spec.instances == 3 &&
        object.spec.bootstrap.recovery.source == 'origin' &&
        object.spec.bootstrap.recovery.recoveryTarget.backupID ==
          object.metadata.annotations['kodex.dev/cnpg-backup-id'] &&
        object.spec.bootstrap.recovery.recoveryTarget.targetTLI != 'latest' &&
        object.spec.imageName.contains('@sha256:')
      message: PITR cluster recovery and image boundary rejected
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: internal-rpc-authority-restore-pitr-cluster-owner
spec:
  policyName: internal-rpc-authority-restore-pitr-cluster-owner
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-system
