apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: automation-scheduler-platform-worker-grant-signer
spec:
  provider: vault
  parameters:
    roleName: automation-scheduler
    audience: vault
    objects: |
      - objectName: "private.jwk"
        secretPath: "kv/data/mattercodex/platform-worker-grants/automation-scheduler"
        secretKey: "private.jwk"
        filePermission: 288
---
