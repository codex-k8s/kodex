apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: automation-scheduler-application-grant
spec:
  provider: vault
  parameters:
    roleName: automation-scheduler
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "application-grant.jws"
        secretPath: "kv/data/mattercodex/automation-scheduler/readiness-grant"
        secretKey: "compact-jws"
        filePermission: 288
      - objectName: "operation-grant.jws"
        secretPath: "kv/data/mattercodex/automation-scheduler/application-grant"
        secretKey: "compact-jws"
        filePermission: 288
---
