apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-scheduler-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: automation-scheduler
data:
  automation-scheduler.json: |
    {"uid":"kodex-automation-scheduler","title":"Kodex automation-scheduler","schemaVersion":39,"panels":[{"type":"timeseries","title":"Циклы планировщика","targets":[{"expr":"sum by (outcome) (rate(kodex_automation_scheduler_cycles_total[5m]))"}]},{"type":"timeseries","title":"Исходы обработки","targets":[{"expr":"sum by (outcome) (rate(kodex_automation_scheduler_occurrences_total[5m]))"}]},{"type":"stat","title":"Удерживаемые leases","targets":[{"expr":"sum(kodex_automation_scheduler_tracked_claims)"}]}]}
