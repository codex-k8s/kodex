apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-scheduler-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: automation-scheduler
data:
  automation-scheduler.json: |
    {"uid":"mattercodex-automation-scheduler","title":"MatterCodex automation-scheduler","schemaVersion":39,"panels":[{"type":"timeseries","title":"Reconciliation cycles","targets":[{"expr":"sum by (outcome) (rate(mattercodex_automation_scheduler_cycles_total[5m]))"}]},{"type":"timeseries","title":"Occurrence operations","targets":[{"expr":"sum by (operation, outcome) (rate(mattercodex_automation_scheduler_occurrences_total[5m]))"}]},{"type":"stat","title":"Transient claims","targets":[{"expr":"sum(mattercodex_automation_scheduler_tracked_claims)"}]}]}
