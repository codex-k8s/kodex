apiVersion: v1
kind: Service
metadata:
  name: automation-scheduler
  labels:
    app.kubernetes.io/name: automation-scheduler
    app.kubernetes.io/component: scheduler-job
spec:
  selector:
    app.kubernetes.io/name: automation-scheduler
    app.kubernetes.io/component: scheduler-job
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: auth-metrics
      port: 9091
      targetPort: auth-metrics
      protocol: TCP
