apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automation-scheduler-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: automation-scheduler
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automation-scheduler-exact-runtime-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: automation-scheduler
      app.kubernetes.io/component: scheduler-job
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9091}
  egress: []
