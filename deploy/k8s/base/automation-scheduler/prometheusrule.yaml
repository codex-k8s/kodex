apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: automation-scheduler
  labels:
    app.kubernetes.io/name: automation-scheduler
spec:
  groups:
    - name: automation-scheduler
      rules:
        - alert: AutomationSchedulerCycleFailures
          expr: increase(kodex_automation_scheduler_cycles_total{outcome="error"}[10m]) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Ошибки рабочего цикла планировщика
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/automation-scheduler.md
        - alert: AutomationSchedulerOccurrenceFailures
          expr: sum by (namespace, pod) (increase(kodex_automation_scheduler_occurrences_total{outcome=~"invalid|renew_error|materialize_error"}[10m])) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Повторные ошибки обработки запусков по расписанию
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/automation-scheduler.md
        - alert: AutomationSchedulerProtectedPathUnavailable
          expr: kodex_automation_scheduler_readiness{ready="false"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Локальный контур полномочий планировщика не готов
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/automation-scheduler.md
