apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: automation-scheduler
  labels:
    app.kubernetes.io/name: automation-scheduler
spec:
  groups:
    - name: automation-scheduler
      rules:
        - alert: AutomationSchedulerCycleFailures
          expr: increase(mattercodex_automation_scheduler_cycles_total{outcome="error"}[10m]) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Automation scheduler reconciliation is failing
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/automation-scheduler.md
        - alert: AutomationSchedulerClaimBacklog
          expr: mattercodex_automation_scheduler_tracked_claims > 200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Automation scheduler transient claim tracking is near its bound
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/automation-scheduler.md
        - alert: AutomationSchedulerProtectedPathUnavailable
          expr: mattercodex_automation_scheduler_readiness{ready="false"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Automation scheduler protected control-plane path is unavailable
            runbook_url: https://github.com/codex-k8s/matter-codex/blob/main/docs/runbooks/automation-scheduler.md
