apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-rpc-authority-database-credential-reconciler
  labels:
    app.kubernetes.io/name: internal-rpc-authority
    app.kubernetes.io/component: database-credential-reconciler
data:
  INTERNAL_RPC_AUTHORITY_RECONCILER_LISTEN: ":8443"
  INTERNAL_RPC_AUTHORITY_TECHNICAL_LISTEN: ":9090"
  INTERNAL_RPC_AUTHORITY_RECONCILER_CALLER_SPIFFE_ID: "spiffe://mattercodex.local/ns/mattercodex-system/sa/internal-rpc-authority-publisher"
  INTERNAL_RPC_AUTHORITY_POSTGRES_TLS_SERVER_NAME: "internal-rpc-authority-postgresql.mattercodex-system.svc.cluster.local"
  INTERNAL_RPC_AUTHORITY_POSTGRES_EXPECTED_SESSION_USER: "ira_database_credential_reconciler"
  INTERNAL_RPC_AUTHORITY_VAULT_ADDRESS: "https://vault.mattercodex-system.svc:8200"
  INTERNAL_RPC_AUTHORITY_VAULT_TLS_SERVER_NAME: "vault.mattercodex-system.svc.cluster.local"
  INTERNAL_RPC_AUTHORITY_VAULT_AUTH_ROLE: "internal-rpc-authority-database-credential-reconciler"
  INTERNAL_RPC_AUTHORITY_KUBERNETES_API_ADDRESS: "https://kubernetes.default.svc:443"
  INTERNAL_RPC_AUTHORITY_KUBERNETES_API_TLS_SERVER_NAME: "kubernetes.default.svc"
  INTERNAL_RPC_AUTHORITY_KUBERNETES_API_CA_FILE: "/var/run/config/kubernetes.io/serviceaccount/ca.crt"
  INTERNAL_RPC_AUTHORITY_KUBERNETES_API_TOKEN_FILE: "/var/run/secrets/tokens/kubernetes-api/token"
  INTERNAL_RPC_AUTHORITY_REGISTERED_SET_SOURCE_REVISION: "2"
  INTERNAL_RPC_AUTHORITY_REGISTERED_SET_SOURCE_DIGEST_SHA256: "13f937ec6e39cd799ffac742b3153f7adaa6229da8d6850def44512d947e324d"
