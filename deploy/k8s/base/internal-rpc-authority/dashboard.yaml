apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-rpc-authority-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: internal-rpc-authority
data:
  internal-rpc-authority.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "{__name__=~\"mattercodex_internal_rpc_authority_(issuer|verifier|publisher|readback_attestor|restore_controller|database_credential_reconciler)_readiness\",ready=\"true\"}",
              "legendFormat": "{{pod}} {{__name__}}",
              "refId": "A"
            }
          ],
          "title": "Served-state readiness",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 2,
          "targets": [
            {
              "expr": "sum by (operation, code) (rate({__name__=~\"mattercodex_internal_rpc_authority_.*_grpc_requests_total\"}[5m]))",
              "legendFormat": "{{operation}} {{code}}",
              "refId": "A"
            }
          ],
          "title": "Bounded gRPC outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 3,
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, operation) (rate({__name__=~\"mattercodex_internal_rpc_authority_.*_grpc_request_duration_seconds_bucket\"}[5m])))",
              "legendFormat": "{{operation}}",
              "refId": "A"
            }
          ],
          "title": "gRPC p99 latency",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["mattercodex", "internal-rpc-authority"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "MatterCodex internal RPC authority",
      "uid": "mattercodex-internal-rpc-authority",
      "version": 1
    }
