apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-database-credential-reconciler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority
      app.kubernetes.io/component: database-credential-reconciler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority
              app.kubernetes.io/component: publisher
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-postgresql
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentry-relay
      ports:
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-postgresql-from-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority
              app.kubernetes.io/component: database-credential-reconciler
        - podSelector:
            matchLabels:
              mattercodex.dev/internal-rpc-authority-issuer: enabled
        - podSelector:
            matchLabels:
              mattercodex.dev/internal-rpc-authority-verifier: enabled
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-publisher
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-readback-attestor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-restore-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-restore-recovery
        - podSelector:
            matchExpressions:
              - key: mattercodex.dev/image-admission-phase
                operator: In
                values: [claim, admit, promote]
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-from-internal-rpc-authority-reconciler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority
              app.kubernetes.io/component: database-credential-reconciler
        - podSelector:
            matchLabels:
              mattercodex.dev/internal-rpc-authority-issuer: enabled
        - podSelector:
            matchLabels:
              mattercodex.dev/internal-rpc-authority-verifier: enabled
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-publisher
      ports:
        - port: 8200
          protocol: TCP
