apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-database-credential-rollout
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - internal-rpc-authority-publisher-database-g1
      - internal-rpc-authority-publisher-database-g2
      - internal-rpc-authority-publisher-database-g3
      - internal-rpc-authority-publisher-database-g4
      - internal-rpc-authority-publisher-database-g5
      - internal-rpc-authority-readback-database-g1
      - internal-rpc-authority-readback-database-g2
      - internal-rpc-authority-readback-database-g3
      - internal-rpc-authority-readback-database-g4
      - internal-rpc-authority-readback-database-g5
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - internal-rpc-authority-prototype-static-role-state
    verbs:
      - get
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - internal-rpc-authority-publisher
      - internal-rpc-authority-readback-attestor
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-database-credential-rollout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-database-credential-rollout
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-database-credential-reconciler
