apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-database-credential-rollout
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - internal-rpc-authority-publisher
      - internal-rpc-authority-readback-attestor
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-database-credential-rollout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-database-credential-rollout
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-database-credential-reconciler
