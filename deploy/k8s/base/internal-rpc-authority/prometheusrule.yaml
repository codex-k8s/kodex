apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: internal-rpc-authority
  labels:
    app.kubernetes.io/name: internal-rpc-authority
spec:
  groups:
    - name: internal-rpc-authority
      rules:
        - alert: InternalRPCAuthorityReconcilerUnavailable
          expr: absent(mattercodex_internal_rpc_authority_database_credential_reconciler_readiness{ready="true"}) or max(mattercodex_internal_rpc_authority_database_credential_reconciler_readiness{ready="true"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Internal RPC authority credential reconciler is unavailable"
            runbook_url: "https://docs.mattercodex.dev/runbooks/internal-rpc-authority"
        - alert: InternalRPCAuthorityUnexpectedGRPCFailures
          expr: sum(rate({__name__=~"mattercodex_internal_rpc_authority_.*_grpc_requests_total",code=~"Internal|Unavailable|Unknown|DataLoss"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Internal RPC authority reports unexpected gRPC failures"
            runbook_url: "https://docs.mattercodex.dev/runbooks/internal-rpc-authority"
        - alert: InternalRPCAuthorityServedStateUnavailable
          expr: |
            absent(mattercodex_internal_rpc_authority_issuer_readiness{ready="true"})
            or absent(mattercodex_internal_rpc_authority_verifier_readiness{ready="true"})
            or absent(mattercodex_internal_rpc_authority_publisher_readiness{ready="true"})
            or absent(mattercodex_internal_rpc_authority_readback_attestor_readiness{ready="true"})
            or absent(mattercodex_internal_rpc_authority_restore_controller_readiness{ready="true"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Internal RPC authority served-state path is unavailable"
            runbook_url: "https://docs.mattercodex.dev/runbooks/internal-rpc-authority"
        - alert: InternalRPCAuthorityGRPCLatencyHigh
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate({__name__=~"mattercodex_internal_rpc_authority_.*_grpc_request_duration_seconds_bucket"}[5m])
              )
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Internal RPC authority gRPC p99 latency is high"
            runbook_url: "https://docs.mattercodex.dev/runbooks/internal-rpc-authority"
