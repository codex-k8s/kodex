apiVersion: mattercodex.dev/v1alpha1
kind: InternalRPCAuthorityCapabilityRegistry
metadata:
  name: internal-rpc-authority
  owner: internal-rpc-authority
  issue: "186"
spec:
  artifact:
    repository: ghcr.io/codex-k8s/matter-codex/internal-rpc-authority
    imageReferencePolicy: DIGEST_ONLY
    binaries:
      socketInit: /usr/local/bin/internal-rpc-authority-socket-init
      issuer: /usr/local/bin/internal-rpc-authority-issuer
      verifier: /usr/local/bin/internal-rpc-authority-verifier
      publisher: /usr/local/bin/internal-rpc-authority-publisher
      readbackAttestor: /usr/local/bin/internal-rpc-authority-readback-attestor
      restoreController: /usr/local/bin/internal-rpc-authority-restore-controller
      restoreOperator: /usr/local/bin/internal-rpc-authority-restore-operator
      recovery: /usr/local/bin/internal-rpc-authority-recovery
      cli: /usr/local/bin/internal-rpc-authority-cli
  unixDomainSockets:
    volume:
      name: internal-rpc-authority-sockets
      type: emptyDir
      medium: Filesystem
      sizeLimit: 8Mi
      mountPath: /run/mattercodex/internal-rpc-authority
    identity:
      applicationUid: 10001
      applicationPrimaryGid: 10001
      socketInitUid: 29000
      issuerUid: 29001
      verifierUid: 29002
      sharedFsGid: 29000
      fsGroupChangePolicy: OnRootMismatch
    rootDirectory:
      path: /run/mattercodex/internal-rpc-authority
      mode: "1770"
      ownerUid: 29000
      ownerGid: 29000
      sticky: true
    issuer:
      path: /run/mattercodex/internal-rpc-authority/issuer.sock
      mode: "0660"
      ownerUid: 29001
      ownerGid: 29000
      listener: internal-rpc-authority-issuer
      client: application
    verifier:
      path: /run/mattercodex/internal-rpc-authority/verifier.sock
      mode: "0660"
      ownerUid: 29002
      ownerGid: 29000
      listener: internal-rpc-authority-verifier
      client: application
    peerBinding:
      mechanism: LINUX_SO_PEERCRED
      expectedApplicationUid: 10001
      expectedApplicationPrimaryGid: 10001
      requirePrivatePodVolume: true
      rejectSymlink: true
      rejectNonSocket: true
  deployables:
    socket-init:
      kind: initContainer
      owner: consuming-workload
      serviceAccount: consuming-workload
      requiredBefore:
        - issuer
        - verifier
    issuer:
      kind: sidecar
      owner: consuming-workload
      serviceAccount: consuming-workload
      privateKeyDelivery: vault-csi
      privateKeySecretName: internal-rpc-authority-issuer-key
      privateKeyMountPath: /var/run/secrets/mattercodex/internal-rpc-authority/issuer
      authoritySnapshotSecretName: internal-rpc-authority-snapshot
      authoritySnapshotMountPath: /var/run/config/mattercodex/internal-rpc-authority/snapshot
      manifestTrustDelivery: vault-csi
      manifestTrustSecretName: internal-rpc-authority-manifest-trust
      manifestTrustBundleId: internal-rpc-authority-manifest-signers
      manifestTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/manifest-trust
      authorityProofTrustDelivery: vault-csi
      authorityProofTrustSecretName: internal-rpc-authority-proof-trust
      authorityProofTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/authority-proof-trust
      restoreEvidenceSecretName: internal-rpc-authority-restore-evidence
      restoreEvidenceMountPath: /var/run/config/mattercodex/internal-rpc-authority/restore-evidence
      restoreEvidenceTrustSecretName: internal-rpc-authority-restore-evidence-trust
      restoreEvidenceTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/restore-evidence-trust
      databaseLoginPrincipal: FROM_EXACT_WORKLOAD_ROLE_REGISTRY
      databaseGroupRole: internal_rpc_authority_issuer
      cryptographicReadbackTable: authority_key_delivery_readbacks
      snapshotVerification:
        requireIndependentManifestTrust: true
        requireCertificateValidity: true
        requireExactSignerGeneration: true
        requireCanonicalPayload: true
        requirePredecessorChain: true
        requirePersistentHighWatermark: true
        requireCryptographicReadback: true
      readinessOwner: application
      failurePolicy: FAIL_CLOSED
    authority-proof-resolver:
      kind: applicationCapability
      owner: control-plane
      implementationIssue: "187"
      contractOwner: internal-rpc-authority
      serviceAccount: control-plane
      fullMethod: /internalrpcauthority.v1.AuthorityProofResolverService/ResolveAuthorityProof
      firstCallInternalAuthorizationContext: FORBIDDEN
      callerTransport:
        protocol: MTLS
        exactCallerWorkload: control-api-gateway
        exactCallerSpiffeId: spiffe://mattercodex.local/ns/mattercodex-system/sa/control-api-gateway
        exactTlsServerName: control-plane.mattercodex-system.svc.cluster.local
        exactTrustBundleId: mattercodex-internal-ca-g1
      applicationCredential:
        type: OIDC_BEARER
        metadataKey: authorization
        exactIssuer: https://sso.mattercodex.local/realms/mattercodex
        exactAudience: mattercodex-control-api
        exactTrustBundleId: mattercodex-oidc-signers-g1
        actorSource: VERIFIED_OIDC_SUBJECT
        requestIdentityFieldsAllowed: false
      resolution:
        owner: control-plane
        sequence:
          - validate-application-credential
          - resolve-subject-to-actor
          - resolve-resource-inside-actor-tenant-boundary
          - verify-project-ownership
          - bind-operation-audience-workload-and-provenance
          - persist-idempotency-receipt
          - sign-authority-proof
        crossTenantPolicy: DENY_BEFORE_SIGN
        hiddenResourcePolicy: NOT_FOUND
      timeout:
        deadlineMilliseconds: 2000
        maxAttempts: 2
        retryableGrpcCodes:
          - UNAVAILABLE
          - DEADLINE_EXCEEDED
        reuseSameIdempotencyKey: true
      proofSignerPrivateKeyDelivery: vault-csi
      proofSignerSecretName: internal-rpc-authority-proof-signer-key
      proofTrustSecretName: internal-rpc-authority-proof-trust
      authoritySnapshotSecretName: internal-rpc-authority-snapshot
      authoritySnapshotMountPath: /var/run/config/mattercodex/internal-rpc-authority/snapshot
      manifestTrustSecretName: internal-rpc-authority-manifest-trust
      manifestTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/manifest-trust
      cryptographicReadbackTable: authority_key_delivery_readbacks
      readiness:
        requireDomainReadPath: true
        requireExactPolicyRevisionAndDigest: true
        requirePrivateKeyMatchesServedPublicJwk: true
        requireSignerGenerationReadback: true
      failurePolicy: FAIL_CLOSED
    verifier:
      kind: sidecar
      owner: consuming-workload
      serviceAccount: consuming-workload
      authoritySnapshotSecretName: internal-rpc-authority-snapshot
      authoritySnapshotMountPath: /var/run/config/mattercodex/internal-rpc-authority/snapshot
      manifestTrustSecretName: internal-rpc-authority-manifest-trust
      manifestTrustBundleId: internal-rpc-authority-manifest-signers
      manifestTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/manifest-trust
      restoreEvidenceSecretName: internal-rpc-authority-restore-evidence
      restoreEvidenceMountPath: /var/run/config/mattercodex/internal-rpc-authority/restore-evidence
      restoreEvidenceTrustSecretName: internal-rpc-authority-restore-evidence-trust
      restoreEvidenceTrustMountPath: /var/run/config/mattercodex/internal-rpc-authority/restore-evidence-trust
      databaseLoginPrincipal: FROM_EXACT_WORKLOAD_ROLE_REGISTRY
      databaseGroupRole: internal_rpc_authority_verifier
      cryptographicReadbackTable: authority_key_delivery_readbacks
      readinessOwner: application
      failurePolicy: FAIL_CLOSED
    publisher:
      kind: Deployment
      canonicalPath: deploy/k8s/base/internal-rpc-authority-publisher
      owner: internal-rpc-authority
      serviceAccount: internal-rpc-authority-publisher
      replicas: 2
      leaderElection: POSTGRESQL_LEASE
      restoreRoleCredentialInterface:
        protoService: internalrpcauthority.v1.RestoreRoleCredentialPublisherService
        publishMethod: /internalrpcauthority.v1.RestoreRoleCredentialPublisherService/PublishRoleCredential
        readinessMethod: /internalrpcauthority.v1.RestoreRoleCredentialPublisherService/CheckReadiness
        listenAddress: internal-rpc-authority-publisher.mattercodex-system.svc:8444
        tlsServerName: internal-rpc-authority-publisher.mattercodex-system.svc
        clientTrustBundleId: internal-rpc-authority-publisher-ca
        exactCallerSpiffeId: spiffe://mattercodex.local/ns/mattercodex-system/sa/internal-rpc-authority-restore-controller
        requestAuthority: CONTROLLER_SIGNED_ISSUANCE_DIRECTIVE_ONLY
        issuanceDirective:
          protectedType: mattercodex-internal-rpc-restore-role-issuance+jws
          schema: contracts/authorization/v1/restore-coordination.schema.json#/$defs/credentialIssuanceDirective
          verifyControllerSignatureGenerationAndCurrentCoordinationRevision: true
          resolveExactTupleFromTargetRegistry: true
          callerProvidedVaultPathAllowed: false
        delivery:
          generateDistinctEs256AckKeyPerExactRole: true
          privateAckKeyDestination: EXACT_VAULT_PATH_FROM_TARGET_REGISTRY
          publicAckJwkDestination: SIGNED_ROLE_CREDENTIAL
          roleCredentialProtectedType: mattercodex-internal-rpc-restore-role-credential+jws
          requireVaultMetadataAndPrivateToPublicReadback: true
          privateKeyInResponseOrLog: FORBIDDEN
        deliveryReceipt:
          protectedType: mattercodex-internal-rpc-restore-role-delivery-receipt+jws
          schema: contracts/authorization/v1/restore-coordination.schema.json#/$defs/credentialDeliveryReceipt
          bindsIssuanceDirectiveAndVaultMetadataReadback: true
        idempotency:
          store: internal-rpc-authority-data
          sameKeyAndDirectiveDigest: RETURN_SAVED_DELIVERY_RECEIPT
          sameKeyDifferentDigest: IDEMPOTENCY_CONFLICT
          retention: UNTIL_RESTORE_COMPLETED_SAFE_WINDOW
      manifestSignerDelivery: vault-csi
      manifestSignerSecretName: internal-rpc-authority-manifest-signer-key
      restoreRoleCredentialSignerDelivery: vault-csi
      restoreRoleCredentialSignerSecretName: internal-rpc-authority-restore-role-credential-signer
      exactWritableSecretNames:
        - internal-rpc-authority-snapshot
        - internal-rpc-authority-restore-role-trust
      kubernetesRbac:
        apiGroups:
          - ""
        resources:
          - secrets
        resourceNames:
          - internal-rpc-authority-snapshot
          - internal-rpc-authority-restore-role-trust
        verbs:
          - get
          - update
          - patch
      forbiddenKubernetesVerbs:
        - create
        - delete
        - deletecollection
      rotationOwnership:
        authKeyGenerationOwner: internal-rpc-authority-publisher
        authPrivateKeyWriteOwner: internal-rpc-authority-publisher
        authorityProofPrivateKeyWriteOwner: internal-rpc-authority-publisher
        manifestTrustOverlapWriteOwner: internal-rpc-authority-publisher
        authorityProofTrustOverlapWriteOwner: internal-rpc-authority-publisher
        restoreRoleCredentialSignerOwner: internal-rpc-authority-publisher
        restoreRoleCredentialTrustSnapshot:
          schema: contracts/authorization/v1/restore-role-trust.schema.json
          protectedType: mattercodex-internal-rpc-restore-role-trust+jws
          exactSecretName: internal-rpc-authority-restore-role-trust
          statuses:
            - CURRENT
            - NEXT
            - PREVIOUS
          independentManifestTrustSignatureRequired: true
          sourceRevisionDigestAndPredecessorRequired: true
          controllerOwnedHighWatermarkAndReadbackRequired: true
          overlapBeforeSignerUseRequired: true
          previousRetirementAfterControllerReadbackAndMaxTtlOnly: true
        authorityProofSignerRotation:
          statuses:
            - CURRENT
            - NEXT
            - PREVIOUS
          resolverPrivateToPublicReadbackRequired: true
          everyCallerIssuerTrustReadbackRequired: true
          exactProducerPolicyRevisionReadbackRequired: true
          promotionBeforeAllReadbacks: false
          retirementAfterOverlapWindowOnly: true
        targetRegistry: contracts/authorization/v1/bootstrap-key-delivery-targets.json
        targetRegistrySchema: contracts/authorization/v1/key-delivery-targets.schema.json
        vaultAuthResource: internal-rpc-authority-publisher
        vaultKvVersion: 2
        exactWritableVaultPathsFromTargetRegistry: true
        wildcardVaultPathsAllowed: false
        authPrivateKeyCapabilities:
          - create
          - read
          - update
        authorityProofPrivateKeyCapabilities:
          - create
          - read
          - update
        manifestTrustCapabilities:
          - create
          - read
          - update
        forbiddenVaultCapabilities:
          - delete
          - list
          - patch-unregistered-path
        compareAndSwapRequired: true
        perWorkloadRoleFanOutRequired: true
        readbackTable: authority_key_delivery_readbacks
        readbackCardinality: EXACTLY_ONE_PER_REQUIRED_WORKLOAD_ROLE
        protectedReadbackWriteAllowed: false
        requiredRoleUnion: CALLER_ISSUER_TARGET_VERIFIER_PROOF_RESOLVER
        sequence:
          - persist-rotation-intent
          - generate-key-or-certificate
          - vault-cas-deliver-exact-targets
          - workload-role-cryptographic-readback
          - publish-snapshot-cas
          - publisher-cryptographic-readback
          - promote-after-overlap-window
        promotionTransaction:
          isolation: SERIALIZABLE
          lock: authority_rotation_intents-current-generation-for-update
          reads:
            - authority_key_delivery_readbacks
            - authority_snapshot_readbacks
          expectedSet: EXACT_ACTIVE_WORKLOAD_ROLE_GENERATIONS_FROM_PINNED_INTENT
          requireExactRevisionDigestAndGenerationTuple: true
          consumerReadbackWrites: FORBIDDEN
          effects:
            - compare-and-set-rotation-intent-promoted
            - append-authority-snapshot-history
            - advance-current-next-previous
          partialCommitAllowed: false
        crashRecovery:
          resumeSameIntentGenerationAndDigest: true
          requireVaultMetadataReadback: true
          requireEveryRegisteredWorkloadReadback: true
          newGenerationBeforeResolvedIntent: false
      readiness:
        requireCurrentSignerValid: true
        requireDatabase: true
        requireVaultTlsAndExactTargetAuthorization: true
        requireKeyDeliveryReadbacks: true
        requireCryptographicSecretReadback: true
        requireSourceRevisionFinalized: true
      failurePolicy: FAIL_CLOSED
    internal-rpc-authority-readback-attestor:
      kind: Deployment
      canonicalPath: deploy/k8s/base/internal-rpc-authority-readback-attestor
      owner: internal-rpc-authority
      artifactBinary: /usr/local/bin/internal-rpc-authority-readback-attestor
      serviceAccount: internal-rpc-authority-readback-attestor
      replicas: 2
      interface:
        protoService: internalrpcauthority.v1.AuthorityReadbackAttestorService
        attestMethod: /internalrpcauthority.v1.AuthorityReadbackAttestorService/AttestServedState
        readinessMethod: /internalrpcauthority.v1.AuthorityReadbackAttestorService/CheckReadiness
        listenAddress: internal-rpc-authority-readback-attestor.mattercodex-system.svc:8443
        tlsServerName: internal-rpc-authority-readback-attestor.mattercodex-system.svc
        clientTrustBundleId: internal-rpc-authority-readback-attestor-ca
        actualWorkloadIdentity: MTLS_SPIFFE
        applicationCredential: PUBLISHER_SIGNED_ROLE_CREDENTIAL
        evidence:
          protectedType: mattercodex-internal-rpc-readback-attestation+jws
          schema: contracts/authorization/v1/readback-attestation.schema.json
          signatureKey: ROLE_CREDENTIAL_EMBEDDED_ACK_PUBLIC_JWK
          verifyAckJwkKidGenerationAndRfc7638Thumbprint: true
          verifyControllerOwnedPinnedIntent: true
          verifyFreshSingleUseChallenge: true
          verifyServedStateAgainstPinnedDigest: true
          callerProvidedRevisionDigestGenerationIsAuthority: false
        receipt:
          owner: internal-rpc-authority-readback-attestor
          table: authority_readback_attestation_receipts
          immutable: true
          oneTime: true
          ttlSeconds: 300
          binds:
            - pinned-intent-id-and-revision
            - actual-workload-spiffe
            - workload-role-workload-generation-credential-generation
            - ack-key-generation-and-thumbprint
            - served-state-digest
            - evidence-jti-and-digest
          publisherMayCreateOrUpdate: false
          consumersMayCreateOrUpdate: false
      databaseRole: internal_rpc_authority_readback_attestor
      databaseLoginPrincipal: FROM_CONTROLLER_OWNED_EXACT_IDENTITY
      pinnedIntentSource: authority_rotation_intents
      persistedPinnedIntentTable: authority_readback_intents
      readiness:
        requireDatabase: true
        requirePinnedIntentProjectionReadback: true
        requireRoleCredentialTrustServedReadback: true
        requireReceiptInsertAndReadback: true
      failurePolicy: FAIL_CLOSED
    replay-store:
      kind: PostgreSQL
      canonicalPath: deploy/k8s/base/internal-rpc-authority-data
      owner: internal-rpc-authority
      sourceOfTruth: true
      issuerRole: internal_rpc_authority_issuer
      runtimeRole: internal_rpc_authority_verifier
      proofResolverRole: internal_rpc_authority_proof_resolver
      publisherRole: internal_rpc_authority_publisher
      recoveryRole: internal_rpc_authority_recovery
      migrationRole: internal_rpc_authority_migrator
      requiredTables:
        - authority_snapshot_history
        - authority_snapshot_watermarks
        - authority_replay_reservations
        - authority_proof_watermarks
        - authority_proof_reservations
        - authority_snapshot_readbacks
        - authority_key_delivery_readbacks
        - authority_readback_intents
        - authority_readback_attestation_receipts
        - authority_workload_database_identities
        - authority_rotation_intents
        - authority_restore_fences
      minimumDatabaseRights:
        internal_rpc_authority_issuer:
          select:
            - authority_snapshot_history
            - authority_restore_fences
            - authority_rotation_intents
          insertUpdate:
            - authority_snapshot_watermarks
            - authority_proof_watermarks
            - authority_proof_reservations
          execute:
            - internal_rpc_authority.record_authority_key_delivery_readback(uuid)
            - internal_rpc_authority.record_authority_snapshot_readback(uuid)
          delete: []
        internal_rpc_authority_verifier:
          select:
            - authority_snapshot_history
            - authority_restore_fences
          insertUpdate:
            - authority_snapshot_watermarks
            - authority_replay_reservations
          execute:
            - internal_rpc_authority.record_authority_key_delivery_readback(uuid)
            - internal_rpc_authority.record_authority_snapshot_readback(uuid)
          delete: []
        internal_rpc_authority_proof_resolver:
          select:
            - authority_snapshot_history
            - authority_restore_fences
            - authority_rotation_intents
          insertUpdate: []
          execute:
            - internal_rpc_authority.record_authority_key_delivery_readback(uuid)
            - internal_rpc_authority.record_authority_snapshot_readback(uuid)
          delete: []
        internal_rpc_authority_publisher:
          selectInsertUpdate:
            - authority_snapshot_history
            - authority_rotation_intents
          select:
            - authority_key_delivery_readbacks
            - authority_snapshot_readbacks
            - authority_restore_fences
          execute: []
          delete: []
        internal_rpc_authority_readback_attestor:
          selectInsert:
            - authority_readback_intents
            - authority_readback_attestation_receipts
          forbidden:
            - authority_key_delivery_readbacks
            - authority_snapshot_readbacks
            - authority_workload_database_identities
          execute: []
          delete: []
        internal_rpc_authority_recovery:
          select:
            - authority_restore_fences
          insertUpdate:
            - authority_restore_fences
          forbidden:
            - authority_snapshot_watermarks
            - authority_replay_reservations
            - authority_proof_watermarks
            - authority_proof_reservations
      forbiddenRuntimeDatabaseRights:
        - DDL
        - TRUNCATE
        - RESET_WATERMARK
        - DELETE_REPLAY_RESERVATION
        - DIRECT_KEY_DELIVERY_READBACK_WRITE
        - DIRECT_SNAPSHOT_READBACK_WRITE
        - PUBLISHER_ATTESTATION_RECEIPT_WRITE
        - LOGIN_AS_SHARED_GROUP_ROLE
      workloadRoleDatabaseIdentity:
        executableContract: contracts/authorization/v1/postgresql-readback-boundary.sql
        schema: internal_rpc_authority
        schemaOwner: internal_rpc_authority_readback_owner
        tableOwner: internal_rpc_authority_readback_owner
        functionOwner: internal_rpc_authority_readback_owner
        ownerAttributes:
          login: false
          superuser: false
          bypassRls: false
          createDb: false
          createRole: false
          inherit: false
        ownerRuntimeMembershipAllowed: false
        schemaCreatePolicy: OWNER_ONLY
        registry: contracts/authorization/v1/bootstrap-key-delivery-targets.json
        cardinality: BOUNDED_ONE_CURRENT_ONE_NEXT_ONE_PREVIOUS_PER_WORKLOAD_ROLE_GENERATION
        mappingTable: authority_workload_database_identities
        mappingKey:
          - session_user
        mappedFields:
          - workload_id
          - role
          - workload_generation
          - credential_generation
        constraints:
          sessionUserUnique: true
          currentWorkloadRoleGenerationUnique: true
          nextWorkloadRoleGenerationUnique: true
          previousWorkloadRoleGenerationUnique: true
          readbackForeignKeyToIdentity: true
          readbackUniqueTuple:
            - workload_id
            - role
            - workload_generation
            - source_revision
            - digest_sha256
        sharedCapabilityRoles: NOLOGIN
        rowLevelSecurity:
          enabled: true
          forcedForTableOwner: true
          principalSource: session_user
          defaultPolicy: DENY
        protectedReadbackTables:
          - authority_readback_intents
          - authority_readback_attestation_receipts
          - authority_key_delivery_readbacks
          - authority_snapshot_readbacks
        readbackFunctions:
          keyDelivery:
            name: internal_rpc_authority.record_authority_key_delivery_readback
            identityArguments: uuid
            exactSignature: internal_rpc_authority.record_authority_key_delivery_readback(uuid)
            returns: bigint
            targetTable: authority_key_delivery_readbacks
            security: SECURITY_DEFINER
            fixedSearchPath: pg_catalog,internal_rpc_authority,pg_temp
            publicExecuteRevoked: true
            unsafeOverloadAllowed: false
            executeGrantsFromExactTargetRegistry: true
            publisherExecuteAllowed: false
            callerProvidedWorkloadOrRoleAllowed: false
            callerProvidedRevisionDigestGenerationAllowed: false
            onlyArgument: controller_verified_immutable_attestation_receipt_id
            locksRegisteredTarget: true
            atomicChecks:
              - allowed-current-next-or-bounded-previous-session-user-mapping
              - exact-workload-role-generation
              - pinned-key-delivery-intent
              - controller-verified-role-specific-possession-and-served-state
              - single-use-unexpired-attestation-receipt
          snapshot:
            name: internal_rpc_authority.record_authority_snapshot_readback
            identityArguments: uuid
            exactSignature: internal_rpc_authority.record_authority_snapshot_readback(uuid)
            returns: bigint
            targetTable: authority_snapshot_readbacks
            security: SECURITY_DEFINER
            fixedSearchPath: pg_catalog,internal_rpc_authority,pg_temp
            publicExecuteRevoked: true
            unsafeOverloadAllowed: false
            executeGrantsFromExactTargetRegistry: true
            publisherExecuteAllowed: false
            callerProvidedWorkloadOrRoleAllowed: false
            callerProvidedRevisionDigestGenerationAllowed: false
            onlyArgument: controller_verified_immutable_attestation_receipt_id
            locksRegisteredTarget: true
            atomicChecks:
              - allowed-current-next-or-bounded-previous-session-user-mapping
              - exact-workload-role-generation
              - pinned-snapshot-intent
              - controller-verified-role-specific-possession-and-served-state
              - single-use-unexpired-attestation-receipt
        credentialLifecycle:
          owner: internal-rpc-authority-publisher
          delivery: vault-database-secret
          statuses:
            CURRENT: exactly-one
            NEXT: at-most-one
            PREVIOUS: at-most-one-bounded-by-overlap-not-after
            RETIRED: append-only-history
          overlap: current-and-next-login-principals-simultaneously-usable
          nextReadbackBeforePromotionRequired: true
          promotionFunction: internal_rpc_authority.promote_authority_workload_database_identity(text,text,bigint,bigint,uuid,uuid)
          promotionIsolation: SERIALIZABLE
          promotionAtomicEffects:
            - verify-next-key-delivery-and-snapshot-attestation-receipts
            - current-to-bounded-previous
            - next-to-current
            - pinned-intents-to-promoted
          retirePreviousAfterPromotionAndCurrentReadback: true
          revokeRetiredLoginAfterStateCommit: true
          staleOrRetiredFunctionCallPolicy: FAIL_CLOSED
          readinessRequiresSessionUserReadback: true
      backupPitr: REQUIRED
    restore-evidence-anchor:
      kind: ExternalMonotonicKubernetesSecret
      owner: internal-rpc-authority-restore-controller
      namespace: mattercodex-system
      resourceName: internal-rpc-authority-restore-evidence
      outsideRestoredPostgreSQL: true
      updateProtocol: SEMANTIC_REVISION_PREDECESSOR_CAS
      resourceVersionUse: LOST_UPDATE_GUARD_ONLY
      semanticHighWatermarkFields:
        - anchor_revision
        - restore_epoch
        - predecessor.digest_sha256
      admissionProjectionAnnotations:
        anchorRevision: mattercodex.dev/restore-anchor-revision
        restoreEpoch: mattercodex.dev/restore-epoch
        evidenceDigest: mattercodex.dev/restore-evidence-digest-sha256
        predecessorRevision: mattercodex.dev/restore-predecessor-revision
        predecessorDigest: mattercodex.dev/restore-predecessor-digest-sha256
      servedReadback:
        requireSignedClaimsEqualProjectionAnnotations: true
        requireCompactJwsDigestEqualsEvidenceDigestAnnotation: true
        annotationOnlyStateIsAuthority: false
      admission:
        policyName: internal-rpc-authority-restore-anchor-forward-only
        bindingName: internal-rpc-authority-restore-anchor-forward-only
        apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        failurePolicy: Fail
        validationActions:
          - Deny
        exactNamespace: mattercodex-system
        exactResourceName: internal-rpc-authority-restore-evidence
        transitionRules:
