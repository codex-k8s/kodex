      - uds-stop-accepting
      - uds-inflight-join
      - uds-socket-inode-checked-cleanup
      - database-close
    bounded: true
  restore:
    pitrBehavior: QUARANTINE
    fenceOwner: internal-rpc-authority-recovery-job
    externalMonotonicAnchor: internal-rpc-authority-restore-evidence
    controller: internal-rpc-authority-restore-controller
    operator: internal-rpc-authority-restore-operator-job
    externalAnchorOwner: internal-rpc-authority-restore-controller
    externalAnchorOutsideRestoredDatabase: true
    preparedEvidenceRequiredBeforeDatabaseRestore: true
    completedEvidenceRequiredAfterDatabaseRestore: true
    applicationTrafficDuringRestore: CLOSED
    issuanceAndReservationDuringRestore: CLOSED_ON_EVERY_WORK_PATH
    preparedBarrier:
      expectedSet: EVERY_ACTIVE_WORKLOAD_ROLE_GENERATION
      ackIdentity: MTLS_SPIFFE_ROLE_CREDENTIAL_AND_BOUND_ACK_SIGNATURE
      discoveryMethod: /internalrpcauthority.v1.RestoreControllerService/GetRestoreDirective
      discoveryVersion: coordination_revision
      directivePhase: QUIESCING
      roleCredentialAudience: urn:mattercodex:internal-rpc-authority-restore-controller
      roleCredentialSignerTrust: CONTROLLER_OWNED_CURRENT_NEXT_PREVIOUS_SNAPSHOT_WITH_READBACK
      ackPublicKeySource: SIGNED_ROLE_CREDENTIAL
      requireAckJwkKidGenerationAndThumbprintMatch: true
      ackCondition: READINESS_FALSE_ACCEPT_STOPPED_INFLIGHT_DRAINED
      directiveAndAckReplayState: EXTERNAL_COORDINATION_SECRET_CAS
      semanticRetry:
        exactSameIdempotencyKeyJtiAndDigest: RETURN_SAVED_RECEIPT
        keyOrJtiWithDifferentDigest: SECURITY_REPLAY
      partialAckRecovery: RECONSTRUCT_CANONICAL_RECORD_SET_AFTER_LEADER_CRASH
      missingOrStaleAckPolicy: DENY_PREPARED
    startupOrder:
      - controller-enters-quiescing
      - every-current-workload-role-generation-stops-and-acks
      - signed-external-anchor-prepared
      - database-restore
      - signed-external-anchor-completed
      - recovery-job-validates-and-commits-fence
      - database-safe-window-elapses
      - every-workload-role-external-anchor-readback
      - application-readiness
    fenceDurationSeconds: 40
    calculation: TOKEN_TTL_30_PLUS_TWO_CLOCK_SKEW_WINDOWS_5
    requireDatabaseFenceEpochEqualsExternalEpoch: true
    requireDatabaseFenceDigestEqualsExternalCompletedDigest: true
    requireExternalAnchorReadOnEveryReadinessTransition: true
    requireExternalAnchorReadOnEveryIssuanceAndReservation: true
    semanticAnchorSource: SIGNED_REVISION_DIGEST_PREDECESSOR_CHAIN
    kubernetesResourceVersionIsSemanticWatermark: false
    missingOrStaleExternalEvidencePolicy: FAIL_CLOSED
    recoveryJobFailurePolicy: KEEP_TRAFFIC_QUARANTINED
    issuerReadyDuringFence: false
    verifierReadyDuringFence: false
    watermarkResetAllowed: false
    replayReservationResetAllowed: false
