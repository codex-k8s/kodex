apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: internal-rpc-authority
  labels:
    app.kubernetes.io/name: internal-rpc-authority
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority
      app.kubernetes.io/component: database-credential-reconciler
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 5s
