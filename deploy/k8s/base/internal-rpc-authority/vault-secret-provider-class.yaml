apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-database-credential-reconciler-postgres
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-database-credential-reconciler
    audience: vault
    objects: |
      - objectName: "dsn"
        secretPath: "kv/data/internal-rpc-authority/database-credential-reconciler"
        secretKey: "dsn"
        filePermission: 288
