{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "email-bridge-postgresql",
    "namespace": "kodex-system",
    "labels": {
      "app.kubernetes.io/name": "email-bridge-postgresql"
    }
  },
  "spec": {
    "serviceName": "email-bridge-postgresql",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "email-bridge-postgresql"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "email-bridge-postgresql"
        }
      },
      "spec": {
        "serviceAccountName": "email-bridge-postgresql",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsUser": 70,
          "runAsGroup": 70,
          "runAsNonRoot": true,
          "fsGroup": 70,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "postgresql",
            "image": "docker.io/library/postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7",
            "args": [
              "postgres",
              "-c",
              "ssl=on",
              "-c",
              "ssl_cert_file=/var/run/email-tls/tls.crt",
              "-c",
              "ssl_key_file=/var/run/email-tls/tls.key",
              "-c",
              "hba_file=/bootstrap/pg_hba.conf",
              "-c",
              "log_statement=none"
            ],
            "env": [
              {
                "name": "POSTGRES_PASSWORD_FILE",
                "value": "/var/run/email-bootstrap/admin-password"
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              }
            ],
            "ports": [
              {
                "name": "postgresql",
                "containerPort": 5432
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-h",
                  "127.0.0.1",
                  "-U",
                  "postgres"
                ]
              },
              "periodSeconds": 5
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-h",
                  "127.0.0.1",
                  "-U",
                  "postgres"
                ]
              },
              "periodSeconds": 10
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-h",
                  "127.0.0.1",
                  "-U",
                  "postgres"
                ]
              },
              "periodSeconds": 5,
              "failureThreshold": 30
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              },
              {
                "name": "bootstrap",
                "mountPath": "/bootstrap",
                "readOnly": true
              },
              {
                "name": "init",
                "mountPath": "/docker-entrypoint-initdb.d",
                "readOnly": true
              },
              {
                "name": "credentials",
                "mountPath": "/var/run/email-bootstrap",
                "readOnly": true
              },
              {
                "name": "tls",
                "mountPath": "/var/run/email-tls",
                "readOnly": true
              },
              {
                "name": "socket",
                "mountPath": "/var/run/postgresql"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "bootstrap",
            "configMap": {
              "name": "email-bridge-postgresql-bootstrap",
              "defaultMode": 292
            }
          },
          {
            "name": "init",
            "configMap": {
              "name": "email-bridge-postgresql-bootstrap",
              "defaultMode": 365,
              "items": [
                {
                  "key": "bootstrap.sh",
                  "path": "bootstrap.sh"
                }
              ]
            }
          },
          {
            "name": "credentials",
            "secret": {
              "secretName": "email-bridge-postgresql-bootstrap",
              "defaultMode": 288
            }
          },
          {
            "name": "tls",
            "secret": {
              "secretName": "email-bridge-postgresql-tls",
              "defaultMode": 288
            }
          },
          {
            "name": "socket",
            "emptyDir": {
              "sizeLimit": "16Mi"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
