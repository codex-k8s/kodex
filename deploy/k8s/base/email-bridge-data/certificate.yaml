{
  "apiVersion": "cert-manager.io/v1",
  "kind": "Certificate",
  "metadata": {
    "name": "email-bridge-postgresql",
    "namespace": "kodex-system",
    "labels": {
      "app.kubernetes.io/name": "email-bridge-postgresql"
    }
  },
  "spec": {
    "secretName": "email-bridge-postgresql-tls",
    "privateKey": {
      "algorithm": "ECDSA",
      "size": 256,
      "rotationPolicy": "Always"
    },
    "dnsNames": [
      "email-bridge-postgresql.kodex-system.svc.cluster.local"
    ],
    "usages": [
      "server auth"
    ],
    "issuerRef": {
      "name": "kodex-installation-ca",
      "kind": "Issuer"
    }
  }
}
