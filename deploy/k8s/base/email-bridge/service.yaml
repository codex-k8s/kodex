{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "email-bridge",
    "namespace": "kodex-system",
    "labels": {
      "app.kubernetes.io/name": "email-bridge"
    }
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "email-bridge"
    },
    "ports": [
      {
        "name": "https",
        "port": 8443,
        "targetPort": "https"
      },
      {
        "name": "metrics",
        "port": 9090,
        "targetPort": "metrics"
      }
    ]
  }
}
