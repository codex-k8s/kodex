apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-email-bridge-authority
  namespace: kodex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: email-bridge
      ports:
        - protocol: TCP
          port: 8443
