apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: integration-gateway-email-bridge
  namespace: kodex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: integration-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: email-bridge
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
      ports:
        - protocol: TCP
          port: 8443
