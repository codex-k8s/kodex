apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-publisher-signers
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-publisher
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "private.jwk"
        secretPath: "secret/data/internal-rpc-authority/publisher/restore-signer"
        secretKey: "private.jwk"
        filePermission: 288
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-publisher-readback-signer
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-publisher
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "private.jwk"
        secretPath: "secret/data/internal-rpc-authority/publisher/readback-signer"
        secretKey: "private.jwk"
        filePermission: 288
