apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-publisher-deny-by-default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority-publisher
  policyTypes:
    - Ingress
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-publisher-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority-publisher
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-restore-controller
      ports:
        - protocol: TCP
          port: 8444
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Installer заменяет default k3s service IP для existing Kubernetes.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
