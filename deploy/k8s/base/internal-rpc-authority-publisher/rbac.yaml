apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-rpc-authority-publisher
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - internal-rpc-authority-snapshot
      - internal-rpc-authority-readback-credential-trust
      - internal-rpc-authority-restore-role-trust
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-rpc-authority-publisher
subjects:
  - kind: ServiceAccount
    name: internal-rpc-authority-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-rpc-authority-publisher
