apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-readback-trust
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-readback-attestor
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "manifest-root.jws"
        secretPath: "secret/data/internal-rpc-authority/readback/trust"
        secretKey: "manifest-root.jws"
        filePermission: 288
      - objectName: "credential-trust.jws"
        secretPath: "secret/data/internal-rpc-authority/readback/trust"
        secretKey: "credential-trust.jws"
        filePermission: 288
