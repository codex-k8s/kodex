apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-readback-attestor-deny-by-default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority-readback-attestor
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-readback-attestor-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority-readback-attestor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - automation-scheduler
                  - secret-broker
                  - session-archive
                  - control-api-gateway
                  - integration-gateway
                  - email-bridge
                  - control-plane
                  - internal-rpc-authority-publisher
                  - role-image-builder
                  - runtime-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-image-admission
              app.kubernetes.io/component: image-admission
            matchExpressions:
              - key: kodex.dev/image-admission-phase
                operator: In
                values: [claim, admit, promote]
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentry-relay
      ports:
        - protocol: TCP
          port: 8443
