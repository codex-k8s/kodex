apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-storage
spec:
  serviceName: seaweedfs
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/component: object-storage
      annotations:
        kubectl.kubernetes.io/default-container: seaweedfs
    spec:
      serviceAccountName: seaweedfs
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-data-directories
          image: __KODEX_SEAWEEDFS_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args: [mkdir -p /data/master /data/volume]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: seaweedfs
          image: __KODEX_SEAWEEDFS_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data/volume
            - -master.dir=/data/master
            - -master.telemetry=false
            - -master.volumeSizeLimitMB=64
            - -volume.max=64
            - -filer
            - -filer.disableDirListing=true
            - -s3
            - -s3.config=/var/run/secrets/kodex/seaweedfs/s3.json
            - -s3.allowDeleteBucketNotEmpty=false
            - -s3.iam=false
            - -ip=seaweedfs
            - -ip.bind=0.0.0.0
          ports:
            - {name: master, containerPort: 9333, protocol: TCP}
            - {name: master-grpc, containerPort: 19333, protocol: TCP}
            - {name: volume, containerPort: 8080, protocol: TCP}
            - {name: volume-grpc, containerPort: 18080, protocol: TCP}
            - {name: filer, containerPort: 8888, protocol: TCP}
            - {name: filer-grpc, containerPort: 18888, protocol: TCP}
            - {name: s3, containerPort: 8333, protocol: TCP}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl --fail --silent --show-error --max-time 2 http://127.0.0.1:9333/cluster/status >/dev/null
                  code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8333/)"
                  [ "$code" = 200 ] || [ "$code" = 403 ]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl --fail --silent --show-error --max-time 2 http://127.0.0.1:9333/cluster/status >/dev/null
                  code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8333/)"
                  [ "$code" = 200 ] || [ "$code" = 403 ]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - name: s3-config
              mountPath: /var/run/secrets/kodex/seaweedfs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: s3-config
          secret:
            secretName: kodex-external-s3
            defaultMode: 0440
            items:
              - {key: s3.json, path: s3.json}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: seaweedfs
          app.kubernetes.io/component: object-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
