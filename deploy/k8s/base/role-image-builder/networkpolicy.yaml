apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: role-image-builder-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: role-image-builder}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: role-image-builder-exact-runtime-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: role-image-builder
      app.kubernetes.io/component: image-build-client
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 9091}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: control-plane}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: kodex-buildkit}
      ports: [{protocol: TCP, port: 1234}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-image-registry
              kodex.dev/registry-scope: pull
      ports: [{protocol: TCP, port: 5000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: opentelemetry-collector}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: sentry-relay}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kodex-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: vault}
      ports: [{protocol: TCP, port: 8200}]
