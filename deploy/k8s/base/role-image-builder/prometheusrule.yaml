apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: role-image-builder
  labels: {app.kubernetes.io/name: role-image-builder}
spec:
  groups:
    - name: role-image-builder
      rules:
        - alert: RoleImageBuilderUnavailable
          expr: absent(kodex_role_image_builder_readiness{ready="true"}) or sum(kodex_role_image_builder_readiness{ready="true"}) < 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Role image builder is unavailable
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/role-image-builder.md
        - alert: RoleImageBuildFailures
          expr: sum(increase(kodex_role_image_builder_operations_total{operation=~"materialize|build",outcome=~"rejected|error"}[15m])) > 2
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Role image builds are failing
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/role-image-builder.md
