apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: role-image-builder-application-grant
spec:
  provider: vault
  parameters:
    roleName: role-image-builder
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "application-grant.jws"
        secretPath: "kv/data/mattercodex/role-image-builder/application-grant"
        secretKey: "compact-jws"
        filePermission: 288
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: role-image-builder-buildkit-client
spec:
  provider: vault
  parameters:
    roleName: role-image-builder
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "tls.crt"
        secretPath: "pki/issue/mattercodex-buildkit-client"
        secretKey: "certificate"
        method: PUT
        secretArgs:
          common_name: role-image-builder
          alt_names: role-image-builder.mattercodex-system.svc
          ttl: 30m
      - objectName: "tls.key"
        secretPath: "pki/issue/mattercodex-buildkit-client"
        secretKey: "private_key"
        method: PUT
        secretArgs:
          common_name: role-image-builder
          alt_names: role-image-builder.mattercodex-system.svc
          ttl: 30m
      - objectName: "ca.pem"
        secretPath: "pki/cert/ca"
        secretKey: "certificate"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: role-image-builder-input-read
spec:
  provider: vault
  parameters:
    roleName: role-image-builder-input-read
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "config.json"
        secretPath: "kv/data/mattercodex/role-image-builder/input-read"
        secretKey: "docker-config"
        filePermission: 256
      - objectName: "tls.crt"
        secretPath: "pki/issue/mattercodex-role-image-input-read"
        secretKey: "certificate"
        method: PUT
        secretArgs:
          common_name: role-image-builder-input-read
          ttl: 30m
      - objectName: "tls.key"
        secretPath: "pki/issue/mattercodex-role-image-input-read"
        secretKey: "private_key"
        method: PUT
        secretArgs:
          common_name: role-image-builder-input-read
          ttl: 30m
      - objectName: "ca.pem"
        secretPath: "pki-public/cert/ca"
        secretKey: "certificate"
---
