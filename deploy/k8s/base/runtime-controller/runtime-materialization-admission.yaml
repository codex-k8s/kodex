apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runtime-execution-ticket-exact-projection
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: runtime-controller-ticket
      expression: >-
        object.metadata.namespace == 'kodex-runtime' &&
        request.userInfo.username ==
          'system:serviceaccount:kodex-system:runtime-controller'
  validations:
    - expression: request.operation == 'CREATE'
      message: runtime execution tickets are immutable and cannot be updated
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['runtime.kodex.dev/managed'] == 'true' &&
        object.metadata.labels['runtime.kodex.dev/mode'] in
          ['turn', 'warm', 'warm-turn']
      message: runtime execution ticket labels are invalid
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:runtime-controller'
      message: only runtime-controller may create execution tickets
    - expression: >-
        object.metadata.name.startsWith('runtime-ticket-') &&
        has(object.immutable) && object.immutable == true &&
        object.type == 'Opaque' &&
        !has(object.stringData)
      message: runtime execution ticket identity or immutability is invalid
    - expression: >-
        has(object.data) &&
        'runtime.json' in object.data &&
        'token' in object.data &&
        object.data.all(key,
          key == 'runtime.json' || key == 'token' ||
          key.matches('^environment-[a-f0-9]{16}$'))
      message: runtime execution ticket contains an unsupported data key
    - expression: >-
        has(object.metadata.annotations) &&
        'runtime.kodex.dev/revision-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/revision-digest']
          .matches('^[a-f0-9]{64}$') &&
        'runtime.kodex.dev/config-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/config-digest']
          .matches('^[a-f0-9]{64}$') &&
        'runtime.kodex.dev/environment-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/environment-digest']
          .matches('^[a-f0-9]{64}$') &&
        'runtime.kodex.dev/controller-pod-uid' in object.metadata.annotations &&
        size(object.metadata.annotations['runtime.kodex.dev/controller-pod-uid']) > 0 &&
        'runtime.kodex.dev/pod-name' in object.metadata.annotations &&
        size(object.metadata.annotations['runtime.kodex.dev/pod-name']) > 0 &&
        ['runtime.kodex.dev/resources-digest',
         'runtime.kodex.dev/volumes-digest',
         'runtime.kodex.dev/network-digest',
         'runtime.kodex.dev/rbac-profile-digest',
         'runtime.kodex.dev/effective-rbac-digest'].all(key,
           key in object.metadata.annotations &&
           object.metadata.annotations[key].matches('^[a-f0-9]{64}$'))
      message: runtime execution ticket is not pinned to exact runtime revisions
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runtime-execution-ticket-exact-projection
spec:
  policyName: runtime-execution-ticket-exact-projection
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-runtime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runtime-execution-service-account
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts]
  matchConditions:
    - name: runtime-controller-service-account
      expression: >-
        object.metadata.namespace == 'kodex-runtime' &&
        request.userInfo.username ==
          'system:serviceaccount:kodex-system:runtime-controller'
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:runtime-controller'
      message: only runtime-controller may create execution ServiceAccounts
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['runtime.kodex.dev/managed'] == 'true' &&
        object.metadata.labels['runtime.kodex.dev/mode'] == 'turn' &&
        object.metadata.labels['runtime.kodex.dev/execution-hash'].matches('^[a-f0-9]{16}$')
      message: execution ServiceAccount labels are invalid
    - expression: >-
        object.metadata.name.matches('^runtime-sa-[a-f0-9]{16}$') &&
        has(object.automountServiceAccountToken) &&
        object.automountServiceAccountToken == false &&
        object.metadata.name.endsWith(
          object.metadata.labels['runtime.kodex.dev/execution-hash'])
      message: execution ServiceAccount identity is invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runtime-execution-service-account
spec:
  policyName: runtime-execution-service-account
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-runtime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runtime-execution-rbac
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [roles, rolebindings]
  matchConditions:
    - name: runtime-controller-rbac
      expression: >-
        object.metadata.namespace == 'kodex-runtime' &&
        request.userInfo.username ==
          'system:serviceaccount:kodex-system:runtime-controller'
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:runtime-controller'
      message: only runtime-controller may create execution RBAC
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['runtime.kodex.dev/managed'] == 'true' &&
        object.metadata.labels['runtime.kodex.dev/mode'] == 'turn' &&
        object.metadata.labels['runtime.kodex.dev/execution-hash'].matches('^[a-f0-9]{16}$')
      message: execution RBAC labels are invalid
    - expression: >-
        object.kind == 'RoleBinding' ||
        (object.metadata.name.matches('^runtime-role-[a-f0-9]{16}$') &&
         object.metadata.name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
         size(object.rules) == 2 &&
         object.rules.all(rule,
           size(rule.apiGroups) == 1 && rule.apiGroups[0] == '' &&
           size(rule.verbs) == 1 && rule.verbs[0] == 'get' &&
           size(rule.resourceNames) == 1 &&
           rule.resourceNames[0].matches('^runtime-turn-[a-f0-9]{16}$') &&
           rule.resourceNames[0].endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
           size(rule.resources) == 1 &&
           rule.resources[0] in ['pods', 'pods/log']))
      message: execution Role may read only its exact Pod and logs
    - expression: >-
        object.kind == 'Role' ||
        (object.metadata.name.matches('^runtime-rb-[a-f0-9]{16}$') &&
         object.metadata.name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
         size(object.subjects) == 1 &&
         object.subjects[0].kind == 'ServiceAccount' &&
         object.subjects[0].namespace == 'kodex-runtime' &&
         object.subjects[0].name.matches('^runtime-sa-[a-f0-9]{16}$') &&
         object.subjects[0].name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
         object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
         object.roleRef.kind == 'Role' &&
         object.roleRef.name.matches('^runtime-role-[a-f0-9]{16}$') &&
         object.roleRef.name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']))
      message: execution RoleBinding identity is invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runtime-execution-rbac
spec:
  policyName: runtime-execution-rbac
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-runtime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runtime-execution-network-policy
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [networkpolicies]
  matchConditions:
    - name: runtime-controller-network-policy
      expression: >-
        object.metadata.namespace == 'kodex-runtime' &&
        request.userInfo.username ==
          'system:serviceaccount:kodex-system:runtime-controller'
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:runtime-controller'
      message: only runtime-controller may create execution NetworkPolicies
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['runtime.kodex.dev/managed'] == 'true' &&
        object.metadata.labels['runtime.kodex.dev/mode'] == 'turn' &&
        object.metadata.labels['runtime.kodex.dev/execution-hash'].matches('^[a-f0-9]{16}$')
      message: execution NetworkPolicy labels are invalid
    - expression: >-
        object.metadata.name.matches('^runtime-net-[a-f0-9]{16}$') &&
        object.metadata.name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
        size(object.spec.policyTypes) == 1 &&
        object.spec.policyTypes[0] == 'Egress' &&
        !has(object.spec.ingress) &&
        size(object.spec.podSelector.matchLabels) == 3 &&
        object.spec.podSelector.matchLabels['runtime.kodex.dev/managed'] == 'true' &&
        object.spec.podSelector.matchLabels['runtime.kodex.dev/mode'] == 'turn' &&
        object.spec.podSelector.matchLabels['runtime.kodex.dev/execution-hash'] ==
          object.metadata.labels['runtime.kodex.dev/execution-hash']
      message: execution NetworkPolicy selector is not exact
    - expression: >-
        size(object.spec.egress) >= 4 && size(object.spec.egress) <= 5 &&
        object.spec.egress.all(rule,
          size(rule.to) == 1 && size(rule.ports) == 1 &&
          ((rule.ports[0].port == 53 &&
            rule.ports[0].protocol in ['TCP', 'UDP'] &&
            has(rule.to[0].namespaceSelector) &&
            size(rule.to[0].namespaceSelector.matchLabels) == 1 &&
            rule.to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'kube-system' &&
            has(rule.to[0].podSelector) &&
            size(rule.to[0].podSelector.matchLabels) == 1 &&
            rule.to[0].podSelector.matchLabels['k8s-app'] == 'kube-dns' &&
            !has(rule.to[0].ipBlock)) ||
           (rule.ports[0].port == 8444 &&
            rule.ports[0].protocol == 'TCP' &&
            has(rule.to[0].namespaceSelector) &&
            size(rule.to[0].namespaceSelector.matchLabels) == 1 &&
            rule.to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'kodex-system' &&
            has(rule.to[0].podSelector) &&
            size(rule.to[0].podSelector.matchLabels) == 2 &&
            rule.to[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'runtime-controller' &&
            rule.to[0].podSelector.matchLabels['app.kubernetes.io/component'] == 'internal-controller' &&
            !has(rule.to[0].ipBlock)) ||
           (rule.ports[0].port == 8080 &&
            rule.ports[0].protocol == 'TCP' &&
            has(rule.to[0].namespaceSelector) &&
            size(rule.to[0].namespaceSelector.matchLabels) == 1 &&
            rule.to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'kodex-system' &&
            has(rule.to[0].podSelector) &&
            size(rule.to[0].podSelector.matchLabels) == 2 &&
            rule.to[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'egress-gateway' &&
            rule.to[0].podSelector.matchLabels['app.kubernetes.io/component'] == 'platform-egress' &&
            !has(rule.to[0].ipBlock)) ||
           (rule.ports[0].port == 443 &&
            rule.ports[0].protocol == 'TCP' &&
            has(rule.to[0].ipBlock) &&
            rule.to[0].ipBlock.cidr ==
              params.data['kubernetes-api-service-cidr'] &&
            !has(rule.to[0].ipBlock.except) &&
            !has(rule.to[0].namespaceSelector) &&
            !has(rule.to[0].podSelector)))) &&
        size(object.spec.egress.filter(rule,
          rule.ports[0].port == 53 && rule.ports[0].protocol == 'TCP')) == 1 &&
        size(object.spec.egress.filter(rule,
          rule.ports[0].port == 53 && rule.ports[0].protocol == 'UDP')) == 1 &&
        size(object.spec.egress.filter(rule, rule.ports[0].port == 8080)) == 1 &&
        size(object.spec.egress.filter(rule, rule.ports[0].port == 8444)) == 1 &&
        size(object.spec.egress.filter(rule, rule.ports[0].port == 443)) <= 1
      message: execution NetworkPolicy contains a wildcard or unsupported egress rule
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runtime-execution-network-policy
spec:
  policyName: runtime-execution-network-policy
  validationActions: [Deny]
  paramRef:
    name: runtime-materialization-admission-parameters
    namespace: kodex-system
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kodex-runtime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runtime-role-pod-exact-secret-projection
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: runtime-controller-role-pod
      expression: >-
        object.metadata.namespace == 'kodex-runtime' &&
        request.userInfo.username ==
          'system:serviceaccount:kodex-system:runtime-controller'
  variables:
    - name: ticketVolumes
      expression: >-
        object.spec.volumes.filter(volume,
          volume.name == 'runtime-input' && has(volume.secret))
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: providerContainers
      expression: >-
        object.spec.containers.filter(container,
          container.name == 'provider-runtime')
    - name: roleContainers
      expression: >-
        object.spec.containers.filter(container,
          container.name == 'role-runtime')
    - name: relayContainers
      expression: >-
        object.spec.containers.filter(container,
          container.name == 'provider-credential-relay')
    - name: kubeAccessVolumes
      expression: >-
        object.spec.volumes.filter(volume,
          volume.name == 'kube-api-access')
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:kodex-system:runtime-controller'
      message: only runtime-controller may create managed role Pods
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['runtime.kodex.dev/managed'] == 'true' &&
        object.metadata.labels['app.kubernetes.io/name'] == 'agent-runner' &&
        object.metadata.labels['app.kubernetes.io/component'] == 'role-runtime' &&
        object.metadata.labels['runtime.kodex.dev/mode'] in ['turn', 'warm']
      message: managed role Pod labels are invalid
    - expression: >-
        ((object.metadata.labels['runtime.kodex.dev/mode'] == 'warm' &&
          object.metadata.name == 'system-assistant-warm' &&
          object.spec.serviceAccountName == 'agent-runner') ||
         (object.metadata.labels['runtime.kodex.dev/mode'] == 'turn' &&
          object.metadata.name.matches('^runtime-turn-[a-f0-9]{16}$') &&
          object.metadata.name.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']) &&
          object.spec.serviceAccountName.matches('^runtime-sa-[a-f0-9]{16}$') &&
          object.spec.serviceAccountName.endsWith(object.metadata.labels['runtime.kodex.dev/execution-hash']))) &&
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: managed role Pod service account boundary is invalid
    - expression: >-
        size(object.spec.containers) == 3 &&
        size(variables.roleContainers) == 1 &&
        size(variables.providerContainers) == 1 &&
        size(variables.relayContainers) == 1 &&
        has(object.spec.initContainers) &&
        size(object.spec.initContainers) == 1 &&
        object.spec.initContainers[0].name == 'workspace-init'
      message: managed role Pod container set is invalid
    - expression: >-
        object.spec.restartPolicy == 'Never' &&
        has(object.spec.enableServiceLinks) &&
        object.spec.enableServiceLinks == false &&
        object.spec.terminationGracePeriodSeconds == 30 &&
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
        (!has(object.spec.shareProcessNamespace) ||
          object.spec.shareProcessNamespace == false) &&
        has(object.spec.securityContext) &&
        object.spec.securityContext.runAsNonRoot == true &&
        object.spec.securityContext.fsGroup == 29000 &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: managed role Pod security boundary is invalid
    - expression: >-
        [variables.roleContainers[0], variables.providerContainers[0],
          object.spec.initContainers[0]].all(container,
          container.image.matches('^.+@sha256:[a-f0-9]{64}$') &&
          container.image == variables.roleContainers[0].image &&
          container.imagePullPolicy == 'IfNotPresent' &&
          (!has(container.command) || size(container.command) == 0)) &&
        variables.relayContainers[0].image.matches('^.+@sha256:[a-f0-9]{64}$') &&
        variables.relayContainers[0].image == params.data['nodeReadbackImage'] &&
        variables.relayContainers[0].imagePullPolicy == 'IfNotPresent' &&
        (!has(variables.relayContainers[0].command) ||
          size(variables.relayContainers[0].command) == 0) &&
        size(variables.roleContainers[0].args) == 1 &&
        variables.roleContainers[0].args[0] ==
          (object.metadata.labels['runtime.kodex.dev/mode'] == 'warm'
            ? 'runtime-warm' : 'runtime-session') &&
        size(variables.providerContainers[0].args) == 1 &&
        variables.providerContainers[0].args[0] == 'runtime-provider' &&
        size(variables.relayContainers[0].args) == 1 &&
        variables.relayContainers[0].args[0] ==
          'runtime-provider-credential-relay' &&
        size(object.spec.initContainers[0].args) == 1 &&
        object.spec.initContainers[0].args[0] == 'runtime-init-workspace'
      message: managed role Pod image or process contract is invalid
    - expression: >-
        variables.allContainers.all(container,
          has(container.securityContext) &&
          container.securityContext.runAsNonRoot == true &&
          container.securityContext.allowPrivilegeEscalation == false &&
          container.securityContext.readOnlyRootFilesystem == true &&
          (!has(container.securityContext.privileged) ||
            container.securityContext.privileged == false) &&
          has(container.securityContext.capabilities) &&
          (!has(container.securityContext.capabilities.add) ||
            size(container.securityContext.capabilities.add) == 0) &&
          size(container.securityContext.capabilities.drop) == 1 &&
          container.securityContext.capabilities.drop[0] == 'ALL') &&
        variables.roleContainers[0].securityContext.runAsUser == 10001 &&
        variables.roleContainers[0].securityContext.runAsGroup == 10001 &&
        variables.roleContainers[0].securityContext.seccompProfile.type ==
          'RuntimeDefault' &&
        object.spec.initContainers[0].securityContext.runAsUser == 10001 &&
        object.spec.initContainers[0].securityContext.runAsGroup == 10001 &&
        object.spec.initContainers[0].securityContext.seccompProfile.type ==
          'RuntimeDefault' &&
        variables.providerContainers[0].securityContext.runAsUser == 10002 &&
        variables.providerContainers[0].securityContext.runAsGroup == 10002 &&
        variables.providerContainers[0].securityContext.seccompProfile.type ==
          'Unconfined' &&
        (params.data['providerAppArmorProfile'] == '' ?
          !has(variables.providerContainers[0].securityContext.appArmorProfile) :
          params.data['providerAppArmorProfile'] == 'kodex-provider-runtime' &&
          has(variables.providerContainers[0].securityContext.appArmorProfile) &&
          variables.providerContainers[0].securityContext.appArmorProfile.type == 'Localhost' &&
          variables.providerContainers[0].securityContext.appArmorProfile.localhostProfile ==
            params.data['providerAppArmorProfile']) &&
        variables.relayContainers[0].securityContext.runAsUser == 10003 &&
        variables.relayContainers[0].securityContext.runAsGroup == 10003 &&
        variables.relayContainers[0].securityContext.seccompProfile.type ==
          'RuntimeDefault'
      message: managed role Pod container securityContext is invalid
    - expression: >-
        size(variables.roleContainers[0].resources.requests) == 3 &&
        size(variables.roleContainers[0].resources.limits) == 3 &&
        quantity(string(variables.roleContainers[0].resources.requests.cpu)).compareTo(quantity('100m')) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.requests.cpu)).compareTo(quantity('8')) <= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits.cpu)).compareTo(
          quantity(string(variables.roleContainers[0].resources.requests.cpu))) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits.cpu)).compareTo(quantity('16')) <= 0 &&
        quantity(string(variables.roleContainers[0].resources.requests.memory)).compareTo(quantity('128Mi')) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.requests.memory)).compareTo(quantity('32Gi')) <= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits.memory)).compareTo(
          quantity(string(variables.roleContainers[0].resources.requests.memory))) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits.memory)).compareTo(quantity('64Gi')) <= 0 &&
        quantity(string(variables.roleContainers[0].resources.requests['ephemeral-storage'])).compareTo(
          quantity('256Mi')) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.requests['ephemeral-storage'])).compareTo(
          quantity('20Gi')) <= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits['ephemeral-storage'])).compareTo(
          quantity(string(variables.roleContainers[0].resources.requests['ephemeral-storage']))) >= 0 &&
        quantity(string(variables.roleContainers[0].resources.limits['ephemeral-storage'])).compareTo(
          quantity('100Gi')) <= 0
      message: managed role Pod resources are outside the approved policy
    - expression: >-
        [variables.providerContainers[0], variables.relayContainers[0],
          object.spec.initContainers[0]].all(container,
          size(container.resources.requests) == 2 &&
          size(container.resources.limits) == 2 &&
          quantity(string(container.resources.requests.cpu)).compareTo(quantity('25m')) == 0 &&
          quantity(string(container.resources.requests.memory)).compareTo(quantity('64Mi')) == 0 &&
          quantity(string(container.resources.limits.cpu)).compareTo(quantity('500m')) == 0 &&
          quantity(string(container.resources.limits.memory)).compareTo(quantity('256Mi')) == 0)
      message: managed runtime support container resources are invalid
    - expression: >-
        has(object.metadata.annotations) &&
        'runtime.kodex.dev/revision-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/revision-digest']
          .matches('^[a-f0-9]{64}$') &&
        'runtime.kodex.dev/config-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/config-digest']
          .matches('^[a-f0-9]{64}$') &&
        'runtime.kodex.dev/environment-digest' in object.metadata.annotations &&
        object.metadata.annotations['runtime.kodex.dev/environment-digest']
          .matches('^[a-f0-9]{64}$') &&
        ['runtime.kodex.dev/resources-digest',
         'runtime.kodex.dev/volumes-digest',
         'runtime.kodex.dev/network-digest',
         'runtime.kodex.dev/rbac-profile-digest',
         'runtime.kodex.dev/effective-rbac-digest'].all(key,
           key in object.metadata.annotations &&
           object.metadata.annotations[key].matches('^[a-f0-9]{64}$'))
      message: managed role Pod is not pinned to exact runtime revisions
    - expression: >-
        size(variables.ticketVolumes) == 1 &&
        variables.ticketVolumes[0].secret.secretName
          .startsWith('runtime-ticket-')
      message: managed role Pod must use one execution-scoped runtime ticket
    - expression: >-
        size(variables.providerContainers) == 1 &&
        variables.providerContainers[0].env.all(item,
          !(has(item.valueFrom) && has(item.valueFrom.secretKeyRef)) ||
          (item.valueFrom.secretKeyRef.name ==
             variables.ticketVolumes[0].secret.secretName &&
           item.valueFrom.secretKeyRef.key
             .matches('^environment-[a-f0-9]{16}$') &&
           (!has(item.valueFrom.secretKeyRef.optional) ||
