apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: runtime-controller
  labels: {app.kubernetes.io/name: runtime-controller}
spec:
  groups:
    - name: runtime-controller
      rules:
        - alert: RuntimeControllerNotReady
          expr: max(kodex_runtime_controller_readiness{ready="false"}) == 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Runtime controller is not ready
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/runtime-controller.md
