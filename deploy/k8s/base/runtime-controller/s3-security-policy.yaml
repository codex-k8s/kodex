apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-controller-s3-security-policy
  labels:
    app.kubernetes.io/name: runtime-controller
    mattercodex.dev/policy-kind: s3-iam-source
data:
  archive-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Sid":"BucketReadback","Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetObjectLockConfiguration","s3:GetEncryptionConfiguration","s3:GetBucketPublicAccessBlock"],"Resource":"arn:aws:s3:::mattercodex-runtime"},
        {"Sid":"ReadExactArchiveKey","Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":"arn:aws:s3:::mattercodex-runtime/runtime/${aws:PrincipalTag/organization_id}/${aws:PrincipalTag/project_id}/${aws:PrincipalTag/session_id}/${aws:PrincipalTag/execution_id}/*","Condition":{"Bool":{"aws:SecureTransport":"true"}}},
        {"Sid":"WriteExactArchiveKey","Effect":"Allow","Action":["s3:PutObject","s3:PutObjectRetention"],"Resource":"arn:aws:s3:::mattercodex-runtime/runtime/${aws:PrincipalTag/organization_id}/${aws:PrincipalTag/project_id}/${aws:PrincipalTag/session_id}/${aws:PrincipalTag/execution_id}/*","Condition":{"Bool":{"aws:SecureTransport":"true"},"StringEquals":{"s3:x-amz-server-side-encryption":"aws:kms","s3:object-lock-mode":"COMPLIANCE"}}},
        {"Sid":"ArchiveKMS","Effect":"Allow","Action":["kms:Decrypt","kms:Encrypt","kms:GenerateDataKey"],"Resource":"${aws:PrincipalTag/kms_key_arn}"},
        {"Sid":"DenyListDeleteCrossTenant","Effect":"Deny","Action":["s3:ListBucket","s3:DeleteObject","s3:DeleteObjectVersion","s3:BypassGovernanceRetention"],"Resource":["arn:aws:s3:::mattercodex-runtime","arn:aws:s3:::mattercodex-runtime/*"]},
        {"Sid":"DenyInsecureTransport","Effect":"Deny","Action":"s3:*","Resource":["arn:aws:s3:::mattercodex-runtime","arn:aws:s3:::mattercodex-runtime/*"],"Condition":{"Bool":{"aws:SecureTransport":"false"}}}
      ]
    }
  restore-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Sid":"BucketReadback","Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetObjectLockConfiguration","s3:GetEncryptionConfiguration","s3:GetBucketPublicAccessBlock"],"Resource":"arn:aws:s3:::mattercodex-runtime"},
        {"Sid":"ExactArchiveVersion","Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":"arn:aws:s3:::mattercodex-runtime/runtime/${aws:PrincipalTag/organization_id}/${aws:PrincipalTag/project_id}/${aws:PrincipalTag/session_id}/${aws:PrincipalTag/source_execution_id}/*","Condition":{"Bool":{"aws:SecureTransport":"true"}}},
        {"Sid":"ReadExactRestoreProof","Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":"arn:aws:s3:::mattercodex-runtime/runtime-restore-proof/${aws:PrincipalTag/organization_id}/${aws:PrincipalTag/project_id}/${aws:PrincipalTag/session_id}/${aws:PrincipalTag/source_execution_id}/*","Condition":{"Bool":{"aws:SecureTransport":"true"}}},
        {"Sid":"WriteExactRestoreProof","Effect":"Allow","Action":["s3:PutObject","s3:PutObjectRetention"],"Resource":"arn:aws:s3:::mattercodex-runtime/runtime-restore-proof/${aws:PrincipalTag/organization_id}/${aws:PrincipalTag/project_id}/${aws:PrincipalTag/session_id}/${aws:PrincipalTag/source_execution_id}/*","Condition":{"Bool":{"aws:SecureTransport":"true"},"StringEquals":{"s3:x-amz-server-side-encryption":"aws:kms","s3:object-lock-mode":"COMPLIANCE"}}},
        {"Sid":"RestoreKMS","Effect":"Allow","Action":["kms:Decrypt","kms:Encrypt","kms:GenerateDataKey"],"Resource":"${aws:PrincipalTag/kms_key_arn}"},
        {"Sid":"DenyListDeleteCrossTenant","Effect":"Deny","Action":["s3:ListBucket","s3:DeleteObject","s3:DeleteObjectVersion","s3:BypassGovernanceRetention"],"Resource":["arn:aws:s3:::mattercodex-runtime","arn:aws:s3:::mattercodex-runtime/*"]},
        {"Sid":"DenyInsecureTransport","Effect":"Deny","Action":"s3:*","Resource":["arn:aws:s3:::mattercodex-runtime","arn:aws:s3:::mattercodex-runtime/*"],"Condition":{"Bool":{"aws:SecureTransport":"false"}}}
      ]
    }
  requirements.yaml: |
    credential_ttl_max_seconds: 900
    identity_source: vault_aws_sts
    required_session_tags: [organization_id, project_id, session_id, execution_id, source_execution_id, kms_key_arn]
    bucket_versioning: Enabled
    object_lock: Enabled
    object_lock_mode: COMPLIANCE
    encryption: aws:kms
    public_access_block: required
    forbidden_actions: [s3:ListBucket, s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention]
