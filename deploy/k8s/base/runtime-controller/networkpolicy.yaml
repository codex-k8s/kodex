apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-default-deny}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-controller
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-exact-paths}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-controller
      app.kubernetes.io/component: internal-controller
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner
              app.kubernetes.io/component: role-runtime
              runtime.kodex.dev/managed: "true"
      ports: [{protocol: TCP, port: 8444}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: control-plane}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: secret-broker
              app.kubernetes.io/component: secret-broker
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - ipBlock: {cidr: __KODEX_KUBERNETES_API_SERVICE_CIDR__}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-collector}}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: sentry-relay}}
      ports: [{protocol: TCP, port: 8443}]
