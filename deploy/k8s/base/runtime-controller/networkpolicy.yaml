apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-deny-all}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: runtime-controller}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-exact-paths}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: runtime-controller, app.kubernetes.io/component: hot-runtime}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: control-plane}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: egress-gateway}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: internal-rpc-authority-readback-attestor}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: internal-rpc-authority-postgresql}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: internal-rpc-authority-restore-controller}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: vault}}}]
      ports: [{protocol: TCP, port: 8200}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-collector}}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: sentry-relay}}
      ports: [{protocol: TCP, port: 8443}]
