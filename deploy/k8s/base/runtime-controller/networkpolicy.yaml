apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-default-deny}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [runtime-controller, agent-runner]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-controller-exact-paths}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-controller
      app.kubernetes.io/component: internal-controller
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner
              app.kubernetes.io/component: role-runtime
              runtime.mattercodex.dev/managed: "true"
      ports: [{protocol: TCP, port: 8444}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: control-plane}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - ipBlock: {cidr: __MATTERCODEX_KUBERNETES_API_SERVICE_CIDR__}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-collector}}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: sentry-relay}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-runner-exact-paths}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runner
      app.kubernetes.io/component: role-runtime
      runtime.mattercodex.dev/managed: "true"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: runtime-controller
              app.kubernetes.io/component: internal-controller
      ports: [{protocol: TCP, port: 8444}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-gateway
              app.kubernetes.io/component: platform-egress
      ports: [{protocol: TCP, port: 8080}]
