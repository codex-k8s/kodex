apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: runtime-controller-application-grant}
spec:
  provider: vault
  parameters:
    roleName: runtime-controller
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "application-grant.jws"
        secretPath: "kv/data/mattercodex/runtime-controller/application-grant"
        secretKey: "compact-jws"
        filePermission: 288
---
