apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: runtime-controller-platform-worker-grant-signer}
spec:
  provider: vault
  parameters:
    roleName: runtime-controller
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "private.jwk"
        secretPath: "kv/data/mattercodex/platform-worker-grants/runtime-controller"
        secretKey: "private.jwk"
        filePermission: 288
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: runtime-controller-provider-credential}
spec:
  provider: vault
  parameters:
    roleName: runtime-controller
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "api-key"
        secretPath: "kv/data/mattercodex/providers/openai-codex/default"
        secretKey: "api-key"
        filePermission: 288
