kind: Service
metadata: {name: runtime-s3-restore-exchanger}
spec:
  selector: {app.kubernetes.io/name: runtime-s3-restore-exchanger, app.kubernetes.io/component: credential-authority}
  ports: [{name: https, port: 8443, targetPort: mtls}]
