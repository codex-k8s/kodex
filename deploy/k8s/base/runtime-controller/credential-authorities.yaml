          readinessProbe: {exec: {command: [/usr/local/bin/runtime-credential-broker, check-s3-archive]}, periodSeconds: 5, timeoutSeconds: 1, failureThreshold: 2}
          livenessProbe: {tcpSocket: {port: mtls}, periodSeconds: 10, timeoutSeconds: 1, failureThreshold: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: vault-token, mountPath: /var/run/secrets/tokens, readOnly: true}
            - {name: vault-ca, mountPath: /var/run/config/mattercodex/vault, readOnly: true}
            - {name: s3-ca, mountPath: /var/run/config/mattercodex/runtime-credential-broker/s3-ca, readOnly: true}
            - {name: server-tls, mountPath: /var/run/config/mattercodex/runtime-credential-authority, readOnly: true}
            - {name: ticket-trust, mountPath: /var/run/config/mattercodex/runtime-workload-ticket, readOnly: true}
            - {name: broker-config, mountPath: /var/run/secrets/mattercodex/runtime-credential-broker/s3, readOnly: true}
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {audience: https://kubernetes.default.svc, expirationSeconds: 600, path: token}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
        - {name: vault-token, projected: {defaultMode: 0440, sources: [{serviceAccountToken: {audience: vault, expirationSeconds: 600, path: vault}}]}}
        - {name: vault-ca, configMap: {name: internal-rpc-authority-vault-ca, items: [{key: ca.pem, path: ca.pem}], defaultMode: 0440}}
        - {name: s3-ca, configMap: {name: mattercodex-s3-ca, items: [{key: ca.pem, path: ca.pem}], defaultMode: 0440}}
        - {name: server-tls, secret: {secretName: runtime-s3-archive-exchanger-tls, defaultMode: 0440}}
        - {name: ticket-trust, csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: runtime-s3-archive-exchanger-ticket-trust}}}
        - {name: broker-config, csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: runtime-s3-archive-exchanger-config}}}
