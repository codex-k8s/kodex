apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-controller-runtime
data:
  RUNTIME_CONTROLLER_TECHNICAL_LISTEN: ":9090"
  RUNTIME_CONTROL_PLANE_TARGET: "control-plane.mattercodex-system.svc:8443"
  RUNTIME_CONTROL_PLANE_TLS_SERVER_NAME: "control-plane.mattercodex-system.svc.cluster.local"
  RUNTIME_ROLE_IMAGE_REPOSITORY: "mattercodex-image-registry.mattercodex-system.svc.cluster.local:5000/mattercodex/agent-runner"
  RUNTIME_RUNNER_CONTROL_PLANE_TARGET: "control-plane.mattercodex-system.svc:8443"
  RUNTIME_RUNNER_CONTROL_PLANE_TLS_SERVER_NAME: "control-plane.mattercodex-system.svc.cluster.local"
  RUNTIME_INTERACTION_GATEWAY_URL: "https://interaction-gateway.mattercodex-system.svc.cluster.local:8443"
  RUNTIME_SESSION_MCP_URL: "https://matter-codex-bot-service.mattercodex-system.svc.cluster.local:8443"
  RUNTIME_STORAGE_CLASS: "runtime-session"
  RUNTIME_PVC_SIZE: "20Gi"
  RUNTIME_READ_CLUSTER_ROLE: "runtime-role-project-read"
  RUNTIME_ADMIN_CLUSTER_ROLE: "cluster-admin"
  RUNTIME_ARCHIVE_SERVICE_ACCOUNT: "runtime-archive"
  RUNTIME_RESTORE_SERVICE_ACCOUNT: "runtime-restore-verifier"
  RUNTIME_CLEANUP_SERVICE_ACCOUNT: "runtime-cleanup-authorizer"
  RUNTIME_CREDENTIAL_BROKER_SERVICE_ACCOUNT: "runtime-credential-broker"
  RUNTIME_PROJECT_READ_BROKER_SERVICE_ACCOUNT: "runtime-project-read-broker"
  RUNTIME_CLUSTER_ADMIN_BROKER_SERVICE_ACCOUNT: "runtime-cluster-admin-broker"
  RUNTIME_S3_ARCHIVE_BROKER_SERVICE_ACCOUNT: "runtime-s3-archive-broker"
  RUNTIME_S3_RESTORE_BROKER_SERVICE_ACCOUNT: "runtime-s3-restore-broker"
  RUNTIME_MAXIMUM_PODS: "100"
  RUNTIME_MAXIMUM_ORGANIZATION_EXECUTIONS: "16"
  RUNTIME_MAXIMUM_CPU_MILLI: "100000"
  RUNTIME_MAXIMUM_MEMORY_BYTES: "429496729600"
  RUNTIME_S3_ENDPOINT: "https://runtime-archive-s3.mattercodex-system.svc:9000"
  RUNTIME_S3_TLS_SERVER_NAME: "runtime-archive-s3.mattercodex-system.svc.cluster.local"
  RUNTIME_S3_BUCKET: "mattercodex-runtime"
  RUNTIME_S3_REGION: "mattercodex-1"
  RUNTIME_NATS_URL: "tls://nats.mattercodex-system.svc:4222"
  RUNTIME_NATS_TLS_SERVER_NAME: "nats.mattercodex-system.svc.cluster.local"
  RUNTIME_NATS_STREAM: "CONTROL_PLANE"
  RUNTIME_NATS_DURABLE: "RUNTIME_CONTROLLER_V1"
  RUNTIME_NATS_REPLICAS: "3"
  RUNTIME_POSTGRES_TLS_SERVER_NAME: "runtime-controller-postgresql.mattercodex-system.svc.cluster.local"
  RUNTIME_POSTGRES_PRINCIPAL: "runtime_controller_runtime_g1"
  RUNTIME_STARTUP_TIMEOUT: "30s"
  RUNTIME_SHUTDOWN_TIMEOUT: "20s"
  RUNTIME_RECONCILE_INTERVAL: "5s"
  RUNTIME_CLAIM_INTERVAL: "1s"
  RUNTIME_EXPIRY_INTERVAL: "15s"
  RUNTIME_READINESS_INTERVAL: "10s"
  RUNTIME_WATCHDOG: "2m"
  RUNTIME_WARM_TTL: "4h"
  RUNTIME_JOB_TTL: "1h"
