apiVersion: v1
kind: ConfigMap
metadata: {name: runtime-controller-runtime}
data:
  RUNTIME_CONTROLLER_TECHNICAL_LISTEN: ":9090"
  RUNTIME_CONTROLLER_CONTROL_PLANE_TARGET: "dns:///control-plane.mattercodex-system.svc:8443"
  RUNTIME_CONTROLLER_CONTROL_PLANE_TLS_SERVER_NAME: control-plane.mattercodex-system.svc.cluster.local
  RUNTIME_CONTROLLER_CONTROL_PLANE_CA_FILE: /var/run/config/mattercodex/runtime-controller/control-plane/ca.pem
  RUNTIME_CONTROLLER_CONTROL_PLANE_CLIENT_CERTIFICATE_FILE: /var/run/secrets/mattercodex/runtime-controller/control-plane-client/tls.crt
  RUNTIME_CONTROLLER_CONTROL_PLANE_CLIENT_PRIVATE_KEY_FILE: /var/run/secrets/mattercodex/runtime-controller/control-plane-client/tls.key
  RUNTIME_CONTROLLER_CONTROL_PLANE_APPLICATION_GRANT_FILE: /var/run/secrets/mattercodex/runtime-controller/application-grant/application-grant.jws
  RUNTIME_CONTROLLER_PROVIDER_PROXY: http://egress-gateway.mattercodex-system.svc.cluster.local:8080
  RUNTIME_CONTROLLER_PROVIDER_CREDENTIAL_FILE: /var/run/secrets/mattercodex/runtime-controller/provider/api-key
  RUNTIME_CONTROLLER_POLL_INTERVAL: 500ms
  RUNTIME_CONTROLLER_HEARTBEAT_INTERVAL: 15s
  RUNTIME_CONTROLLER_LEASE_RENEW_INTERVAL: 10s
  RUNTIME_CONTROLLER_REQUEST_TIMEOUT: 5s
  RUNTIME_CONTROLLER_EXECUTION_TIMEOUT: 20m
  RUNTIME_CONTROLLER_SHUTDOWN_TIMEOUT: 30s
