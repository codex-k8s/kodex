apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: runtime-controller
  labels: {app.kubernetes.io/name: runtime-controller}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: runtime-controller}}
  endpoints:
    - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
