        resources: [secrets]
  validations:
    - expression: >-
        !(request.userInfo.username in
          ['system:serviceaccount:mattercodex-system:runtime-s3-archive-exchanger',
           'system:serviceaccount:mattercodex-system:runtime-s3-restore-exchanger']) ||
        (object.metadata.namespace == 'mattercodex-system' && object.immutable == true &&
         object.type == 'Opaque' && has(object.metadata.labels) && has(object.metadata.annotations) &&
         object.metadata.labels['runtime.mattercodex.dev/managed'] == 'true' &&
         object.metadata.labels['app.kubernetes.io/component'] == 'runtime-s3-credential' &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/workload-ticket-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/inline-policy-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/readback-sha256'].matches('^[a-f0-9]{64}$') &&
         size(object.data) == 3 && has(object.data['access-key-id']) &&
         has(object.data['secret-access-key']) && has(object.data['session-token']) &&
         ((request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-s3-archive-exchanger' &&
           object.metadata.annotations['runtime.mattercodex.dev/action'] == 'archive' &&
           object.metadata.name.matches('^runtime-s3-[a-f0-9]{20}-archive$')) ||
          (request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-s3-restore-exchanger' &&
           object.metadata.annotations['runtime.mattercodex.dev/action'] == 'restore' &&
           object.metadata.name.matches('^runtime-s3-[a-f0-9]{20}-restore$'))))
      message: runtime S3 exchanger may create only its exact immutable action credential
