    resources: [persistentvolumeclaims, configmaps, resourcequotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/status]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, delete]
  - apiGroups: [batch]
    resources: [jobs, jobs/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runtime-controller}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
