apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-controller}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-runner}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runtime-controller}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runtime-controller}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-controller}
