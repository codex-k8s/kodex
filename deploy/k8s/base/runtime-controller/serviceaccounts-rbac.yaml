apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-controller}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-controller-migration}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-role-cluster-admin
  labels: {runtime.mattercodex.dev/access-profile: cluster_admin}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-archive}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-restore-verifier}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-cleanup-authorizer}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runtime-controller}
rules:

  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/status, persistentvolumeclaims, configmaps, resourcequotas, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, jobs/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runtime-controller}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: runtime-controller-node-reader}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [runtime-role-project-read]
    verbs: [get, bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [runtime-role-cluster-admin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: runtime-controller-node-reader}
subjects:
  - {kind: ServiceAccount, name: runtime-controller, namespace: mattercodex-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: runtime-controller-node-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: runtime-role-cluster-admin}
subjects:
  - {kind: ServiceAccount, name: runtime-role-cluster-admin, namespace: mattercodex-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: runtime-role-project-read}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/log, services, endpoints, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch]
    resources: [deployments, daemonsets, statefulsets, replicasets, jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: runtime-controller-exact-pod-authority}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:mattercodex-system:runtime-controller' ||
        !has(object.metadata.labels) ||
        object.metadata.labels['app.kubernetes.io/component'] != 'role-runtime' ||
        (object.metadata.namespace == 'mattercodex-system' &&
         has(object.metadata.annotations) &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/revision-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/input-sha256'].matches('^[a-f0-9]{64}$') &&
         (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
         (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
         (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
         size(object.spec.containers) == 1 && object.spec.containers[0].args == ['runtime-session'] &&
         ((object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'none' &&
           object.spec.serviceAccountName.startsWith('runtime-access-')) ||
          (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'project_read_only' &&
           object.spec.serviceAccountName.startsWith('runtime-access-')) ||
          (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'cluster_admin' &&
           object.spec.serviceAccountName == 'runtime-role-cluster-admin')))
      message: runtime role Pod authority tuple is not admitted
    - expression: >-
        object.spec.serviceAccountName != 'runtime-role-cluster-admin' ||
        ((request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-controller' ||
          (request.operation == 'UPDATE' &&
           request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-role-cluster-admin' &&
           object.spec == oldObject.spec)) &&
         object.metadata.namespace == 'mattercodex-system' &&
         has(object.metadata.labels) &&
         object.metadata.labels['app.kubernetes.io/component'] == 'role-runtime' &&
         object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'cluster_admin' &&
         has(object.metadata.annotations) &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/revision-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/input-sha256'].matches('^[a-f0-9]{64}$') &&
         (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
         (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
         (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
         size(object.spec.containers) == 1 && object.spec.containers[0].args == ['runtime-session'])
      message: cluster-admin runtime identity is restricted to an exact role Pod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: runtime-controller-exact-pod-authority}
spec:
  policyName: runtime-controller-exact-pod-authority
  validationActions: [Deny]
