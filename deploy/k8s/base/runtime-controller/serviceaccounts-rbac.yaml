apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: runtime-materializer-exact-resource-authority}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts, configmaps]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [roles, rolebindings]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:mattercodex-system:runtime-workload-materializer' ||
        (has(object.metadata.labels) && object.metadata.labels['runtime.mattercodex.dev/managed'] == 'true' &&
         'runtime.mattercodex.dev/execution' in object.metadata.labels &&
         ((request.resource.resource == 'serviceaccounts' && object.metadata.namespace == 'mattercodex-system' &&
           object.automountServiceAccountToken == false &&
           ((object.metadata.labels['app.kubernetes.io/component'] == 'runtime-access' && object.metadata.name.startsWith('runtime-access-')) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-credential-copy' && object.metadata.name.startsWith('runtime-credential-copy-')))) ||
          (request.resource.resource == 'roles' && object.metadata.namespace == 'mattercodex-system' &&
           ((object.metadata.labels['app.kubernetes.io/component'] == 'runtime-handoff' &&
             object.metadata.name.startsWith('runtime-handoff-') && size(object.rules) == 3 &&
             object.rules[0].apiGroups == [''] && object.rules[0].resources == ['configmaps'] &&
             object.rules[0].verbs == ['get'] && size(object.rules[0].resourceNames) == 1 &&
             object.rules[1].apiGroups == [''] && object.rules[1].resources == ['configmaps'] &&
             object.rules[1].verbs == ['get','update'] && size(object.rules[1].resourceNames) == 1 &&
             object.rules[2].apiGroups == [''] && object.rules[2].resources == ['secrets'] &&
             object.rules[2].verbs == ['get'] && size(object.rules[2].resourceNames) > 0) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-credential-copy' &&
             object.metadata.name.startsWith('runtime-credential-copy-') && size(object.rules) == 4 &&
             object.rules.all(r, r.apiGroups == [''] && size(r.resources) == 1 &&
               r.resources[0] in ['secrets','configmaps'] &&
               ((r.verbs == ['get'] && size(r.resourceNames) == 2) ||
                (r.verbs == ['create'] && !has(r.resourceNames))))))) ||
          (request.resource.resource == 'rolebindings' &&
           size(object.subjects) == 1 && object.subjects[0].kind == 'ServiceAccount' &&
           object.subjects[0].namespace == 'mattercodex-system' &&
           ((object.metadata.namespace == 'mattercodex-system' &&
             object.metadata.labels['app.kubernetes.io/component'] == 'runtime-handoff' &&
             object.metadata.name.startsWith('runtime-handoff-') &&
             object.subjects[0].name.startsWith('runtime-access-') &&
             object.roleRef.kind == 'Role' && object.roleRef.name == object.metadata.name) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-credential-copy' &&
             object.subjects[0].name == object.metadata.name &&
             object.roleRef.kind == 'Role' && object.roleRef.name == object.metadata.name))) ||
          (request.resource.resource == 'configmaps' && object.metadata.namespace == 'mattercodex-system' &&
           object.immutable == true &&
           (object.metadata.name.startsWith('runtime-authority-receipt-') ||
            object.metadata.name.startsWith('runtime-ticket-trust-')))))
      message: runtime materializer may create only exact execution-scoped resources
