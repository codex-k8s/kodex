---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: runtime-role-project-read}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/log, services, endpoints, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch]
    resources: [deployments, daemonsets, statefulsets, replicasets, jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: runtime-controller-exact-pod-authority}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        !(request.userInfo.username in ['system:serviceaccount:mattercodex-system:runtime-credential-broker',
          'system:serviceaccount:mattercodex-system:runtime-project-read-broker',
          'system:serviceaccount:mattercodex-system:runtime-cluster-admin-broker']) ||
        (request.operation == 'CREATE' && has(object.metadata.labels) &&
         object.metadata.labels['app.kubernetes.io/component'] == 'role-runtime')
      message: runtime credential broker may create only an exact role Pod
    - expression: >-
        !has(object.metadata.labels) ||
        object.metadata.labels['app.kubernetes.io/component'] != 'role-runtime' ||
        (((request.operation == 'CREATE' &&
            request.userInfo.username in ['system:serviceaccount:mattercodex-system:runtime-credential-broker',
              'system:serviceaccount:mattercodex-system:runtime-project-read-broker',
              'system:serviceaccount:mattercodex-system:runtime-cluster-admin-broker']) ||
           (request.operation == 'UPDATE' && object.spec == oldObject.spec &&
            (request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-controller' ||
             request.userInfo.username.startsWith('system:serviceaccount:mattercodex-system:runtime-access-') ||
             request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-role-cluster-admin'))) &&
         object.metadata.namespace == 'mattercodex-system' &&
         has(object.metadata.annotations) &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/revision-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/input-sha256'].matches('^[a-f0-9]{64}$') &&
         (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
         (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
         (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
         size(object.spec.containers) == 1 && object.spec.containers[0].args == ['runtime-session'] &&
         ((object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'none' &&
           object.spec.serviceAccountName.startsWith('runtime-access-')) ||
          (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'project_read_only' &&
           object.spec.serviceAccountName.startsWith('runtime-access-')) ||
          (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'cluster_admin' &&
           object.spec.serviceAccountName == 'runtime-role-cluster-admin')))
      message: runtime role Pod authority tuple is not admitted
    - expression: >-
        !has(object.metadata.labels) ||
        object.metadata.labels['app.kubernetes.io/component'] != 'role-runtime' ||
        (object.metadata.annotations['runtime.mattercodex.dev/workload-ticket-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/workload-ticket'].matches('^[A-Za-z0-9_-]{20,}[.][A-Za-z0-9_-]{86}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/credential-snapshot-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/effective-runtime-sha256'].matches('^[a-f0-9]{64}$') &&
         object.spec.automountServiceAccountToken == false &&
         object.spec.restartPolicy == 'Never' &&
         object.spec.enableServiceLinks == false &&
         size(object.spec.initContainers) == 1 &&
         object.spec.initContainers[0].args == ['runtime-init-workspace'] &&
         object.spec.initContainers[0].image == object.spec.containers[0].image &&
         object.spec.containers[0].image.matches('^mattercodex-image-registry\\.mattercodex-system\\.svc\\.cluster\\.local:5000/mattercodex/agent-runtime@sha256:[a-f0-9]{64}$') &&
         size(object.spec.containers[0].env) == 4 &&
         object.spec.containers[0].env[0].name == 'MATTERCODEX_RUNTIME_REVISION_FILE' &&
         object.spec.containers[0].env[0].value == '/var/run/config/mattercodex/runtime/runtime.json' &&
         object.spec.containers[0].securityContext.allowPrivilegeEscalation == false &&
         object.spec.containers[0].securityContext.readOnlyRootFilesystem == true &&
         object.spec.containers[0].securityContext.runAsNonRoot == true &&
         object.spec.containers[0].securityContext.capabilities.drop == ['ALL'] &&
         !object.spec.volumes.exists(v, has(v.hostPath)) &&
         !object.spec.volumes.exists(v, has(v.nfs)) &&
         object.spec.volumes.exists(v, v.name == 'runtime-config' && has(v.configMap)) &&
         object.spec.volumes.exists(v, v.name == 'session' && has(v.persistentVolumeClaim)) &&
         object.spec.volumes.exists(v, v.name == 'kube-api-access' && has(v.projected) &&
           v.projected.sources.exists(s, has(s.serviceAccountToken) &&
             s.serviceAccountToken.audience == 'https://kubernetes.default.svc' &&
             s.serviceAccountToken.expirationSeconds <= 600)))
      message: runtime role Pod spec is outside the exact ticketed profile
    - expression: >-
        object.spec.serviceAccountName != 'runtime-role-cluster-admin' ||
        (((request.operation == 'CREATE' &&
           request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-cluster-admin-broker') ||
          (request.operation == 'UPDATE' &&
           request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-controller' &&
           object.spec == oldObject.spec) ||
          (request.operation == 'UPDATE' &&
           request.userInfo.username == 'system:serviceaccount:mattercodex-system:runtime-role-cluster-admin' &&
           object.spec == oldObject.spec)) &&
         object.metadata.namespace == 'mattercodex-system' &&
         has(object.metadata.labels) &&
         object.metadata.labels['app.kubernetes.io/component'] == 'role-runtime' &&
         object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'cluster_admin' &&
         has(object.metadata.annotations) &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/revision-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/input-sha256'].matches('^[a-f0-9]{64}$') &&
         (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
         (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
         (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
         size(object.spec.containers) == 1 && object.spec.containers[0].args == ['runtime-session'])
      message: cluster-admin runtime identity is restricted to an exact role Pod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: runtime-controller-exact-pod-authority}
spec:
  policyName: runtime-controller-exact-pod-authority
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: runtime-controller-exact-worker-job-authority}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:mattercodex-system:runtime-controller' ||
        (object.metadata.namespace == 'mattercodex-system' &&
         has(object.metadata.labels) &&
         object.metadata.labels['runtime.mattercodex.dev/managed'] == 'true' &&
         object.metadata.labels['app.kubernetes.io/component'] in
           ['runtime-archive','runtime-restore-verifier','runtime-rehydrate','runtime-cleanup-authorizer','runtime-credential-broker'] &&
         object.metadata.annotations['runtime.mattercodex.dev/execution-id'].matches('^[0-9a-f-]{36}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/workload-ticket-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/workload-ticket'].matches('^[A-Za-z0-9_-]{20,}[.][A-Za-z0-9_-]{86}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/revision-sha256'].matches('^[a-f0-9]{64}$') &&
         object.metadata.annotations['runtime.mattercodex.dev/input-sha256'].matches('^[a-f0-9]{64}$') &&
         object.spec.template.spec.automountServiceAccountToken == false &&
         object.spec.template.spec.restartPolicy == 'OnFailure' &&
         object.spec.template.spec.enableServiceLinks == false &&
         size(object.spec.template.spec.containers) == 1 &&
         object.spec.template.spec.containers[0].image.matches('^mattercodex-image-registry\\.mattercodex-system\\.svc\\.cluster\\.local:5000/mattercodex/runtime-controller@sha256:[a-f0-9]{64}$') &&
         ((object.metadata.labels['app.kubernetes.io/component'] == 'runtime-credential-broker' &&
           object.spec.template.spec.serviceAccountName in
             ['runtime-credential-broker','runtime-project-read-broker','runtime-cluster-admin-broker','runtime-s3-archive-broker','runtime-s3-restore-broker'] &&
           size(object.spec.template.spec.initContainers) == 0 &&
           object.spec.template.spec.containers[0].command == ['/usr/local/bin/runtime-credential-broker'] &&
           object.spec.template.spec.containers[0].args in [['snapshot'],['s3-archive'],['s3-restore']] &&
           ((object.spec.template.spec.containers[0].args == ['snapshot'] &&
             ((object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'none' &&
               object.spec.template.spec.serviceAccountName == 'runtime-credential-broker') ||
              (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'project_read_only' &&
               object.spec.template.spec.serviceAccountName == 'runtime-project-read-broker') ||
              (object.metadata.labels['runtime.mattercodex.dev/access-profile'] == 'cluster_admin' &&
               object.spec.template.spec.serviceAccountName == 'runtime-cluster-admin-broker'))) ||
            (object.spec.template.spec.containers[0].args == ['s3-archive'] && object.spec.template.spec.serviceAccountName == 'runtime-s3-archive-broker') ||
            (object.spec.template.spec.containers[0].args == ['s3-restore'] && object.spec.template.spec.serviceAccountName == 'runtime-s3-restore-broker')) &&
           object.spec.template.spec.volumes.exists(v, v.name == 'workload-ticket-key' && has(v.csi) &&
             v.csi.driver == 'secrets-store.csi.k8s.io' && v.csi.readOnly == true &&
             ((object.spec.template.spec.containers[0].args == ['snapshot'] &&
               v.csi.volumeAttributes['secretProviderClass'] == 'runtime-credential-broker-workload-ticket-trust') ||
              (object.spec.template.spec.containers[0].args == ['s3-archive'] &&
               v.csi.volumeAttributes['secretProviderClass'] == 'runtime-s3-archive-workload-ticket-trust') ||
              (object.spec.template.spec.containers[0].args == ['s3-restore'] &&
               v.csi.volumeAttributes['secretProviderClass'] == 'runtime-s3-restore-workload-ticket-trust'))) &&
           ((object.spec.template.spec.containers[0].args == ['snapshot']) ||
            (object.spec.template.spec.volumes.exists(v, v.name == 'vault-token' && has(v.projected) &&
               v.projected.sources.exists(s, has(s.serviceAccountToken) &&
                 s.serviceAccountToken.audience == 'vault' && s.serviceAccountToken.expirationSeconds <= 600)) &&
             object.spec.template.spec.volumes.exists(v, v.name == 's3-broker-config' && has(v.csi) &&
               v.csi.driver == 'secrets-store.csi.k8s.io' && v.csi.readOnly == true &&
               v.csi.volumeAttributes['secretProviderClass'] in ['runtime-s3-archive-broker-config','runtime-s3-restore-broker-config']))) &&
           object.spec.template.spec.volumes.exists(v, v.name == 'runtime-config' && has(v.configMap) &&
             v.configMap.name == object.metadata.annotations['runtime.mattercodex.dev/runtime-config-name'])) ||
          (object.metadata.labels['app.kubernetes.io/component'] != 'runtime-credential-broker' &&
           size(object.spec.template.spec.initContainers) == 2 &&
           object.spec.template.spec.initContainers.all(c,
             c.image.matches('^ghcr\\.io/codex-k8s/matter-codex/internal-rpc-authority@sha256:[a-f0-9]{64}$')) &&
           ((object.metadata.labels['app.kubernetes.io/component'] == 'runtime-archive' &&
             object.spec.template.spec.serviceAccountName == 'runtime-archive' &&
             object.spec.template.spec.containers[0].command == ['/usr/local/bin/runtime-archive']) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-restore-verifier' &&
             object.spec.template.spec.serviceAccountName == 'runtime-restore-verifier' &&
             object.spec.template.spec.containers[0].command == ['/usr/local/bin/runtime-restore-verifier']) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-rehydrate' &&
             object.spec.template.spec.serviceAccountName == 'runtime-restore-verifier' &&
             object.spec.template.spec.containers[0].command == ['/usr/local/bin/runtime-rehydrate']) ||
            (object.metadata.labels['app.kubernetes.io/component'] == 'runtime-cleanup-authorizer' &&
             object.spec.template.spec.serviceAccountName == 'runtime-cleanup-authorizer' &&
             object.spec.template.spec.containers[0].command == ['/usr/local/bin/runtime-cleanup-authorizer'])) &&
           (!has(object.spec.template.spec.containers[0].envFrom) ||
             size(object.spec.template.spec.containers[0].envFrom) == 0) &&
           object.spec.template.spec.containers[0].env.all(e,
             !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)) &&
           object.spec.template.spec.volumes.all(v,
             !has(v.secret) ||
             (v.name == 'control-plane-tls' &&
              v.secret.secretName == 'internal-rpc-authority-' + object.metadata.labels['app.kubernetes.io/component'] + '-workload-tls') ||
             (v.name == 's3-credential' &&
              v.secret.secretName.startsWith('runtime-s3-') &&
              ((object.metadata.labels['app.kubernetes.io/component'] == 'runtime-archive' && v.secret.secretName.endsWith('-archive')) ||
               (object.metadata.labels['app.kubernetes.io/component'] in ['runtime-restore-verifier','runtime-rehydrate'] &&
                v.secret.secretName.endsWith('-restore')))))) &&
         !object.spec.template.spec.volumes.exists(v, has(v.hostPath)) &&
         !object.spec.template.spec.volumes.exists(v, has(v.nfs)))
      message: runtime worker Job spec is outside the exact ticketed profile
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: runtime-controller-exact-worker-job-authority}
spec:
  policyName: runtime-controller-exact-worker-job-authority
  validationActions: [Deny]
