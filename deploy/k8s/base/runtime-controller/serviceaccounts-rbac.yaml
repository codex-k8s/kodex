apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-controller}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-controller-migration}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-role-none}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-restore-verifier}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: runtime-cleanup-authorizer}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runtime-controller}
rules:

  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/status, persistentvolumeclaims, configmaps, secrets, resourcequotas, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, jobs/status]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runtime-controller}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runtime-worker-journal}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runtime-worker-journal}
subjects:
  - {kind: ServiceAccount, name: runtime-restore-verifier}
  - {kind: ServiceAccount, name: runtime-cleanup-authorizer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-worker-journal}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: runtime-controller-node-reader}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, clusterrolebindings]
    verbs: [get, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [runtime-role-project-read, cluster-admin]
    verbs: [get, bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: runtime-controller-node-reader}
subjects:
  - {kind: ServiceAccount, name: runtime-controller, namespace: mattercodex-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: runtime-controller-node-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: runtime-role-project-read}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/log, services, endpoints, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch]
    resources: [deployments, daemonsets, statefulsets, replicasets, jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
