apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-controller-dashboard
  labels: {grafana_dashboard: "1"}
data:
  runtime-controller.json: |
    {
      "title": "MatterCodex runtime-controller",
      "uid": "mattercodex-runtime-controller",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {"type":"stat","title":"Readiness","targets":[{"expr":"max(mattercodex_runtime_controller_readiness{ready=\"true\"})"}],"gridPos":{"x":0,"y":0,"w":6,"h":4}},
        {"type":"timeseries","title":"Lifecycle operations","targets":[{"expr":"sum by (operation,outcome) (rate(mattercodex_runtime_controller_operations_total[5m]))"}],"gridPos":{"x":6,"y":0,"w":18,"h":8}},
        {"type":"timeseries","title":"Capacity state","targets":[{"expr":"mattercodex_runtime_controller_capacity_state"}],"gridPos":{"x":0,"y":8,"w":12,"h":8}},
        {"type":"timeseries","title":"Go runtime","targets":[{"expr":"rate(go_gc_duration_seconds_count{job=\"runtime-controller\"}[5m])"}],"gridPos":{"x":12,"y":8,"w":12,"h":8}}
      ]
    }
