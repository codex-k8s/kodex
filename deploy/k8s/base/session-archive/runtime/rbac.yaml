apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-archive-controller
  namespace: kodex-runtime
rules:
  - apiGroups: [""]
    resources: [pods]
    # Только controller: positive UID/RV join и освобождение завершённых helper Pods.
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    # PATCH используется только для CAS suspend положительно созданной physical attempt.
    verbs: [get, list, create, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-archive-controller
  namespace: kodex-runtime
subjects:
  - kind: ServiceAccount
    name: session-archive
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-archive-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-archive-worker
  namespace: kodex-runtime
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-archive-worker
  namespace: kodex-runtime
subjects:
  - kind: ServiceAccount
    name: session-archive-worker
    namespace: kodex-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-archive-worker
