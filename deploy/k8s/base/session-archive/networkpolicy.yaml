apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: session-archive-default-deny }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: session-archive } }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: session-archive-exact-paths }
spec:
  podSelector:
    {
      matchLabels:
        {
          app.kubernetes.io/name: session-archive,
          app.kubernetes.io/component: archive-controller,
        },
    }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ protocol: TCP, port: 9090 }, { protocol: TCP, port: 9091 }]
  egress:
    - to:
        - podSelector:
            { matchLabels: { app.kubernetes.io/name: control-plane } }
      ports: [{ protocol: TCP, port: 8443 }]
    - to:
        - ipBlock: { cidr: __KODEX_KUBERNETES_API_SERVICE_CIDR__ }
      ports: [{ protocol: TCP, port: 443 }]
