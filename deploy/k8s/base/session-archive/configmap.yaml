apiVersion: v1
kind: ConfigMap
metadata:
  name: session-archive-runtime
data:
  SESSION_ARCHIVE_TECHNICAL_LISTEN: ":9090"
  SESSION_ARCHIVE_NAMESPACE: "kodex-system"
  SESSION_ARCHIVE_CONTROL_PLANE_TARGET: "control-plane.kodex-system.svc:8443"
  SESSION_ARCHIVE_CONTROL_PLANE_TLS_SERVER_NAME: "control-plane.kodex-system.svc.cluster.local"
  SESSION_ARCHIVE_STARTUP_TIMEOUT: "45s"
  SESSION_ARCHIVE_SHUTDOWN_TIMEOUT: "30s"
  SESSION_ARCHIVE_RPC_DEADLINE: "5s"
  SESSION_ARCHIVE_POLL_INTERVAL: "1s"
  SESSION_ARCHIVE_READINESS_INTERVAL: "10s"
  SESSION_ARCHIVE_WORKER_TIMEOUT: "8m"
  SESSION_ARCHIVE_WORKER_SERVICE_ACCOUNT: "session-archive-worker"
  # Должны совпадать с runtime-controller для одного канонического session PVC.
  SESSION_ARCHIVE_STORAGE_CLASS: ""
  SESSION_ARCHIVE_SESSION_PVC_SIZE: "20Gi"
  SESSION_ARCHIVE_OBJECT_STORAGE_SECRET: "kodex-external-s3"
  SESSION_ARCHIVE_OBJECT_STORAGE_REGION: "us-east-1"
  SESSION_ARCHIVE_OBJECT_STORAGE_BUCKET: "kodex-session-archives"
  SESSION_ARCHIVE_OBJECT_STORAGE_ALLOW_INSECURE_LOCAL: "false"
