# Ролевые selector и metrics ingress; общий egress сохраняет явные namespace назначения.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-broker-internal-rpc-authority-exact-paths
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: secret-broker, kodex.dev/internal-rpc-authority-issuer: enabled}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - {protocol: TCP, port: 9091}
    - {protocol: TCP, port: 9092}
