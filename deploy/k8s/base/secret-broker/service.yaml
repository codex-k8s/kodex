apiVersion: v1
kind: Service
metadata:
  name: secret-broker
  labels:
    app.kubernetes.io/name: secret-broker
    app.kubernetes.io/component: secret-broker
spec:
  selector:
    app.kubernetes.io/name: secret-broker
    app.kubernetes.io/component: secret-broker
  ports:
    - name: grpc
      port: 8443
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: auth-metrics
      port: 9091
      targetPort: auth-metrics
      protocol: TCP
