apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: interaction-gateway-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: interaction-gateway
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: interaction-gateway-exact-runtime-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: interaction-gateway
      app.kubernetes.io/component: interaction-adapter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9091}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mattercodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - {protocol: TCP, port: 8443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mattercodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-gateway
              app.kubernetes.io/component: platform-egress
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4317}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentry-relay
      ports:
        - {protocol: TCP, port: 8443}
