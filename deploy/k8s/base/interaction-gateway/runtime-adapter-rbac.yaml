apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interaction-gateway-bot-credential-runtime
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [interaction-gateway-bot-credentials]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interaction-gateway-bot-credential-runtime
subjects:
  - kind: ServiceAccount
    name: interaction-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: interaction-gateway-bot-credential-runtime
