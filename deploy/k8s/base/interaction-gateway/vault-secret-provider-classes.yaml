apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: interaction-gateway-runtime
spec:
  provider: vault
  parameters:
    roleName: interaction-gateway
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "postgres-dsn"
        secretPath: "database/static-creds/interaction-gateway-runtime-g1"
        secretKey: "dsn"
        filePermission: 288
      - objectName: "slash-token"
        secretPath: "kv/data/mattercodex/interaction-gateway/mattermost"
        secretKey: "slash-token"
        filePermission: 288
      - objectName: "bot-primary-token"
        secretPath: "kv/data/mattercodex/interaction-gateway/mattermost"
        secretKey: "bot-primary-token"
        filePermission: 288
      - objectName: "delivery-key"
        secretPath: "kv/data/mattercodex/interaction-gateway/delivery"
        secretKey: "key"
        filePermission: 288
      - objectName: "callback-key"
        secretPath: "kv/data/mattercodex/interaction-gateway/callback"
        secretKey: "key"
        filePermission: 288
      - objectName: "mattermost-event.private.jwk"
        secretPath: "kv/data/mattercodex/interaction-gateway/mattermost-event"
        secretKey: "private-jwk"
        filePermission: 288
      - objectName: "provider-readback.private.jwk"
        secretPath: "kv/data/mattercodex/interaction-gateway/provider-readback"
        secretKey: "private-jwk"
        filePermission: 288
      - objectName: "delivery-readback.public-keyset.json"
        secretPath: "kv/data/mattercodex/control-plane/interaction-delivery-readback"
        secretKey: "public-keyset"
        filePermission: 288
      - objectName: "s3-access-key"
        secretPath: "kv/data/mattercodex/interaction-gateway/object-store"
        secretKey: "access-key"
        filePermission: 288
      - objectName: "s3-secret-key"
        secretPath: "kv/data/mattercodex/interaction-gateway/object-store"
        secretKey: "secret-key"
        filePermission: 288
---
