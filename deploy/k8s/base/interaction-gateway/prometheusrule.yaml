apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: interaction-gateway
  labels:
    app.kubernetes.io/name: interaction-gateway
spec:
  groups:
    - name: interaction-gateway
      rules:
        - alert: InteractionGatewayLocalAuthorityUnavailable
          expr: kodex_interaction_gateway_readiness{ready="false"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Interaction gateway local authority path is unavailable
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/interaction-gateway.md
