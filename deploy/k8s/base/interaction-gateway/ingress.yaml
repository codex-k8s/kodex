apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interaction-gateway-artifacts
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: interaction-gateway.mattercodex-system.svc.cluster.local
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [interaction-artifacts.mattercodex.dev]
      secretName: interaction-gateway-artifacts-tls
  rules:
    - host: interaction-artifacts.mattercodex.dev
      http:
        paths:
          - path: /mattermost/v1/artifacts/
            pathType: Prefix
            backend:
              service: {name: interaction-gateway, port: {name: https}}
