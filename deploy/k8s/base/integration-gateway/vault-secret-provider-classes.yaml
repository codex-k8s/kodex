apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: integration-gateway-postgres-runtime
spec:
  provider: vault
  parameters:
    roleName: integration-gateway
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "dsn"
        secretPath: "database/static-creds/integration-gateway-runtime-g1"
        secretKey: "dsn"
        filePermission: 288
---
