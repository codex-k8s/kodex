apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: integration-gateway
  labels:
    app.kubernetes.io/name: integration-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: integration-gateway
      app.kubernetes.io/component: integration-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
    - port: auth-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
