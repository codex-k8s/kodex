apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: integration-gateway-provider-credential-runtime
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [integration-gateway-provider-credentials]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: integration-gateway-provider-credential-runtime
subjects:
  - kind: ServiceAccount
    name: integration-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: integration-gateway-provider-credential-runtime
