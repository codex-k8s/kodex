apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattercodex-system
resources:
  - ../vault-ca-delivery
  - ../image-supply-chain
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - migration-job.yaml
  - postgresql.yaml
  - egress-proxy.yaml
  - management-egress-proxy.yaml
  - networkpolicy.yaml
  - vault-secret-provider-classes.yaml
  - vault-resources.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - dashboard.yaml
transformers:
  - bundle-cluster-scope-transformer.yaml
configMapGenerator:
  - name: integration-gateway-runtime
    literals:
      - INTEGRATION_GATEWAY_POSTGRES_PRINCIPAL_NAME=integration_gateway_runtime_g1
      - INTEGRATION_GATEWAY_POSTGRES_PRINCIPAL_GENERATION=1
      - INTEGRATION_GATEWAY_POSTGRES_CONTEXT_KEY_ID=integration-gateway-db-context-g1
  - name: integration-gateway-db-principals
    literals:
      - INTEGRATION_GATEWAY_POSTGRES_CONTEXT_KEY_ID=integration-gateway-db-context-g1
      - INTEGRATION_GATEWAY_POSTGRES_CURRENT_GENERATION=1
      - INTEGRATION_GATEWAY_POSTGRES_CURRENT_NOT_BEFORE=2026-08-03T00:00:00Z
      - INTEGRATION_GATEWAY_POSTGRES_CURRENT_NOT_AFTER=2026-11-03T00:00:00Z
      - INTEGRATION_GATEWAY_POSTGRES_NEXT_GENERATION=2
      - INTEGRATION_GATEWAY_POSTGRES_NEXT_NOT_BEFORE=2026-10-20T00:00:00Z
      - INTEGRATION_GATEWAY_POSTGRES_NEXT_NOT_AFTER=2027-02-03T00:00:00Z
  - name: integration-gateway-definitions
    files:
      - health.yaml=definitions/health.yaml
  - name: integration-gateway-provider-catalog
    files:
      - catalog.json=provider-catalog/catalog.json
  - name: integration-gateway-git-sources
    files:
      - catalog.json=git-sources/catalog.json
      - integration-observer-role.json=git-sources/integration-observer-role.json
generatorOptions:
  disableNameSuffixHash: true
