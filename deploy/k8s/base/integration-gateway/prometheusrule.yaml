apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: integration-gateway
  labels:
    app.kubernetes.io/name: integration-gateway
spec:
  groups:
    - name: integration-gateway
      rules:
        - alert: IntegrationGatewayCycleFailures
          expr: increase(kodex_integration_gateway_cycles_total{outcome="error"}[10m]) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Integration gateway reconciliation is failing
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/integration-gateway.md
        - alert: IntegrationGatewayClaimBacklog
          expr: kodex_integration_gateway_tracked_claims > 200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Integration gateway transient claim tracking is near its bound
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/integration-gateway.md
        - alert: IntegrationGatewayProtectedPathUnavailable
          expr: kodex_integration_gateway_readiness{ready="false"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Integration gateway protected control-plane path is unavailable
            runbook_url: https://github.com/codex-k8s/kodex/blob/main/docs/runbooks/integration-gateway.md
