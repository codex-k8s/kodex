apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-gateway-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: integration-gateway
data:
  integration-gateway.json: |
    {"uid":"mattercodex-integration-gateway","title":"MatterCodex integration-gateway","schemaVersion":39,"panels":[{"type":"timeseries","title":"Reconciliation cycles","targets":[{"expr":"sum by (outcome) (rate(mattercodex_integration_gateway_cycles_total[5m]))"}]},{"type":"timeseries","title":"Occurrence operations","targets":[{"expr":"sum by (operation, outcome) (rate(mattercodex_integration_gateway_occurrences_total[5m]))"}]},{"type":"stat","title":"Transient claims","targets":[{"expr":"sum(mattercodex_integration_gateway_tracked_claims)"}]}]}
