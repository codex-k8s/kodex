apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-gateway-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: integration-gateway
data:
  integration-gateway.json: |
    {"uid":"kodex-integration-gateway","title":"Kodex integration-gateway","schemaVersion":39,"panels":[{"type":"timeseries","title":"Циклы обработки","targets":[{"expr":"sum by (outcome) (rate(kodex_integration_gateway_cycles_total[5m]))"}]},{"type":"timeseries","title":"Результаты адаптеров","targets":[{"expr":"sum by (operation, outcome) (rate(kodex_integration_gateway_operations_total[5m]))"}]},{"type":"stat","title":"Готовность","targets":[{"expr":"kodex_integration_gateway_readiness{ready=\"true\"}"}]},{"type":"timeseries","title":"Память процесса","targets":[{"expr":"process_resident_memory_bytes{job=\"integration-gateway\"}"}]}]}
