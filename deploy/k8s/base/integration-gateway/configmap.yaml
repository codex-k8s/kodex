apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-gateway-runtime
data:
  INTEGRATION_GATEWAY_TECHNICAL_LISTEN: ":9090"
  INTEGRATION_GATEWAY_CONTROL_PLANE_TARGET: control-plane.kodex-system.svc:8443
  INTEGRATION_GATEWAY_CONTROL_PLANE_TLS_SERVER_NAME: control-plane.kodex-system.svc.cluster.local
  INTEGRATION_GATEWAY_EGRESS_PROXY_URL: http://egress-gateway.kodex-system.svc.cluster.local:8080
  INTEGRATION_GATEWAY_SYNTHETIC_BASE_URL: http://integration-synthetic.kodex-system.svc.cluster.local:8080
  INTEGRATION_GATEWAY_STARTUP_TIMEOUT: 30s
  INTEGRATION_GATEWAY_SHUTDOWN_TIMEOUT: 20s
  INTEGRATION_GATEWAY_REQUEST_TIMEOUT: 3s
  INTEGRATION_GATEWAY_OPERATION_TIMEOUT: 45s
  INTEGRATION_GATEWAY_POLL_INTERVAL: 500ms
  INTEGRATION_GATEWAY_READINESS_INTERVAL: 10s
  INTEGRATION_GATEWAY_CLAIM_LIMIT: "8"
