apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-migrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority
      app.kubernetes.io/component: migrator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-postgresql
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-rpc-authority-postgresql-from-migrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-rpc-authority-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority
              app.kubernetes.io/component: migrator
      ports:
        - port: 5432
          protocol: TCP
