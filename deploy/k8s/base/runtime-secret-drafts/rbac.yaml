apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-broker-encrypted-drafts
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [secret-broker-draft-key-guard]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-broker-encrypted-drafts
subjects:
  - kind: ServiceAccount
    name: secret-broker
    namespace: kodex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-broker-encrypted-drafts
