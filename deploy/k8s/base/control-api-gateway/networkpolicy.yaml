apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-api-gateway-deny-all}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: control-api-gateway}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-api-gateway-exact-runtime-paths}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-api-gateway
      app.kubernetes.io/component: external-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: staff-control-center
              app.kubernetes.io/component: staff-frontend
      ports: [{protocol: TCP, port: 8443}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 9091}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: control-plane}}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: kodex-nats}}
      ports: [{protocol: TCP, port: 4222}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: vault}}
      ports: [{protocol: TCP, port: 8200}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: __KODEX_OIDC_NAMESPACE__}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: __KODEX_OIDC_POD_NAME__
              app.kubernetes.io/component: __KODEX_OIDC_POD_COMPONENT__
      ports: [{protocol: TCP, port: __KODEX_OIDC_TARGET_PORT__}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-collector}}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: sentry-relay}}
      ports: [{protocol: TCP, port: 8443}]
