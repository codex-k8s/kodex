apiVersion: apps/v1
kind: Deployment
metadata: {name: control-api-gateway}
spec:
  template:
    spec:
      containers:
        - name: control-api-gateway
          startupProbe:
            $patch: replace
            httpGet: {path: /readyz, port: metrics}
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            $patch: replace
            httpGet: {path: /readyz, port: metrics}
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 2
