apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: control-api-gateway
  labels: {app.kubernetes.io/name: control-api-gateway}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: control-api-gateway}}
  namespaceSelector: {matchNames: [kodex-system]}
  endpoints:
    - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 5s}
