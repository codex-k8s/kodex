apiVersion: v1
kind: ConfigMap
metadata:
  name: control-api-gateway-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: control-api-gateway
data:
  control-api-gateway.json: |
    {"title":"MatterCodex Control API Gateway","uid":"mattercodex-control-api-gateway","schemaVersion":39,"version":2,"panels":[{"type":"timeseries","title":"Owner API HTTP requests","targets":[{"expr":"sum by (route,status) (rate(mattercodex_control_api_gateway_http_requests_total[5m]))"}]},{"type":"timeseries","title":"Owner API unexpected failures","targets":[{"expr":"sum by (route) (rate(mattercodex_control_api_gateway_http_requests_total{status=\"500\"}[5m]))"}]},{"type":"timeseries","title":"WebSocket snapshots","targets":[{"expr":"sum by (channel,outcome) (rate(mattercodex_control_api_gateway_websocket_snapshots_total[5m]))"}]},{"type":"stat","title":"Protected readiness","targets":[{"expr":"sum(mattercodex_control_api_gateway_readiness{ready=\"true\"})"}]}]}
