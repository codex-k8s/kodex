apiVersion: v1
kind: ConfigMap
metadata:
  name: control-api-gateway-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: control-api-gateway
data:
  control-api-gateway.json: |
    {"title":"Kodex Control API Gateway","uid":"kodex-control-api-gateway","schemaVersion":39,"version":3,"panels":[{"type":"timeseries","title":"Owner API HTTP requests","targets":[{"expr":"sum by (route,status) (rate(kodex_control_api_gateway_http_requests_total[5m]))"}]},{"type":"timeseries","title":"Neighbor dependency failures","targets":[{"expr":"sum by (route,status) (rate(kodex_control_api_gateway_http_requests_total{status=~\"502|503|504\"}[5m]))"}]},{"type":"timeseries","title":"Owner API unexpected failures","targets":[{"expr":"sum by (route) (rate(kodex_control_api_gateway_http_requests_total{status=\"500\"}[5m]))"}]},{"type":"timeseries","title":"WebSocket snapshots","targets":[{"expr":"sum by (channel,outcome) (rate(kodex_control_api_gateway_websocket_snapshots_total[5m]))"}]},{"type":"stat","title":"Local readiness","targets":[{"expr":"sum(kodex_control_api_gateway_readiness{ready=\"true\"})"}]}]}
