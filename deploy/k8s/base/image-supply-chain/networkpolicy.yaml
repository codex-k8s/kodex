apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-supply-chain-deny-all
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - image-registry
          - image-builder
          - image-build-client
          - image-retention
          - image-pull-readback
          - image-admission
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-registry-pull
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      mattercodex.dev/registry-scope: pull
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 5000
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-registry-push
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      mattercodex.dev/registry-scope: push
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-buildkit
        - podSelector:
            matchLabels:
              mattercodex.dev/image-build-client: "true"
        - podSelector:
            matchLabels:
              mattercodex.dev/image-admission: "true"
      ports:
        - protocol: TCP
          port: 5001
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-registry-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      mattercodex.dev/registry-scope: admin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-registry-cleanup
      ports:
        - protocol: TCP
          port: 5002
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-registry-promotion
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      mattercodex.dev/registry-scope: promotion
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              mattercodex.dev/image-admission: "true"
      ports:
        - protocol: TCP
          port: 5003
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-buildkit-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-buildkit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              mattercodex.dev/image-build-client: "true"
      ports:
        - protocol: TCP
          port: 1234
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
              mattercodex.dev/registry-scope: push
      ports:
        - protocol: TCP
          port: 5001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-build-client-exact-paths
spec:
  podSelector:
    matchLabels:
      mattercodex.dev/image-build-client: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-buildkit
      ports:
        - protocol: TCP
          port: 1234
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
              mattercodex.dev/registry-scope: push
      ports:
        - protocol: TCP
          port: 5001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-admission-exact-paths
spec:
  podSelector:
    matchLabels:
      mattercodex.dev/image-admission: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
              mattercodex.dev/registry-scope: push
      ports:
        - {protocol: TCP, port: 5001}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
              mattercodex.dev/registry-scope: promotion
      ports:
        - {protocol: TCP, port: 5003}
---
