apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-supply-chain-deny-all
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - image-registry
          - image-builder
          - image-retention
          - image-pull-readback
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-image-registry-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Node pull идёт через LoadBalancer; exact FQDN/TLS/auth и read-only
    # registry scope являются authority boundary, а не source IP кластера.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-buildkit
      ports:
        - protocol: TCP
          port: 5001
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-registry-cleanup
      ports:
        - protocol: TCP
          port: 5002
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-buildkit-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-buildkit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              mattercodex.dev/image-build-client: "true"
      ports:
        - protocol: TCP
          port: 1234
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
      ports:
        - protocol: TCP
          port: 5001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattercodex-registry-cleanup-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-registry-cleanup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
      ports:
        - protocol: TCP
          port: 5002
