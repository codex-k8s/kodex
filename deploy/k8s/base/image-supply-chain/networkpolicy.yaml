apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kodex-image-supply-chain-deny-all
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - image-registry
          - image-builder
          - image-build-client
          - image-retention
          - image-pull-readback
          - image-admission
          - image-admission-orchestrator
  policyTypes:
    - Ingress
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kodex-image-admission-controller-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: image-admission-controller
      app.kubernetes.io/component: image-admission-orchestrator
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: __KODEX_KUBERNETES_API_SERVICE_CIDR__}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-collector}}
      ports: [{protocol: TCP, port: 4317}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: sentry-relay}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kodex-image-registry-pull
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-image-registry
      kodex.dev/registry-scope: pull
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __KODEX_INGRESS_NAMESPACE__
          podSelector:
            matchLabels:
              app.kubernetes.io/name: __KODEX_INGRESS_POD_NAME__
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-buildkit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: role-image-builder
      ports:
        - protocol: TCP
          port: 5000
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kodex-image-registry-push
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-image-registry
      kodex.dev/registry-scope: push
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-buildkit
      ports:
        - protocol: TCP
          port: 5001
  egress: []
---
apiVersion: networking.k8s.io/v1
