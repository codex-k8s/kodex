  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-image-registry
      kodex.dev/registry-scope: evidence
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: kodex.dev/image-admission-phase
                operator: In
                values: [admit, promote]
      ports: [{protocol: TCP, port: 5007}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kodex-buildkit-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kodex-buildkit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kodex.dev/image-build-client: "true"
      ports:
        - protocol: TCP
          port: 1234
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-image-registry
              kodex.dev/registry-scope: push
      ports:
        - protocol: TCP
          port: 5001
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kodex-image-registry
              kodex.dev/registry-scope: pull
      ports:
        - protocol: TCP
          port: 5000
---
