  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-registry-cleanup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mattercodex-image-registry
              mattercodex.dev/registry-scope: admin
      ports:
        - protocol: TCP
          port: 5002
