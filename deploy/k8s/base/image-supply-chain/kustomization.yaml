apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattercodex-system
resources:
  - admission-policy.yaml
  - serviceaccount.yaml
  - registry.yaml
  - registry-tls-secret-provider-class.yaml
  - buildkit.yaml
  - buildkit-tls-secret-provider-class.yaml
  - admission-secret-provider-classes.yaml
  - cleanup.yaml
  - node-pull-readback.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mattercodex-buildkit-config
    files:
      - buildkitd.toml
  - name: mattercodex-registry-cleanup
    files:
      - cleanup.sh
  - name: mattercodex-image-admission
    files:
      - image-admission.sh
      - provenance-policy.jq
  - name: mattercodex-registry-readiness
    files:
      - registry-readiness.sh
generatorOptions:
  disableNameSuffixHash: true
