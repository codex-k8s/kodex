apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattercodex-system
resources:
  - admission-policy.yaml
  - image-admission-controller.yaml
  - image-admission-controller-policy.yaml
  - role-environments.yaml
  - serviceaccount.yaml
  - registry.yaml
  - registry-ingress-route.yaml
  - staging-read-registry.yaml
  - evidence-registry.yaml
  - registry-tls-secret-provider-class.yaml
  - buildkit.yaml
  - buildkit-tls-secret-provider-class.yaml
  - admission-secret-provider-classes.yaml
  - admission-authority-secret-provider-classes.yaml
  - cleanup.yaml
  - node-pull-readback.yaml
  - release-artifact-materializer.yaml
  - release-artifact-materializer-secrets.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mattercodex-buildkit-config
    files:
      - buildkitd.toml
  - name: mattercodex-registry-cleanup
    files:
      - cleanup.sh
  - name: mattercodex-image-admission
    files:
      - image-admission.sh
      - provenance-policy.jq
  - name: mattercodex-registry-readiness
    files:
      - registry-readiness.sh
  - name: mattercodex-release-artifact-materializer
    files:
      - release-artifact-materializer.sh
generatorOptions:
  disableNameSuffixHash: true
