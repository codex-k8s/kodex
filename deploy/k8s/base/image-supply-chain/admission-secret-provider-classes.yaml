apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-scanner
spec:
  provider: vault
  parameters:
    roleName: mattercodex-image-scanner
    objects: |
      - objectName: registry-client.crt
        secretPath: pki/issue/mattercodex-image-scanner
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-image-scanner
          ttl: 30m
        filePermission: 292
      - objectName: registry-client.key
        secretPath: pki/issue/mattercodex-image-scanner
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-image-scanner
          ttl: 30m
        filePermission: 292
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: username
        secretPath: kv/data/mattercodex/image-registry/scanner
        secretKey: username
        filePermission: 292
      - objectName: password
        secretPath: kv/data/mattercodex/image-registry/scanner
        secretKey: password
        filePermission: 292
---
