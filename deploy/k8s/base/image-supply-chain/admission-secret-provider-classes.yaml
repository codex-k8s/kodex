apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-scanner
spec:
  provider: vault
  parameters:
    roleName: mattercodex-image-scanner
    objects: |
      - objectName: registry-client.crt
        secretPath: pki/issue/mattercodex-image-scanner
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-image-scanner
          ttl: 30m
      - objectName: registry-client.key
        secretPath: pki/issue/mattercodex-image-scanner
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-image-scanner
          ttl: 30m
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
      - objectName: username
        secretPath: kv/data/mattercodex/image-registry/scanner
        secretKey: username
      - objectName: password
        secretPath: kv/data/mattercodex/image-registry/scanner
        secretKey: password
      - objectName: builder.pub
        secretPath: kv/data/mattercodex/image-admission/builder-public
        secretKey: public_key
---
