apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kodex-buildkit-tls
spec:
  provider: vault
  parameters:
    roleName: kodex-buildkit
    audience: vault
    objects: |
      - objectName: server.crt
        secretPath: pki/issue/kodex-buildkit-server
        secretKey: certificate
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit.kodex-system.svc.cluster.local
          alt_names: kodex-buildkit,kodex-buildkit.kodex-system.svc,kodex-buildkit.kodex-system.svc.cluster.local
          ttl: 1h
      - objectName: server.key
        secretPath: pki/issue/kodex-buildkit-server
        secretKey: private_key
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit.kodex-system.svc.cluster.local
          alt_names: kodex-buildkit,kodex-buildkit.kodex-system.svc,kodex-buildkit.kodex-system.svc.cluster.local
          ttl: 1h
      - objectName: probe.crt
        secretPath: pki/issue/kodex-buildkit-probe
        secretKey: certificate
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-probe
          alt_names: kodex-buildkit-probe.kodex-system.svc
          ttl: 30m
      - objectName: probe.key
        secretPath: pki/issue/kodex-buildkit-probe
        secretKey: private_key
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-probe
          alt_names: kodex-buildkit-probe.kodex-system.svc
          ttl: 30m
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: pull-ca.pem
        secretPath: pki-public/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: config.json
        secretPath: kv/data/kodex/image-registry/buildkit-base-pull
        secretKey: dockerconfigjson
        filePermission: 292
      - objectName: push-ca.pem
        secretPath: pki-buildkit-push/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: base-registry-client.crt
        secretPath: pki/issue/kodex-buildkit-base-pull
        secretKey: certificate
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-base-pull
          ttl: 30m
      - objectName: base-registry-client.key
        secretPath: pki/issue/kodex-buildkit-base-pull
        secretKey: private_key
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-base-pull
          ttl: 30m
      - objectName: staging-registry-client.crt
        secretPath: pki-buildkit-push/issue/kodex-buildkit-staging-push
        secretKey: certificate
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-staging-push
          ttl: 30m
      - objectName: staging-registry-client.key
        secretPath: pki-buildkit-push/issue/kodex-buildkit-staging-push
        secretKey: private_key
        filePermission: 292
        method: PUT
        secretArgs:
          common_name: kodex-buildkit-staging-push
          ttl: 30m
