apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-buildkit-tls
spec:
  provider: vault
  parameters:
    roleName: mattercodex-buildkit
    objects: |
      - objectName: server.crt
        secretPath: pki/issue/mattercodex-buildkit-server
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-buildkit,mattercodex-buildkit.mattercodex-system.svc,mattercodex-buildkit.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: server.key
        secretPath: pki/issue/mattercodex-buildkit-server
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-buildkit,mattercodex-buildkit.mattercodex-system.svc,mattercodex-buildkit.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: probe.crt
        secretPath: pki/issue/mattercodex-buildkit-probe
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit-probe
          alt_names: mattercodex-buildkit-probe.mattercodex-system.svc
          ttl: 30m
      - objectName: probe.key
        secretPath: pki/issue/mattercodex-buildkit-probe
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit-probe
          alt_names: mattercodex-buildkit-probe.mattercodex-system.svc
          ttl: 30m
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
      - objectName: registry-client.crt
        secretPath: pki/issue/mattercodex-buildkit-registry-client
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit
          ttl: 30m
      - objectName: registry-client.key
        secretPath: pki/issue/mattercodex-buildkit-registry-client
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-buildkit
          ttl: 30m
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-role-image-builder-tls
spec:
  provider: vault
  parameters:
    roleName: mattercodex-role-image-builder
    objects: |
      - objectName: client.crt
        secretPath: pki/issue/mattercodex-buildkit-client
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-role-image-builder
          alt_names: mattercodex-role-image-builder.mattercodex-system.svc
          ttl: 30m
      - objectName: client.key
        secretPath: pki/issue/mattercodex-buildkit-client
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-role-image-builder
          alt_names: mattercodex-role-image-builder.mattercodex-system.svc
          ttl: 30m
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
