apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-buildkit-tls
spec:
  provider: vault
  secretObjects:
    # Только доверенные build controllers получают client identity. Наличие
    # label NetworkPolicy не выдаёт доступ к BuildKit без этого сертификата.
    - secretName: mattercodex-buildkit-client-tls
      type: kubernetes.io/tls
      data:
        - objectName: client.crt
          key: tls.crt
        - objectName: client.key
          key: tls.key
        - objectName: ca.pem
          key: ca.crt
  parameters:
    roleName: mattercodex-buildkit
    objects: |
      - objectName: server.crt
        secretPath: pki/issue/mattercodex-buildkit-server
        secretKey: certificate
      - objectName: server.key
        secretPath: pki/issue/mattercodex-buildkit-server
        secretKey: private_key
      - objectName: probe.crt
        secretPath: pki/issue/mattercodex-buildkit-probe
        secretKey: certificate
      - objectName: probe.key
        secretPath: pki/issue/mattercodex-buildkit-probe
        secretKey: private_key
      - objectName: client.crt
        secretPath: pki/issue/mattercodex-buildkit-client
        secretKey: certificate
      - objectName: client.key
        secretPath: pki/issue/mattercodex-buildkit-client
        secretKey: private_key
      - objectName: ca.pem
        secretPath: pki/issue/mattercodex-buildkit-server
        secretKey: issuing_ca
