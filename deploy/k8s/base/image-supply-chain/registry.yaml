apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattercodex-image-registry-staging
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    mattercodex.dev/registry-storage: staging
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattercodex-image-registry-promoted
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    mattercodex.dev/registry-storage: promoted
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattercodex-image-registry-pull
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    app.kubernetes.io/component: image-registry
    mattercodex.dev/registry-scope: pull
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      mattercodex.dev/registry-scope: pull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattercodex-image-registry
        app.kubernetes.io/component: image-registry
        mattercodex.dev/registry-scope: pull
    spec:
      serviceAccountName: mattercodex-image-registry-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /var/run/secrets/mattercodex/registry/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /var/run/secrets/mattercodex/registry/tls.key
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: mattercodex-image-pull
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /var/run/secrets/mattercodex/registry/auth.htpasswd
            - name: REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED
              value: "true"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "false"
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/mattercodex/registry
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattercodex-image-registry-promoted
            readOnly: true
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mattercodex-image-registry-pull
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
