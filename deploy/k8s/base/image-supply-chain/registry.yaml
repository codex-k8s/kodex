apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattercodex-image-registry
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    app.kubernetes.io/component: image-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattercodex-image-registry
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    app.kubernetes.io/component: image-registry
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mattercodex-image-registry
      app.kubernetes.io/component: image-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattercodex-image-registry
        app.kubernetes.io/component: image-registry
    spec:
      serviceAccountName: mattercodex-image-registry
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /var/run/secrets/mattercodex/image-registry/tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /var/run/secrets/mattercodex/image-registry/tls/tls.key
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v2/
              port: registry
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /v2/
              port: registry
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /var/run/secrets/mattercodex/image-registry/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattercodex-image-registry
        - name: tls
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mattercodex-image-registry-tls
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mattercodex-image-registry
  labels:
    app.kubernetes.io/name: mattercodex-image-registry
    app.kubernetes.io/component: image-registry
spec:
  selector:
    app.kubernetes.io/name: mattercodex-image-registry
    app.kubernetes.io/component: image-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
