apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imageadmissionpolicyparameters.supplychain.kodex.dev
spec:
  group: supplychain.kodex.dev
  scope: Namespaced
  names:
    plural: imageadmissionpolicyparameters
    singular: imageadmissionpolicyparameters
    kind: ImageAdmissionPolicyParameters
    listKind: ImageAdmissionPolicyParametersList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required:
                - orchestrationRevision
                - toolsImage
                - admissionImage
                - authorityImage
                - promotionRepository
                - promotionEvidenceRepository
                - evidenceRepository
                - promotedPullRepository
                - pullRegistryHost
                - pullCredentialGeneration
                - nodeReadbackImage
                - roleImageInputRepository
                - policyRevision
                - policySHA256
                - builderIdentity
                - buildType
                - trustedRoleBaseRepository
                - trustedRoleBaseDigest
                - builderSHA256
                - frontendSHA256
                - toolchainSHA256
                - roleRuntimeContractRevision
                - roleRuntimeContractSHA256
                - providerAppArmorProfile
                - scannerIdentity
                - signerIdentity
                - admissionOwnerIdentity
                - promotionIdentity
                - requiredTools
              properties:
                orchestrationRevision:
                  type: string
                  pattern: ^[a-f0-9]{40}$
                toolsImage: {type: string, minLength: 1}
                admissionImage: {type: string, minLength: 1}
                authorityImage: {type: string, minLength: 1}
                authorityIssuerImage: {type: string, pattern: '^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$'}
                promotionRepository: {type: string, minLength: 1}
                promotionEvidenceRepository: {type: string, minLength: 1}
                evidenceRepository: {type: string, minLength: 1}
                promotedPullRepository: {type: string, minLength: 1}
                pullRegistryHost: {type: string, minLength: 1}
                pullCredentialGeneration:
                  type: string
                  pattern: ^[0-9]+$
                nodeReadbackImage: {type: string, minLength: 1}
                roleImageInputRepository: {type: string, minLength: 1}
                policyRevision:
                  type: string
                  pattern: ^[0-9]+$
                policySHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                builderIdentity: {type: string, minLength: 1}
                buildType: {type: string, minLength: 1}
                trustedRoleBaseRepository: {type: string, minLength: 1}
                trustedRoleBaseDigest:
                  type: string
                  pattern: ^sha256:[a-f0-9]{64}$
                builderSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                frontendSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                toolchainSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                roleRuntimeContractRevision:
                  type: string
                  pattern: ^[0-9]+$
                roleRuntimeContractSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                providerAppArmorProfile:
                  type: string
                  enum: ["", kodex-provider-runtime]
                scannerIdentity: {type: string, minLength: 1}
                signerIdentity: {type: string, minLength: 1}
                admissionOwnerIdentity: {type: string, minLength: 1}
                promotionIdentity: {type: string, minLength: 1}
                requiredTools:
                  type: string
                  enum: ['base64,cmp,cosign,grype,image-admission-bridge,image-tool-inventory-validator,image-vulnerability-report-validator,jq,regctl,sha256sum,syft,tr,wc']
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Image admission policy parameters are immutable.
---
apiVersion: supplychain.kodex.dev/v1alpha1
kind: ImageAdmissionPolicyParameters
metadata:
  name: kodex-image-admission-policy
  labels:
    app.kubernetes.io/name: kodex-image-admission
    kodex.dev/owner-intent: "true"
# Значения spec проецируются из ConfigMap.data при канонической сборке Kustomize.
spec: {}
