              required:
                - orchestrationRevision
                - toolsImage
                - admissionImage
                - authorityImage
                - promotionRepository
                - promotionEvidenceRepository
                - evidenceRepository
                - promotedPullRepository
                - pullRegistryHost
                - pullCredentialGeneration
                - nodeReadbackImage
                - roleImageInputRepository
                - policyRevision
                - policySHA256
                - builderIdentity
                - buildType
                - trustedRoleBaseRepository
                - trustedRoleBaseDigest
                - builderSHA256
                - frontendSHA256
                - toolchainSHA256
                - roleRuntimeContractRevision
                - roleRuntimeContractSHA256
                - scannerIdentity
                - signerIdentity
                - admissionOwnerIdentity
                - promotionIdentity
                - requiredTools
              properties:
                orchestrationRevision:
                  type: string
                  pattern: ^[a-f0-9]{40}$
                toolsImage: {type: string, minLength: 1}
                admissionImage: {type: string, minLength: 1}
                authorityImage: {type: string, minLength: 1}
                promotionRepository: {type: string, minLength: 1}
                promotionEvidenceRepository: {type: string, minLength: 1}
                evidenceRepository: {type: string, minLength: 1}
                promotedPullRepository: {type: string, minLength: 1}
                pullRegistryHost: {type: string, minLength: 1}
                pullCredentialGeneration:
                  type: string
                  pattern: ^[0-9]+$
                nodeReadbackImage: {type: string, minLength: 1}
                roleImageInputRepository: {type: string, minLength: 1}
                policyRevision:
                  type: string
                  pattern: ^[0-9]+$
                policySHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                builderIdentity: {type: string, minLength: 1}
                buildType: {type: string, minLength: 1}
                trustedRoleBaseRepository: {type: string, minLength: 1}
                trustedRoleBaseDigest:
                  type: string
                  pattern: ^sha256:[a-f0-9]{64}$
                builderSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                frontendSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                toolchainSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                roleRuntimeContractRevision:
                  type: string
                  pattern: ^[0-9]+$
                roleRuntimeContractSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                scannerIdentity: {type: string, minLength: 1}
                signerIdentity: {type: string, minLength: 1}
                admissionOwnerIdentity: {type: string, minLength: 1}
                promotionIdentity: {type: string, minLength: 1}
                requiredTools: {type: string, minLength: 1}
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Image admission policy parameters are immutable.
