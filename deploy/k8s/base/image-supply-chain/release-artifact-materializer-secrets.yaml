apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: release-artifact-materializer-source
spec:
  provider: vault
  parameters:
    roleName: release-artifact-materializer
    audience: vault
    objects: |
      - objectName: "config.json"
        secretPath: "kv/data/kodex/release-registry/pull"
        secretKey: "dockerconfigjson"
        filePermission: 292
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: release-artifact-materializer-destination
spec:
  provider: vault
  parameters:
    roleName: release-artifact-materializer
    audience: vault
    objects: |
      - objectName: "config.json"
        secretPath: "kv/data/kodex/image-registry/promotion"
        secretKey: "dockerconfigjson"
        filePermission: 292
      - objectName: "tls.crt"
        secretPath: "pki/issue/release-artifact-materializer"
        secretKey: "certificate"
        method: PUT
        secretArgs:
          common_name: release-artifact-materializer
          ttl: 30m
        filePermission: 292
      - objectName: "tls.key"
        secretPath: "pki/issue/release-artifact-materializer"
        secretKey: "private_key"
        method: PUT
        secretArgs:
          common_name: release-artifact-materializer
          ttl: 30m
        filePermission: 292
      - objectName: "ca.pem"
        secretPath: "pki/cert/ca"
        secretKey: "certificate"
        filePermission: 292
