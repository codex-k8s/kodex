apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mattercodex-image-registry-pull
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`registry-pull.invalid`)
      services:
        - name: mattercodex-image-registry-pull
          port: 5000
  tls:
    passthrough: true
