apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-registry-pull
  annotations:
    mattercodex.dev/registry-pull-host: registry-pull.invalid
spec:
  provider: vault
  secretObjects:
    - secretName: mattercodex-image-pull
      type: kubernetes.io/dockerconfigjson
      data:
        - objectName: pull-dockerconfigjson
          key: .dockerconfigjson
  parameters:
    roleName: mattercodex-image-registry-pull
    objects: |
      - objectName: tls.crt
        secretPath: pki-public/issue/mattercodex-image-registry-pull
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-image-registry-pull.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-image-registry-pull,mattercodex-image-registry-pull.mattercodex-system.svc,mattercodex-image-registry-pull.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: tls.key
        secretPath: pki-public/issue/mattercodex-image-registry-pull
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-image-registry-pull.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-image-registry-pull,mattercodex-image-registry-pull.mattercodex-system.svc,mattercodex-image-registry-pull.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: auth.htpasswd
        secretPath: kv/data/mattercodex/image-registry/pull
        secretKey: htpasswd
      - objectName: pull-dockerconfigjson
        secretPath: kv/data/mattercodex/image-registry/pull
        secretKey: dockerconfigjson
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-registry-push
spec:
  provider: vault
  secretObjects:
    - secretName: mattercodex-image-registry-ca
      type: Opaque
      data:
        - objectName: ca.pem
          key: ca.pem
    - secretName: mattercodex-image-push
      type: kubernetes.io/dockerconfigjson
      data:
        - objectName: push-dockerconfigjson
          key: .dockerconfigjson
    - secretName: mattercodex-image-push-client
      type: Opaque
      data:
        - objectName: push.username
          key: username
        - objectName: push.password
          key: password
  parameters:
    roleName: mattercodex-image-registry-push
    objects: |
      - objectName: tls.crt
        secretPath: pki/issue/mattercodex-image-registry-push
        secretKey: certificate
        method: PUT
