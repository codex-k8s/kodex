apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-registry-tls
spec:
  provider: vault
  secretObjects:
    - secretName: mattercodex-image-registry-ca
      type: Opaque
      data:
        - objectName: ca.pem
          key: ca.pem
  parameters:
    roleName: mattercodex-image-registry
    objects: |
      - objectName: tls.crt
        secretPath: pki/issue/mattercodex-image-registry
        secretKey: certificate
      - objectName: tls.key
        secretPath: pki/issue/mattercodex-image-registry
        secretKey: private_key
      - objectName: ca.pem
        secretPath: pki/issue/mattercodex-image-registry
        secretKey: issuing_ca
