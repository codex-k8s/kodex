          common_name: mattercodex-image-registry-push.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-image-registry-push,mattercodex-image-registry-push.mattercodex-system.svc,mattercodex-image-registry-push.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: tls.key
        secretPath: pki/issue/mattercodex-image-registry-push
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-image-registry-push.mattercodex-system.svc.cluster.local
          alt_names: mattercodex-image-registry-push,mattercodex-image-registry-push.mattercodex-system.svc,mattercodex-image-registry-push.mattercodex-system.svc.cluster.local
          ttl: 1h
      - objectName: ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
      - objectName: auth.htpasswd
        secretPath: kv/data/mattercodex/image-registry/push
        secretKey: htpasswd
      - objectName: push-dockerconfigjson
        secretPath: kv/data/mattercodex/image-registry/push
        secretKey: dockerconfigjson
      - objectName: push.username
        secretPath: kv/data/mattercodex/image-registry/push
        secretKey: username
      - objectName: push.password
        secretPath: kv/data/mattercodex/image-registry/push
        secretKey: password
