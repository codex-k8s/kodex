apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mattercodex-image-registry-pull
  annotations:
    mattercodex.dev/registry-pull-host: registry-pull.invalid
spec:
  provider: vault
  secretObjects:
    - secretName: mattercodex-image-pull
      type: kubernetes.io/dockerconfigjson
      data:
        - objectName: pull-dockerconfigjson
          key: .dockerconfigjson
  parameters:
    roleName: mattercodex-image-registry-pull
    objects: |
      - objectName: tls.crt
        secretPath: pki-public/issue/mattercodex-image-registry-pull
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: registry-pull.invalid
          alt_names: registry-pull.invalid,mattercodex-image-registry,mattercodex-image-registry.mattercodex-system.svc,mattercodex-image-registry.mattercodex-system.svc.cluster.local
          ttl: 1h
        filePermission: 292
      - objectName: tls.key
        secretPath: pki-public/issue/mattercodex-image-registry-pull
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: registry-pull.invalid
          alt_names: registry-pull.invalid,mattercodex-image-registry,mattercodex-image-registry.mattercodex-system.svc,mattercodex-image-registry.mattercodex-system.svc.cluster.local
          ttl: 1h
        filePermission: 292
      - objectName: ca.pem
        secretPath: pki-public/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: client-ca.pem
        secretPath: pki/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: node-client-ca.pem
        secretPath: pki-node-pull/cert/ca
        secretKey: certificate
        filePermission: 292
      - objectName: probe.crt
        secretPath: pki/issue/mattercodex-image-registry-pull-probe
        secretKey: certificate
        method: PUT
        secretArgs:
          common_name: mattercodex-image-registry-pull-probe
          ttl: 30m
        filePermission: 292
      - objectName: probe.key
        secretPath: pki/issue/mattercodex-image-registry-pull-probe
        secretKey: private_key
        method: PUT
        secretArgs:
          common_name: mattercodex-image-registry-pull-probe
          ttl: 30m
        filePermission: 292
      - objectName: auth.htpasswd
        secretPath: kv/data/mattercodex/image-registry/pull
        secretKey: htpasswd
        filePermission: 292
      - objectName: pull-dockerconfigjson
        secretPath: kv/data/mattercodex/image-registry/pull
        secretKey: dockerconfigjson
        filePermission: 292
      - objectName: probe-dockerconfig.json
        secretPath: kv/data/mattercodex/image-registry/pull
        secretKey: dockerconfigjson
        filePermission: 292
      - objectName: buildkit-dockerconfig.json
        secretPath: kv/data/mattercodex/image-registry/buildkit-base-pull
        secretKey: dockerconfigjson
        filePermission: 292
      - objectName: input-dockerconfig.json
        secretPath: kv/data/mattercodex/role-image-builder/input-read
        secretKey: docker-config
        filePermission: 292
