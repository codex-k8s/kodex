apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: image-admission-application-grant
spec:
  provider: vault
  parameters:
    roleName: image-admission
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "application-grant.jws"
        secretPath: "kv/data/mattercodex/image-admission/application-grant"
        secretKey: "compact-jws"
        filePermission: 288
---
