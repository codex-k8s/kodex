apiVersion: batch/v1
kind: CronJob
metadata:
  name: mattercodex-registry-cleanup
  labels:
    app.kubernetes.io/name: mattercodex-registry-cleanup
    app.kubernetes.io/component: image-retention
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mattercodex-registry-cleanup
            app.kubernetes.io/component: image-retention
        spec:
          serviceAccountName: mattercodex-registry-cleanup
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: regclient/regctl:v0.9.2-alpine@sha256:53115c38927846d4f2ae111121cca7e95a033fd84132d69569e814ede1a696d3
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /var/run/config/mattercodex/registry-cleanup/cleanup.sh
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /var/run/config/mattercodex/registry-cleanup
                  readOnly: true
                - name: registry-ca
                  mountPath: /var/run/config/mattercodex/image-registry
                  readOnly: true
                - name: registry-admin
                  mountPath: /var/run/secrets/mattercodex/image-registry/admin
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: mattercodex-registry-cleanup
                defaultMode: 0550
            - name: registry-ca
              secret:
                secretName: mattercodex-image-registry-ca
                defaultMode: 0440
            - name: registry-admin
              secret:
                secretName: mattercodex-image-registry-admin
                defaultMode: 0440
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
