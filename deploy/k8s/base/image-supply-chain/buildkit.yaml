apiVersion: apps/v1
kind: Deployment
metadata:
  name: kodex-buildkit
  labels:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kodex-buildkit
      app.kubernetes.io/component: image-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kodex-buildkit
        app.kubernetes.io/component: image-builder
    spec:
      # BuildKit работает от namespace-root внутри обязательного Kubernetes
      # Pod user namespace. privileged действует только внутри remapped user
      # namespace и не выдаёт процессу host-root. Кластер без hostUsers=false
      # обязан отклонить Pod; переход в host user namespace или
      # noProcessSandbox запрещён.
      hostUsers: false
      serviceAccountName: kodex-buildkit
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.24.0@sha256:8c2ce26a3722e0cf4514fad4cfcd0e0f0f16214219ca7b73f3e1fcef74640ac4
          imagePullPolicy: IfNotPresent
          args:
            - --config=/var/run/config/kodex/buildkit/buildkitd.toml
          ports:
            - name: buildkit
              containerPort: 1234
              protocol: TCP
          env:
            - name: KODEX_BUILDKIT_READINESS_BASE_REPOSITORY
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['kodex.dev/trusted-role-base-repository']
            - name: KODEX_BUILDKIT_READINESS_BASE_DIGEST
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['kodex.dev/trusted-role-base-digest']
            - name: KODEX_BUILDKIT_READINESS_FRONTEND_SHA256
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['kodex.dev/frontend-sha256']
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  work=$(mktemp -d)
                  trap 'rm -rf "$work"' EXIT
                  export DOCKER_CONFIG=/var/run/secrets/kodex/buildkit/tls
                  fail_policy_input() {
                    printf 'BuildKit readiness policy input is invalid: %s\n' "$1" >&2
                    exit 1
                  }
                  base=${KODEX_BUILDKIT_READINESS_BASE_REPOSITORY:-}
                  base_digest=${KODEX_BUILDKIT_READINESS_BASE_DIGEST:-}
                  frontend=${KODEX_BUILDKIT_READINESS_FRONTEND_SHA256:-}
                  case "$base" in
                    ''|*://*|*@*|/*|*/|*//*|*[!a-z0-9._:/-]*)
                      fail_policy_input 'trusted role base repository'
                      ;;
                  esac
                  case "$base" in
                    */*) ;;
                    *) fail_policy_input 'trusted role base repository' ;;
                  esac
                  registry=${base%%/*}
                  case "$registry" in
                    *.*) ;;
                    *) fail_policy_input 'trusted role base repository' ;;
                  esac
                  case "$registry" in
                    *:*)
                      port=${registry##*:}
                      case "$port" in
                        ''|*[!0-9]*) fail_policy_input 'trusted role base repository' ;;
                      esac
                      [ "$port" -ge 1 ] && [ "$port" -le 65535 ] ||
                        fail_policy_input 'trusted role base repository'
                      ;;
                  esac
                  case "$base_digest" in
                    sha256:*) base_hex=${base_digest#sha256:} ;;
                    *) fail_policy_input 'trusted role base digest' ;;
                  esac
                  [ "${#base_hex}" -eq 64 ] || fail_policy_input 'trusted role base digest'
                  case "$base_hex" in
                    *[!a-f0-9]*) fail_policy_input 'trusted role base digest' ;;
                  esac
                  [ "${#frontend}" -eq 64 ] || fail_policy_input 'frontend digest'
                  case "$frontend" in
                    *[!a-f0-9]*) fail_policy_input 'frontend digest' ;;
                  esac
                  printf '# syntax=%s@sha256:%s\nFROM %s@%s AS verify\nRUN ["/bin/sh","-c","test -x /usr/local/bin/kodex-init && test -x /usr/local/bin/kodex-agent-runner && printf ready > /tmp/kodex-readiness"]\nFROM scratch\nCOPY --from=verify /tmp/kodex-readiness /kodex-readiness\n' \
                    'kodex-image-registry.kodex-system.svc.cluster.local:5000/kodex/dockerfile' \
                    "$frontend" "$base" "$base_digest" >"$work/Dockerfile"
                  buildctl --addr tcp://127.0.0.1:1234 \
                    --tlscacert /var/run/secrets/kodex/buildkit/tls/ca.pem \
                    --tlscert /var/run/secrets/kodex/buildkit/tls/probe.crt \
                    --tlskey /var/run/secrets/kodex/buildkit/tls/probe.key \
                    --tlsservername kodex-buildkit.kodex-system.svc.cluster.local \
                    build --frontend dockerfile.v0 --local context="$work" --local dockerfile="$work" \
                    --opt filename=Dockerfile --opt platform=linux/amd64 \
                    --output type=image,name=kodex-image-registry-push.kodex-system.svc.cluster.local:5001/staging/readiness:userns-probe,push=true \
                    --no-cache >/dev/null
            periodSeconds: 60
            timeoutSeconds: 180
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - buildctl
                - --addr
                - tcp://127.0.0.1:1234
                - --tlscacert
                - /var/run/secrets/kodex/buildkit/tls/ca.pem
                - --tlscert
                - /var/run/secrets/kodex/buildkit/tls/probe.crt
                - --tlskey
                - /var/run/secrets/kodex/buildkit/tls/probe.key
                - --tlsservername
                - kodex-buildkit.kodex-system.svc.cluster.local
                - debug
                - workers
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/buildkit
            - name: config
              mountPath: /var/run/config/kodex/buildkit
              readOnly: true
            - name: registry-ca
              mountPath: /var/run/config/kodex/image-registry
              readOnly: true
            - name: buildkit-tls
              mountPath: /var/run/secrets/kodex/buildkit/tls
              readOnly: true
      volumes:
        - name: state
          emptyDir:
            sizeLimit: 20Gi
        - name: config
          configMap:
            name: kodex-buildkit-config
            defaultMode: 0440
        - name: registry-ca
          secret:
            secretName: kodex-image-registry-ca
            defaultMode: 0440
        - name: buildkit-tls
          secret:
            secretName: kodex-buildkit-tls
            defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: kodex-buildkit
  labels:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
spec:
  selector:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
      protocol: TCP
