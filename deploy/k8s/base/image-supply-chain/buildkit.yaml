apiVersion: apps/v1
kind: Deployment
metadata:
  name: kodex-buildkit
  labels:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kodex-buildkit
      app.kubernetes.io/component: image-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kodex-buildkit
        app.kubernetes.io/component: image-builder
    spec:
      # BuildKit работает от namespace-root внутри обязательного Kubernetes
      # Pod user namespace. privileged действует только внутри remapped user
      # namespace и не выдаёт процессу host-root. Кластер без hostUsers=false
      # обязан отклонить Pod; переход в host user namespace или
      # noProcessSandbox запрещён.
      hostUsers: false
      serviceAccountName: kodex-buildkit
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.24.0@sha256:8c2ce26a3722e0cf4514fad4cfcd0e0f0f16214219ca7b73f3e1fcef74640ac4
          imagePullPolicy: IfNotPresent
          args:
            - --config=/var/run/config/kodex/buildkit/buildkitd.toml
          ports:
            - name: buildkit
              containerPort: 1234
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  work=$(mktemp -d)
                  trap 'rm -rf "$work"' EXIT
                  export DOCKER_CONFIG=/var/run/secrets/kodex/buildkit/tls
                  base=$(cat /var/run/config/kodex/image-policy/trustedRoleBaseRepository)
                  base_digest=$(cat /var/run/config/kodex/image-policy/trustedRoleBaseDigest)
                  frontend=$(cat /var/run/config/kodex/image-policy/frontendSHA256)
                  printf '# syntax=%s@sha256:%s\nFROM %s@%s\nRUN ["/bin/sh","-c","test -x /usr/local/bin/kodex-init && test -x /usr/local/bin/kodex-agent-runner"]\n' \
                    'kodex-image-registry.kodex-system.svc.cluster.local:5000/kodex/dockerfile' \
                    "$frontend" "$base" "$base_digest" >"$work/Dockerfile"
                  buildctl --addr tcp://127.0.0.1:1234 \
                    --tlscacert /var/run/secrets/kodex/buildkit/tls/ca.pem \
                    --tlscert /var/run/secrets/kodex/buildkit/tls/probe.crt \
                    --tlskey /var/run/secrets/kodex/buildkit/tls/probe.key \
                    --tlsservername kodex-buildkit.kodex-system.svc.cluster.local \
                    build --frontend dockerfile.v0 --local context="$work" --local dockerfile="$work" \
                    --opt filename=Dockerfile --opt platform=linux/amd64 \
                    --output type=image,name=kodex-image-registry-push.kodex-system.svc.cluster.local:5001/staging/readiness:userns-probe,push=true \
                    --no-cache >/dev/null
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - buildctl
                - --addr
                - tcp://127.0.0.1:1234
                - --tlscacert
                - /var/run/secrets/kodex/buildkit/tls/ca.pem
                - --tlscert
                - /var/run/secrets/kodex/buildkit/tls/probe.crt
                - --tlskey
                - /var/run/secrets/kodex/buildkit/tls/probe.key
                - --tlsservername
                - kodex-buildkit.kodex-system.svc.cluster.local
                - debug
                - workers
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/buildkit
            - name: config
              mountPath: /var/run/config/kodex/buildkit
              readOnly: true
            - name: registry-ca
              mountPath: /var/run/config/kodex/image-registry
              readOnly: true
            - name: image-policy
              mountPath: /var/run/config/kodex/image-policy
              readOnly: true
            - name: buildkit-tls
              mountPath: /var/run/secrets/kodex/buildkit/tls
              readOnly: true
      volumes:
        - name: state
          emptyDir:
            sizeLimit: 20Gi
        - name: config
          configMap:
            name: kodex-buildkit-config
            defaultMode: 0440
        - name: registry-ca
          secret:
            secretName: kodex-image-registry-ca
            defaultMode: 0440
        - name: image-policy
          configMap:
            name: kodex-image-admission-policy
            defaultMode: 0440
            items:
              - {key: trustedRoleBaseRepository, path: trustedRoleBaseRepository}
              - {key: trustedRoleBaseDigest, path: trustedRoleBaseDigest}
              - {key: frontendSHA256, path: frontendSHA256}
        - name: buildkit-tls
          secret:
            secretName: kodex-buildkit-tls
            defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: kodex-buildkit
  labels:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
spec:
  selector:
    app.kubernetes.io/name: kodex-buildkit
    app.kubernetes.io/component: image-builder
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
      protocol: TCP
