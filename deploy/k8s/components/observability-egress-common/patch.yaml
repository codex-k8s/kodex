- op: add
  path: /spec/egress/-
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
    ports:
    - protocol: TCP
      port: 4317
- op: add
  path: /spec/egress/-
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sentry-relay
    ports:
    - protocol: TCP
      port: 8443
