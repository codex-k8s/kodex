# Только четыре прежних runtime policy: DNS, owner RPC и телеметрия, независимо от issuer.
# Secret-broker сохраняет исходный egress-gateway перед DNS через move2→0.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
- ../observability-egress-common
patches:
- path: patch.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (automation-scheduler-exact-runtime-paths|integration-gateway-exact-runtime-paths|interaction-gateway-exact-runtime-paths|secret-broker-exact-runtime-paths)
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: secret-broker-exact-runtime-paths
  patch: |
    - op: move
      from: /spec/egress/2
      path: /spec/egress/0
