# Exact namespace+pod peers и прежние ports; специальные пути остаются в workload.
- op: add
  path: /spec/egress/0
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
- op: add
  path: /spec/egress/1
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kodex-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: control-plane
    ports:
    - protocol: TCP
      port: 8443
- op: add
  path: /spec/egress/-
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
    ports:
    - protocol: TCP
      port: 4317
- op: add
  path: /spec/egress/-
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sentry-relay
    ports:
    - protocol: TCP
      port: 8443
