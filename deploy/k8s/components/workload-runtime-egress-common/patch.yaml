# Точные DNS/CP peers; телеметрия добавляется общим компонентом до этих позиционных вставок.
- op: add
  path: /spec/egress/0
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
- op: add
  path: /spec/egress/1
  value:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kodex-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: control-plane
    ports:
    - protocol: TCP
      port: 8443
