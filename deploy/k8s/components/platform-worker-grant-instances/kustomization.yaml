apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Fresh profiles используют CP с поддержкой v2; upgrade сначала обновляет всех consumers.
patches:
  - target:
      kind: Deployment
      name: (secret-broker|email-bridge|integration-gateway|interaction-gateway|automation-scheduler|session-archive|role-image-builder)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: selected-worker
      spec:
        template:
          metadata:
            annotations:
              kodex.dev/worker-grant-format: "2"
          spec:
            containers:
              - name: platform-worker-grant-agent
                env:
                  - name: PLATFORM_WORKER_GRANT_INSTANCE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-plane
      spec:
        template:
          metadata:
            annotations:
              kodex.dev/worker-grant-format: "2"
          spec:
            containers:
              - name: control-plane-platform-worker-grant-agent
                env:
                  - name: PLATFORM_WORKER_GRANT_INSTANCE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
  - target:
      kind: Deployment
      name: runtime-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: runtime-controller
      spec:
        template:
          metadata:
            annotations:
              kodex.dev/worker-grant-format: "2"
          spec:
            initContainers:
              - name: internal-rpc-authority-socket-init
              - name: internal-rpc-authority-issuer
              - name: platform-worker-grant-agent
                env:
                  - name: PLATFORM_WORKER_GRANT_INSTANCE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
              - name: artifact-spool-init
