apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Opt-in только после обновления всех control-plane consumers по #1220.
patches:
  - target:
      kind: Deployment
      name: (secret-broker|email-bridge|runtime-controller|integration-gateway|interaction-gateway|automation-scheduler|session-archive|role-image-builder)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: selected-worker
      spec:
        template:
          metadata:
            annotations:
              kodex.dev/worker-grant-format: "2"
          spec:
            containers:
              - name: platform-worker-grant-agent
                env:
                  - name: PLATFORM_WORKER_GRANT_INSTANCE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-plane
      spec:
        template:
          metadata:
            annotations:
              kodex.dev/worker-grant-format: "2"
          spec:
            containers:
              - name: control-plane-platform-worker-grant-agent
                env:
                  - name: PLATFORM_WORKER_GRANT_INSTANCE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
