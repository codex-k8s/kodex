# Ролевые selector и ingress; общие точные egress-пары подключены отдельным component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stt-tts-service-internal-rpc-authority-exact-paths
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stt-tts-service, kodex.dev/internal-rpc-authority-issuer: enabled}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - {protocol: TCP, port: 9091}
