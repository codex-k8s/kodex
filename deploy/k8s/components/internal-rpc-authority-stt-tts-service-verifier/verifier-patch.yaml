# Точные workload/SPIFFE/Secret bindings и опорные элементы порядка verifier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-tts-service
spec:
  template:
    spec:
      initContainers:
      - name: internal-rpc-authority-socket-init
        volumeMounts:
        - {name: authority-sockets, mountPath: /run/kodex}
      containers:
      - name: stt-tts-service
        env:
        - {name: INTERNAL_RPC_AUTHORITY_VERIFIER_SOCKET, value: /run/kodex/internal-rpc-authority/verifier.sock}
        volumeMounts:
        - {name: authority-sockets, mountPath: /run/kodex, readOnly: true}
      - name: internal-rpc-authority-verifier
        env:
        - name: DEPLOYMENT_ENVIRONMENT
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_TLS_SERVER_NAME
        - name: OTEL_EXPORTER_OTLP_CA_FILE
        - name: OTEL_TRACES_SAMPLER_ARG
        - name: SENTRY_DSN_FILE
        - name: SENTRY_EXPECTED_HOST
        - {name: INTERNAL_RPC_AUTHORITY_WORKLOAD_ID, value: stt-tts-service}
        - {name: INTERNAL_RPC_AUTHORITY_WORKLOAD_SPIFFE_ID, value: 'spiffe://kodex.local/ns/kodex-system/sa/stt-tts-service'}
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_ADDRESS
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_TLS_SERVER_NAME
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_RESTORE_CONTROLLER_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_TECHNICAL_LISTEN
        - name: INTERNAL_RPC_AUTHORITY_STARTUP_TIMEOUT
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_UID
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_GID
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_DSN_FILE
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_EXPECTED_SESSION_USER
          valueFrom:
            secretKeyRef: {name: internal-rpc-authority-stt-tts-service-verifier-postgresql, key: username}
        volumeMounts:
        - {name: authority-sockets, mountPath: /run/kodex}
        - mountPath: /var/run/config/kodex/internal-rpc-authority/snapshot
        - mountPath: /var/run/config/kodex/internal-rpc-authority/manifest-trust
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/workload-tls
        - mountPath: /var/run/config/kodex/internal-rpc-authority/readback
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/controller-trust
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/role-trust
        - {name: internal-rpc-authority-stt-tts-service-verifier-postgres, mountPath: /var/run/secrets/kodex/internal-rpc-authority/postgres, readOnly: true}
        - mountPath: /var/run/config/kodex/internal-rpc-authority/postgresql
        - mountPath: /var/run/config/kodex/internal-rpc-authority/observability
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/observability
        - mountPath: /usr/local/share/internal-rpc-authority/manifest-root
        - {name: stt-tts-service-verifier-readback-credential, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/credential, readOnly: true}
        - {name: stt-tts-service-verifier-readback-possession, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/possession, readOnly: true}
        - {name: stt-tts-service-verifier-restore-credential, mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/credential, readOnly: true}
        - {name: stt-tts-service-verifier-restore-ack, mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/ack, readOnly: true}
      volumes:
      - name: internal-rpc-authority-stt-tts-service-verifier-postgres
        secret:
          secretName: internal-rpc-authority-stt-tts-service-verifier-postgresql
          defaultMode: 288
          items:
          - {key: dsn, path: dsn}
      - name: stt-tts-service-verifier-readback-credential
        secret: {secretName: internal-rpc-authority-stt-tts-service-verifier-readback-credential, defaultMode: 292}
      - name: stt-tts-service-verifier-readback-possession
        secret: {secretName: internal-rpc-authority-stt-tts-service-verifier-readback-possession, defaultMode: 292}
      - name: stt-tts-service-verifier-restore-credential
        secret: {secretName: internal-rpc-authority-stt-tts-service-verifier-restore-credential, defaultMode: 292}
      - name: stt-tts-service-verifier-restore-ack
        secret: {secretName: internal-rpc-authority-stt-tts-service-verifier-restore-ack, defaultMode: 292}
