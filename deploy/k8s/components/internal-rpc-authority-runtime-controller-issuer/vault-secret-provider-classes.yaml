apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-runtime-controller-issuer-key
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-runtime-controller
    audience: vault
    vaultAddress: https://vault.mattercodex-system.svc:8200
    vaultTLSServerName: vault.mattercodex-system.svc.cluster.local
    vaultSkipTLSVerify: "false"
    objects: |
      - objectName: "private.jwk"
        secretPath: "kv/data/mattercodex/internal-rpc-authority/runtime-controller/issuer/auth-private"
        secretKey: "private.jwk"
        filePermission: 288
---
