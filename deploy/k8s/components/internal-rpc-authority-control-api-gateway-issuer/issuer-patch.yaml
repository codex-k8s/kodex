# Идентичность и отличия workload; общие поля подключаются Kustomize components.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api-gateway
spec:
  template:
    spec:
      initContainers:
      - name: internal-rpc-authority-socket-init
        volumeMounts:
        - name: internal-rpc-authority-sockets
          mountPath: /run/kodex
      containers:
      - name: control-api-gateway
        env:
        - name: INTERNAL_RPC_AUTHORITY_ISSUER_SOCKET
          value: /run/kodex/internal-rpc-authority/issuer.sock
        - name: INTERNAL_RPC_AUTHORITY_LOCAL_ROLE
          value: issuer
        readinessProbe:
          exec:
            command:
            - /run/kodex/internal-rpc-authority/local-readiness
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: internal-rpc-authority-sockets
          mountPath: /run/kodex
          readOnly: true
      - name: internal-rpc-authority-issuer
        lifecycle:
          preStop:
            sleep:
              seconds: 40
        env:
        - name: DEPLOYMENT_ENVIRONMENT
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_TLS_SERVER_NAME
        - name: OTEL_EXPORTER_OTLP_CA_FILE
        - name: OTEL_TRACES_SAMPLER_ARG
        - name: SENTRY_DSN_FILE
        - name: SENTRY_EXPECTED_HOST
        - name: INTERNAL_RPC_AUTHORITY_WORKLOAD_ID
          value: control-api-gateway
        - name: INTERNAL_RPC_AUTHORITY_WORKLOAD_SPIFFE_ID
          value: spiffe://kodex.local/ns/kodex-system/sa/control-api-gateway
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_ADDRESS
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_TLS_SERVER_NAME
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_RESTORE_CONTROLLER_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_TECHNICAL_LISTEN
        - name: INTERNAL_RPC_AUTHORITY_STARTUP_TIMEOUT
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_UID
          value: '10001'
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_GID
          value: '10001'
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_DSN_FILE
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_EXPECTED_SESSION_USER
          valueFrom:
            secretKeyRef:
              name: internal-rpc-authority-control-api-gateway-issuer-postgresql
        volumeMounts:
        - name: internal-rpc-authority-sockets
          mountPath: /run/kodex
        - mountPath: /var/run/config/kodex/internal-rpc-authority/snapshot
        - mountPath: /var/run/config/kodex/internal-rpc-authority/manifest-trust
        - mountPath: /var/run/config/kodex/internal-rpc-authority/authority-proof-trust
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/issuer
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/workload-tls
        - mountPath: /var/run/config/kodex/internal-rpc-authority/readback
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/controller-trust
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/role-trust
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/postgres
        - mountPath: /var/run/config/kodex/internal-rpc-authority/postgresql
        - mountPath: /var/run/config/kodex/internal-rpc-authority/observability
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/observability
        - mountPath: /usr/local/share/internal-rpc-authority/manifest-root
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/credential
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/possession
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/credential
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/ack
      volumes:
      - name: authority-bootstrap-roots
      - name: internal-rpc-authority-sockets
        emptyDir:
          medium: ''
          sizeLimit: 32Mi
      - name: internal-rpc-authority-snapshot
      - name: internal-rpc-authority-manifest-trust
        secret:
          secretName: internal-rpc-authority-control-api-gateway-manifest-trust
      - name: internal-rpc-authority-proof-trust
        secret:
          secretName: internal-rpc-authority-control-api-gateway-proof-trust
      - name: internal-rpc-authority-issuer-key
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-key
      - name: internal-rpc-authority-workload-tls
        secret:
          secretName: internal-rpc-authority-control-api-gateway-workload-tls
      - name: internal-rpc-authority-readback-attestor-ca
      - name: internal-rpc-authority-restore-controller-ca
      - name: internal-rpc-authority-restore-controller-certificate
      - name: internal-rpc-authority-restore-role-trust
      - name: internal-rpc-authority-postgresql
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-postgresql
      - name: internal-rpc-authority-postgresql-ca
      - name: internal-rpc-authority-observability
      - name: internal-rpc-authority-sentry-dsn
      - name: authority-readback-credential
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-readback-credential
      - name: authority-readback-possession
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-readback-possession
      - name: authority-restore-credential
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-restore-credential
      - name: authority-restore-ack
        secret:
          secretName: internal-rpc-authority-control-api-gateway-issuer-restore-ack
