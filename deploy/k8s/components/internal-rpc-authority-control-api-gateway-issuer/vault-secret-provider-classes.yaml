apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: internal-rpc-authority-control-api-gateway-issuer-key
spec:
  provider: vault
  parameters:
    roleName: internal-rpc-authority-control-api-gateway
    audience: vault
    objects: |
      - objectName: "private.jwk"
        secretPath: "kv/data/mattercodex/internal-rpc-authority/control-api-gateway/issuer/auth-private"
        secretKey: "private.jwk"
        filePermission: 292
---
