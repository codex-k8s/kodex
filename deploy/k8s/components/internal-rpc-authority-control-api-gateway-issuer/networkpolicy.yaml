apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-gateway-internal-rpc-authority-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-api-gateway
      mattercodex.dev/internal-rpc-authority-issuer: enabled
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-readback-attestor
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: internal-rpc-authority-restore-controller
      ports:
        - protocol: TCP
          port: 8443
