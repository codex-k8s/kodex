# Ролевые selector и ingress; точные egress-пары подключены общим component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-internal-rpc-authority-issuer-exact-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      kodex.dev/internal-rpc-authority-issuer: enabled
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9091
    - protocol: TCP
      port: 9093
