apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: control-plane-internal-rpc-authority-verifier
  labels:
    app.kubernetes.io/name: internal-rpc-authority
    app.kubernetes.io/component: verifier
spec:
  selector:
    matchLabels:
      kodex.dev/internal-rpc-authority-verifier: enabled
  podMetricsEndpoints:
    - port: auth-metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 5s
