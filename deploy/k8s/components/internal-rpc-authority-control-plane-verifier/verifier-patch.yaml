# Привязки control-plane, resolver mounts, имя metrics-порта и порядок; runtime verifier общий.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  template:
    spec:
      containers:
      - name: control-plane
        env:
        - {name: INTERNAL_RPC_AUTHORITY_VERIFIER_SOCKET, value: /run/kodex/internal-rpc-authority/verifier.sock}
        - {name: INTERNAL_RPC_AUTHORITY_LOCAL_ROLE, value: verifier}
        volumeMounts:
        - {name: internal-rpc-authority-sockets, mountPath: /run/kodex, readOnly: true}
        - {name: internal-rpc-authority-resolver-key, mountPath: /var/run/secrets/kodex/internal-rpc-authority/proof-signer, readOnly: true}
        - {name: internal-rpc-authority-resolver-trust, mountPath: /var/run/config/kodex/internal-rpc-authority/authority-proof-trust, readOnly: true}
      - name: internal-rpc-authority-verifier
        env:
        - name: DEPLOYMENT_ENVIRONMENT
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_TLS_SERVER_NAME
        - name: OTEL_EXPORTER_OTLP_CA_FILE
        - name: OTEL_TRACES_SAMPLER_ARG
        - name: SENTRY_DSN_FILE
        - name: SENTRY_EXPECTED_HOST
        - {name: INTERNAL_RPC_AUTHORITY_WORKLOAD_ID, value: control-plane}
        - {name: INTERNAL_RPC_AUTHORITY_WORKLOAD_SPIFFE_ID, value: 'spiffe://kodex.local/ns/kodex-system/sa/control-plane'}
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_ADDRESS
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_TLS_SERVER_NAME
        - name: INTERNAL_RPC_AUTHORITY_READBACK_ATTESTOR_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_RESTORE_CONTROLLER_CA_FILE
        - name: INTERNAL_RPC_AUTHORITY_TECHNICAL_LISTEN
        - name: INTERNAL_RPC_AUTHORITY_STARTUP_TIMEOUT
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_UID
        - name: INTERNAL_RPC_AUTHORITY_EXPECTED_PEER_GID
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_DSN_FILE
        - name: INTERNAL_RPC_AUTHORITY_POSTGRES_EXPECTED_SESSION_USER
          valueFrom:
            secretKeyRef: {name: internal-rpc-authority-control-plane-verifier-postgresql, key: username}
        ports:
        - {name: auth-metrics, containerPort: 9092, protocol: TCP}
        readinessProbe: {httpGet: {path: /readyz, port: auth-metrics}, timeoutSeconds: 3, periodSeconds: 5}
        startupProbe: {httpGet: {path: /healthz, port: auth-metrics}, timeoutSeconds: 2, periodSeconds: 2, failureThreshold: 60}
        livenessProbe: {httpGet: {path: /healthz, port: auth-metrics}, timeoutSeconds: 2, periodSeconds: 10}
        volumeMounts:
        - mountPath: /run/kodex
        - mountPath: /var/run/config/kodex/internal-rpc-authority/snapshot
        - mountPath: /var/run/config/kodex/internal-rpc-authority/manifest-trust
        - {name: internal-rpc-authority-resolver-key, mountPath: /var/run/secrets/kodex/internal-rpc-authority/proof-signer, readOnly: true}
        - {name: internal-rpc-authority-resolver-trust, mountPath: /var/run/config/kodex/internal-rpc-authority/authority-proof-trust, readOnly: true}
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/workload-tls
        - mountPath: /var/run/config/kodex/internal-rpc-authority/readback
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/controller-trust
        - mountPath: /var/run/config/kodex/internal-rpc-authority/restore/role-trust
        - {name: internal-rpc-authority-postgresql, mountPath: /var/run/secrets/kodex/internal-rpc-authority/postgres, readOnly: true}
        - mountPath: /var/run/config/kodex/internal-rpc-authority/postgresql
        - mountPath: /var/run/config/kodex/internal-rpc-authority/observability
        - mountPath: /var/run/secrets/kodex/internal-rpc-authority/observability
        - mountPath: /usr/local/share/internal-rpc-authority/manifest-root
        - {name: authority-readback-credential, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/credential, readOnly: true}
        - {name: authority-readback-possession, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/possession, readOnly: true}
        - {name: authority-restore-credential, mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/credential, readOnly: true}
        - {name: authority-restore-ack, mountPath: /var/run/secrets/kodex/internal-rpc-authority/restore/ack, readOnly: true}
        - {name: authority-resolver-readback-credential, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/resolver-credential, readOnly: true}
        - {name: authority-resolver-readback-possession, mountPath: /var/run/secrets/kodex/internal-rpc-authority/readback/resolver-possession, readOnly: true}
      volumes:
      - name: authority-bootstrap-roots
        secret:
          secretName: internal-rpc-authority-bootstrap-roots
          defaultMode: 292
          items:
          - {key: manifest-root-public.jwk, path: bootstrap-public.jwk}
          - {key: manifest-root-metadata.json, path: bootstrap-metadata.json}
      - name: internal-rpc-authority-sockets
        emptyDir: {medium: '', sizeLimit: 32Mi}
      - name: internal-rpc-authority-snapshot
        secret: {secretName: internal-rpc-authority-snapshot, defaultMode: 288}
      - name: internal-rpc-authority-manifest-trust
        secret: {secretName: internal-rpc-authority-control-plane-manifest-trust, defaultMode: 292}
      - name: internal-rpc-authority-resolver-key
        secret: {secretName: internal-rpc-authority-control-plane-resolver-key, defaultMode: 292}
      - name: internal-rpc-authority-resolver-trust
        secret: {secretName: internal-rpc-authority-control-plane-resolver-trust, defaultMode: 292}
      - name: internal-rpc-authority-workload-tls
        secret: {secretName: internal-rpc-authority-control-plane-workload-tls, defaultMode: 288}
      - name: internal-rpc-authority-readback-attestor-ca
        configMap: {name: internal-rpc-authority-readback-attestor-ca, defaultMode: 288}
      - name: internal-rpc-authority-restore-controller-ca
        configMap: {name: internal-rpc-authority-restore-controller-ca, defaultMode: 288}
      - name: internal-rpc-authority-restore-controller-certificate
        secret:
          secretName: internal-rpc-authority-restore-controller-tls
          defaultMode: 288
          items:
          - {key: tls.crt, path: tls.crt}
      - name: internal-rpc-authority-restore-role-trust
        secret:
          secretName: internal-rpc-authority-restore-role-trust
          defaultMode: 288
          items:
          - {key: restore-role-trust.jws, path: restore-role-trust.jws}
      - name: internal-rpc-authority-postgresql
        secret:
          secretName: internal-rpc-authority-control-plane-verifier-postgresql
          defaultMode: 288
          items:
          - {key: dsn, path: dsn}
      - name: internal-rpc-authority-postgresql-ca
        configMap: {name: internal-rpc-authority-postgresql-ca, defaultMode: 288}
      - name: internal-rpc-authority-observability
        configMap:
          name: internal-rpc-authority-otel-ca
          defaultMode: 288
          items:
          - {key: ca.pem, path: otel-ca.pem}
      - name: internal-rpc-authority-sentry-dsn
        secret:
          secretName: internal-rpc-authority-sentry
          defaultMode: 288
          items:
          - {key: dsn, path: sentry-dsn}
      - name: authority-readback-credential
        secret: {secretName: internal-rpc-authority-control-plane-verifier-readback-credential, defaultMode: 292}
      - name: authority-readback-possession
        secret: {secretName: internal-rpc-authority-control-plane-verifier-readback-possession, defaultMode: 292}
      - name: authority-restore-credential
        secret: {secretName: internal-rpc-authority-control-plane-verifier-restore-credential, defaultMode: 292}
      - name: authority-restore-ack
        secret: {secretName: internal-rpc-authority-control-plane-verifier-restore-ack, defaultMode: 292}
      - name: authority-resolver-readback-credential
        secret: {secretName: internal-rpc-authority-control-plane-resolver-readback-credential, defaultMode: 292}
      - name: authority-resolver-readback-possession
        secret: {secretName: internal-rpc-authority-control-plane-resolver-readback-possession, defaultMode: 292}
