# Только прежние policy names. Позиционные restore guards сохраняют отдельные API/owner endpoints и порядок.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- path: postgres.patch.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (backup-controller-exact-local-paths|internal-rpc-authority-publisher-exact-paths|internal-rpc-authority-readback-attestor-exact-paths|internal-rpc-authority-restore-controller-exact-paths|internal-rpc-authority-restore-jobs-exact-paths)
- path: dns.patch.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (backup-controller-exact-local-paths|control-api-gateway-exact-runtime-paths|session-archive-exact-paths|internal-rpc-authority-publisher-exact-paths|internal-rpc-authority-readback-attestor-exact-paths|internal-rpc-authority-restore-controller-exact-paths|internal-rpc-authority-restore-jobs-exact-paths|internal-rpc-authority-restore-pitr-telemetry|seaweedfs-exact-local-paths|seaweedfs-bucket-bootstrap-exact-paths)
- path: control-plane.patch.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (control-api-gateway-exact-runtime-paths|session-archive-exact-paths)
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (internal-rpc-authority-restore-controller-exact-paths)
  patch: |
    - op: test
      path: /spec/egress/2/ports/0/port
      value: 443
    - op: test
      path: /spec/egress/3/to/0/podSelector/matchLabels/app.kubernetes.io~1name
      value: internal-rpc-authority-publisher
    - op: test
      path: /spec/egress/3/ports/0/port
      value: 8444
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (internal-rpc-authority-restore-jobs-exact-paths)
  patch: |
    - op: test
      path: /spec/egress/2/ports/0/port
      value: 443
    - op: test
      path: /spec/egress/3/to/0/podSelector/matchLabels/app.kubernetes.io~1name
      value: internal-rpc-authority-restore-controller
    - op: test
      path: /spec/egress/3/ports/0/port
      value: 8443
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (internal-rpc-authority-restore-controller-exact-paths|internal-rpc-authority-restore-jobs-exact-paths)
  patch: |
    - op: move
      from: /spec/egress/0
      path: /spec/egress/3
    - op: move
      from: /spec/egress/0
      path: /spec/egress/2
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
    name: (internal-rpc-authority-restore-pitr-telemetry)
  patch: |
    - op: test
      path: /spec/egress/1/ports/0/port
      value: 443
    - op: move
      from: /spec/egress/0
      path: /spec/egress/1
