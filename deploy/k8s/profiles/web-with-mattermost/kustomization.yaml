apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattercodex-system
resources:
  - namespace.yaml
  - ../../base/platform-endpoints
  - ../../overlays/production/internal-rpc-authority
  - ../../overlays/production/image-supply-chain
  - ../../overlays/production/control-plane
  - ../../overlays/production/egress-gateway
  - ../../overlays/production/role-image-builder
  - ../../overlays/production/runtime-controller
  - ../../overlays/production/integration-gateway
  - ../../overlays/production/automation-scheduler
  - ../../overlays/production/control-api-gateway
  - ../../overlays/production/staff-control-center
  - ../../overlays/production/interaction-gateway
  - control-plane-interaction-grant-trust.yaml
patches:
  - path: control-plane-patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: internal-rpc-authority-publisher
    patch: |-
      - op: add
        path: /rules/0/resourceNames/-
        value: internal-rpc-authority-interaction-gateway-issuer-delivery
      - op: add
        path: /rules/0/resourceNames/-
        value: internal-rpc-authority-interaction-gateway-issuer-key
      - op: add
        path: /rules/0/resourceNames/-
        value: internal-rpc-authority-interaction-gateway-manifest-trust
      - op: add
        path: /rules/0/resourceNames/-
        value: internal-rpc-authority-interaction-gateway-proof-trust
configMapGenerator:
  - name: internal-rpc-authority-publisher-target-registry
    behavior: merge
    files:
      - key-delivery-targets.yaml
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: mattercodex
      mattercodex.dev/environment: production
      mattercodex.dev/profile: web-with-mattermost
    includeSelectors: false
    includeTemplates: true
