apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/platform-worker-grant-instances
resources:
  - namespace.yaml
  - runtime-namespace.yaml
  - ../platform-common
generatorOptions:
  disableNameSuffixHash: true
transformers:
  - bundle-cluster-scope-transformer.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: kodex
      kodex.dev/environment: production
      kodex.dev/profile: web-with-mattermost
    includeSelectors: false
    includeTemplates: true
