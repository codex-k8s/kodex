apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-plane-interaction-grant-trust
spec:
  provider: vault
  parameters:
    roleName: control-plane
    audience: vault
    objects: |
      - objectName: "interaction-gateway.platform-worker.public.jwk"
        secretPath: "kv/data/mattercodex/platform-worker-grants/interaction-gateway"
        secretKey: "public-jwk"
        filePermission: 292
