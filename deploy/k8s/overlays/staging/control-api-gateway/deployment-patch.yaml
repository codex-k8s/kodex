apiVersion: apps/v1
kind: Deployment
metadata: {name: control-api-gateway}
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: control-api-gateway
          env:
            - {name: CONTROL_API_GATEWAY_ALLOWED_ORIGINS, value: "https://control.staging.kodex.local"}
            - {name: CONTROL_API_GATEWAY_PUBLIC_TLS_SERVER_NAME, value: control-api.staging.kodex.local}
