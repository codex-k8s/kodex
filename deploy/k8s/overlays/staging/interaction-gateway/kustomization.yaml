apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/interaction-gateway
configMapGenerator:
  - name: interaction-gateway-runtime
    behavior: merge
    literals:
      - INTERACTION_GATEWAY_ARTIFACT_DOWNLOAD_BASE_URL=https://interaction-artifacts.staging.mattercodex.dev
      - INTERACTION_GATEWAY_MATTERMOST_MAPPING_EXPECTED_REVISION=staging-r1
patches:
  - path: deployment-patch.yaml
  - target: {group: secrets.hashicorp.com, version: v1beta1, kind: VaultStaticSecret, name: interaction-gateway-mapping}
    patch: |-
      - op: replace
        path: /spec/path
        value: mattercodex/interaction-gateway/mapping/staging/revisions/staging-r1
  - target: {group: networking.k8s.io, version: v1, kind: Ingress, name: interaction-gateway-artifacts}
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: interaction-artifacts.staging.mattercodex.dev
      - op: replace
        path: /spec/tls/0/secretName
        value: interaction-gateway-artifacts-staging-tls
      - op: replace
        path: /spec/rules/0/host
        value: interaction-artifacts.staging.mattercodex.dev
  - target: {group: secrets.hashicorp.com, version: v1beta1, kind: VaultStaticSecret, name: interaction-gateway-bot-tokens}
    patch: |-
      - op: replace
        path: /spec/path
        value: mattercodex/interaction-gateway/bot-tokens/staging
labels:
  - pairs: {mattercodex.dev/environment: staging}
    includeSelectors: false
    includeTemplates: true
