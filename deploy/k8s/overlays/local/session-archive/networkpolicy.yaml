apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-archive-worker-object-storage
  namespace: kodex-runtime
spec:
  podSelector:
    matchLabels:
      session-archive.kodex.dev/managed: "true"
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/component: object-storage
      ports:
        - { protocol: TCP, port: 8333 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-session-archive-runtime-ingress
  namespace: kodex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: object-storage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kodex-runtime
          podSelector:
            matchLabels:
              session-archive.kodex.dev/managed: "true"
      ports:
        - { protocol: TCP, port: 8333 }
