apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-rpc-authority-database-credential-reconciler
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: reconciler
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
