    "title": "Закрытый Prometheus-compatible provider subset",
    "version": "1.0.0",
    "description": "Prometheus3.14.0 / Thanos0.42.5; типизированные чтения endpoint. timeout и lookback_delta принудительны для query. limit применяется только Prometheus; Thanos не поддерживает query result limit, его ответы проверяет bounded consumer. Синтаксис и история AST не доказывают лимиты CPU/memory."
