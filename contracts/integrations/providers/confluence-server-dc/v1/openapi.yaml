openapi: 3.0.3
info:
  version: 1.0.0
  description: Самостоятельно описанный ограниченный контракт по официальной документации;
    это не полный официальный OpenAPI и не grant.
  title: Confluence Server / Data Center — ограниченный REST v1
security:
- bearerAuth: []
- basicAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Identity:
      type: object
      properties:
        type:
          type: string
          enum:
          - known
        userKey:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
        displayName:
          type: string
      additionalProperties: true
      required:
      - type
      - userKey
      - username
      - displayName
    Space:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        key:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - key
      - name
    Storage:
      type: object
      properties:
        value:
          type: string
        representation:
          type: string
          enum:
          - storage
      additionalProperties: true
      required:
      - value
      - representation
    Page:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          enum:
          - page
        title:
          type: string
        status:
          type: string
          enum:
          - current
        space:
          type: object
          properties:
            key:
              type: string
          additionalProperties: true
          required:
          - key
        version:
          type: object
          properties:
            number:
              type: integer
              minimum: 1
              maximum: 2147483647
          additionalProperties: true
          required:
          - number
        ancestors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
            additionalProperties: true
            required:
            - id
        body:
          type: object
          properties:
            storage:
              $ref: '#/components/schemas/Storage'
          additionalProperties: true
          required:
          - storage
      additionalProperties: true
      required:
      - id
      - type
      - title
      - status
      - space
      - version
    PageList:
      type: object
      properties:
        start:
          type: integer
          minimum: 0
          maximum: 10000
        limit:
          type: integer
          minimum: 1
          maximum: 50
        size:
          type: integer
          minimum: 0
          maximum: 50
        results:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        _links:
          type: object
          properties:
            next:
              type: string
          additionalProperties: true
      additionalProperties: true
      required:
      - start
      - limit
      - size
      - results
      - _links
