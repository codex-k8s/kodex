          - desc
      responses:
        '200':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MergeRequest'
                maxItems: 100
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: gitlab.merge_request.create
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      responses:
        '201':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequest'
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequestInput'
  /projects/{project}/merge_requests/{merge_request_iid}:
    get:
      operationId: gitlab.merge_request.read
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/MergeRequestIID'
      responses:
        '200':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequest'
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /projects/{project}/pipelines/{pipeline_id}:
    get:
      operationId: gitlab.pipeline.read
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/PipelineID'
      responses:
        '200':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /projects/{project}/repository/files/{file_path}:
    get:
      operationId: gitlab.repository.file.read
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
