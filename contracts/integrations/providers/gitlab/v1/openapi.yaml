              schema:
                type: object
                additionalProperties: true
  /projects/{project}/repository/branches:
    post:
      operationId: gitlab.branch.create
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      responses:
        '201':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
  /projects/{project}/repository/branches/{branch}:
    get:
      operationId: gitlab.branch.read
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Branch'
      responses:
        '200':
          description: Успешный типизированный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Отказ либо ошибка; payload не является доказательством прав.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /projects/{project}/merge_requests:
    get:
      operationId: gitlab.merge_request.list
      description: Ограниченный проверяемый контракт; право вызова определяется Definition/Connection/Grant
        и текущим ключом.
      parameters:
      - $ref: '#/components/parameters/Project'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: scope
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: state
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: search
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: in
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: source_branch
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: target_branch
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: order_by
        in: query
        required: false
        schema:
