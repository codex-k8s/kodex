openapi: 3.0.3
info:
  version: 1.2.0
  description: Самостоятельно описанный ограниченный контракт по официальной документации;
    это не полный официальный OpenAPI и не grant.
  title: Jira Server / Data Center — ограниченный REST v2
security:
- bearerAuth: []
- basicAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        key:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - key
      - name
    Identity:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
        displayName:
          type: string
        active:
          type: boolean
      additionalProperties: true
      required:
      - key
      - name
      - displayName
    Issue:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        key:
          type: string
        fields:
          type: object
          properties:
            project:
              type: object
              properties:
                key:
                  type: string
                id:
                  type: string
                  minLength: 1
                  maxLength: 26
              additionalProperties: true
              required:
              - key
            summary:
              type: string
            description:
              type: string
              nullable: true
            labels:
              type: array
              items:
                type: string
            status:
              type: object
              properties:
                name:
                  type: string
              additionalProperties: true
              required:
              - name
            creator:
              $ref: '#/components/schemas/RecoveryAuthor'
            issuetype:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
              additionalProperties: true
          additionalProperties: true
          required:
          - project
          - summary
          - status
      additionalProperties: true
      required:
      - id
      - key
      - fields
    SearchPage:
      type: object
      properties:
        startAt:
          type: integer
          minimum: 0
        maxResults:
          type: integer
          minimum: 1
          maximum: 2147483647
        total:
          type: integer
          minimum: 0
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      additionalProperties: true
      required:
      - startAt
      - maxResults
      - total
      - issues
    CreatedIssue:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        key:
          type: string
      additionalProperties: true
      required:
      - id
      - key
    CreatedComment:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: true
      required:
      - id
    Transitions:
      type: object
      properties:
        transitions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
              name:
                type: string
              fields:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    required:
                      type: boolean
                  additionalProperties: true
                  required:
                  - required
            additionalProperties: true
            required:
            - id
            - name
            - fields
      additionalProperties: true
      required:
      - transitions
    RecoveryAuthor:
      type: object
      required:
      - key
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: true
    RecoveryComment:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 26
        body:
          type: string
        author:
          $ref: '#/components/schemas/RecoveryAuthor'
        updateAuthor:
          $ref: '#/components/schemas/RecoveryAuthor'
      required:
      - id
      - body
      - author
      - updateAuthor
      additionalProperties: true
    RecoveryComments:
      type: object
      properties:
        startAt:
          type: integer
          minimum: 0
        maxResults:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        comments:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecoveryComment'
      required:
      - startAt
      - maxResults
      - total
      - comments
      additionalProperties: true
