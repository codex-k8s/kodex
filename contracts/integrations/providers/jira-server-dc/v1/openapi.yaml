  /rest/api/2/mypermissions:
    get:
      operationId: jira.permissions.read
      description: Внутренняя предпосылка personal WRITE, не capability и не отдельный
        tool. Runtime задаёт ровно projectKey для create либо issueKey для comment/transition.
      parameters:
      - name: projectKey
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: issueKey
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 96
      responses:
        '200':
          description: Права текущего пользователя только в запрошенном контексте.
          content:
            application/json:
              schema:
                type: object
                required:
                - permissions
                properties:
                  permissions:
                    type: object
                    maxProperties: 1024
                    additionalProperties:
                      type: object
                      required:
                      - key
                      - type
                      - havePermission
                      properties:
                        key:
                          type: string
                        type:
                          type: string
                          enum:
                          - GLOBAL
                          - PROJECT
                        havePermission:
                          type: boolean
                        deprecatedKey:
                          type: boolean
                      additionalProperties: true
                additionalProperties: true
        '401':
          description: Аутентификация отклонена, внешний эффект не начинается.
        '403':
          description: Доступ к проверке отклонён, внешний эффект не начинается.
        '404':
          description: Контекст недоступен, внешний эффект не начинается.
        '429':
          description: Исчерпан лимит, автоматическая запись не выполняется.
