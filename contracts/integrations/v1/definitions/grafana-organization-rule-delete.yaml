{
  "apiVersion": "integrations.kodex.io/v1",
  "kind": "IntegrationPackage",
  "metadata": {
    "key": "grafana-organization-rule-delete",
    "version": "1.0.0",
    "origin": "SHIPPED"
  },
  "spec": {
    "name": "Grafana — удаление правил API-only организации",
    "description": "Отдельный явный scope; доступен только с действующим operator evidence точного backend/version/key. Проверка не выдаёт grant и не расширяет существующие connections.",
    "category": "observability",
    "adapter": "OBSERVABILITY",
    "adapterOwner": "integration-gateway",
    "executionRoute": "MANAGED_MCP",
    "readiness": "READY",
    "credential": {
      "secretKey": "api_token",
      "kind": "TOKEN"
    },
    "configurationFields": [
      {
        "key": "base_url",
        "type": "STRING",
        "format": "HTTPS_ORIGIN",
        "required": true,
        "maximumLength": 2048,
        "label": "Адрес Grafana API",
        "help": "Точный HTTPS origin; обязательны operator-pinned native transport и TLS."
      },
      {
        "key": "organization_id",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 20,
        "label": "Организация Grafana",
        "help": "Положительный numeric ID текущей организации токена; проверяется сервером."
      },
      {
        "key": "scope_mode",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 48,
        "label": "Область доступа",
        "help": "Явная whole-organization область для удаления правил; нужна API-only организация с operator evidence. Dashboard grant не расширяется.",
        "allowedValues": [
          "API_ONLY_ORGANIZATION_RULE_DELETE"
        ]
      }
    ],
    "networkDestinations": [
      {
        "key": "grafana_api",
        "source": "CONFIGURATION",
        "configurationField": "base_url",
        "port": 443,
        "tls": "REQUIRED"
      }
    ],
    "healthCheck": {
      "operation": "grafana.connection.read",
      "timeoutSeconds": 15,
      "maxAttempts": 1
    },
    "capabilities": [
      {
        "key": "grafana.connection.read",
        "name": "Проверить подключение",
        "description": "Проверить подключение в явно выбранной организации.",
        "operation": "grafana.connection.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.rule.list",
        "name": "Перечислить alert rules",
        "description": "Перечислить alert rules в явно выбранной организации.",
        "operation": "grafana.rule.list",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.rule.read",
        "name": "Прочитать alert rule",
        "description": "Прочитать alert rule в явно выбранной организации.",
        "operation": "grafana.rule.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "rule_uid",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "maximumLength": 100,
            "label": "Alert rule",
            "help": "Буквальный UID без path/query."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.rule.delete",
        "name": "Удалить правило",
        "description": "Удалить API-managed правило только в подтверждённой API-only организации.",
        "operation": "grafana.rule.delete",
        "risk": "DESTRUCTIVE",
        "approvalPolicy": "HUMAN_EACH_EFFECT",
        "allowedApprovalPolicies": [
          "HUMAN_EACH_EFFECT"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "rule_uid",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "label": "UID правила",
            "help": "UID правила; значение проверяется закрытым типизированным consumer.",
            "maximumLength": 40
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "EFFECT_KEY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      }
    ]
  }
}
