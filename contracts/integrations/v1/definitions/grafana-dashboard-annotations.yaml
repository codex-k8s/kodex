{
  "apiVersion": "integrations.kodex.io/v1",
  "kind": "IntegrationPackage",
  "metadata": {
    "key": "grafana-dashboard-annotations",
    "version": "1.0.0",
    "origin": "SHIPPED"
  },
  "spec": {
    "name": "Grafana — аннотации выбранного dashboard",
    "description": "Отдельный явный scope; доступен только с действующим operator evidence точного backend/version/key. Проверка не выдаёт grant и не расширяет существующие connections.",
    "category": "observability",
    "adapter": "OBSERVABILITY",
    "adapterOwner": "integration-gateway",
    "executionRoute": "MANAGED_MCP",
    "readiness": "READY",
    "credential": {
      "secretKey": "api_token",
      "kind": "TOKEN"
    },
    "configurationFields": [
      {
        "key": "base_url",
        "type": "STRING",
        "format": "HTTPS_ORIGIN",
        "required": true,
        "maximumLength": 2048,
        "label": "Адрес Grafana API",
        "help": "Точный HTTPS origin; обязательны operator-pinned native transport и TLS."
      },
      {
        "key": "organization_id",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 20,
        "label": "Организация Grafana",
        "help": "Положительный numeric ID текущей организации токена; проверяется сервером."
      },
      {
        "key": "scope_mode",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 48,
        "label": "Область доступа",
        "help": "Только аннотации выбранного dashboard в подтверждённом legacy SQL backend; grant не охватывает другие dashboard либо всю организацию.",
        "allowedValues": [
          "DASHBOARD_ANNOTATIONS"
        ]
      },
      {
        "key": "dashboard_uid",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "label": "UID выбранного dashboard",
        "help": "UID выбранного dashboard; значение проверяется закрытым типизированным consumer.",
        "maximumLength": 40
      }
    ],
    "networkDestinations": [
      {
        "key": "grafana_api",
        "source": "CONFIGURATION",
        "configurationField": "base_url",
        "port": 443,
        "tls": "REQUIRED"
      }
    ],
    "healthCheck": {
      "operation": "grafana.connection.read",
      "timeoutSeconds": 15,
      "maxAttempts": 1
    },
    "capabilities": [
      {
        "key": "grafana.connection.read",
        "name": "Проверить подключение",
        "description": "Проверить подключение в явно выбранной организации.",
        "operation": "grafana.connection.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.annotation.list",
        "name": "Перечислить аннотации",
        "description": "Перечислить аннотации в явно выбранной организации.",
        "operation": "grafana.annotation.list",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [
          {
            "key": "start",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало периода",
            "help": "Явный UTC RFC3339 timestamp; окно не более24часов."
          },
          {
            "key": "end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец периода",
            "help": "Явный UTC RFC3339 timestamp; окно не более24часов."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.annotation.read",
        "name": "Прочитать аннотацию",
        "description": "Прочитать аннотацию в явно выбранной организации.",
        "operation": "grafana.annotation.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [
          {
            "key": "annotation_id",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "maximumLength": 20,
            "label": "Аннотация",
            "help": "Точный положительный numeric ID; ownership выводится из текущего provider state."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.annotation.create",
        "name": "Создать аннотацию",
        "description": "Создать аннотацию в явно выбранной организации.",
        "operation": "grafana.annotation.create",
        "risk": "WRITE",
        "approvalPolicy": "HUMAN_EACH_EFFECT",
        "allowedApprovalPolicies": [
          "HUMAN_EACH_EFFECT"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 2000,
            "label": "Текст аннотации",
            "help": "Точное содержимое записи; scope и HTTP payload строит сервер."
          },
          {
            "key": "time",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало аннотации",
            "help": "UTC RFC3339 timestamp с точностью до миллисекунд."
          },
          {
            "key": "time_end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец аннотации",
            "help": "UTC RFC3339 timestamp с точностью до миллисекунд, не позже24часов после начала."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "EFFECT_KEY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.annotation.update",
        "name": "Изменить аннотацию",
        "description": "Изменить аннотацию в явно выбранной организации.",
        "operation": "grafana.annotation.update",
        "risk": "WRITE",
        "approvalPolicy": "HUMAN_EACH_EFFECT",
        "allowedApprovalPolicies": [
          "HUMAN_EACH_EFFECT"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [
          {
            "key": "annotation_id",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "maximumLength": 20,
            "label": "Аннотация",
            "help": "Точный положительный numeric ID; ownership выводится из текущего provider state."
          },
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 2000,
            "label": "Текст аннотации",
            "help": "Точное содержимое записи; scope и HTTP payload строит сервер."
          },
          {
            "key": "time",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало аннотации",
            "help": "UTC RFC3339 timestamp с точностью до миллисекунд."
          },
          {
            "key": "time_end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец аннотации",
            "help": "UTC RFC3339 timestamp с точностью до миллисекунд, не позже24часов после начала."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "EFFECT_KEY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.annotation.delete",
        "name": "Удалить аннотацию",
        "description": "Удалить аннотацию в явно выбранной организации.",
        "operation": "grafana.annotation.delete",
        "risk": "DESTRUCTIVE",
        "approvalPolicy": "HUMAN_EACH_EFFECT",
        "allowedApprovalPolicies": [
          "HUMAN_EACH_EFFECT"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [
          {
            "key": "annotation_id",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "maximumLength": 20,
            "label": "Аннотация",
            "help": "Точный положительный numeric ID; ownership выводится из текущего provider state."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "EFFECT_KEY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "grafana.dashboard.read",
        "name": "Прочитать dashboard",
        "description": "Прочитать dashboard в точной области чтения dashboard.",
        "operation": "grafana.dashboard.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "scope_mode",
            "dashboard_uid"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      }
    ]
  }
}
