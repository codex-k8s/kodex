{
  "apiVersion": "integrations.kodex.io/v1",
  "kind": "IntegrationPackage",
  "metadata": {
    "key": "grafana-organization",
    "version": "1.0.0",
    "origin": "SHIPPED"
  },
  "spec": {
    "name": "Grafana — вся организация",
    "description": "Явный доступ к организации Grafana: типизированные аннотации и подавления под EACH Gate, чтение alert rules. Dashboard-only grant автоматически не расширяется.",
    "category": "observability",
    "adapter": "OBSERVABILITY",
    "adapterOwner": "integration-gateway",
    "executionRoute": "MANAGED_MCP",
    "readiness": "READY",
    "credential": {
      "secretKey": "api_token",
      "kind": "TOKEN"
    },
    "configurationFields": [
      {
        "key": "base_url",
        "type": "STRING",
        "format": "HTTPS_ORIGIN",
        "required": true,
        "maximumLength": 2048,
        "label": "Адрес Grafana API",
        "help": "Точный HTTPS origin; обязательны operator-pinned native transport и TLS."
      },
      {
        "key": "organization_id",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 20,
        "label": "Организация Grafana",
        "help": "Положительный numeric ID текущей организации токена; проверяется сервером."
      },
      {
        "key": "datasource_uid",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 100,
        "label": "Источник Prometheus",
        "help": "Точный UID одного источника; URL, plugin config и credentials не выдаются."
      },
      {
        "key": "scope_mode",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 48,
        "label": "Область доступа",
        "help": "Grant охватывает всю выбранную организацию, включая annotation/silence effects.",
        "allowedValues": [
          "WHOLE_ORGANIZATION"
        ]
      }
    ],
    "networkDestinations": [
      {
        "key": "grafana_api",
        "source": "CONFIGURATION",
        "configurationField": "base_url",
        "port": 443,
        "tls": "REQUIRED"
      }
    ],
    "healthCheck": {
      "operation": "grafana.connection.read",
      "timeoutSeconds": 15,
      "maxAttempts": 1
    },
    "capabilities": [
      {
        "key": "grafana.connection.read",
        "name": "Проверить подключение",
        "description": "Проверить подключение в явно выбранной организации.",
        "operation": "grafana.connection.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "organization_id",
            "datasource_uid",
            "scope_mode"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
