apiVersion: integrations.kodex.io/v1
kind: IntegrationPackage
metadata:
  key: kubernetes-managed
  version: 1.0.0
  origin: SHIPPED
spec:
  name: Управляемый Kubernetes
  description: Типизированные Kubernetes operations через private broker с отдельными identity, namespace grants, current permissions и effect gates.
  category: infrastructure
  adapter: KUBERNETES
  adapterOwner: integration-gateway
  executionRoute: MANAGED_MCP
  readiness: READY
  credential: {kind: BROKER_IDENTITY, brokerPurpose: KUBERNETES_TARGET}
  configurationFields:
    - {key: target_ref, label: Выбранный Kubernetes target, help: Ссылка на настроенный оператором target без kubeconfig или URL., type: STRING, format: IDENTIFIER, required: true, maximumLength: 96}
    - {key: service_subject_ref, label: Служебная identity, help: Только для явно выбранного PROJECT_SHARED. Владелец проверяет активный SERVICE и права управления., type: STRING, format: IDENTIFIER, required: false, maximumLength: 96}
  networkDestinations:
    - {key: kubernetes_broker, source: STATIC, hostname: secret-broker.kodex-system.svc, port: 8443, tls: REQUIRED}
  healthCheck: {operation: kubernetes.identity, timeoutSeconds: 20, maxAttempts: 1}
  capabilities:
    - key: kubernetes.access
      name: "Проверить конкретное право"
      description: "Проверить конкретное право по exact target и namespace scope; broker заново проверяет identity, discovery и необходимые права."
      operation: kubernetes.access
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: ["NONE"]
      resourceScope: {kind: KUBERNETES_TARGET, connectionFields: [target_ref]}
      inputFields: []
      outputFields:
        - {key: result, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: outcome, type: STRING, format: PLAIN, required: true, maximumLength: 9, allowedValues: [SUCCEEDED, FAILED, UNKNOWN]}
        - {key: effect_ref, type: STRING, format: PLAIN, required: false, maximumLength: 256}
      execution: {leaseProfile: MANAGED_KUBERNETES_V1, idempotency: READ_ONLY, timeoutSeconds: 600, maxAttempts: 1, retryBackoffMilliseconds: 250}
    - key: kubernetes.annotate
      name: "Изменить annotations"
      description: "Изменить annotations по exact target и namespace scope; broker заново проверяет identity, discovery и необходимые права."
      operation: kubernetes.annotate
      risk: WRITE
      approvalPolicy: HUMAN_SCOPED
      allowedApprovalPolicies: ["HUMAN_SCOPED", "HUMAN_EACH_EFFECT"]
      approvalScope:
        name: Точный Kubernetes resource
        requiredInputPaths: ["/group", "/version", "/resource", "/namespace", "/name", "/uid"]
        limits: {durationSeconds: 604800, maxEffects: 10000}
        allowedLifetimes: [ROOT_RUN, INITIATOR_RESOURCE]
      resourceScope: {kind: KUBERNETES_TARGET, connectionFields: [target_ref]}
      inputFields: []
      outputFields:
        - {key: result, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: outcome, type: STRING, format: PLAIN, required: true, maximumLength: 9, allowedValues: [SUCCEEDED, FAILED, UNKNOWN]}
        - {key: effect_ref, type: STRING, format: PLAIN, required: false, maximumLength: 256}
      execution: {leaseProfile: MANAGED_KUBERNETES_V1, idempotency: ONE_ATTEMPT, timeoutSeconds: 600, maxAttempts: 1, retryBackoffMilliseconds: 250}
    - key: kubernetes.apply
      name: "Применить объект"
      description: "Применить объект по exact target и namespace scope; broker заново проверяет identity, discovery и необходимые права."
