apiVersion: integrations.kodex.io/v1
kind: IntegrationPackage
metadata:
  key: jira-server-dc
  version: 1.2.0
  origin: SHIPPED
spec:
  name: Jira Server / Data Center
  description: Ограниченный Server/DC REST-контракт с явно заданным context path и
    точным scope; Cloud-пакет выбирается отдельно.
  category: work-management
  adapter: JIRA
  adapterOwner: integration-gateway
  executionRoute: MANAGED_MCP
  readiness: READY
  credential:
    secretKey: token
    kind: TOKEN
  configurationFields:
  - key: base_url
    type: STRING
    format: HTTPS_ORIGIN
    required: true
    maximumLength: 2048
  - key: context_path
    type: STRING
    format: HTTPS_PATH
    required: true
    maximumLength: 128
  - key: auth_scheme
    type: STRING
    format: IDENTIFIER
    required: true
    maximumLength: 16
    allowedValues:
    - BASIC
    - BEARER
  - key: username
    type: STRING
    format: PLAIN
    required: false
    maximumLength: 256
  - key: project_key
    type: STRING
    format: IDENTIFIER
    required: true
    maximumLength: 64
  - key: issue_type
    type: STRING
    format: PLAIN
    required: true
    maximumLength: 120
  - key: issue_create_fields
    type: STRING
    format: PLAIN
    required: false
    maximumLength: 8192
  networkDestinations:
  - key: jira_api
    source: CONFIGURATION
    configurationField: base_url
    port: 443
    tls: REQUIRED
  healthCheck:
    operation: jira.project.read
    timeoutSeconds: 15
    maxAttempts: 3
  capabilities:
  - key: jira.identity.read
    name: Проверить текущую учётную запись
    description: Возвращает ограниченную identity текущей credential без выдачи новых
      прав.
    operation: jira.identity.read
    risk: READ
    approvalPolicy: NONE
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Область подключения"
      requiredInputPaths: []
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields: []
    outputFields:
    - key: id
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 256
    - key: username
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 256
    - key: display_name
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 512
    execution:
      idempotency: READ_ONLY
      timeoutSeconds: 20
      maxAttempts: 3
      retryBackoffMilliseconds: 250
  - key: jira.project.read
    name: Прочитать проект Jira
    description: Возвращает имя и ключ одного разрешённого проекта.
    operation: jira.project.read
    risk: READ
    approvalPolicy: NONE
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Область подключения"
      requiredInputPaths: []
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields: []
    outputFields:
    - key: id
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 64
    - key: key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 64
    - key: name
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 255
    execution:
      idempotency: READ_ONLY
      timeoutSeconds: 20
      maxAttempts: 3
      retryBackoffMilliseconds: 250
  - key: jira.issue.search
    name: Найти задачи
    description: Поиск по тексту только в одном настроенном проекте; raw JQL не принимается.
    operation: jira.issue.search
    risk: READ
    approvalPolicy: NONE
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Область подключения"
      requiredInputPaths: []
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: text
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 1024
    - key: limit
      type: INTEGER
      required: false
      minimum: 1
      maximum: 50
    - key: cursor
      type: STRING
      format: PLAIN
      required: false
      maximumLength: 2048
    outputFields:
    - key: count
      type: INTEGER
      required: true
      minimum: 0
      maximum: 50
    - key: issues
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 65536
    - key: next_cursor
      type: STRING
      format: PLAIN
      required: false
      maximumLength: 2048
    execution:
      idempotency: READ_ONLY
      timeoutSeconds: 30
      maxAttempts: 3
      retryBackoffMilliseconds: 300
  - key: jira.issue.read
    name: Прочитать задачу
    description: Возвращает безопасную проекцию одной задачи configured project.
    operation: jira.issue.read
    risk: READ
    approvalPolicy: NONE
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Задача"
      requiredInputPaths: ["/issue_key"]
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: issue_key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 80
    outputFields:
    - key: key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 80
    - key: summary
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 512
    - key: status
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 120
    - key: description
      type: STRING
      format: PLAIN
      required: false
      maximumLength: 65536
    execution:
      idempotency: READ_ONLY
      timeoutSeconds: 20
      maxAttempts: 3
      retryBackoffMilliseconds: 250
  - key: jira.issue.create
    name: Создать задачу
    description: Создаёт задачу настроенного типа с effect label после Human Gate.
      Необязательный fields_json — JSON-строка явных значений aliases из issue_create_fields
      подключения; например {"hours":0,"epic":"DEMO-42"}. reporter_self=true назначает
      только текущего внешнего пользователя reporter. Без этих полей прежний режим сохраняется.
    operation: jira.issue.create
    risk: WRITE
    approvalPolicy: HUMAN_EACH_EFFECT
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Область подключения"
      requiredInputPaths: []
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: summary
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 512
    - key: description
      type: STRING
      format: PLAIN
      required: false
      maximumLength: 65536
    - key: fields_json
      type: STRING
      format: PLAIN
      required: false
      maximumLength: 2048
    - key: reporter_self
      type: BOOLEAN
      required: false
    outputFields:
    - key: id
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 64
    - key: key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 80
    execution:
      idempotency: EFFECT_KEY
      timeoutSeconds: 30
      maxAttempts: 1
      retryBackoffMilliseconds: 500
  - key: jira.issue.comment.write
    name: Добавить комментарий
    description: Добавляет один ADF-комментарий с effect marker после Human Gate.
    operation: jira.issue.comment.write
    risk: WRITE
    approvalPolicy: HUMAN_EACH_EFFECT
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Задача"
      requiredInputPaths: ["/issue_key"]
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: issue_key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 80
    - key: body
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 65536
    outputFields:
    - key: comment_id
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 64
    - key: issue_key
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 80
    execution:
      idempotency: EFFECT_KEY
      timeoutSeconds: 30
      maxAttempts: 1
      retryBackoffMilliseconds: 500
  - key: jira.issue.transition.list
    name: Получить доступные переходы issue
    description: Получить доступные переходы issue в одном разрешённом проекте с ограниченным
      результатом и receipt.
    operation: jira.issue.transition.list
    risk: READ
    approvalPolicy: NONE
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Задача"
      requiredInputPaths: ["/issue_key"]
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: issue_key
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 256
    outputFields:
    - key: items
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 65536
    - key: count
      type: INTEGER
      required: true
      minimum: 0
      maximum: 100
    - key: next_cursor
      type: INTEGER
      required: false
      minimum: 1
      maximum: 10000
    execution:
      idempotency: READ_ONLY
      timeoutSeconds: 30
      maxAttempts: 3
      retryBackoffMilliseconds: 250
  - key: jira.issue.transition.apply
    name: Выполнить переход issue
    description: Выполнить переход issue в одном разрешённом проекте с ограниченным
      результатом и receipt.
    operation: jira.issue.transition.apply
    risk: WRITE
    approvalPolicy: HUMAN_EACH_EFFECT
    allowedApprovalPolicies: ["NONE", "HUMAN_EACH_EFFECT", "HUMAN_SCOPED"]
    approvalScope:
      name: "Задача"
      requiredInputPaths: ["/issue_key", "/transition_id"]
      limits: {"durationSeconds": 604800, "maxEffects": 10000}
      allowedLifetimes: ["ROOT_RUN", "INITIATOR_RESOURCE"]
    resourceScope:
      kind: JIRA_PROJECT
      connectionFields:
      - base_url
      - context_path
      - project_key
    inputFields:
    - key: issue_key
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 256
    - key: transition_id
      type: STRING
      format: PLAIN
      required: true
      maximumLength: 256
    outputFields:
    - key: accepted
      type: BOOLEAN
      required: true
    execution:
      idempotency: EFFECT_KEY
      timeoutSeconds: 30
      maxAttempts: 1
      retryBackoffMilliseconds: 250
