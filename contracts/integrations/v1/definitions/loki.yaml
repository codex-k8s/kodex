            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "start",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "end",
