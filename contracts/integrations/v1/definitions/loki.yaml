            "maximumLength": 40,
            "label": "Конец периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "match",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 2048,
            "label": "LogQL selector",
            "help": "Literal stream selector; pipeline и metric expression в metadata API не допускаются."
          },
          {
            "key": "label",
            "type": "STRING",
            "format": "IDENTIFIER",
            "required": true,
            "maximumLength": 100,
            "label": "Имя метки",
            "help": "Буквальное имя без HTTP path или query."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "loki.series.list",
        "name": "Перечислить ряды",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.series.list",
        "risk": "READ",
