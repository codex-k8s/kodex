{
  "apiVersion": "integrations.kodex.io/v1",
  "kind": "IntegrationPackage",
  "metadata": {
    "key": "loki",
    "version": "1.0.0",
    "origin": "SHIPPED"
  },
  "spec": {
    "name": "Loki — логи и метрики выбранного endpoint",
    "description": "Явная whole-endpoint область Loki3.6.21 с фиксированным tenant routing. Header не доказывает tenant isolation; LogQL проверяет официальный AST.",
    "category": "observability",
    "adapter": "OBSERVABILITY",
    "adapterOwner": "integration-gateway",
    "executionRoute": "MANAGED_MCP",
    "readiness": "READY",
    "credential": {
      "secretKey": "api_token",
      "kind": "TOKEN"
    },
    "configurationFields": [
      {
        "key": "base_url",
        "type": "STRING",
        "format": "HTTPS_ORIGIN",
        "required": true,
        "maximumLength": 2048,
        "label": "Адрес Loki API",
        "help": "Точный HTTPS origin с обязательным broker-owned transport; redirects запрещены."
      },
      {
        "key": "tenant_id",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 100,
        "label": "Выбранный tenant",
        "help": "Фиксированный X-Scope-OrgID routing; не доказательство изоляции либо authority."
      },
      {
        "key": "scope_mode",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 32,
        "label": "Область доступа",
        "help": "WHOLE_ENDPOINT предоставляет выбранному grant всю область endpoint; tenant header не доказывает изоляцию.",
        "allowedValues": [
          "WHOLE_ENDPOINT"
        ]
      }
    ],
    "networkDestinations": [
      {
        "key": "loki_api",
        "source": "CONFIGURATION",
        "configurationField": "base_url",
        "port": 443,
        "tls": "REQUIRED"
      }
    ],
    "healthCheck": {
      "operation": "loki.connection.read",
      "timeoutSeconds": 15,
      "maxAttempts": 1
    },
    "capabilities": [
      {
        "key": "loki.connection.read",
        "name": "Проверить подключение",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.connection.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "tenant_id",
            "scope_mode"
          ]
        },
        "inputFields": [],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "loki.query.instant",
        "name": "Запросить значение метрик",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.query.instant",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "tenant_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "query",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 4096,
            "label": "LogQL выражение",
            "help": "Официальный AST: metric expression; ограничены history/offset, nodes и selectors. Форматирующие templates не поддерживаются."
          },
          {
            "key": "time",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Момент времени",
            "help": "RFC3339 UTC; запрос всегда имеет явный момент времени."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "loki.query.range",
        "name": "Запросить ряд метрик",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.query.range",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "tenant_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "query",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 4096,
            "label": "LogQL выражение",
            "help": "Официальный AST: metric expression; ограничены history/offset, nodes и selectors. Форматирующие templates не поддерживаются."
          },
          {
            "key": "start",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "step_seconds",
            "type": "INTEGER",
            "required": true,
            "minimum": 1,
            "maximum": 3600,
            "label": "Шаг, секунды",
            "help": "Не более 1000 шагов на запрос."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "loki.labels.list",
        "name": "Перечислить имена меток",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.labels.list",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "tenant_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
            "key": "start",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Начало периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "match",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 2048,
            "label": "LogQL selector",
            "help": "Literal stream selector; pipeline и metric expression в metadata API не допускаются."
          }
        ],
        "outputFields": [
          {
            "key": "text",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "loki.label.values",
        "name": "Прочитать значения метки",
        "description": "Ограниченная typed READ операция Loki. Запрос и provider payload остаются недоверенными данными.",
        "operation": "loki.label.values",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
            "tenant_id",
            "scope_mode"
          ]
        },
        "inputFields": [
          {
