apiVersion: integrations.kodex.io/v1
kind: IntegrationPackage
metadata:
  key: github
  version: 4.0.0
  origin: SHIPPED
spec:
  name: GitHub
  description: Содержимое репозитория, ветки, коммиты, issue, pull requests, reviews, checks и Actions в одном разрешённом репозитории.
  category: source-control
  adapter: GITHUB
  adapterOwner: integration-gateway
  executionRoute: MANAGED_MCP
  readiness: READY
  credential:
    secretKey: token
    kind: TOKEN
  configurationFields:
    - key: owner
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 100
    - key: repository
      type: STRING
      format: IDENTIFIER
      required: true
      maximumLength: 100
  networkDestinations:
    - key: github_api
      source: STATIC
      hostname: api.github.com
      port: 443
      tls: REQUIRED
    - key: github_git
      source: STATIC
      hostname: github.com
      port: 443
      tls: REQUIRED
  healthCheck:
    operation: github.repository.metadata.read
    timeoutSeconds: 15
    maxAttempts: 3
  capabilities:
    - key: github.repository.metadata.read
      name: Прочитать метаданные репозитория
      description: Возвращает безопасную проекцию состояния одного разрешённого репозитория.
      operation: github.repository.metadata.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields: []
      outputFields:
        - {key: full_name, type: STRING, format: IDENTIFIER, required: true, maximumLength: 220}
        - {key: default_branch, type: STRING, format: IDENTIFIER, required: true, maximumLength: 255}
        - {key: visibility, type: STRING, format: IDENTIFIER, required: true, maximumLength: 32}
        - {key: private, type: BOOLEAN, required: true}
        - {key: archived, type: BOOLEAN, required: true}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 20
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.issue.create
      name: Создать issue
      description: Создаёт issue с детерминированной меткой эффекта после Human Gate.
      operation: github.issue.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 256}
        - {key: body, type: STRING, format: PLAIN, required: false, maximumLength: 65536}
      outputFields:
        - {key: number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 256}
        - {key: state, type: STRING, format: IDENTIFIER, required: true, maximumLength: 16}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 2
        retryBackoffMilliseconds: 500
    - key: github.issue.list
      name: Получить список issue
      description: Возвращает одну bounded страницу issue без pull requests и opaque provider payload.
      operation: github.issue.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {key: state, type: STRING, format: IDENTIFIER, required: false, maximumLength: 16, allowedValues: [open, closed, all]}
        - {key: limit, type: INTEGER, required: false, minimum: 1, maximum: 100}
        - {key: cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
      outputFields:
        - {key: count, type: INTEGER, required: true, minimum: 0, maximum: 100}
        - {key: issues, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: next_cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 20
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.issue.read
      name: Прочитать issue
      description: Возвращает bounded проекцию одного issue и закрыто отклоняет pull request.
      operation: github.issue.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {key: issue_number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
      outputFields:
        - {key: number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 256}
        - {key: state, type: STRING, format: IDENTIFIER, required: true, maximumLength: 16}
        - {key: body, type: STRING, format: PLAIN, required: false, maximumLength: 65536}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 20
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.issue.comment.create
      name: Добавить комментарий к issue
      description: Добавляет один комментарий с effect marker после Human Gate.
      operation: github.issue.comment.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [NONE, HUMAN_EACH_EFFECT, HUMAN_SCOPED]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {key: issue_number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: body, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
      outputFields:
        - {key: comment_id, type: INTEGER, required: true, minimum: 1, maximum: 9007199254740991}
        - {key: issue_number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 500
    - key: github.issue.update
      name: Обновить issue
      description: Изменяет только разрешённые поля существующего issue после Human Gate.
      operation: github.issue.update
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {key: issue_number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: title, type: STRING, format: PLAIN, required: false, maximumLength: 256}
        - {key: body, type: STRING, format: PLAIN, required: false, maximumLength: 65536}
        - {key: state, type: STRING, format: IDENTIFIER, required: false, maximumLength: 16, allowedValues: [open, closed]}
      outputFields:
        - {key: number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 256}
        - {key: state, type: STRING, format: IDENTIFIER, required: true, maximumLength: 16}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 500
    - key: github.repository.content.list
      name: Получить содержимое каталога
      description: Получить содержимое каталога в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.repository.content.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
        - {"key":"ref","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":1000}
        - {"key":"next_cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.repository.content.read
      name: Прочитать файл
      description: UTF-8 файл до 1 МиБ; ref — commit SHA. Читать до eof с expected_sha и next_offset_bytes. maximum_bytes по умолчанию/максимум 16384 байта. JSON escaping может уменьшить страницу для модели native ответа 64 КиБ; это не EOF и не усечение. source_digest/chunk_digest и отдельный receipt сохраняются.
      operation: github.repository.content.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"ref","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"expected_sha","type":"STRING","format":"PLAIN","required":false,"maximumLength":40}
        - {"key":"offset_bytes","type":"INTEGER","required":false,"minimum":0,"maximum":1048576}
        - {"key":"maximum_bytes","type":"INTEGER","required":false,"minimum":4,"maximum":16384}
      outputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"type","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":40}
        - {"key":"size","type":"INTEGER","required":true,"minimum":0,"maximum":1048576}
        - {"key":"text","type":"STRING","format":"PLAIN","required":true,"maximumLength":16384,"allowEmpty":true}
        - {"key":"commit_sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":40}
        - {"key":"offset_bytes","type":"INTEGER","required":true,"minimum":0,"maximum":1048576}
        - {"key":"next_offset_bytes","type":"INTEGER","required":true,"minimum":0,"maximum":1048576}
        - {"key":"eof","type":"BOOLEAN","required":true}
        - {"key":"source_digest","type":"STRING","format":"PLAIN","required":true,"maximumLength":71}
        - {"key":"chunk_digest","type":"STRING","format":"PLAIN","required":true,"maximumLength":71}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.repository.content.create
      name: Создать файл
      description: Создать файл в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.repository.content.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"message","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"content_base64","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
      outputFields:
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 250
    - key: github.repository.content.update
      name: Обновить файл
      description: Обновить файл в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.repository.content.update
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"message","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"content_base64","type":"STRING","format":"PLAIN","required":true,"maximumLength":349528,"allowEmpty":true}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 250
    - key: github.repository.content.delete
      name: Удалить файл
      description: Удалить файл в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.repository.content.delete
      risk: DESTRUCTIVE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"message","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"path","type":"STRING","format":"PLAIN","required":true,"maximumLength":1024}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 250
    - key: github.branch.list
      name: Получить ветки
      description: Получить ветки в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.branch.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.branch.read
      name: Прочитать ветку
      description: Прочитать ветку в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.branch.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"name","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"protected","type":"BOOLEAN","required":true}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.branch.create
      name: Создать ветку
      description: Создать ветку в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.branch.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"name","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"protected","type":"BOOLEAN","required":true}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 250
    - key: github.branch.delete
      name: Удалить ветку
      description: Удалить ветку в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.branch.delete
      risk: DESTRUCTIVE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [HUMAN_EACH_EFFECT]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"branch","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"accepted","type":"BOOLEAN","required":true}
      execution:
        idempotency: EFFECT_KEY
        timeoutSeconds: 30
        maxAttempts: 1
        retryBackoffMilliseconds: 250
    - key: github.commit.list
      name: Получить коммиты
      description: Получить коммиты в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.commit.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"ref","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
        - {"key":"path","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.commit.read
      name: Прочитать коммит
      description: Прочитать коммит в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.commit.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"ref","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {key: limit, type: INTEGER, required: false, minimum: 1, maximum: 100}
        - {key: cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
      outputFields:
        - {"key":"sha","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {key: message, type: STRING, format: PLAIN, required: true, maximumLength: 32768, allowEmpty: true}
        - {"key":"url","type":"STRING","format":"PLAIN","required":true,"maximumLength":2048}
        - {key: files, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: count, type: INTEGER, required: true, minimum: 0, maximum: 100}
        - {key: next_cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.pull_request.list
      name: Получить pull requests
      description: Получить pull requests в одном разрешённом репозитории; ограниченный результат и отдельный receipt эффекта.
      operation: github.pull_request.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"state","type":"STRING","format":"PLAIN","required":false,"maximumLength":16,"allowedValues":["open","closed","all"]}
        - {"key":"head","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
        - {"key":"base","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"INTEGER","required":false,"minimum":1,"maximum":10000}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.pull_request.read
      name: Прочитать pull request
      description: Прочитать полное описание и состояние pull request с точными head SHA (sha), base_sha и changed_files для закрепления индекса. Это не чтение содержимого изменённых файлов.
      operation: github.pull_request.read
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"pull_request_number","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
      outputFields:
        - {"key":"number","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"title","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
        - {"key":"state","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"head","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"base","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {key: sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: base_sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: changed_files, type: INTEGER, required: true, minimum: 0, maximum: 2147483647}
        - {"key":"draft","type":"BOOLEAN","required":true}
        - {"key":"url","type":"STRING","format":"PLAIN","required":true,"maximumLength":2048}
      execution:
        idempotency: READ_ONLY
        timeoutSeconds: 30
        maxAttempts: 3
        retryBackoffMilliseconds: 250
    - key: github.pull_request.create
      name: Создать pull request
      description: Создать pull request в одном разрешённом репозитории; draft задаёт черновик, по умолчанию false; ограниченный результат и отдельный receipt эффекта.
      operation: github.pull_request.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      allowedApprovalPolicies: [NONE, HUMAN_EACH_EFFECT, HUMAN_SCOPED]
      resourceScope:
        kind: GITHUB_REPOSITORY
        connectionFields: [owner, repository]
      inputFields:
        - {"key":"title","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"body","type":"STRING","format":"PLAIN","required":false,"maximumLength":32768,"allowEmpty":true}
        - {"key":"head","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"base","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
