    - key: github.pull_request.file.list
      name: Получить индекс изменённых файлов pull request
      # next_cursor только от GitHub. Полный индекс: непрерывные offset
      # 0..total_count, одинаковые pins/page_size; отдельная страница не полный read.
      # Nullable blob SHA не заменяется hash. Удаление читается из base, rename
      # использует previous_filename. Binary, отсутствующий source и raw >2 MiB
      # остаются отказом. Path <=1024 UTF-8 байт без control characters; 4 максимально
      # экранированных rename записи помещаются в общий 64 KiB envelope.
      description: >-
        Только метаданные, без patch/source. Pins из pull_request.read; drift запрещён.
        limit 1..4 (default 4), cursor номер страницы (default 1); limit неизменен.
        eof — конец индекса, НЕ source read; >3000 файлов: отказ без усечения.
        Полный source: repository.content.read до EOF на точном head/base SHA.
      operation: github.pull_request.file.list
      risk: READ
      approvalPolicy: NONE
      allowedApprovalPolicies: [NONE]
      resourceScope: {kind: GITHUB_REPOSITORY, connectionFields: [owner, repository]}
      inputFields:
        - {key: pull_request_number, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: expected_head_sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: expected_base_sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: expected_changed_files, type: INTEGER, required: true, minimum: 0, maximum: 3000}
        - {key: limit, type: INTEGER, required: false, minimum: 1, maximum: 4}
        - {key: cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
      outputFields:
        - {key: items, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: count, type: INTEGER, required: true, minimum: 0, maximum: 4}
        - {key: next_cursor, type: INTEGER, required: false, minimum: 1, maximum: 10000}
        - {key: head_sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: base_sha, type: STRING, format: IDENTIFIER, required: true, maximumLength: 40}
        - {key: total_count, type: INTEGER, required: true, minimum: 0, maximum: 3000}
        - {key: page_size, type: INTEGER, required: true, minimum: 1, maximum: 4}
        - {key: offset, type: INTEGER, required: true, minimum: 0, maximum: 3000}
        - {key: eof, type: BOOLEAN, required: true}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
