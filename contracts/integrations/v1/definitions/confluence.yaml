apiVersion: integrations.kodex.io/v1
kind: IntegrationPackage
metadata:
  key: confluence
  version: 1.2.0
  origin: SHIPPED
spec:
  name: Confluence
  description: Поиск и чтение страниц, а также создание и OCC-обновление черновиков в одном exact space.
  category: knowledge
  adapter: CONFLUENCE
  adapterOwner: integration-gateway
  executionRoute: MANAGED_MCP
  readiness: READY
  credential: {secretKey: token, kind: TOKEN}
  configurationFields:
    - {key: base_url, type: STRING, format: HTTPS_ORIGIN, required: true, maximumLength: 2048}
    - {key: auth_scheme, type: STRING, format: IDENTIFIER, required: true, maximumLength: 16, allowedValues: [BASIC, BEARER]}
    - {key: username, type: STRING, format: EMAIL, required: false, maximumLength: 320}
    - {key: space_id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
  networkDestinations:
    - {key: confluence_api, source: CONFIGURATION, configurationField: base_url, port: 443, tls: REQUIRED}
  healthCheck: {operation: confluence.space.read, timeoutSeconds: 15, maxAttempts: 3}
  capabilities:
    - key: confluence.space.read
      name: Прочитать пространство
      description: Возвращает имя и ключ одного разрешённого space.
      operation: confluence.space.read
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields: []
      outputFields:
        - {key: id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: key, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: name, type: STRING, format: PLAIN, required: true, maximumLength: 255}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 20, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.page.search
      name: Найти страницы
      description: Выполняет bounded поиск страниц внутри configured space.
      operation: confluence.page.search
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 512}
        - {key: limit, type: INTEGER, required: false, minimum: 1, maximum: 50}
        - {key: cursor, type: STRING, format: PLAIN, required: false, maximumLength: 2048}
      outputFields:
        - {key: count, type: INTEGER, required: true, minimum: 0, maximum: 50}
        - {key: pages, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: next_cursor, type: STRING, format: PLAIN, required: false, maximumLength: 2048}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 300}
    - key: confluence.page.read
      name: Прочитать страницу
      description: Возвращает title, version и bounded storage body одной страницы configured space.
      operation: confluence.page.read
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {key: page_id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
      outputFields:
        - {key: id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 512}
        - {key: version, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: status, type: STRING, format: IDENTIFIER, required: true, maximumLength: 32}
        - {key: body, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 300}
    - key: confluence.page.create
      name: Создать черновик страницы
      description: Создаёт черновик с effect marker в configured space после Human Gate.
      operation: confluence.page.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 512}
        - {key: body, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
        - {key: parent_id, type: STRING, format: IDENTIFIER, required: false, maximumLength: 64}
      outputFields:
        - {key: id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 512}
        - {key: version, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: status, type: STRING, format: IDENTIFIER, required: true, maximumLength: 32}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 2, retryBackoffMilliseconds: 500}
    - key: confluence.page.update
      name: Обновить черновик страницы
      description: Обновляет title или body только при совпадении expected version после Human Gate.
      operation: confluence.page.update
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {key: page_id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: expected_version, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: title, type: STRING, format: PLAIN, required: false, maximumLength: 512}
        - {key: body, type: STRING, format: PLAIN, required: false, maximumLength: 65536}
      outputFields:
        - {key: id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 512}
        - {key: version, type: INTEGER, required: true, minimum: 1, maximum: 2147483647}
        - {key: status, type: STRING, format: IDENTIFIER, required: true, maximumLength: 32}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 1, retryBackoffMilliseconds: 500}
    - key: confluence.attachment.upload
      name: Загрузить вложение страницы
      description: Загружает один bounded attachment в страницу configured space после Human Gate.
      operation: confluence.attachment.upload
      risk: SENSITIVE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {key: page_id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: file_name, type: STRING, format: PLAIN, required: true, maximumLength: 255}
        - {key: media_type, type: STRING, format: IDENTIFIER, required: true, maximumLength: 127}
        - {key: content_base64, type: STRING, format: PLAIN, required: true, maximumLength: 65536}
      outputFields:
        - {key: attachment_id, type: STRING, format: IDENTIFIER, required: true, maximumLength: 64}
        - {key: title, type: STRING, format: PLAIN, required: true, maximumLength: 255}
        - {key: media_type, type: STRING, format: IDENTIFIER, required: true, maximumLength: 127}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 45, maxAttempts: 1, retryBackoffMilliseconds: 500}
    - key: confluence.space.list
      name: Получить разрешённое пространство
      description: Получить разрешённое пространство в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.space.list
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields: []
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.page.descendant.list
      name: Получить потомков страницы
      description: Получить потомков страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.descendant.list
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.page.comment.list
      name: Получить комментарии страницы
      description: Получить комментарии страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.comment.list
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"parent_comment_id","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.page.comment.read
      name: Прочитать комментарий страницы
      description: Прочитать комментарий страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.comment.read
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"parent_comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256,"allowEmpty":true}
        - {"key":"status","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.page.comment.create
      name: Создать комментарий страницы
      description: Создать комментарий страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.comment.create
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"parent_comment_id","type":"STRING","format":"PLAIN","required":false,"maximumLength":256}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768}
      outputFields:
        - {"key":"id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"parent_comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256,"allowEmpty":true}
        - {"key":"status","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 1, retryBackoffMilliseconds: 250}
    - key: confluence.page.comment.update
      name: Обновить комментарий страницы
      description: Обновить комментарий страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.comment.update
      risk: WRITE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"expected_version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
      outputFields:
        - {"key":"id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"parent_comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256,"allowEmpty":true}
        - {"key":"status","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"body","type":"STRING","format":"PLAIN","required":true,"maximumLength":32768,"allowEmpty":true}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 1, retryBackoffMilliseconds: 250}
    - key: confluence.page.comment.delete
      name: Удалить комментарий страницы
      description: Удалить комментарий страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.page.comment.delete
      risk: DESTRUCTIVE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"comment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"expected_version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
      outputFields:
        - {"key":"accepted","type":"BOOLEAN","required":true}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 1, retryBackoffMilliseconds: 250}
    - key: confluence.attachment.list
      name: Получить вложения страницы
      description: Получить вложения страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.attachment.list
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"limit","type":"INTEGER","required":false,"minimum":1,"maximum":100}
        - {"key":"cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      outputFields:
        - {"key":"items","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536}
        - {"key":"count","type":"INTEGER","required":true,"minimum":0,"maximum":100}
        - {"key":"next_cursor","type":"STRING","format":"PLAIN","required":false,"maximumLength":1024}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.attachment.read
      name: Прочитать вложение страницы
      description: Прочитать вложение страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.attachment.read
      risk: READ
      approvalPolicy: NONE
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"attachment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"title","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"media_type","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"size","type":"INTEGER","required":true,"minimum":0,"maximum":65536}
        - {"key":"version","type":"INTEGER","required":true,"minimum":1,"maximum":2147483647}
        - {"key":"content_base64","type":"STRING","format":"PLAIN","required":true,"maximumLength":65536,"allowEmpty":true}
      execution: {idempotency: READ_ONLY, timeoutSeconds: 30, maxAttempts: 3, retryBackoffMilliseconds: 250}
    - key: confluence.attachment.delete
      name: Удалить вложение страницы
      description: Удалить вложение страницы в одном разрешённом пространстве с ограниченным результатом и receipt.
      operation: confluence.attachment.delete
      risk: DESTRUCTIVE
      approvalPolicy: HUMAN_EACH_EFFECT
      resourceScope: {kind: CONFLUENCE_SPACE, connectionFields: [base_url, space_id]}
      inputFields:
        - {"key":"page_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
        - {"key":"attachment_id","type":"STRING","format":"PLAIN","required":true,"maximumLength":256}
      outputFields:
        - {"key":"accepted","type":"BOOLEAN","required":true}
      execution: {idempotency: EFFECT_KEY, timeoutSeconds: 30, maxAttempts: 1, retryBackoffMilliseconds: 250}
