        }
      },
      {
        "key": "thanos.alerts.list",
        "name": "Прочитать alerts",
        "description": "Прочитать alerts в полной выбранной области endpoint.",
        "operation": "thanos.alerts.list",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "allowedApprovalPolicies": [
          "NONE"
        ],
        "resourceScope": {
          "kind": "HTTPS_RESOURCE",
          "connectionFields": [
            "base_url",
