            "maximumLength": 40,
            "label": "Начало периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "end",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 40,
            "label": "Конец периода",
            "help": "RFC3339 UTC; период не более 24 часов."
          },
          {
            "key": "match",
            "type": "STRING",
            "format": "PLAIN",
            "required": true,
            "maximumLength": 2048,
            "label": "Селектор рядов",
            "help": "Один обязательный match[] внутри выбранной области endpoint."
          }
        ],
        "outputFields": [
          {
            "key": "text",
