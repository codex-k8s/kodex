            "maximumLength": 65536,
            "label": "Результат",
            "help": "Ограниченная типизированная проекция; неполный или неоднозначный provider response закрыто отклоняется."
          }
        ],
        "execution": {
          "idempotency": "READ_ONLY",
          "timeoutSeconds": 30,
          "maxAttempts": 1,
          "retryBackoffMilliseconds": 250
        }
      },
      {
        "key": "thanos.rules.list",
        "name": "Прочитать правила",
        "description": "Прочитать правила в полной выбранной области endpoint.",
        "operation": "thanos.rules.list",
        "risk": "READ",
        "approvalPolicy": "NONE",
