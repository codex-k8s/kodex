          "https://email-bridge.kodex-system.svc.cluster.local"
        ]
      },
      {
        "key": "from_address",
        "type": "STRING",
        "format": "EMAIL",
        "required": true,
        "maximumLength": 320
      },
      {
        "key": "mailbox_id",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 63
      }
    ],
    "networkDestinations": [
      {
        "key": "email_bridge",
        "source": "CONFIGURATION",
        "configurationField": "base_url",
        "port": 443,
        "tls": "REQUIRED"
      }
    ],
