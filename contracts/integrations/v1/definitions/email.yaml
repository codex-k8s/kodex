        "operation": "email.delivery.health.read",
        "risk": "READ",
        "approvalPolicy": "NONE",
        "resourceScope": {
          "kind": "EMAIL_SENDER",
          "connectionFields": [
            "base_url",
            "from_address",
            "mailbox_id"
          ]
        },
