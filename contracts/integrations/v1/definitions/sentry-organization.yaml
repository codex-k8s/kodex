          "https://sentry.io",
          "https://us.sentry.io",
          "https://de.sentry.io"
        ]
      },
      {
        "key": "organization_slug",
        "type": "STRING",
        "format": "IDENTIFIER",
        "required": true,
        "maximumLength": 100
      }
    ],
    "networkDestinations": [
