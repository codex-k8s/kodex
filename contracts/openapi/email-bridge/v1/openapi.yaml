          }
        }
      }
    },
    "/internal/v1/email-authorizations/resolve": {
      "post": {
        "operationId": "resolveEmailAuthorization",
        "description": "Producer #1046, не email-bridge. mTLS email-bridge плюс отдельный service bearer. Проверяет живой grant, actor, tenant, input, policy/gate и credential revocation; никаких секретов в ответе.",
