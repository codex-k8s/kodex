    "/v1/mailbox-operations": {
      "post": {
        "operationId": "executeMailboxOperation",
        "description": "Закрытый Operation registry. mark возвращает UNSUPPORTED: POP не имеет read flags. Mutations требуют effect_key. Invocation token проверяется онлайн у owner до secrets.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Command"
              }
            }
