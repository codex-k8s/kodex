{
  "openapi": "3.0.3",
  "info": {
    "title": "Email bridge",
    "version": "1.1.0",
    "description": "HTTPS bridge #1037; SMTP/POP, authority и durable receipts. Body и query не являются источником полномочий."
  },
  "servers": [
    {
      "url": "https://email-bridge.kodex-system.svc.cluster.local:8443"
    }
  ],
  "security": [
    {
      "bridgeToken": []
    }
  ],
  "paths": {
    "/v1/health": {
      "get": {
        "operationId": "getHealth",
        "parameters": [
          {
            "in": "query",
            "name": "sender",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Типизированный результат в проверенной mailbox boundary.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "400": {
            "description": "Неверный запрос"
          },
          "403": {
            "description": "Нет допуска либо требуется Human Gate"
          },
          "409": {
            "description": "Конфликт ключа или курсора"
          },
          "503": {
            "description": "Зависимость не готова; mutation не повторяется"
          }
        }
      }
    },
    "/v1/messages": {
      "post": {
        "operationId": "sendMessage",
        "parameters": [
          {
            "in": "query",
            "name": "sender",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MessageInput"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Типизированный результат в проверенной mailbox boundary.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MessageStatus"
                }
              }
            }
          },
          "400": {
            "description": "Неверный запрос"
          },
          "403": {
            "description": "Нет допуска либо требуется Human Gate"
          },
          "409": {
            "description": "Конфликт ключа или курсора"
          },
          "503": {
            "description": "Зависимость не готова; mutation не повторяется"
          }
        }
      }
    },
