openapi: 3.0.3
info:
  title: Kodex Control Center API
  version: 1.0.0
  description: |
    Owner-facing web-first API Kodex. Actor, organization, ownership,
    permissions и root lineage выводятся из проверенной сессии и состояния
    control-plane. Внешние интеграции не являются обязательными.
servers:
  - url: https://kodex.example.com
    description: Environment-owned HTTPS endpoint
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Bootstrap
  - name: Projects
  - name: Agents
  - name: RoleEnvironments
  - name: Workflows
  - name: Runs
  - name: Decisions
  - name: Artifacts
  - name: AttachmentSets
  - name: Automations
  - name: Integrations
  - name: Providers
  - name: Speech
  - name: Assistant
  - name: Administration
  - name: Access
  - name: RuntimeSecrets

paths:
  /api/v1/session:
    post:
      tags: [Session]
      operationId: createOwnerSession
      security: [{ oidcBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerSessionCreateInput' }
      responses:
        '204':
          description: Защищённая browser-сессия создана
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Session]
      operationId: renewOwnerSession
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Idle-срок защищённой browser-сессии продлён при необходимости }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Session]
      operationId: deleteOwnerSession
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Защищённая browser-сессия завершена }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapState
      responses:
        '200':
          description: Авторитетное состояние bootstrap и помощника
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/onboarding/completion:
    post:
      tags: [Bootstrap]
      operationId: completeOnboarding
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Onboarding завершён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/overview:
    get:
      tags: [Bootstrap]
      operationId: getOverview
      parameters:
        - { $ref: '#/components/parameters/ProjectRefQuery' }
      responses:
        '200':
          description: Сводка доступной пользователю работы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/platform-capabilities:
    get:
      tags: [Bootstrap]
      operationId: listPlatformCapabilities
      responses:
        '200':
          description: Каталог core capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformCapability' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runtime-selections:
    get:
      tags: [Bootstrap]
      operationId: listRuntimeSelections
      responses:
        '200':
          description: Доступные профили выполнения ИИ-сотрудников
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RuntimeSelection' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/search:
    get:
      tags: [Search]
      operationId: searchPlatform
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - { $ref: '#/components/parameters/PageToken' }
        - { $ref: '#/components/parameters/ProjectRefQuery' }
      responses:
        '200':
          description: Доступные actor результаты глобального поиска
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Доступные Проекты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Проект создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200':
          description: Проект
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Проект изменён
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMemberships
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Участники Проекта
          content:
            application/json:
              schema:
                type: object
                required: [items, nextActions]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                  nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: addProjectMembership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMembershipCreateInput' }
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/members:
    get:
      tags: [Administration]
      operationId: listPlatformMemberships
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Участники организации и их platform roles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextActions]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                  nextPageToken: { type: string, maxLength: 512 }
                  nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Administration]
      operationId: addPlatformMembership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformMembershipCreateInput' }
      responses:
        '201':
          description: Участник организации добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/membership-candidates:
    get:
      tags: [Administration]
      operationId: listPlatformMembershipCandidates
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Проверенные пользователи, которых можно добавить в организацию
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/members/{membershipRef}:
    parameters: [{ $ref: '#/components/parameters/MembershipRef' }]
    patch:
      tags: [Administration]
      operationId: changePlatformMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformMembershipChangeInput' }
      responses:
        '200':
          description: Platform role изменена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Administration]
      operationId: removePlatformMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Участие в организации отозвано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/membership-candidates:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMembershipCandidates
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Пользователи, которых можно добавить в Проект
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members/{membershipRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }, { $ref: '#/components/parameters/MembershipRef' }]
    patch:
      tags: [Projects]
      operationId: changeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMembershipChangeInput' }
      responses:
        '200':
          description: Доступ изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Projects]
      operationId: removeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Участие отозвано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects/{projectRef}/agents:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Agents]
      operationId: listAgents
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: ИИ-сотрудники Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Agents]
      operationId: createAgent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '201':
          description: ИИ-сотрудник создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/project-memberships:
    get:
      tags: [Projects]
      operationId: listOrganizationProjectMemberships
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Участники доступных проектов
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextActions]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Membership' } }
                  nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/agents:
    get:
      tags: [Agents]
      operationId: listOrganizationAgents
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: ИИ-сотрудники доступных проектов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/workflows:
    get:
      tags: [Workflows]
      operationId: listOrganizationWorkflows
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Процессы доступных проектов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/schedules:
    get:
      tags: [Automations]
      operationId: listOrganizationSchedules
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Автоматизации доступных проектов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/runtime-environments:
    get:
      tags: [Agents]
      operationId: listOrganizationRuntimeEnvironmentSets
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Окружения доступных проектов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeEnvironmentPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/runtime-secrets:
    get:
      tags: [Agents]
      operationId: listOrganizationRuntimeSecrets
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Безопасные описания секретов доступных проектов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSecretPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/vfs/nodes:
    get:
      tags: [Artifacts]
      operationId: listVFSNodes
      description: Путь выбирает виртуальный каталог и не является полномочием или путём object storage.
      parameters:
        - { $ref: '#/components/parameters/ProjectRefQuery' }
        - { name: path, in: query, required: false, schema: { type: string, maxLength: 1000, default: /projects } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/VFSPageToken' }
      responses:
        '200':
          description: Разрешённые элементы виртуального каталога
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VFSNodePage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/vfs/search:
    get:
      tags: [Artifacts]
      operationId: searchVFS
      parameters:
        - { $ref: '#/components/parameters/ProjectRefQuery' }
        - { name: query, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/VFSPageToken' }
      responses:
        '200':
          description: Результаты поиска доступных виртуальных файлов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VFSNodePage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}:
    parameters: [{ $ref: '#/components/parameters/AgentRef' }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        '200':
          description: ИИ-сотрудник
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '200':
          description: ИИ-сотрудник изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/avatar:
    parameters: [{ $ref: '#/components/parameters/AgentRef' }]
    put:
      tags: [Agents]
      operationId: setAgentAvatar
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentAvatarInput' }
      responses:
        '200':
          description: Готовый image Artifact привязан как avatar
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Agents]
      operationId: removeAgentAvatar
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Пользовательский avatar удалён, активирован server-generated fallback
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/agents/{agentRef}/avatar:
    parameters:
      - { $ref: '#/components/parameters/ProjectRef' }
      - { $ref: '#/components/parameters/AgentRef' }
    put:
      tags: [Agents]
      operationId: uploadAgentAvatar
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        description: Ограниченный поток готового avatar до 5 MiB; Artifact, binding и Agent version фиксируются одной транзакцией владельца.
        content:
          image/png: { schema: { type: string, format: binary, maxLength: 5242880 } }
          image/jpeg: { schema: { type: string, format: binary, maxLength: 5242880 } }
          image/webp: { schema: { type: string, format: binary, maxLength: 5242880 } }
      responses:
        '200':
          description: Avatar и новая версия ИИ-сотрудника опубликованы атомарно
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/avatar/content:
    get:
      tags: [Agents]
      operationId: getAgentAvatarContent
      parameters: [{ $ref: '#/components/parameters/AgentRef' }]
      responses:
        '200':
          description: Готовое изображение либо deterministic server fallback
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-versions:
    get:
      tags: [Agents]
      operationId: listAgentInstructionVersions
