openapi: 3.0.3
info:
  title: MatterCodex Control API Gateway
  version: 1.0.0
  description: >-
    Owner API для проектов, управляемой конфигурации и авторитетных проекций
    control-plane. Actor, organization, project и ownership выводятся только из
    проверенной OIDC-сессии и состояния control-plane; request body не является
    источником полномочий.
servers:
  - url: https://control-api.mattercodex.local/api/v1
tags:
  - { name: session, description: Защищённая owner-сессия gateway. }
  - { name: projects, description: Проекты в разрешённой owner boundary. }
  - { name: resources, description: Управление ресурсами через control-plane. }
  - { name: projections, description: Авторитетные read-only проекции. }
  - { name: schedules, description: Специализированные owner-команды расписаний. }
paths:
  /session:
    post:
      tags: [session]
      summary: Создать защищённую owner-сессию
      operationId: createOwnerSession
      security: [{ oidcBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204':
          description: Защищённая owner-сессия и CSRF cookie созданы.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [session]
      summary: Завершить локальную owner-сессию
      operationId: deleteOwnerSession
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Локальная сессия закрыта. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects:
    get:
      tags: [projects]
      summary: Получить доступные owner проекты
      operationId: listProjects
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Проекты, видимые проверенному owner.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [projects]
      summary: Создать проект с назначенным сервером owner
      operationId: createProject
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProject' } } }
      responses:
        '201':
          description: Сервер назначил project ID и owner.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources:
    get:
      tags: [resources]
      summary: Получить авторитетную страницу ресурсов
      operationId: listResources
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceKindQuery' }
        - { name: parentId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/LifecycleState' } }, style: form, explode: true }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Авторитетная проекция ресурсов текущей owner/tenant boundary.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [resources]
      summary: Создать ресурс допустимого вида
      operationId: createResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateResource' } } }
      responses:
        '201':
          description: Ресурс создан; project и owner назначены сервером.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [resources]
      summary: Получить ресурс после owner resolution
      operationId: getResource
      security: [{ ownerSession: [] }]
      parameters:
        - { name: expectedKind, in: query, required: true, schema: { $ref: '#/components/schemas/ResourceKind' } }
      responses:
        '200':
          description: Ресурс после owner/tenant resolution.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [resources]
      summary: Обновить ресурс с optimistic concurrency
      operationId: updateResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateResource' } } }
      responses:
        '200':
          description: Ресурс обновлён после server-side owner resolution и OCC.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [resources]
      summary: Удалить ресурс с optimistic concurrency
      operationId: deleteResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Авторитетное состояние удаления.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/search:
    get:
      tags: [resources]
      summary: Выполнить авторитетный owner search одного закрытого resource kind
      operationId: searchResources
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceKindQuery' }
        - { name: query, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 128 } }
        - { name: state, in: query, schema: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/LifecycleState' } }, style: form, explode: true }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Страница search results той же owner eligibility boundary.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}/transition:
    post:
      tags: [resources]
      summary: Выполнить допустимый lifecycle transition
      operationId: transitionResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceID' }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransitionResource' } } }
      responses:
        '200':
          description: Новый state после специализированной проверки lifecycle.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /schedules/{scheduleId}/run-now:
    post:
      tags: [schedules]
      summary: Создать отдельный немедленный запуск без сдвига watermark
      operationId: runScheduleNow
      security: [{ ownerSession: [] }]
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '202':
          description: Немедленная occurrence устойчиво создана control-plane.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleOccurrence' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /schedules/{scheduleId}/occurrences:
    get:
      tags: [schedules]
      summary: Получить ограниченную owner-visible историю запусков расписания
      operationId: listScheduleOccurrences
      security: [{ ownerSession: [] }]
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Страница запусков exact owner schedule.
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleOccurrencePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /schedules/{scheduleId}/occurrences/{occurrenceId}/recovery:
    post:
      tags: [schedules]
      summary: Разрешить exact recovery incident без частичного terminal graph
      operationId: resolveScheduleRecovery
      security: [{ ownerSession: [] }]
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: occurrenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResolveScheduleRecovery' } } }
      responses:
        '200':
          description: Authoritative owner readback после repair/cancel/skip.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleOccurrence' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /access-resources:
    post:
      tags: [resources]
      summary: Выполнить специализированную access command
      operationId: manageAccessResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: If-Match
          in: header
          required: false
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ManageAccessResource' } } }
      responses:
        '200':
          description: Результат специализированной административной команды.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /access-resources/{resourceId}/detach:
    post:
      tags: [resources]
      summary: Явно перевести Git-owned access resource в UI ownership
      operationId: detachAccessResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceID' }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DetachAccessResource' } } }
      responses:
        '200':
          description: Тот же resource с новой server-owned UI revision.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /access-resources/{resourceId}/copy:
    post:
      tags: [resources]
      summary: Создать UI-owned копию exact Git-owned access resource version
      operationId: copyAccessResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceID' }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CopyAccessResource' } } }
      responses:
        '201':
          description: Новая server-assigned UI-owned сущность.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /runs:
    get:
      tags: [projections]
      summary: Получить авторитетную проекцию запусков
      operationId: listRuns
      security: [{ ownerSession: [] }]
      parameters:
        - { name: state, in: query, schema: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/LifecycleState' } }, style: form, explode: true }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Авторитетные PROCESS_RUN resources.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /audit:
    get:
      tags: [projections]
      summary: Получить audit metadata
      operationId: listAuditEvents
      security: [{ ownerSession: [] }]
      parameters:
        - { name: resourceKind, in: query, schema: { $ref: '#/components/schemas/ResourceKind' } }
        - { name: resourceId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_]*$' } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Audit metadata без credential, token и secret values.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /incidents:
    get:
      tags: [projections]
      summary: Получить авторитетную проекцию инцидентов
      operationId: listIncidents
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Авторитетная typed watchdog incident projection.
          content: { application/json: { schema: { $ref: '#/components/schemas/IncidentPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /configuration-changes:
    get:
      tags: [projections]
      summary: Получить проекцию изменений конфигурации
      operationId: listConfigurationChanges
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Audit projection закрытого набора configuration mutation actions.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationChangePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /diagnostics:
    get:
      tags: [projections]
      summary: Получить ограниченную диагностику control-plane
      operationId: getDiagnostics
      security: [{ ownerSession: [] }]
      responses:
        '200':
          description: Ограниченная авторитетная диагностика control-plane.
          content: { application/json: { schema: { $ref: '#/components/schemas/Diagnostics' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    oidcBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    ownerSession: { type: apiKey, in: cookie, name: __Host-mattercodex-session }
  parameters:
    CSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 43, maxLength: 64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    ResourceID: { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
    ResourceKindQuery: { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/ResourceKind' } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    PageToken: { name: pageToken, in: query, schema: { type: string, maxLength: 1024 } }
  headers:
    ETag: { description: Точная версия ресурса для следующего If-Match., schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
  schemas:
    ResourceKind:
      title: ResourceKind
      type: string
      enum: [PROJECT, TEAM, CHAT, ROLE, PROMPT_PROFILE, CREDENTIAL_BINDING, REPOSITORY_WORKSPACE, INTEGRATION, RUNTIME_REVISION, SESSION, TURN, PROCESS_RUN, SCHEDULE, OWNER_GATE, MEMORY_RECORD, WORK_CLAIM, ARTIFACT]
    MutableResourceKind:
      title: MutableResourceKind
      type: string
      enum: [CHAT, CREDENTIAL_BINDING, REPOSITORY_WORKSPACE, INTEGRATION]
    AccessResourceKind: { title: AccessResourceKind, type: string, enum: [TEAM, ROLE, PROMPT_PROFILE] }
    LifecycleState:
      title: LifecycleState
      type: string
      enum: [ACTIVE, PAUSED, ARCHIVED, DELETION_PENDING, DELETED, QUEUED, CLAIMED, RUNNING, WAITING_OWNER, WAITING_EXTERNAL, SUCCEEDED, FAILED, CANCELLED, EXPIRED, BLOCKED]
    ChatRoomType:
      title: ChatRoomType
      type: string
      enum: [USER, COORDINATION, WORK_CONTROL, RUNS]
    ConfigurationManagedBy:
      title: ConfigurationManagedBy
      type: string
      enum: [ui, git]
    ProjectLocale:
      title: ProjectLocale
      type: string
      enum: [ru, en]
    ProviderPoolPolicy:
      title: ProviderPoolPolicy
      type: string
      enum: [least_used, weighted]
    OwnerGateDecision:
      title: OwnerGateDecision
      type: string
      enum: [PENDING, APPROVED, REJECTED, CHANGES_REQUESTED, CANCELLED]
    ArtifactScanStatus:
      title: ArtifactScanStatus
      type: string
      enum: [PENDING, SCANNING, CLEAN, QUARANTINED, FAILED]
    ProjectSpec:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 2000 }
        locale: { type: string, minLength: 2, maxLength: 16 }
      required: [slug, locale]
    CreateProject:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { $ref: '#/components/schemas/ProjectSpec' }
      required: [name, spec]
    ChatSpec:
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160 }
        roomType: { $ref: '#/components/schemas/ChatRoomType' }
        defaultAgentId: { type: string, format: uuid }
        externalChannelRef: { type: string, maxLength: 512 }
        workPolicy: { type: string, maxLength: 80 }
      required: [stableKey, roomType, workPolicy]
    CredentialBindingSpec:
      type: object
      additionalProperties: false
      description: Содержит только URI/metadata Secret; secret value запрещён.
      properties:
        purpose: { type: string, minLength: 1, maxLength: 120 }
        immutableSecretRef: { type: string, minLength: 1, maxLength: 512 }
        principalRef: { type: string, minLength: 1, maxLength: 512 }
        revision: { type: integer, format: int64, minimum: 1 }
      required: [purpose, immutableSecretRef, principalRef, revision]
    RepositoryWorkspaceSpec:
      type: object
      additionalProperties: false
      properties:
        repositoryRef: { type: string, minLength: 1, maxLength: 512 }
        workspaceMode: { type: string, minLength: 1, maxLength: 80 }
        defaultBranch: { type: string, minLength: 1, maxLength: 255 }
        credentialBindingId: { type: string, format: uuid }
      required: [repositoryRef, workspaceMode, defaultBranch]
    IntegrationSpec:
      type: object
      additionalProperties: false
      properties:
        definitionRef: { type: string, minLength: 1, maxLength: 512 }
        definitionVersion: { type: integer, format: int64, minimum: 1 }
        capabilities: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, maxLength: 120 } }
        credentialBindingIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
        endpointRef: { type: string, minLength: 1, maxLength: 512 }
      required: [definitionRef, definitionVersion, capabilities, credentialBindingIds, endpointRef]
    TeamSpec:
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160 }
        externalTeamRef: { type: string, maxLength: 512 }
        memberActorIds: { type: array, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid } }
        roleIds: { type: array, maxItems: 64, uniqueItems: true, items: { type: string, format: uuid } }
      required: [stableKey, memberActorIds, roleIds]
    RoleSpec:
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160 }
        capabilities: { type: array, maxItems: 64, uniqueItems: true, items: { type: string, maxLength: 160 } }
        allowedTargetRoleIds: { type: array, maxItems: 64, uniqueItems: true, items: { type: string, format: uuid } }
        promptProfileId: { type: string, format: uuid }
        providerCredentialBindingIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
        repositoryWorkspaceIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
        integrationIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
      required: [stableKey, capabilities, allowedTargetRoleIds, providerCredentialBindingIds, repositoryWorkspaceIds, integrationIds]
    PromptProfileSpec:
      type: object
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceRef: { type: string, minLength: 1, maxLength: 512 }
        locale: { type: string, minLength: 2, maxLength: 16 }
      required: [revision, contentSha256, sourceRef, locale]
    ResourceSpecInput:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        chat: { $ref: '#/components/schemas/ChatSpec' }
        credentialBinding: { $ref: '#/components/schemas/CredentialBindingSpec' }
        repositoryWorkspace: { $ref: '#/components/schemas/RepositoryWorkspaceSpec' }
        integration: { $ref: '#/components/schemas/IntegrationSpec' }
    AccessSpecInput:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        team: { $ref: '#/components/schemas/TeamSpec' }
        role: { $ref: '#/components/schemas/RoleSpec' }
        promptProfile: { $ref: '#/components/schemas/PromptProfileSpec' }
    CreateResource:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/MutableResourceKind' }
        name: { type: string, minLength: 1, maxLength: 160 }
        parentId: { type: string, format: uuid }
        spec: { $ref: '#/components/schemas/ResourceSpecInput' }
      required: [kind, name, spec]
    UpdateResource:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/MutableResourceKind' }
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { $ref: '#/components/schemas/ResourceSpecInput' }
      required: [kind, name, spec]
    TransitionResource:
      type: object
      additionalProperties: false
      properties:
        targetState: { $ref: '#/components/schemas/LifecycleState' }
        reasonCode: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z][A-Z0-9_]*$' }
      required: [targetState, reasonCode]
    ManageAccessResource:
      type: object
      additionalProperties: false
      description: CREATE/UPDATE требуют name+spec; остальные действия требуют resourceId+If-Match и запрещают name/spec.
      properties:
        kind: { $ref: '#/components/schemas/AccessResourceKind' }
        action: { type: string, enum: [CREATE, UPDATE, ACTIVATE, PAUSE, ARCHIVE, DELETE] }
        resourceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { $ref: '#/components/schemas/AccessSpecInput' }
      required: [kind, action]
    DetachAccessResource:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/AccessResourceKind' }
      required: [kind]
    CopyAccessResource:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/AccessResourceKind' }
        name: { type: string, minLength: 1, maxLength: 160 }
      required: [kind, name]
    ConfigurationOwnershipProjection:
      title: ConfigurationOwnershipProjection
      type: object
      additionalProperties: false
      properties:
        managedBy: { $ref: '#/components/schemas/ConfigurationManagedBy' }
        source: { type: string, minLength: 1, maxLength: 512 }
        revision: { type: integer, format: int64, minimum: 1 }
      required: [managedBy, source, revision]
    ProjectProjection:
      title: ProjectProjection
      type: object
      additionalProperties: false
      properties:
        slug: { type: string }
        description: { type: string }
        locale: { $ref: '#/components/schemas/ProjectLocale' }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [slug, description, locale, ownership]
    TeamProjection:
      title: TeamProjection
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string }
        externalTeamRef: { type: string }
        memberActorIds: { type: array, items: { type: string, format: uuid } }
        roleIds: { type: array, items: { type: string, format: uuid } }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [stableKey, externalTeamRef, memberActorIds, roleIds, ownership]
    ChatProjection:
      title: ChatProjection
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string }
        roomType: { $ref: '#/components/schemas/ChatRoomType' }
        defaultAgentId: { type: string, format: uuid }
        externalChannelRef: { type: string }
        workPolicy: { type: string }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [stableKey, roomType, externalChannelRef, workPolicy, ownership]
    ProviderPoolBindingProjection:
      title: ProviderPoolBindingProjection
      type: object
      additionalProperties: false
      properties:
        credentialBindingId: { type: string, format: uuid }
        weight: { type: integer, minimum: 1, maximum: 10000 }
      required: [credentialBindingId, weight]
    ProviderPoolProjection:
      title: ProviderPoolProjection
      type: object
      additionalProperties: false
      properties:
        policy: { $ref: '#/components/schemas/ProviderPoolPolicy' }
        policyRevision: { type: integer, format: int64, minimum: 1 }
        observationMaxAgeSeconds: { type: integer, format: int64, minimum: 60 }
        bindings: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ProviderPoolBindingProjection' } }
      required: [policy, policyRevision, observationMaxAgeSeconds, bindings]
    RoleProjection:
      title: RoleProjection
      type: object
      additionalProperties: false
      properties:
        stableKey: { type: string }
        capabilities: { type: array, items: { type: string } }
        allowedTargetRoleIds: { type: array, items: { type: string, format: uuid } }
        promptProfileId: { type: string, format: uuid }
        providerCredentialBindingIds: { type: array, items: { type: string, format: uuid } }
        repositoryWorkspaceIds: { type: array, items: { type: string, format: uuid } }
        integrationIds: { type: array, items: { type: string, format: uuid } }
        providerAccountPool: { $ref: '#/components/schemas/ProviderPoolProjection' }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [stableKey, capabilities, allowedTargetRoleIds, promptProfileId, providerCredentialBindingIds, repositoryWorkspaceIds, integrationIds, providerAccountPool, ownership]
    PromptProfileProjection:
      title: PromptProfileProjection
      type: object
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceRef: { type: string }
        locale: { type: string }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [revision, contentSha256, sourceRef, locale, ownership]
    CredentialBindingProjection:
      title: CredentialBindingProjection
      type: object
      additionalProperties: false
      properties:
        purpose: { type: string }
        immutableSecretRef: { type: string }
        principalRef: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        providerEligible: { type: boolean }
        providerCapabilities: { type: array, items: { type: string } }
        providerObservationRevision: { type: integer, format: int64, minimum: 0 }
        providerObservedAt: { type: string, format: date-time }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [purpose, immutableSecretRef, principalRef, revision, providerEligible, providerCapabilities, providerObservationRevision, contentSha256, ownership]
    RepositoryWorkspaceProjection:
      title: RepositoryWorkspaceProjection
      type: object
      additionalProperties: false
      properties:
        repositoryRef: { type: string }
        workspaceMode: { type: string }
        defaultBranch: { type: string }
        credentialBindingId: { type: string, format: uuid }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [repositoryRef, workspaceMode, defaultBranch, ownership]
    IntegrationProjection:
      title: IntegrationProjection
      type: object
      additionalProperties: false
      properties:
        definitionRef: { type: string }
        definitionVersion: { type: integer, format: int64, minimum: 1 }
        capabilities: { type: array, items: { type: string } }
        credentialBindingIds: { type: array, items: { type: string, format: uuid } }
        endpointRef: { type: string }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [definitionRef, definitionVersion, capabilities, credentialBindingIds, endpointRef, ownership]
    RuntimeRevisionProjection:
      title: RuntimeRevisionProjection
      type: object
      additionalProperties: false
      properties:
        manifestSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        imageDigest: { type: string }
        promptProfileId: { type: string, format: uuid }
        promptRevision: { type: integer, format: int64, minimum: 1 }
        sessionId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        effectiveRuntimeSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        authorityPolicyRevision: { type: integer, format: int64, minimum: 1 }
      required: [manifestSha256, imageDigest, promptProfileId, promptRevision, sessionId, roleId, effectiveRuntimeSha256, authorityPolicyRevision]
    SessionProjection:
      title: SessionProjection
      type: object
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        providerAccountBindingId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        archiveRef: { type: string }
        lastTurnSequence: { type: integer, format: int64, minimum: 0 }
      required: [agentId, providerAccountBindingId, lastTurnSequence]
    TurnProjection:
      title: TurnProjection
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        sourceRef: { type: string }
        runtimeRevisionId: { type: string, format: uuid }
        processRunId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        resultArtifactId: { type: string, format: uuid }
        effectiveInputSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      required: [sessionId, sequence, sourceRef, runtimeRevisionId, attempt, effectiveInputSha256]
    ProcessRunProjection:
      title: ProcessRunProjection
      type: object
      additionalProperties: false
      properties:
        parentProcessRunId: { type: string, format: uuid }
        playbookRef: { type: string }
        policyRevision: { type: integer, format: int64, minimum: 1 }
        rootTriggerRef: { type: string }
        rootSessionId: { type: string, format: uuid }
        rootTurnId: { type: string, format: uuid }
        rootAttempt: { type: integer, minimum: 1 }
        immutableInputSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        runtimeRevisionId: { type: string, format: uuid }
        currentSessionId: { type: string, format: uuid }
        currentTurnId: { type: string, format: uuid }
        currentAttempt: { type: integer, minimum: 1 }
      required: [playbookRef, policyRevision, rootTriggerRef, rootSessionId, rootTurnId, rootAttempt, immutableInputSha256, runtimeRevisionId]
    ScheduleProjection:
      title: ScheduleProjection
      type: object
      additionalProperties: false
      properties:
        targetResourceId: { type: string, format: uuid }
        targetKind: { $ref: '#/components/schemas/ResourceKind' }
        targetVersion: { type: integer, format: int64, minimum: 1 }
        cron: { type: string }
        timezone: { type: string }
        nextRunAt: { type: string, format: date-time }
        maximumAttempts: { type: integer, minimum: 1 }
        ownership: { $ref: '#/components/schemas/ConfigurationOwnershipProjection' }
      required: [targetResourceId, targetKind, targetVersion, timezone, nextRunAt, maximumAttempts, ownership]
    ScheduleOccurrenceState:
      title: ScheduleOccurrenceState
      type: string
      enum: [QUEUED, RESERVED, CLAIMED, WAITING_OWNER, CONTINUATION, SUCCEEDED, FAILED, CANCELLED, SKIPPED, DEAD_LETTER, RECOVERY_BLOCKED]
    ScheduleOccurrence:
      title: ScheduleOccurrence
      type: object
      additionalProperties: false
      properties:
        occurrenceId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        scheduledFor: { type: string, format: date-time }
        targetResourceId: { type: string, format: uuid }
        targetKind: { $ref: '#/components/schemas/ResourceKind' }
        targetVersion: { type: integer, format: int64, minimum: 1 }
        effectiveInputSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state: { $ref: '#/components/schemas/ScheduleOccurrenceState' }
        attempt: { type: integer, minimum: 1, maximum: 100 }
        authorityGeneration: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 1 }
        availableAt: { type: string, format: date-time }
        outcome: { type: string, maxLength: 256 }
        recoveryEvidenceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      required: [occurrenceId, scheduleId, scheduledFor, targetResourceId, targetKind, targetVersion, effectiveInputSha256, state, attempt, authorityGeneration, version, availableAt]
    ScheduleOccurrencePage:
      type: object
      additionalProperties: false
      properties:
        occurrences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ScheduleOccurrence' } }
        nextPageToken: { type: string }
      required: [occurrences]
    ResolveScheduleRecovery:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [REPAIR, CANCEL, SKIP] }
        expectedAttempt: { type: integer, minimum: 1, maximum: 100 }
        recoveryEvidenceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        reasonCode: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
      required: [action, expectedAttempt, recoveryEvidenceSha256, reasonCode]
    OwnerGateProjection:
      title: OwnerGateProjection
      type: object
      additionalProperties: false
      properties:
        processRunId: { type: string, format: uuid }
        resultSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expiresAt: { type: string, format: date-time }
        decision: { $ref: '#/components/schemas/OwnerGateDecision' }
        sessionId: { type: string, format: uuid }
        turnId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        immutableInputSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      required: [processRunId, resultSha256, expiresAt, decision, sessionId, turnId, attempt, immutableInputSha256]
    MemoryRecordProjection:
      title: MemoryRecordProjection
      type: object
      additionalProperties: false
      properties:
        scope: { type: string }
        roleId: { type: string, format: uuid }
        title: { type: string }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        provenance: { type: string }
        importance: { type: integer, minimum: 0 }
      required: [scope, title, contentSha256, provenance, importance]
    WorkClaimProjection:
      title: WorkClaimProjection
      type: object
      additionalProperties: false
      properties:
        processRunId: { type: string, format: uuid }
        turnId: { type: string, format: uuid }
        domains: { type: array, items: { type: string } }
        resourceKeys: { type: array, items: { type: string } }
        workloadId: { type: string }
        sessionId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        authorityGeneration: { type: integer, format: int64, minimum: 1 }
      required: [processRunId, turnId, domains, resourceKeys, workloadId, sessionId, attempt, expiresAt, authorityGeneration]
    ArtifactProjection:
      title: ArtifactProjection
      type: object
      additionalProperties: false
      properties:
        artifactKind: { type: string }
        direction: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        mediaType: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { $ref: '#/components/schemas/ArtifactScanStatus' }
        scanPolicyRevision: { type: integer, format: int64, minimum: 0 }
        scanEvidenceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scannedAt: { type: string, format: date-time }
