openapi: 3.0.3
info:
  title: MatterCodex Control Center API
  version: 1.0.0
  description: |
    Owner-facing web-first API MatterCodex. Actor, organization, ownership,
    permissions и root lineage выводятся из проверенной сессии и состояния
    control-plane. Внешние интеграции не являются обязательными.
servers:
  - url: https://mattercodex.example.com
    description: Environment-owned HTTPS endpoint
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Bootstrap
  - name: Projects
  - name: Agents
  - name: RoleEnvironments
  - name: Workflows
  - name: Runs
  - name: Decisions
  - name: Artifacts
  - name: Automations
  - name: Integrations
  - name: Assistant
  - name: Administration

paths:
  /api/v1/session:
    post:
      tags: [Session]
      operationId: createOwnerSession
      security: [{ oidcBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204':
          description: Защищённая browser-сессия создана
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Session]
      operationId: deleteOwnerSession
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Защищённая browser-сессия завершена }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapState
      responses:
        '200':
          description: Авторитетное состояние bootstrap и помощника
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/onboarding/completion:
    post:
      tags: [Bootstrap]
      operationId: completeOnboarding
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Onboarding завершён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/overview:
    get:
      tags: [Bootstrap]
      operationId: getOverview
      parameters:
        - { $ref: '#/components/parameters/ProjectRefQuery' }
      responses:
        '200':
          description: Сводка доступной пользователю работы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/platform-capabilities:
    get:
      tags: [Bootstrap]
      operationId: listPlatformCapabilities
      responses:
        '200':
          description: Каталог core capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformCapability' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runtime-selections:
    get:
      tags: [Bootstrap]
      operationId: listRuntimeSelections
      responses:
        '200':
          description: Доступные профили выполнения ИИ-сотрудников
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RuntimeSelection' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Доступные Проекты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Проект создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200':
          description: Проект
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Проект изменён
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMemberships
      responses:
        '200':
          description: Участники Проекта
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: addProjectMembership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipInput' }
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/membership-candidates:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMembershipCandidates
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Пользователи, которых можно добавить в Проект
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members/{membershipRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }, { $ref: '#/components/parameters/MembershipRef' }]
    patch:
      tags: [Projects]
      operationId: changeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipInput' }
      responses:
        '200':
          description: Доступ изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Projects]
      operationId: removeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Участие отозвано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects/{projectRef}/agents:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Agents]
      operationId: listAgents
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: ИИ-сотрудники Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Agents]
      operationId: createAgent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '201':
          description: ИИ-сотрудник создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}:
    parameters: [{ $ref: '#/components/parameters/AgentRef' }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        '200':
          description: ИИ-сотрудник
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '200':
          description: ИИ-сотрудник изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/commands:
    post:
      tags: [Agents]
      operationId: commandAgent
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCommand' }
      responses:
        '200':
          description: Специализированная команда применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-drafts:
    post:
      tags: [Agents]
      operationId: createInstructionDraft
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatchOptional' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties: { content: { type: string, minLength: 1, maxLength: 65536 } }
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-commands:
    post:
      tags: [Agents]
      operationId: commandAgentInstructions
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructionCommand' }
      responses:
        '200':
          description: Команда к версии инструкций применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/role-environments:
    get:
      tags: [RoleEnvironments]
      operationId: listRoleEnvironments
      responses:
        '200':
          description: Безопасный каталог поддерживаемых окружений ролей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvironmentPage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/role-image-recipes:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [RoleEnvironments]
      operationId: listRoleImageRecipes
      parameters:
        - { $ref: '#/components/parameters/RoleDefinitionRefQuery' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Окружения ролей Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleImageRecipePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [RoleEnvironments]
      operationId: createRoleImageRecipe
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleImageRecipeCreateInput' }
      responses:
        '201':
          description: Окружение роли создано
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleImageRecipe' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/role-image-recipes/{recipeRef}:
    parameters:
      - { $ref: '#/components/parameters/ProjectRef' }
      - { $ref: '#/components/parameters/RecipeRef' }
    get:
      tags: [RoleEnvironments]
      operationId: getRoleImageRecipe
      responses:
        '200':
          description: Окружение роли и история сборок
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleImageRecipeDetail' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [RoleEnvironments]
      operationId: updateRoleImageRecipe
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleImageRecipeUpdateInput' }
      responses:
        '200':
          description: Окружение роли изменено
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleImageRecipe' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/role-image-recipes/{recipeRef}/commands:
    post:
      tags: [RoleEnvironments]
      operationId: commandRoleImageRecipe
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/RecipeRef' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleImageRecipeCommand' }
      responses:
        '200':
          description: Команда окружения роли применена
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleImageRecipeCommandReceipt' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects/{projectRef}/workflows:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Workflows]
      operationId: listWorkflows
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Процессы Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses:
        '201':
          description: Процесс создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/workflows/{workflowRef}:
    parameters: [{ $ref: '#/components/parameters/WorkflowRef' }]
    get:
      tags: [Workflows]
      operationId: getWorkflow
      responses:
        '200':
          description: Процесс
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Workflows]
      operationId: updateWorkflowDraft
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses:
        '200':
          description: Черновик Процесса изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/workflows/{workflowRef}/commands:
    post:
      tags: [Workflows]
      operationId: commandWorkflow
      parameters: [{ $ref: '#/components/parameters/WorkflowRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowCommand' }
      responses:
        '200':
          description: Команда Процесса применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Доступные запуски
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Runs]
      operationId: createRun
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInput' }
      responses:
        '201':
          description: Запуск создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunWorkspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runs/{runRef}:
    get:
      tags: [Runs]
      operationId: getRun
      parameters: [{ $ref: '#/components/parameters/RunRef' }]
      responses:
        '200':
          description: Запуск
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runs/{runRef}/graph:
    get:
      tags: [Runs]
      operationId: getRunGraph
      parameters: [{ $ref: '#/components/parameters/RunRef' }]
      responses:
        '200':
          description: Authoritative graph snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunWorkspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runs/{runRef}/events:
    get:
      tags: [Runs]
      operationId: listRunEvents
      parameters:
        - { $ref: '#/components/parameters/RunRef' }
        - name: afterSequence
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Ordered catch-up events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventPage' }
        '410':
          description: Event range недоступен, требуется новый snapshot
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runs/{runRef}/commands:
    post:
      tags: [Runs]
      operationId: commandRun
      parameters: [{ $ref: '#/components/parameters/RunRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCommand' }
      responses:
        '200':
          description: Команда полного графа применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunWorkspace' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionRef}/turns:
    post:
      tags: [Runs]
      operationId: addSessionTurn
      parameters: [{ $ref: '#/components/parameters/SessionRef' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnInput' }
      responses:
        '201':
          description: Turn поставлен в FIFO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunWorkspace' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/owner-gates:
    get:
      tags: [Decisions]
      operationId: listOwnerGates
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Human Gates
          content:
            application/json:
              schema:
                type: object
                required: [items]
