  /api/v1/assistant-conversations:
    get:
      tags: [Assistant]
      operationId: listAssistantConversations
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }]
      responses:
        '200':
          description: Долговечная история помощника
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/AssistantConversation' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Assistant]
      operationId: createAssistantConversation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                projectRef: { $ref: '#/components/schemas/OpaqueRef' }
      responses:
        '201':
          description: Диалог создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/assistant-conversations/{conversationRef}/turns:
    post:
      tags: [Assistant]
      operationId: addAssistantTurn
      parameters: [{ $ref: '#/components/parameters/ConversationRef' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 32768 }
                artifactRefs: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OpaqueRef' } }
      responses:
        '202':
          description: Turn поставлен в последовательную очередь warm session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/assistant-plans/{planRef}/application:
    post:
      tags: [Assistant]
      operationId: applyAssistantPlan
      parameters: [{ $ref: '#/components/parameters/PlanRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Typed operations применены в пределах прав пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantPlanReceipt' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration:
    get:
      tags: [Administration]
      operationId: getAdministration
      responses:
        '200':
          description: Core readiness и optional adapters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/audit-events:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      parameters: [{ $ref: '#/components/parameters/ProjectRefQuery' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Безопасный audit readback
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: mattercodex_session
  headers:
    ETag:
      description: Версия авторитетного агрегата
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ProjectRef:
      name: projectRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ProjectRefQuery:
      name: projectRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    MembershipRef:
      name: membershipRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AgentRef:
      name: agentRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RecipeRef:
      name: recipeRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RoleDefinitionRefQuery:
      name: roleDefinitionRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    WorkflowRef:
      name: workflowRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRef:
      name: runRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRefQuery:
      name: runRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    SessionRef:
      name: sessionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    GateRef:
      name: gateRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ArtifactRef:
      name: artifactRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ScheduleRef:
      name: scheduleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConnectionRef:
      name: connectionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConversationRef:
      name: conversationRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    PlanRef:
      name: planRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    Query:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageToken:
      name: pageToken
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
  responses:
    Problem:
      description: Безопасная ошибка API
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OpaqueRef:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    Timestamp:
      type: string
      format: date-time
    NextAction:
      type: string
      enum: [OPEN, EDIT, UPDATE, ARCHIVE, RESTORE, REQUEST_BUILD, ENABLE, DISABLE, VALIDATE, PUBLISH, ROLLBACK, LAUNCH, ADD_TURN, CANCEL, RETRY, RESOLVE_GATE, DOWNLOAD, BIND, TEST, REVOKE, APPLY_PLAN, RECOVER, CREATE_AGENT, CREATE_WORKFLOW, CREATE_RUN, CREATE_SCHEDULE, MANAGE_INTEGRATIONS, MANAGE_MEMBERS, UPLOAD_ARTIFACT, MANAGE_CAPABILITIES]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 1000 }
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 80 }
        correlationId: { type: string, format: uuid }
        actualVersion: { type: integer, format: int64, minimum: 1 }
        winnerSummary: { type: string, maxLength: 300 }
    UserSummary:
      type: object
      additionalProperties: false
      required: [ref, displayName]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        emailHint: { type: string, maxLength: 200 }
    PlatformCapability:
      type: object
      additionalProperties: false
      required: [key, name, description, category, availableWithoutIntegration]
      properties:
        key: { type: string, pattern: '^[a-z0-9_.-]+$', maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 80 }
        availableWithoutIntegration: { type: boolean }
    SystemAssistant:
      type: object
      additionalProperties: false
      required: [ref, version, name, system, removable, corePromptRevision, ownerInstructions, runtimeState, readinessSummary, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 120 }
        system: { type: boolean, enum: [true] }
        removable: { type: boolean, enum: [false] }
        corePromptRevision: { type: string, maxLength: 80 }
        ownerInstructions: { type: string, maxLength: 65536 }
        ownerInstructionsRevision: { type: integer, minimum: 0 }
        runtimeState: { type: string, enum: [PROVISIONING, READY, BUSY, RECOVERING, FAILED] }
        runtimeRevision: { type: string, maxLength: 80 }
        warmSessionRef: { $ref: '#/components/schemas/OpaqueRef' }
        readinessSummary: { type: string, maxLength: 300 }
        lastHeartbeatAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/NextAction' } }
    BootstrapState:
      type: object
      additionalProperties: false
      required: [initialized, onboardingComplete, webOnlyReady, assistant, currentUser]
      properties:
        initialized: { type: boolean }
        onboardingComplete: { type: boolean }
        webOnlyReady: { type: boolean }
        assistant: { $ref: '#/components/schemas/SystemAssistant' }
        currentUser: { $ref: '#/components/schemas/UserSummary' }
    Project:
      type: object
      additionalProperties: false
      required: [ref, version, name, purpose, language, lifecycle, agentCount, workflowCount, activeRunCount, pendingGateCount, updatedAt, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        purpose: { type: string, maxLength: 1000 }
        language: { type: string, enum: [ru, en] }
        lifecycle: { type: string, enum: [ACTIVE, ARCHIVED] }
        agentCount: { type: integer, minimum: 0 }
        workflowCount: { type: integer, minimum: 0 }
        activeRunCount: { type: integer, minimum: 0 }
        pendingGateCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
