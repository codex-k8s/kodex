components:
  securitySchemes:
    oidcBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    ownerSession: { type: apiKey, in: cookie, name: __Host-mattercodex-session }
  parameters:
    CSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 43, maxLength: 64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    OptionalIfMatch: { name: If-Match, in: header, required: false, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    ResourceID: { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
    ResourceRef: { name: resourceRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    Selector: { name: selector, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
    ProviderRef: { name: providerRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    AuthorizationRef: { name: authorizationRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    ConnectionRef: { name: connectionRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    PoolRef: { name: poolRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    DefinitionRef: { name: definitionRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    ConfigurationRef: { name: configurationRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    TestRef: { name: testRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    ApprovalRef: { name: approvalRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    RunRef: { name: runRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    IncidentRef: { name: incidentRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    BackupRef: { name: backupRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    RestoreRef: { name: restoreRef, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
    ResourceKindQuery: { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/ResourceKind' } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    PageToken: { name: pageToken, in: query, schema: { type: string, maxLength: 1024 } }
  headers:
    ETag: { description: Точная версия ресурса для следующего If-Match., schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
  schemas:
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    MattermostTeamStatus:
      title: MattermostTeamStatus
      type: string
      enum: [ACTIVE, DELETED]
    MattermostTeam:
      type: object
      additionalProperties: false
      properties:
        selector: { type: string, minLength: 1, maxLength: 256 }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: '#/components/schemas/MattermostTeamStatus' }
        providerSnapshotSha256: { $ref: '#/components/schemas/Sha256' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
      required: [selector, displayName, slug, status, providerSnapshotSha256, createdAt, updatedAt, observedAt]
    MattermostTeamPage:
      type: object
      additionalProperties: false
      properties:
        teams: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MattermostTeam' } }
        nextPageToken: { type: string, maxLength: 1024 }
