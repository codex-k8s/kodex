components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: kodex_session
  headers:
    ETag:
      description: Версия авторитетного агрегата
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  parameters:
    SkillBundleRef:
      name: bundleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    MemoryRecordRef:
      name: recordRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ContextRevisionRef:
      name: revisionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ContextAgentRefQuery:
      name: agentRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ContextResourceStateQuery:
      name: state
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ContextResourceState' }
    ConfigurationRef:
      name: configurationRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConfigurationRevisionRef:
      name: revisionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ProjectRef:
      name: projectRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ProjectRefQuery:
      name: projectRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    MembershipRef:
      name: membershipRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AccessRoleRef:
      name: roleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AccessBindingRef:
      name: bindingRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AgentRef:
      name: agentRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeEnvironmentRef:
      name: environmentRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeSecretDraftRef:
      name: draftRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeEnvironmentDraftRef:
      name: draftRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeEnvironmentVersionRef:
      name: versionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeSecretRevision:
      name: revision
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    IntegrationInvocationRef:
      name: invocationRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    EmailEffectReceiptRef:
      name: receiptRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    InteractionIdentityRef:
      name: identityRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    SecretRef:
      name: secretRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RecipeRef:
      name: recipeRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RoleDefinitionRefQuery:
      name: roleDefinitionRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    WorkflowRef:
      name: workflowRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRef:
      name: runRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRefQuery:
      name: runRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    SessionRef:
      name: sessionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    GateRef:
      name: gateRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ArtifactRef:
      name: artifactRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ImpactDigest:
      name: X-Impact-Digest
      in: header
      required: true
      description: Digest свежего server-side impact/preflight для exact action и artifact version
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    AttachmentSetRef:
      name: attachmentSetRef
      in: path
      required: true
      schema:
        type: string
        pattern: '^aset_[A-Za-z0-9_-]{8,89}$'
    ArtifactLifecycleStateQuery:
      name: lifecycleState
      in: query
      required: false
      schema:
        type: string
        enum: [ACTIVE, DELETED, PURGE_PENDING, PURGED]
        default: ACTIVE
    ArtifactTypeQuery:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [TEXT, DOCUMENT, IMAGE]
    ArtifactScanStateQuery:
      name: scanState
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, SCANNING, CLEAN, QUARANTINED, FAILED]
    ArtifactSourceKindQuery:
      name: sourceKind
      in: query
      required: false
      schema:
        type: string
        enum: [CONTROL_CENTER, AGENT_RESULT, INTEGRATION_RESULT, KNOWLEDGE_SOURCE, INTERACTION_ATTACHMENT]
    ScheduleRef:
      name: scheduleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConnectionRef:
      name: connectionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ProviderAccountRef:
      name: providerAccountRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConversationRef:
      name: conversationRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    PlanRef:
      name: planRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    Query:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    TemplateAgentRef:
      name: agentRef
      in: query
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    TemplateRuntimeRevisionRef:
      name: runtimeRevisionRef
      in: query
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageToken:
      name: pageToken
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    VFSPageToken:
      name: pageToken
      in: query
      required: false
      schema: { type: string, maxLength: 2048 }
  responses:
    Problem:
      description: Безопасная ошибка API
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OpaqueRef:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    OwnerSessionCreateInput:
      type: object
      additionalProperties: false
      properties:
        purpose: { $ref: '#/components/schemas/OwnerSessionPurpose' }
    OwnerSessionPurpose:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [RUNTIME_SECRET_CREATE, RUNTIME_SECRET_ROTATE, RUNTIME_SECRET_REVOKE, RUNTIME_SECRET_REVEAL, EMAIL_EFFECT_RECONCILIATION]
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        secretRef:
          allOf: [{ $ref: '#/components/schemas/OpaqueRef' }]
          description: Обязателен для ROTATE, REVOKE и REVEAL; отсутствует для CREATE
        receiptRef:
          allOf: [{ $ref: '#/components/schemas/OpaqueRef' }]
          description: Только EMAIL_EFFECT_RECONCILIATION; обязательна точная квитанция, projectRef и secretRef запрещены
        receiptVersion: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        receiptDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
    Timestamp:
      type: string
      format: date-time
    PermissionRisk:
      type: string
      enum: [READ, WRITE, APPROVE, ADMIN]
    AccessSubjectKind:
      type: string
      enum: [USER, OIDC_GROUP, SERVICE]
    AccessScopeKind:
      type: string
      enum: [ORGANIZATION, PROJECT, RESOURCE_KIND, RESOURCE_INSTANCE]
    AccessResourceKind:
      type: string
      enum: [ORGANIZATION, PROJECT, AGENT, WORKFLOW, RUN, SESSION, OWNER_GATE, ARTIFACT, SCHEDULE, INTEGRATION, RUNTIME_ENVIRONMENT, ROLE_IMAGE, SECRET]
    AccessRoleKind:
      type: string
      enum: [SYSTEM, CUSTOM]
    AccessRoleState:
      type: string
      enum: [ACTIVE, ARCHIVED]
    AccessBindingState:
      type: string
      enum: [ACTIVE, REVOKED]
    OIDCGroupState:
      type: string
      enum: [ACTIVE, STALE]
    AccessDecision:
      type: string
      enum: [ALLOWED, DENIED]
    PermissionDefinition:
      type: object
      additionalProperties: false
      required: [key, nameKey, descriptionKey, risk, allowedScopes, resourceKinds, ownerConditionSupported]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' }
        nameKey: { type: string, maxLength: 160 }
        descriptionKey: { type: string, maxLength: 240 }
        risk: { $ref: '#/components/schemas/PermissionRisk' }
        allowedScopes: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/AccessScopeKind' } }
        resourceKinds: { type: array, minItems: 1, maxItems: 9, uniqueItems: true, items: { $ref: '#/components/schemas/AccessResourceKind' } }
        ownerConditionSupported: { type: boolean }
    PermissionDefinitionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PermissionDefinition' } }
    AccessSubject:
      type: object
      additionalProperties: false
      required: [ref, kind, displayName, active, oidcGroupRefs]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        kind: { $ref: '#/components/schemas/AccessSubjectKind' }
        displayName: { type: string, maxLength: 160 }
        active: { type: boolean }
        oidcGroupRefs: { type: array, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/OpaqueRef' } }
    AccessSubjectPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AccessSubject' } }
        nextPageToken: { type: string, maxLength: 512 }
    OIDCGroup:
      type: object
      additionalProperties: false
      required: [ref, displayName, state, memberCount, bindingCount, lastSeenAt, syncedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        displayName: { type: string, maxLength: 200 }
        state: { $ref: '#/components/schemas/OIDCGroupState' }
        memberCount: { type: integer, minimum: 0 }
        bindingCount: { type: integer, minimum: 0 }
        lastSeenAt: { $ref: '#/components/schemas/Timestamp' }
        syncedAt: { $ref: '#/components/schemas/Timestamp' }
    OIDCGroupPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OIDCGroup' } }
        nextPageToken: { type: string, maxLength: 512 }
    AccessRoleVersion:
      type: object
      additionalProperties: false
      required: [ref, roleRef, revision, name, description, permissionKeys, allowedScopes, changeComment, createdAt, createdBy]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        roleRef: { $ref: '#/components/schemas/OpaqueRef' }
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        permissionKeys: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' } }
        allowedScopes: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/AccessScopeKind' } }
        changeComment: { type: string, maxLength: 500 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        createdBy: { $ref: '#/components/schemas/UserSummary' }
    AccessRole:
      type: object
      additionalProperties: false
      required: [ref, version, kind, state, currentVersion, bindingCount, updatedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        kind: { $ref: '#/components/schemas/AccessRoleKind' }
        state: { $ref: '#/components/schemas/AccessRoleState' }
        currentVersion: { $ref: '#/components/schemas/AccessRoleVersion' }
        bindingCount: { type: integer, minimum: 0 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AccessRolePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AccessRole' } }
        nextPageToken: { type: string, maxLength: 512 }
    AccessRoleVersionPage:
      type: object
      additionalProperties: false
      required: [role, items]
      properties:
        role: { $ref: '#/components/schemas/AccessRole' }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AccessRoleVersion' } }
        nextPageToken: { type: string, maxLength: 512 }
    AccessScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/AccessScopeKind' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        resourceKind: { $ref: '#/components/schemas/AccessResourceKind' }
        resourceRef: { $ref: '#/components/schemas/OpaqueRef' }
    AccessConditions:
      type: object
      additionalProperties: false
      required: [requireOwner]
      properties:
        validFrom: { $ref: '#/components/schemas/Timestamp' }
        validUntil: { $ref: '#/components/schemas/Timestamp' }
        requireOwner: { type: boolean }
    AccessBinding:
      type: object
      additionalProperties: false
      required: [ref, version, state, subject, roleVersion, scope, conditions, createdAt, updatedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        state: { $ref: '#/components/schemas/AccessBindingState' }
        subject: { $ref: '#/components/schemas/AccessSubject' }
        roleVersion: { $ref: '#/components/schemas/AccessRoleVersion' }
        scope: { $ref: '#/components/schemas/AccessScope' }
        conditions: { $ref: '#/components/schemas/AccessConditions' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AccessBindingPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AccessBinding' } }
        nextPageToken: { type: string, maxLength: 512 }
    AccessExplanationStep:
      type: object
      additionalProperties: false
      required: [code, sourceKind]
      properties:
        code: { type: string, enum: [DIRECT_BINDING, OIDC_GROUP_BINDING, SERVICE_BINDING, ROLE_PERMISSION, SCOPE_MATCH, CONDITION_MATCH, NO_ALLOW_BINDING] }
        bindingRef: { $ref: '#/components/schemas/OpaqueRef' }
        roleRef: { $ref: '#/components/schemas/OpaqueRef' }
        roleVersionRef: { $ref: '#/components/schemas/OpaqueRef' }
        sourceKind: { $ref: '#/components/schemas/AccessSubjectKind' }
        sourceRef: { $ref: '#/components/schemas/OpaqueRef' }
        scope: { $ref: '#/components/schemas/AccessScope' }
    EffectiveAccessDecision:
      type: object
      additionalProperties: false
      required: [permissionKey, decision, target, explanation]
      properties:
        permissionKey: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' }
        decision: { $ref: '#/components/schemas/AccessDecision' }
        target: { $ref: '#/components/schemas/AccessScope' }
        explanation: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AccessExplanationStep' } }
    AccessRoleInput:
      type: object
      additionalProperties: false
      required: [name, description, permissionKeys, allowedScopes, changeComment]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        permissionKeys: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' } }
        allowedScopes: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/AccessScopeKind' } }
        changeComment: { type: string, maxLength: 500 }
    AccessBindingInput:
      type: object
      additionalProperties: false
      required: [subjectKind, subjectRef, roleVersionRef, scope, conditions]
      properties:
        subjectKind: { $ref: '#/components/schemas/AccessSubjectKind' }
        subjectRef: { $ref: '#/components/schemas/OpaqueRef' }
        roleVersionRef: { $ref: '#/components/schemas/OpaqueRef' }
        scope: { $ref: '#/components/schemas/AccessScope' }
        conditions: { $ref: '#/components/schemas/AccessConditions' }
    AccessBindingChangeInput:
      type: object
      additionalProperties: false
      required: [roleVersionRef, scope, conditions]
      properties:
        roleVersionRef: { $ref: '#/components/schemas/OpaqueRef' }
        scope: { $ref: '#/components/schemas/AccessScope' }
        conditions: { $ref: '#/components/schemas/AccessConditions' }
    EffectiveAccessQuery:
      type: object
      additionalProperties: false
      required: [target, permissionKeys]
      properties:
        subjectRef: { $ref: '#/components/schemas/OpaqueRef' }
        target: { $ref: '#/components/schemas/AccessScope' }
        permissionKeys: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' } }
    EffectiveAccessPage:
      type: object
      additionalProperties: false
      required: [subject, items, evaluatedAt]
      properties:
        subject: { $ref: '#/components/schemas/AccessSubject' }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EffectiveAccessDecision' } }
        evaluatedAt: { $ref: '#/components/schemas/Timestamp' }
    ExplainAccessInput:
      type: object
      additionalProperties: false
      required: [permissionKey, target]
      properties:
        subjectRef: { $ref: '#/components/schemas/OpaqueRef' }
        permissionKey: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' }
        target: { $ref: '#/components/schemas/AccessScope' }
    ExplainAccessResult:
      type: object
      additionalProperties: false
      required: [subject, result, evaluatedAt]
      properties:
        subject: { $ref: '#/components/schemas/AccessSubject' }
        result: { $ref: '#/components/schemas/EffectiveAccessDecision' }
        evaluatedAt: { $ref: '#/components/schemas/Timestamp' }
    AccessRoleDraft:
      type: object
      additionalProperties: false
      required: [permissionKeys, allowedScopes]
      properties:
        permissionKeys: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' } }
        allowedScopes: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/AccessScopeKind' } }
    AccessBindingDraft:
      type: object
      additionalProperties: false
      required: [subjectKind, subjectRef, scope, conditions]
      properties:
        subjectKind: { $ref: '#/components/schemas/AccessSubjectKind' }
        subjectRef: { $ref: '#/components/schemas/OpaqueRef' }
        scope: { $ref: '#/components/schemas/AccessScope' }
        conditions: { $ref: '#/components/schemas/AccessConditions' }
    SimulateAccessInput:
      type: object
      additionalProperties: false
      required: [subjectRef, permissionKey, target, role, binding]
      properties:
        subjectRef: { $ref: '#/components/schemas/OpaqueRef' }
        permissionKey: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,95}$' }
        target: { $ref: '#/components/schemas/AccessScope' }
        role: { $ref: '#/components/schemas/AccessRoleDraft' }
        binding: { $ref: '#/components/schemas/AccessBindingDraft' }
        evaluatedAt: { $ref: '#/components/schemas/Timestamp' }
    SimulateAccessResult:
      type: object
      additionalProperties: false
      required: [subject, current, simulated, evaluatedAt]
      properties:
        subject: { $ref: '#/components/schemas/AccessSubject' }
        current: { $ref: '#/components/schemas/EffectiveAccessDecision' }
        simulated: { $ref: '#/components/schemas/EffectiveAccessDecision' }
        evaluatedAt: { $ref: '#/components/schemas/Timestamp' }
    NextAction:
      type: string
      enum: [OPEN, EDIT, UPDATE, ARCHIVE, RESTORE, REQUEST_BUILD, ENABLE, DISABLE, VALIDATE, PUBLISH, ROLLBACK, LAUNCH, ADD_TURN, CANCEL, RETRY, RESOLVE_GATE, DOWNLOAD, BIND, TEST, REVOKE, REFRESH_AUTHORIZATION, APPLY_PLAN, RECOVER, CREATE_AGENT, CREATE_WORKFLOW, CREATE_RUN, CREATE_SCHEDULE, MANAGE_INTEGRATIONS, MANAGE_MEMBERS, UPLOAD_ARTIFACT, MANAGE_CAPABILITIES, MANAGE_GRANTS, CREATE_PROJECT, CREATE_CONNECTION, CREATE_CONVERSATION, COMPLETE_ONBOARDING, CONFIGURE_CREDENTIAL, ROTATE, REVEAL, PROMOTE, DELETE, PURGE]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 1000 }
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 80 }
        correlationId: { type: string, format: uuid }
        retryable: { type: boolean }
        actualVersion: { type: integer, format: int64, minimum: 1 }
        winnerSummary: { type: string, maxLength: 300 }
    UserSummary:
      type: object
      additionalProperties: false
      required: [ref, displayName]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        emailHint: { type: string, maxLength: 200 }
    PlatformCapability:
      type: object
      additionalProperties: false
      required: [key, name, description, category, availableWithoutIntegration]
      properties:
        key: { type: string, pattern: '^[a-z0-9_.-]+$', maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 80 }
        availableWithoutIntegration: { type: boolean }
    SystemAssistant:
      type: object
      additionalProperties: false
      required: [ref, version, name, system, removable, corePromptRevision, ownerInstructions, runtimeState, readinessSummary, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 120 }
        system: { type: boolean, enum: [true] }
        removable: { type: boolean, enum: [false] }
        corePromptRevision: { type: string, maxLength: 80 }
        ownerInstructions: { type: string, maxLength: 65536 }
        ownerInstructionsRevision: { type: integer, minimum: 0 }
        runtimeState: { type: string, enum: [PROVISIONING, READY, BUSY, RECOVERING, FAILED] }
        runtimeRevision: { type: string, maxLength: 80 }
        warmSessionRef: { $ref: '#/components/schemas/OpaqueRef' }
        readinessSummary: { type: string, maxLength: 300 }
        lastHeartbeatAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/NextAction' } }
    BootstrapState:
      type: object
      additionalProperties: false
      required: [initialized, onboardingComplete, webOnlyReady, assistant, currentUser, platformRole, nextActions, speechTranscription]
      properties:
        initialized: { type: boolean }
        onboardingComplete: { type: boolean }
        webOnlyReady: { type: boolean }
        assistant: { $ref: '#/components/schemas/SystemAssistant' }
        currentUser: { $ref: '#/components/schemas/UserSummary' }
        platformRole: { type: string, enum: [OWNER, ADMINISTRATOR, OPERATOR, MEMBER, AUDITOR] }
        nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
        speechTranscription: { $ref: '#/components/schemas/SpeechTranscriptionAvailability' }
    SpeechTranscriptionAvailability:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [READY, STT_NOT_CONFIGURED, STT_DISABLED, STT_PERMISSION_DENIED, STT_PERMISSION_INVALID, STT_PROVIDER_ACCOUNT_INELIGIBLE, STT_PROVIDER_CREDENTIAL_UNSUPPORTED, STT_PROVIDER_DISABLED, STT_MODEL_UNSUPPORTED, STT_CONFIGURATION_UNAVAILABLE, STT_SERVICE_UNAVAILABLE, STT_CREDENTIAL_UNAVAILABLE, STT_EGRESS_UNAVAILABLE, STT_PROVIDER_UNAVAILABLE] }
        validUntil: { $ref: '#/components/schemas/Timestamp' }
    ManagedConfigurationDraftInput:
      type: object
      additionalProperties: false
      required: [name, contentFormat, content]
      properties:
        configurationRef: { $ref: '#/components/schemas/OpaqueRef' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        name: { type: string, minLength: 1, maxLength: 160 }
        contentFormat: { type: string, enum: [TEXT, JSON, YAML, TOML] }
        content: { type: string, minLength: 1, maxLength: 262144 }
    ManagedConfigurationDraftSaveInput:
      type: object
      additionalProperties: false
      required: [contentFormat, content]
      properties:
        contentFormat: { type: string, enum: [TEXT, JSON, YAML, TOML] }
        content:
          type: string
          maxLength: 262144
          description: Неполный текст допустим; ограничение 256 KiB применяется к UTF-8 байтам. Пустая строка разрешена, отсутствие поля и null запрещены.
          x-go-type: '*string'
    ManagedConfigurationCopyInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    ManagedConfigurationConsumer:
      type: object
      additionalProperties: false
      required: [kind, ref, revisionRef, version]
      properties:
        kind: { type: string, enum: [AGENT, WORKFLOW, SCHEDULE, RUNTIME_ENVIRONMENT, INTEGRATION_CONNECTION, STT_SERVICE] }
        ref: { type: string, minLength: 1, maxLength: 160 }
        revisionRef: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    ManagedConfigurationRebindInput:
      type: object
      additionalProperties: false
      required: [impactDigest, consumers]
      properties:
        impactDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        consumers: { type: array, minItems: 1, maxItems: 128, items: { $ref: '#/components/schemas/ManagedConfigurationConsumer' } }
    ManagedConfigurationRevision:
      type: object
      additionalProperties: false
      required: [ref, revision, state, contentFormat, content, digest, validationDiagnostics, createdAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        revision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        state: { type: string, enum: [DRAFT, VALID, INVALID, PUBLISHED, SUPERSEDED, DISCARDED] }
        contentFormat: { type: string, enum: [TEXT, JSON, YAML, TOML] }
        content: { type: string, maxLength: 262144 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        validationDiagnostics: { type: array, items: { type: string } }
        parentRevisionRef: { $ref: '#/components/schemas/OpaqueRef' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        validatedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
    ManagedConfiguration:
      type: object
      additionalProperties: false
      required: [ref, version, kind, name, managedBy, source, sourceRevision, updatedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        kind: { type: string, enum: [PROMPT_TEMPLATE, ROLE_IMAGE, INTEGRATION_DEFINITION, SYSTEM_STT, EMAIL_MAILBOX] }
        name: { type: string, minLength: 1, maxLength: 160 }
        managedBy: { type: string, enum: [UI, GIT] }
        source: { type: string, maxLength: 2000 }
        sourceRevision: { type: string, maxLength: 2000 }
        currentRevision: { $ref: '#/components/schemas/ManagedConfigurationRevision' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ManagedConfigurationSummary:
      type: object
      additionalProperties: false
      required: [ref, version, kind, name, managedBy, source, sourceRevision, updatedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        kind: { type: string, enum: [PROMPT_TEMPLATE, ROLE_IMAGE, INTEGRATION_DEFINITION, SYSTEM_STT, EMAIL_MAILBOX] }
        name: { type: string, minLength: 1, maxLength: 160 }
        managedBy: { type: string, enum: [UI, GIT] }
        source: { type: string, maxLength: 2000 }
        sourceRevision: { type: string, maxLength: 2000 }
        currentRevision:
          type: object
          additionalProperties: false
          required: [ref, revision, state, digest]
          properties:
            ref: { $ref: '#/components/schemas/OpaqueRef' }
            revision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
            state: { type: string, enum: [DRAFT, VALID, INVALID, PUBLISHED, SUPERSEDED, DISCARDED] }
            digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ManagedConfigurationPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ManagedConfigurationSummary' } }
        total: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        nextPageToken: { type: string, maxLength: 512 }
    ManagedConfigurationResult:
      type: object
      additionalProperties: false
      required: [configuration, revision]
      properties:
        configuration: { $ref: '#/components/schemas/ManagedConfiguration' }
        revision: { $ref: '#/components/schemas/ManagedConfigurationRevision' }
    ManagedConfigurationDetachment:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: { $ref: '#/components/schemas/ManagedConfiguration' }
    ManagedConfigurationHistory:
      type: object
      additionalProperties: false
      required: [configuration, items, total]
      properties:
        configuration: { $ref: '#/components/schemas/ManagedConfiguration' }
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ManagedConfigurationRevision' } }
        total: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        nextPageToken: { type: string, maxLength: 512 }
    ManagedConfigurationImpact:
      type: object
      additionalProperties: false
      required: [configurationRef, targetRevisionRef, consumers, digest, total]
      properties:
