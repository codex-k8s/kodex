openapi: 3.0.3
info:
  title: MatterCodex Control API Gateway
  version: 1.0.0
  description: >-
    Owner API для проектов, управляемой конфигурации и авторитетных проекций
    control-plane. Actor, organization, project и ownership выводятся только из
    проверенной OIDC-сессии и состояния control-plane; request body не является
    источником полномочий.
servers:
  - url: https://control-api.mattercodex.local/api/v1
tags:
  - { name: session, description: Защищённая owner-сессия gateway. }
  - { name: projects, description: Проекты в разрешённой owner boundary. }
  - { name: resources, description: Управление ресурсами через control-plane. }
  - { name: projections, description: Авторитетные read-only проекции. }
  - { name: schedules, description: Специализированные owner-команды расписаний. }
  - { name: owner-gates, description: Специализированные решения owner gate. }
  - { name: backups, description: Безопасные backup projections и restore commands. }
  - { name: role-images, description: Специализированные owner-команды image recipe/build. }
paths:
  /session:
    post:
      tags: [session]
      summary: Создать защищённую owner-сессию
      operationId: createOwnerSession
      security: [{ oidcBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204':
          description: Защищённая owner-сессия и CSRF cookie созданы.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [session]
      summary: Завершить локальную owner-сессию
      operationId: deleteOwnerSession
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Локальная сессия закрыта. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects:
    get:
      tags: [projects]
      summary: Получить доступные owner проекты
      operationId: listProjects
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Проекты, видимые проверенному owner.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [projects]
      summary: Создать проект с назначенным сервером owner
      operationId: createProject
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProject' } } }
      responses:
        '201':
          description: Сервер назначил project ID и owner.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [projects]
      summary: Обновить exact owner project после tenant resolution
      operationId: updateProject
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProject' } } }
      responses:
        '200':
          description: Авторитетная новая версия project.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [projects]
      summary: Терминально удалить пустой exact owner project
      operationId: deleteProject
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Terminal tombstone readback удалённого project.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources:
    get:
      tags: [resources]
      summary: Получить авторитетную страницу ресурсов
      operationId: listResources
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceKindQuery' }
        - { name: parentId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/LifecycleState' } }, style: form, explode: true }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Авторитетная проекция ресурсов текущей owner/tenant boundary.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [resources]
      summary: Создать ресурс допустимого вида
      operationId: createResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateResource' } } }
      responses:
        '201':
          description: Ресурс создан; project и owner назначены сервером.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [resources]
      summary: Получить ресурс после owner resolution
      operationId: getResource
      security: [{ ownerSession: [] }]
      parameters:
        - { name: expectedKind, in: query, required: true, schema: { $ref: '#/components/schemas/ResourceKind' } }
      responses:
        '200':
          description: Ресурс после owner/tenant resolution.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [resources]
      summary: Обновить ресурс с optimistic concurrency
      operationId: updateResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateResource' } } }
      responses:
        '200':
          description: Ресурс обновлён после server-side owner resolution и OCC.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [resources]
      summary: Удалить ресурс с optimistic concurrency
      operationId: deleteResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Авторитетное состояние удаления.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/search:
    get:
      tags: [resources]
      summary: Выполнить авторитетный owner search одного закрытого resource kind
      operationId: searchResources
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceKindQuery' }
        - { name: query, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 128 } }
        - { name: state, in: query, schema: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/LifecycleState' } }, style: form, explode: true }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Страница search results той же owner eligibility boundary.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourcePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}/transition:
    post:
      tags: [resources]
      summary: Выполнить допустимый lifecycle transition
      operationId: transitionResource
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceID' }
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransitionResource' } } }
      responses:
        '200':
          description: Новый state после специализированной проверки lifecycle.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /role-image-recipes/commands:
    post:
      tags: [role-images]
      summary: Выполнить закрытую owner-команду RoleImageRecipe
      operationId: manageRoleImageRecipe
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: If-Match, in: header, required: false, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ManageRoleImageRecipe' } } }
      responses:
        '200':
          description: Авторитетный recipe и результат resolve/build/reuse.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RoleImageRecipeResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /role-image-recipes/{recipeId}:
    get:
      tags: [role-images]
      summary: Прочитать exact version полной редактируемой RoleImageRecipe specification
      operationId: getRoleImageRecipe
      security: [{ ownerSession: [] }]
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Полная owner-scoped specification; secret values отсутствуют.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RoleImageRecipeReadback' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /image-builds/commands:
    post:
      tags: [role-images]
      summary: Выполнить закрытую owner-команду ImageBuild
      operationId: manageImageBuild
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ManageImageBuild' } } }
      responses:
        '200':
          description: Авторитетное состояние ImageBuild.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /image-builds/{imageBuildId}:
    get:
      tags: [role-images]
      summary: Прочитать exact version ImageBuild через специализированный owner path
      operationId: getRoleImageBuild
      security: [{ ownerSession: [] }]
      parameters:
        - name: imageBuildId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Авторитетное состояние exact ImageBuild version.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /schedules:
    post:
      tags: [schedules]
      summary: Создать server-owned schedule специализированной командой
      operationId: createSchedule
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSchedule' } } }
      responses:
        '201':
          description: Schedule создан с server-assigned ID, owner и watermark.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [schedules]
      summary: Обновить locked owner schedule специализированной командой
      operationId: updateSchedule
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSchedule' } } }
      responses:
        '200':
          description: Авторитетная новая версия schedule.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
