        operations: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AssistantPlanOperation' } }
        auditSummary: { type: string, maxLength: 1000 }
        applied: { type: boolean }
        contentDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        validationProblems: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
        validatedAt: { $ref: '#/components/schemas/Timestamp' }
        appliedAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [ref, sequence, role, content, state, createdAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM_RECEIPT] }
        content: { type: string, maxLength: 32768 }
        state: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
        plan: { $ref: '#/components/schemas/AssistantPlan' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    AssistantConversation:
      type: object
      additionalProperties: false
      required: [ref, version, title, titleSource, titleRevision, context, turns, updatedAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        title: { type: string, maxLength: 160 }
        titleSource: { type: string, enum: [SERVER_DEFAULT, AGENT_PROPOSED, USER_EDITED] }
        titleRevision: { type: integer, format: int64, minimum: 1 }
        context: { $ref: '#/components/schemas/AssistantContextDescriptor' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        turns: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/AssistantTurn' } }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AssistantContextDescriptor:
      type: object
      additionalProperties: false
      required: [route, entityKind, entityRef, entityName, allowedOperations]
      properties:
        route: { type: string, maxLength: 500 }
        entityKind: { type: string, maxLength: 80 }
        entityRef: { type: string, maxLength: 96 }
        entityName: { type: string, maxLength: 300 }
        entityVersion: { type: integer, format: int64, minimum: 1 }
        allowedOperations:
          type: array
          maxItems: 32
          items: { type: string, enum: [CREATE_PROJECT, CREATE_AGENT, CREATE_WORKFLOW, CHANGE_CAPABILITY, CHANGE_INTEGRATION_GRANT, CREATE_SCHEDULE, LAUNCH_RUN, CREATE_INTEGRATION_CONNECTION, TEST_INTEGRATION_CONNECTION, ARCHIVE_AGENT, ARCHIVE_WORKFLOW] }
    AssistantPlanReceipt:
      type: object
      additionalProperties: false
      required: [ref, planRef, planRevision, outcome, operationReceipts, conflicts, auditRefs, createdResourceRefs, createdAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        planRef: { $ref: '#/components/schemas/OpaqueRef' }
        planRevision: { type: integer, format: int64, minimum: 1 }
        outcome: { type: string, enum: [APPLIED, CONFLICT, REJECTED] }
        operationReceipts:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [operationRef, resourceRef, outcome, auditRef]
            properties:
              operationRef: { $ref: '#/components/schemas/OpaqueRef' }
              resourceRef: { $ref: '#/components/schemas/OpaqueRef' }
              outcome: { type: string, enum: [APPLIED] }
              auditRef: { $ref: '#/components/schemas/OpaqueRef' }
        conflicts:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [operationRef, targetRef, field, expected, actual]
            properties:
              operationRef: { $ref: '#/components/schemas/OpaqueRef' }
              targetRef: { type: string, maxLength: 96 }
              field: { type: string, maxLength: 120 }
              expected: {}
              actual: {}
        auditRefs: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/OpaqueRef' } }
        createdResourceRefs: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/OpaqueRef' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    AssistantPlanApplicationResponse:
      type: object
      additionalProperties: false
      required: [conversation, plan, createdResourceRefs, receipt]
      properties:
        conversation: { $ref: '#/components/schemas/AssistantConversation' }
        plan: { $ref: '#/components/schemas/AssistantPlan' }
        createdResourceRefs: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/OpaqueRef' } }
        receipt: { $ref: '#/components/schemas/AssistantPlanReceipt' }
    AssistantPlanDecisionResponse:
      type: object
      additionalProperties: false
      required: [plan, receipt]
      properties:
        plan: { $ref: '#/components/schemas/AssistantPlan' }
        receipt: { $ref: '#/components/schemas/AssistantPlanReceipt' }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [ref, initiator, executor, source, action, resourceType, resourceRef, resourceName, outcome, safeSummary, occurredAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        initiator: { $ref: '#/components/schemas/UserSummary' }
        executor: { type: string, maxLength: 160 }
        source: { type: string, maxLength: 80 }
        action: { type: string, maxLength: 100 }
        resourceType: { type: string, maxLength: 80 }
        resourceRef: { $ref: '#/components/schemas/OpaqueRef' }
        resourceName: { type: string, maxLength: 200 }
        outcome: { type: string, enum: [SUCCEEDED, REJECTED, FAILED] }
        safeSummary: { type: string, maxLength: 1000 }
        safeErrorCode: { type: string, maxLength: 80 }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
    Incident:
      type: object
      additionalProperties: false
      required: [ref, category, severity, state, safeSummary, safeNextStep, coreAffected, createdAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        category: { type: string, maxLength: 80 }
        severity: { type: string, enum: [INFO, WARNING, ERROR, CRITICAL] }
        state: { type: string, enum: [OPEN, RECOVERING, RESOLVED] }
        safeSummary: { type: string, maxLength: 1000 }
        safeNextStep: { type: string, maxLength: 1000 }
        coreAffected: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Overview:
      type: object
      additionalProperties: false
      required: [projectCount, agentCount, activeRunCount, pendingGateCount, activeRuns, pendingGates, recentArtifacts]
      properties:
        projectCount: { type: integer, minimum: 0 }
        agentCount: { type: integer, minimum: 0 }
        activeRunCount: { type: integer, minimum: 0 }
        pendingGateCount: { type: integer, minimum: 0 }
        activeRuns: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Run' } }
        pendingGates: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OwnerGate' } }
        recentArtifacts: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Artifact' } }
    AdministrationState:
      type: object
      additionalProperties: false
      required: [profile, coreReady, coreSummary, assistant, optionalAdapters, incidents, observedAt]
      properties:
        profile: { type: string, enum: [WEB_ONLY, WEB_WITH_OPTIONAL_ADAPTERS] }
        coreReady: { type: boolean }
        coreSummary: { type: string, maxLength: 500 }
        assistant: { $ref: '#/components/schemas/SystemAssistant' }
        optionalAdapters: { type: array, items: { $ref: '#/components/schemas/IntegrationDefinition' } }
        incidents: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Incident' } }
        observedAt: { $ref: '#/components/schemas/Timestamp' }
