components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: kodex_session
  headers:
    ETag:
      description: Версия авторитетного агрегата
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ProjectRef:
      name: projectRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ProjectRefQuery:
      name: projectRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    MembershipRef:
      name: membershipRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AccessRoleRef:
      name: roleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AccessBindingRef:
      name: bindingRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    AgentRef:
      name: agentRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RuntimeEnvironmentRef:
      name: environmentRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RecipeRef:
      name: recipeRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RoleDefinitionRefQuery:
      name: roleDefinitionRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    WorkflowRef:
      name: workflowRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRef:
      name: runRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    RunRefQuery:
      name: runRef
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    SessionRef:
      name: sessionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    GateRef:
      name: gateRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ArtifactRef:
      name: artifactRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ScheduleRef:
      name: scheduleRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConnectionRef:
      name: connectionRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    ConversationRef:
      name: conversationRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueRef' }
    PlanRef:
      name: planRef
      in: path
      required: true
