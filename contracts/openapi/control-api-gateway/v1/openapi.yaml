openapi: 3.0.3
info:
  title: Kodex Control Center API
  version: 1.0.0
  description: |
    Owner-facing web-first API Kodex. Actor, organization, ownership,
    permissions и root lineage выводятся из проверенной сессии и состояния
    control-plane. Внешние интеграции не являются обязательными.
servers:
  - url: https://kodex.example.com
    description: Environment-owned HTTPS endpoint
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Bootstrap
  - name: Projects
  - name: Agents
  - name: RoleEnvironments
  - name: Workflows
  - name: Runs
  - name: Decisions
  - name: Artifacts
  - name: Automations
  - name: Integrations
  - name: Assistant
  - name: Administration
  - name: Access

paths:
  /api/v1/session:
    post:
      tags: [Session]
      operationId: createOwnerSession
      security: [{ oidcBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204':
          description: Защищённая browser-сессия создана
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Session]
      operationId: renewOwnerSession
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Idle-срок защищённой browser-сессии продлён при необходимости }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Session]
      operationId: deleteOwnerSession
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Защищённая browser-сессия завершена }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapState
      responses:
        '200':
          description: Авторитетное состояние bootstrap и помощника
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/onboarding/completion:
    post:
      tags: [Bootstrap]
      operationId: completeOnboarding
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Onboarding завершён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapState' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/overview:
    get:
      tags: [Bootstrap]
      operationId: getOverview
      parameters:
        - { $ref: '#/components/parameters/ProjectRefQuery' }
      responses:
        '200':
          description: Сводка доступной пользователю работы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/platform-capabilities:
    get:
      tags: [Bootstrap]
      operationId: listPlatformCapabilities
      responses:
        '200':
          description: Каталог core capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformCapability' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/runtime-selections:
    get:
      tags: [Bootstrap]
      operationId: listRuntimeSelections
      responses:
        '200':
          description: Доступные профили выполнения ИИ-сотрудников
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RuntimeSelection' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/search:
    get:
      tags: [Search]
      operationId: searchPlatform
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Доступные actor результаты глобального поиска
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultPage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Доступные Проекты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Проект создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200':
          description: Проект
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Проект изменён
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMemberships
      responses:
        '200':
          description: Участники Проекта
          content:
            application/json:
              schema:
                type: object
                required: [items, nextActions]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                  nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: addProjectMembership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMembershipCreateInput' }
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/members:
    get:
      tags: [Administration]
      operationId: listPlatformMemberships
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Участники организации и их platform roles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextActions]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                  nextPageToken: { type: string, maxLength: 512 }
                  nextActions: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Administration]
      operationId: addPlatformMembership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformMembershipCreateInput' }
      responses:
        '201':
          description: Участник организации добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/membership-candidates:
    get:
      tags: [Administration]
      operationId: listPlatformMembershipCandidates
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Проверенные пользователи, которых можно добавить в организацию
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/administration/members/{membershipRef}:
    parameters: [{ $ref: '#/components/parameters/MembershipRef' }]
    patch:
      tags: [Administration]
      operationId: changePlatformMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformMembershipChangeInput' }
      responses:
        '200':
          description: Platform role изменена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Administration]
      operationId: removePlatformMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Участие в организации отозвано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/membership-candidates:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Projects]
      operationId: listProjectMembershipCandidates
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Пользователи, которых можно добавить в Проект
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  nextPageToken: { type: string, maxLength: 512 }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{projectRef}/members/{membershipRef}:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }, { $ref: '#/components/parameters/MembershipRef' }]
    patch:
      tags: [Projects]
      operationId: changeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMembershipChangeInput' }
      responses:
        '200':
          description: Доступ изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Projects]
      operationId: removeProjectMembership
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Участие отозвано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects/{projectRef}/agents:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Agents]
      operationId: listAgents
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: ИИ-сотрудники Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Agents]
      operationId: createAgent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '201':
          description: ИИ-сотрудник создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}:
    parameters: [{ $ref: '#/components/parameters/AgentRef' }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        '200':
          description: ИИ-сотрудник
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '200':
          description: ИИ-сотрудник изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-versions:
    get:
      tags: [Agents]
      operationId: listAgentInstructionVersions
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: История опубликованных версий инструкций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructionVersionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/commands:
    post:
      tags: [Agents]
      operationId: commandAgent
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCommand' }
      responses:
        '200':
          description: Специализированная команда применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-drafts:
    post:
      tags: [Agents]
      operationId: createInstructionDraft
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties: { content: { type: string, minLength: 1, maxLength: 65536 } }
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/instruction-commands:
    post:
      tags: [Agents]
      operationId: commandAgentInstructions
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructionCommand' }
      responses:
        '200':
          description: Команда к версии инструкций применена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/agents/{agentRef}/runtime-configuration:
    parameters: [{ $ref: '#/components/parameters/AgentRef' }]
    get:
      tags: [Agents]
      operationId: getAgentRuntimeConfiguration
      responses:
        '200':
          description: Опубликованная runtime-конфигурация и безопасный effective readback
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Agents]
      operationId: publishAgentRuntimeConfiguration
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationInput' }
      responses:
        '200':
          description: Новая runtime-конфигурация опубликована
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/runtime-configuration/versions:
    get:
      tags: [Agents]
      operationId: listAgentRuntimeConfigurationVersions
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: История опубликованных runtime-конфигураций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationPage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/config-overlay-drafts:
    post:
      tags: [Agents]
      operationId: createConfigOverlayDraft
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigOverlayDraftInput' }
      responses:
        '201':
          description: Черновик config.toml overlay создан
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/config-overlay-drafts/validation:
    post:
      tags: [Agents]
      operationId: validateConfigOverlayDraft
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Черновик проверен строгим TOML parser и закрытым allowlist
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/config-overlay-drafts/publication:
    post:
      tags: [Agents]
      operationId: publishConfigOverlayDraft
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Проверенный overlay опубликован
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/config-overlay-rollbacks:
    post:
      tags: [Agents]
      operationId: rollbackConfigOverlay
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigOverlayRollbackInput' }
      responses:
        '200':
          description: Выбранная опубликованная версия повторно опубликована
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/agents/{agentRef}/runtime-environment-binding:
    put:
      tags: [Agents]
      operationId: bindAgentRuntimeEnvironment
      parameters: [{ $ref: '#/components/parameters/AgentRef' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeEnvironmentBindingInput' }
      responses:
        '200':
          description: Агент привязан к опубликованному environment set
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRuntimeConfigurationView' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/projects/{projectRef}/runtime-environments:
    parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
    get:
      tags: [Agents]
      operationId: listRuntimeEnvironmentSets
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Поисковый cursor-каталог environment sets Проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeEnvironmentPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Agents]
      operationId: createRuntimeEnvironmentSet
