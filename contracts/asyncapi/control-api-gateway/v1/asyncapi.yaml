asyncapi: 3.0.0
info:
  title: MatterCodex Control API Realtime
  version: 1.0.0
  description: >-
    Защищённый WebSocket snapshot/rejoin contract. Gateway не подписывается на
    NATS и не хранит проекции: каждый snapshot получается через owner-scoped
    control-plane RPC после проверки той же session/CSRF/Origin boundary.
servers:
  owner:
    host: control-api.mattercodex.local
    pathname: /api/v1/realtime
    protocol: wss
    security: [{ $ref: '#/components/securitySchemes/ownerSession' }]
    x-origin-policy: exact-https-allowlist
    x-required-subprotocols:
      - mattercodex.control.v1
      - csrf.<csrf-token>
channels:
  realtime:
    address: /api/v1/realtime
    messages:
      subscribe: { $ref: '#/components/messages/Subscribe' }
      snapshot: { $ref: '#/components/messages/Snapshot' }
      problem: { $ref: '#/components/messages/Problem' }
operations:
  subscribeRealtime:
    action: receive
    channel: { $ref: '#/channels/realtime' }
    messages: [{ $ref: '#/channels/realtime/messages/subscribe' }]
    x-gateway-mapping: CONTROL_PLANE_AUTHORITY_PROOF_AND_RPC
    x-authoritative-rpcs:
      RUNS: /controlplane.v1.ControlPlaneService/ListResources
      INCIDENTS: /controlplane.v1.ControlPlaneService/ListRuntimeIncidents
      RESOURCES: /controlplane.v1.ControlPlaneService/ListResources
      CONFIGURATION_CHANGES: /controlplane.v1.ControlPlaneService/ListAuditEvents
  publishRealtime:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - { $ref: '#/channels/realtime/messages/snapshot' }
      - { $ref: '#/channels/realtime/messages/problem' }
    x-delivery:
      mode: AUTHORITATIVE_SNAPSHOT
      orderingKey: connectionId+sequence
      reconnect: RESUBSCRIBE_AND_READ_CURRENT_STATE
      duplicateBehavior: CLIENT_REPLACES_CHANNEL_SNAPSHOT
      gapBehavior: CLIENT_RECONNECTS_AND_RESUBSCRIBES
      atomicCommit: CLIENT_COMMITS_ONLY_COMPLETE_SINGLE_FRAME
      overflow: PROBLEM_AND_CLOSE_WITHOUT_REPLACE
    x-consumers:
      - service: owner-browser-client
        purpose: REPLACE_OWNER_VISIBLE_REALTIME_PROJECTION
        effect: REPLACE_CHANNEL_SNAPSHOT
        eligibility: SAME_VERIFIED_OWNER_SESSION
components:
  securitySchemes:
    ownerSession:
      type: httpApiKey
      in: cookie
      name: __Host-mattercodex-session
  messages:
    Subscribe:
      name: subscribe
      contentType: application/json
      payload: { $ref: '#/components/schemas/SubscribeEnvelope' }
    Snapshot:
      name: snapshot
      contentType: application/json
      payload: { $ref: '#/components/schemas/SnapshotEnvelope' }
    Problem:
      name: problem
      contentType: application/problem+json
      payload: { $ref: '#/components/schemas/ProblemEnvelope' }
  schemas:
    SubscribeEnvelope:
      title: SubscribeEnvelope
      $id: urn:mattercodex:control-api:ws:SubscribeEnvelope
      type: object
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/SubscribeMessageType' }
        requestId: { $ref: '#/components/schemas/RequestId' }
        channels: { $ref: '#/components/schemas/ProjectionChannelList' }
        resourceKinds: { $ref: '#/components/schemas/ResourceKindList' }
      required: [type, requestId, channels]
    SubscribeMessageType:
      title: SubscribeMessageType
      $id: urn:mattercodex:control-api:ws:SubscribeMessageType
      type: string
      enum: [SUBSCRIBE]
    SnapshotEnvelope:
      title: SnapshotEnvelope
      $id: urn:mattercodex:control-api:ws:SnapshotEnvelope
      type: object
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/SnapshotMessageType' }
        requestId: { $ref: '#/components/schemas/RequestId' }
        channel: { $ref: '#/components/schemas/ProjectionChannel' }
        sequence: { $ref: '#/components/schemas/SnapshotSequence' }
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
        complete: { $ref: '#/components/schemas/CompleteSnapshot' }
        serverTime: { $ref: '#/components/schemas/ServerTime' }
        items: { $ref: '#/components/schemas/SnapshotItems' }
      required: [type, requestId, channel, sequence, snapshotId, complete, serverTime, items]
    SnapshotMessageType:
      title: SnapshotMessageType
      $id: urn:mattercodex:control-api:ws:SnapshotMessageType
      type: string
      enum: [SNAPSHOT]
    SnapshotItems:
      title: SnapshotItems
      $id: urn:mattercodex:control-api:ws:SnapshotItems
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        resources: { $ref: '#/components/schemas/ResourceProjectionList' }
        incidents: { $ref: '#/components/schemas/RuntimeIncidentProjectionList' }
        configurationChanges: { $ref: '#/components/schemas/ConfigurationChangeProjectionList' }
    ProblemEnvelope:
      title: ProblemEnvelope
      $id: urn:mattercodex:control-api:ws:ProblemEnvelope
      type: object
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/ProblemMessageType' }
        requestId: { $ref: '#/components/schemas/RequestId' }
        code: { $ref: '#/components/schemas/ProblemCode' }
        retryable: { $ref: '#/components/schemas/Retryable' }
      required: [type, requestId, code, retryable]
    ProblemMessageType:
      title: ProblemMessageType
      $id: urn:mattercodex:control-api:ws:ProblemMessageType
      type: string
      enum: [PROBLEM]
    ProjectionChannel:
      title: ProjectionChannel
      $id: urn:mattercodex:control-api:ws:ProjectionChannel
      type: string
      enum: [RUNS, INCIDENTS, RESOURCES, CONFIGURATION_CHANGES]
    ProjectionChannelList:
      title: ProjectionChannelList
      $id: urn:mattercodex:control-api:ws:ProjectionChannelList
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items: { $ref: '#/components/schemas/ProjectionChannel' }
    ResourceKind:
      title: ResourceKind
      $id: urn:mattercodex:control-api:ws:ResourceKind
      $ref: '../../../openapi/control-api-gateway/v1/openapi.yaml#/components/schemas/ResourceKind'
    ResourceKindList:
      title: ResourceKindList
      $id: urn:mattercodex:control-api:ws:ResourceKindList
      type: array
      maxItems: 8
      uniqueItems: true
      items: { $ref: '#/components/schemas/ResourceKind' }
    ResourceProjection:
      title: ResourceProjection
      $id: urn:mattercodex:control-api:ws:ResourceProjection
      $ref: '../../../openapi/control-api-gateway/v1/openapi.yaml#/components/schemas/Resource'
    ResourceProjectionList:
      title: ResourceProjectionList
      $id: urn:mattercodex:control-api:ws:ResourceProjectionList
      type: array
      maxItems: 500
      items: { $ref: '#/components/schemas/ResourceProjection' }
    RuntimeIncidentProjection:
      title: RuntimeIncidentProjection
      $id: urn:mattercodex:control-api:ws:RuntimeIncidentProjection
      $ref: '../../../openapi/control-api-gateway/v1/openapi.yaml#/components/schemas/RuntimeIncident'
    RuntimeIncidentProjectionList:
      title: RuntimeIncidentProjectionList
      $id: urn:mattercodex:control-api:ws:RuntimeIncidentProjectionList
      type: array
      maxItems: 500
      items: { $ref: '#/components/schemas/RuntimeIncidentProjection' }
    ConfigurationChangeProjection:
      title: ConfigurationChangeProjection
      $id: urn:mattercodex:control-api:ws:ConfigurationChangeProjection
      $ref: '../../../openapi/control-api-gateway/v1/openapi.yaml#/components/schemas/ConfigurationChange'
    ConfigurationChangeProjectionList:
      title: ConfigurationChangeProjectionList
      $id: urn:mattercodex:control-api:ws:ConfigurationChangeProjectionList
      type: array
      maxItems: 500
      items: { $ref: '#/components/schemas/ConfigurationChangeProjection' }
    RequestId:
      title: RequestId
      $id: urn:mattercodex:control-api:ws:RequestId
      type: string
      format: uuid
    SnapshotId:
      title: SnapshotId
      $id: urn:mattercodex:control-api:ws:SnapshotId
      type: string
      format: uuid
    SnapshotSequence:
      title: SnapshotSequence
      $id: urn:mattercodex:control-api:ws:SnapshotSequence
      type: integer
      minimum: 1
    CompleteSnapshot:
      title: CompleteSnapshot
      $id: urn:mattercodex:control-api:ws:CompleteSnapshot
      type: boolean
      const: true
    ServerTime:
      title: ServerTime
      $id: urn:mattercodex:control-api:ws:ServerTime
      type: string
      format: date-time
    ProblemCode:
      title: ProblemCode
      $id: urn:mattercodex:control-api:ws:ProblemCode
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
    Retryable:
      title: Retryable
      $id: urn:mattercodex:control-api:ws:Retryable
      type: boolean
