asyncapi: 3.0.0
info:
  title: MatterCodex resumable owner streams
  version: 2.1.0
  description: |
    Защищённые owner-scoped WebSocket потоки запуска и общей конфигурации.
    Run stream восстанавливает упорядоченные deltas через авторитетный
    control-plane event store. Platform stream передаёт только безопасные
    invalidation-сигналы без project/aggregate refs; после разрыва клиент
    перечитывает доступные ему bounded read models через owner HTTP API.
    Gateway получает live-сигналы из NATS и не становится владельцем состояния.
defaultContentType: application/json
servers:
  owner:
    host: control-center.mattercodex.local
    pathname: /api/v1
    protocol: wss
    security: [{ $ref: '#/components/securitySchemes/OwnerSession' }]
    x-origin-policy: EXACT_HTTPS_ALLOWLIST
    x-channel-subprotocols:
      runStream: [mattercodex.run.v1, csrf.<csrf-token>]
      platformStream: [mattercodex.platform.v1, csrf.<csrf-token>]
channels:
  runStream:
    address: /runs/{runRef}/stream
    parameters:
      runRef:
        description: Непрозрачный ref из авторитетного readback; не является authority.
    messages:
      resume: { $ref: '#/components/messages/Resume' }
      snapshot: { $ref: '#/components/messages/Snapshot' }
      event: { $ref: '#/components/messages/Event' }
      ready: { $ref: '#/components/messages/Ready' }
      resync: { $ref: '#/components/messages/Resync' }
      heartbeat: { $ref: '#/components/messages/Heartbeat' }
      problem: { $ref: '#/components/messages/Problem' }
  platformStream:
    address: /platform/stream
    messages:
      resume: { $ref: '#/components/messages/Resume' }
      invalidated: { $ref: '#/components/messages/PlatformInvalidated' }
      ready: { $ref: '#/components/messages/PlatformReady' }
      resync: { $ref: '#/components/messages/PlatformResync' }
      heartbeat: { $ref: '#/components/messages/PlatformHeartbeat' }
      problem: { $ref: '#/components/messages/Problem' }
operations:
  resumeRunStream:
    action: receive
    channel: { $ref: '#/channels/runStream' }
    messages: [{ $ref: '#/channels/runStream/messages/resume' }]
    summary: Запросить продолжение после последней непрерывно применённой sequence.
    x-authority: VERIFIED_OWNER_SESSION_AND_CONTROL_PLANE_RUN_ELIGIBILITY
    x-rate-limit: OWNER_AND_RUN_SCOPED
  publishRunStream:
    action: send
    channel: { $ref: '#/channels/runStream' }
    messages:
      - { $ref: '#/channels/runStream/messages/snapshot' }
      - { $ref: '#/channels/runStream/messages/event' }
      - { $ref: '#/channels/runStream/messages/ready' }
      - { $ref: '#/channels/runStream/messages/resync' }
      - { $ref: '#/channels/runStream/messages/heartbeat' }
      - { $ref: '#/channels/runStream/messages/problem' }
    summary: Передать snapshot, ordered deltas и управляемое восстановление.
    x-source:
      initialSnapshot: controlplane.v1.PlatformQueryService.GetRunGraph
      catchUp: controlplane.v1.PlatformQueryService.ListRunEvents
      live: NATS_JETSTREAM_CONTROL_PLANE_RUN_EVENTS
    x-delivery:
      mode: AT_LEAST_ONCE
      orderingKey: rootRunRef
      sequenceField: sequence
      duplicate: CLIENT_IGNORES_SEQUENCE_NOT_GREATER_THAN_APPLIED
      gap: CLIENT_SENDS_RESUME
      unavailableCatchUp: SERVER_SENDS_RESYNC_THEN_AUTHORITATIVE_SNAPSHOT
      reconnect: CLIENT_SENDS_LAST_APPLIED_SEQUENCE
      overflow: PROBLEM_AND_CLOSE_1013
      progress: COALESCED_AND_BOUNDED
      maximumFrameBytes: 65536
    x-redaction:
      forbidden:
        - secret values
        - raw provider payloads
        - raw stdout or stderr
        - arbitrary tool payloads
        - file bodies
  resumePlatformStream:
    action: receive
    channel: { $ref: '#/channels/platformStream' }
    messages: [{ $ref: '#/channels/platformStream/messages/resume' }]
    summary: Продолжить после последней применённой org sequence.
    x-authority: VERIFIED_OWNER_SESSION_AND_CONTROL_PLANE_ORGANIZATION_ELIGIBILITY
    x-rate-limit: OWNER_SCOPED
  publishPlatformStream:
    action: send
    channel: { $ref: '#/channels/platformStream' }
    messages:
      - { $ref: '#/channels/platformStream/messages/invalidated' }
      - { $ref: '#/channels/platformStream/messages/ready' }
      - { $ref: '#/channels/platformStream/messages/resync' }
      - { $ref: '#/channels/platformStream/messages/heartbeat' }
      - { $ref: '#/channels/platformStream/messages/problem' }
    summary: Передать ordered invalidation без раскрытия чужих project metadata.
    x-source:
      cursor: controlplane.v1.PlatformQueryService.GetPlatformEventCursor
      live: NATS_JETSTREAM_CONTROL_PLANE_PLATFORM_EVENTS
      state: OWNER_HTTP_API_AUTHORITATIVE_READS
    x-delivery:
      mode: AT_LEAST_ONCE
      orderingKey: organizationRef
      sequenceField: sequence
      duplicate: CLIENT_IGNORES_SEQUENCE_NOT_GREATER_THAN_APPLIED
      gap: SERVER_CLOSES_AND_CLIENT_RELOADS_AUTHORIZED_BOUNDED_READ_MODELS
      reconnect: CLIENT_SENDS_LAST_APPLIED_SEQUENCE
      overflow: CLOSE_1013_BACKPRESSURE
      maximumFrameBytes: 65536
    x-redaction:
      forwarded: [eventName, kind, sequence]
      forbidden: [organizationRef, projectRef, aggregateRef, safeSummary, secret values, arbitrary event data]
components:
  securitySchemes:
    OwnerSession:
      type: httpApiKey
      in: cookie
      name: __Host-mattercodex-session
  messages:
    Resume:
      name: resume
      contentType: application/json
      payload: { $ref: '#/components/schemas/ResumeEnvelope' }
    Snapshot:
      name: graph_snapshot
      contentType: application/json
      payload: { $ref: '#/components/schemas/SnapshotEnvelope' }
    Event:
      name: run_event
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    Ready:
      name: stream_ready
      contentType: application/json
      payload: { $ref: '#/components/schemas/ReadyEnvelope' }
    Resync:
      name: resync_required
      contentType: application/json
      payload: { $ref: '#/components/schemas/ResyncEnvelope' }
    Heartbeat:
      name: heartbeat
      contentType: application/json
      payload: { $ref: '#/components/schemas/HeartbeatEnvelope' }
    Problem:
      name: problem
      contentType: application/problem+json
      payload: { $ref: '#/components/schemas/ProblemEnvelope' }
    PlatformInvalidated:
      name: platform_invalidated
      contentType: application/json
      payload: { $ref: '#/components/schemas/PlatformInvalidatedEnvelope' }
    PlatformReady:
      name: platform_stream_ready
      contentType: application/json
      payload: { $ref: '#/components/schemas/PlatformReadyEnvelope' }
    PlatformResync:
      name: platform_resync_required
      contentType: application/json
      payload: { $ref: '#/components/schemas/PlatformResyncEnvelope' }
    PlatformHeartbeat:
      name: platform_heartbeat
      contentType: application/json
      payload: { $ref: '#/components/schemas/PlatformHeartbeatEnvelope' }
  schemas:
    OpaqueRef:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,96}$'
    Timestamp:
      type: string
      format: date-time
    ResumeEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, afterSequence]
      properties:
        type: { type: string, const: RESUME }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        afterSequence: { type: integer, format: int64, minimum: 0 }
    SnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, sequence, snapshot]
      properties:
        type: { type: string, const: GRAPH_SNAPSHOT }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 0 }
        snapshot:
          $ref: '#/components/schemas/RunGraph'
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, sequence, event]
      properties:
        type: { type: string, const: RUN_EVENT }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        event:
          $ref: '#/components/schemas/RunEvent'
    ReadyEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, latestSequence]
      properties:
        type: { type: string, const: STREAM_READY }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        latestSequence: { type: integer, format: int64, minimum: 0 }
    ResyncEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, expectedAfterSequence, reason]
      properties:
        type: { type: string, const: RESYNC_REQUIRED }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        expectedAfterSequence: { type: integer, format: int64, minimum: 0 }
        reason: { $ref: '#/components/schemas/ResyncReason' }
    HeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [type, serverTime, latestSequence]
      properties:
        type: { type: string, const: HEARTBEAT }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        latestSequence: { type: integer, format: int64, minimum: 0 }
    ProblemEnvelope:
      type: object
      additionalProperties: false
      required: [type, status, code, title, retryable]
      properties:
        type: { type: string, const: PROBLEM }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ProblemCode' }
        title: { type: string, maxLength: 200 }
        retryable: { type: boolean }
    PlatformInvalidatedEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, sequence, eventName, kind]
      properties:
        type: { type: string, const: PLATFORM_INVALIDATED }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventName: { $ref: '#/components/schemas/PlatformEventName' }
        kind: { $ref: '#/components/schemas/PlatformResourceKind' }
    PlatformReadyEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, latestSequence]
      properties:
        type: { type: string, const: PLATFORM_STREAM_READY }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        latestSequence: { type: integer, format: int64, minimum: 0 }
    PlatformResyncEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, currentSequence, reason]
      properties:
        type: { type: string, const: PLATFORM_RESYNC_REQUIRED }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        currentSequence: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, const: AUTHORITATIVE_READ_REQUIRED }
    PlatformHeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [type, serverTime, latestSequence]
      properties:
        type: { type: string, const: PLATFORM_HEARTBEAT }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        latestSequence: { type: integer, format: int64, minimum: 0 }
    PlatformEventName:
      type: string
      enum: [PROJECT_CHANGED, AGENT_CHANGED, ARTIFACT_CHANGED, INSTRUCTIONS_PUBLISHED, WORKFLOW_CHANGED, SCHEDULE_CHANGED, INTEGRATION_CONNECTION_CHANGED, INTEGRATION_GRANT_CHANGED, MEMBERSHIP_CHANGED, PLATFORM_MEMBERSHIP_CHANGED, SYSTEM_ASSISTANT_CHANGED, ROLE_IMAGE_RECIPE_CHANGED]
    PlatformResourceKind:
      type: string
      enum: [PROJECT, AGENT, ARTIFACT, INSTRUCTIONS, WORKFLOW, SCHEDULE, INTEGRATION_CONNECTION, INTEGRATION_GRANT, MEMBERSHIP, PLATFORM_MEMBERSHIP, SYSTEM_ASSISTANT, ROLE_IMAGE_RECIPE]
    ResyncReason:
      type: string
      enum: [RETENTION_EXPIRED, GAP_DETECTED, PROJECTION_RECOVERED]
    ProblemCode:
      type: string
      enum: [UNAUTHORIZED, FORBIDDEN, RUN_NOT_FOUND, RATE_LIMITED, GAP_UNRECOVERABLE, BACKPRESSURE, INTERNAL]
    RunGraph:
      type: object
      additionalProperties: false
      required: [runRef, revision, sequence, nodes, edges]
      properties:
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        revision: { type: integer, format: int64, minimum: 1 }
        sequence: { type: integer, format: int64, minimum: 0 }
        nodes:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RunNode' }
        edges:
          type: array
          maxItems: 4000
          items: { $ref: '#/components/schemas/RunEdge' }
    RunNode:
      type: object
      additionalProperties: false
      required: [ref, runRef, type, state, displayName, attempt, artifactRefs, childRunRefs, createdAt, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        parentNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        type: { $ref: '#/components/schemas/RunNodeType' }
        state: { $ref: '#/components/schemas/RunNodeState' }
        displayName: { type: string, maxLength: 160 }
        role: { type: string, maxLength: 500 }
        agentRef: { $ref: '#/components/schemas/OpaqueRef' }
        turnRef: { $ref: '#/components/schemas/OpaqueRef' }
        attempt: { type: integer, minimum: 1 }
        inputSummary: { type: string, maxLength: 2000 }
        progressSummary: { type: string, maxLength: 2000 }
        integrationNames:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 160 }
        artifactRefs:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/OpaqueRef' }
        childRunRefs:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/OpaqueRef' }
        callbackSummary: { type: string, maxLength: 2000 }
        safeErrorCode: { type: string, maxLength: 100 }
        safeErrorMessage: { type: string, maxLength: 2000 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: '#/components/schemas/NextAction' }
    RunNodeType:
      type: string
      enum: [ROOT_PROCESS, AGENT_EXECUTION, HUMAN_GATE, EXTERNAL_ACTION]
    RunNodeState:
      type: string
      enum: [QUEUED, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED, SKIPPED]
    NextAction:
      type: string
      enum: [OPEN, EDIT, ARCHIVE, ENABLE, DISABLE, VALIDATE, PUBLISH, ROLLBACK, LAUNCH, ADD_TURN, CANCEL, RETRY, RESOLVE_GATE, DOWNLOAD, BIND, TEST, REVOKE, MANAGE_GRANTS, APPLY_PLAN, RECOVER]
    RunEdge:
      type: object
      additionalProperties: false
      required: [ref, runRef, sourceNodeRef, targetNodeRef, type, label]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sourceNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        targetNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        type: { $ref: '#/components/schemas/RunEdgeType' }
        label: { type: string, maxLength: 160 }
    RunEdgeType:
      type: string
      enum: [DELEGATED_TO, CALLBACK_TO, RETRY_OF, CONTINUES, WAITING_FOR]
    RunDelta:
      type: object
      additionalProperties: false
      required: [ref, version, state, graphRevision, lastEventSequence, artifactRefs, gateRefs, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        state: { $ref: '#/components/schemas/RunState' }
        graphRevision: { type: integer, format: int64, minimum: 1 }
        lastEventSequence: { type: integer, format: int64, minimum: 1 }
        resultSummary: { type: string, maxLength: 4000 }
        safeErrorCode: { type: string, maxLength: 80 }
        safeErrorMessage: { type: string, maxLength: 500 }
        artifactRefs:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OpaqueRef' }
        gateRefs:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OpaqueRef' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: '#/components/schemas/NextAction' }
    RunEvent:
      type: object
      additionalProperties: false
      required: [ref, runRef, sequence, graphRevision, type, summary, occurredAt, run]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        type: { $ref: '#/components/schemas/RunEventType' }
        nodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        edgeRef: { $ref: '#/components/schemas/OpaqueRef' }
        gateRef: { $ref: '#/components/schemas/OpaqueRef' }
        artifactRef: { $ref: '#/components/schemas/OpaqueRef' }
        summary: { type: string, maxLength: 2000 }
        progress: { type: string, maxLength: 2000 }
        runState: { $ref: '#/components/schemas/RunState' }
        nodeState: { $ref: '#/components/schemas/RunNodeState' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        graphRevision: { type: integer, format: int64, minimum: 1 }
        run: { $ref: '#/components/schemas/RunDelta' }
        node: { $ref: '#/components/schemas/RunNode' }
        edge: { $ref: '#/components/schemas/RunEdge' }
        gate: { $ref: '#/components/schemas/OwnerGate' }
        artifact: { $ref: '#/components/schemas/Artifact' }
        incident: { $ref: '#/components/schemas/Incident' }
    RunEventType:
      type: string
      enum: [RUN_CREATED, RUN_STATE_CHANGED, NODE_ADDED, NODE_STATE_CHANGED, EDGE_ADDED, TURN_QUEUED, TURN_STARTED, TURN_PROGRESS, TURN_COMPLETED, DELEGATION_CREATED, CALLBACK_DELIVERED, OWNER_GATE_OPENED, OWNER_GATE_RESOLVED, ARTIFACT_AVAILABLE, INCIDENT_LINKED]
    RunState:
      type: string
      enum: [QUEUED, RUNNING, WAITING_HUMAN, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
    OwnerGate:
      type: object
      additionalProperties: false
      required: [ref, version, projectRef, runRef, nodeRef, title, contextSummary, consequencesSummary, requestedBy, state, allowedDecisions, artifactRefs, openedAt, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        nodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        title: { type: string, maxLength: 240 }
        contextSummary: { type: string, maxLength: 4000 }
        consequencesSummary: { type: string, maxLength: 2000 }
        requestedBy: { $ref: '#/components/schemas/UserSummary' }
        state: { $ref: '#/components/schemas/OwnerGateState' }
        allowedDecisions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/OwnerGateDecision' }
        decision: { $ref: '#/components/schemas/OwnerGateDecision' }
        decisionComment: { type: string, maxLength: 4000 }
        openedAt: { $ref: '#/components/schemas/Timestamp' }
        decidedAt: { $ref: '#/components/schemas/Timestamp' }
        artifactRefs:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OpaqueRef' }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: '#/components/schemas/NextAction' }
    OwnerGateState:
      type: string
      enum: [OPEN, APPROVED, REJECTED, CHANGES_REQUESTED, CANCELLED, EXPIRED]
    OwnerGateDecision:
      type: string
      enum: [APPROVE, REJECT, REQUEST_CHANGES, CANCEL]
    UserSummary:
      type: object
      additionalProperties: false
      required: [ref, displayName]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        displayName: { type: string, maxLength: 160 }
    Artifact:
      type: object
      additionalProperties: false
      required: [ref, version, projectRef, fileName, mediaType, sizeBytes, scanState, source, revision, agentBindings, previewAvailable, createdAt, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        version: { type: integer, format: int64, minimum: 1 }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        fileName: { type: string, maxLength: 255 }
        mediaType: { type: string, maxLength: 160 }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 1073741824 }
        scanState: { $ref: '#/components/schemas/ArtifactScanState' }
        source: { $ref: '#/components/schemas/ArtifactSource' }
        revision: { type: integer, minimum: 1 }
        agentBindings:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 240 }
        previewAvailable: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: '#/components/schemas/NextAction' }
    ArtifactScanState:
      type: string
      enum: [PENDING, SCANNING, CLEAN, QUARANTINED, FAILED]
    ArtifactSource:
      type: string
      enum: [CONTROL_CENTER, AGENT_RESULT, INTEGRATION_RESULT, KNOWLEDGE_SOURCE, INTERACTION_ATTACHMENT]
    Incident:
      type: object
      additionalProperties: false
      required: [ref, category, severity, state, safeSummary, safeNextStep, coreAffected, createdAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        projectRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        category: { type: string, maxLength: 80 }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        state: { $ref: '#/components/schemas/IncidentState' }
        safeSummary: { type: string, maxLength: 1000 }
        safeNextStep: { type: string, maxLength: 1000 }
        coreAffected: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    IncidentSeverity:
      type: string
      enum: [INFO, WARNING, ERROR, CRITICAL]
    IncidentState:
      type: string
      enum: [OPEN, RECOVERING, RESOLVED]
