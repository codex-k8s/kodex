asyncapi: 3.0.0
info:
  title: MatterCodex resumable run stream
  version: 2.0.0
  description: |
    Защищённый owner-scoped WebSocket поток конкретного запуска. После
    авторизации gateway читает актуальный snapshot у control-plane, затем
    пересылает упорядоченные NATS-события. Gateway не владеет event store и
    восстанавливает пропуски авторитетным ListRunEvents. Доставка как минимум
    один раз; reducer клиента применяет только непрерывную новую sequence.
defaultContentType: application/json
servers:
  owner:
    host: control-center.mattercodex.local
    pathname: /api/v1
    protocol: wss
    security: [{ $ref: '#/components/securitySchemes/OwnerSession' }]
    x-origin-policy: EXACT_HTTPS_ALLOWLIST
    x-required-subprotocols:
      - mattercodex.run.v1
      - csrf.<csrf-token>
channels:
  runStream:
    address: /runs/{runRef}/stream
    parameters:
      runRef:
        description: Непрозрачный ref из авторитетного readback; не является authority.
    messages:
      resume: { $ref: '#/components/messages/Resume' }
      snapshot: { $ref: '#/components/messages/Snapshot' }
      event: { $ref: '#/components/messages/Event' }
      resync: { $ref: '#/components/messages/Resync' }
      heartbeat: { $ref: '#/components/messages/Heartbeat' }
      problem: { $ref: '#/components/messages/Problem' }
operations:
  resumeRunStream:
    action: receive
    channel: { $ref: '#/channels/runStream' }
    messages: [{ $ref: '#/channels/runStream/messages/resume' }]
    summary: Запросить продолжение после последней непрерывно применённой sequence.
    x-authority: VERIFIED_OWNER_SESSION_AND_CONTROL_PLANE_RUN_ELIGIBILITY
    x-rate-limit: OWNER_AND_RUN_SCOPED
  publishRunStream:
    action: send
    channel: { $ref: '#/channels/runStream' }
    messages:
      - { $ref: '#/channels/runStream/messages/snapshot' }
      - { $ref: '#/channels/runStream/messages/event' }
      - { $ref: '#/channels/runStream/messages/resync' }
      - { $ref: '#/channels/runStream/messages/heartbeat' }
      - { $ref: '#/channels/runStream/messages/problem' }
    summary: Передать snapshot, ordered deltas и управляемое восстановление.
    x-source:
      initialSnapshot: controlplane.v1.PlatformQueryService.GetRunGraph
      catchUp: controlplane.v1.PlatformQueryService.ListRunEvents
      live: NATS_JETSTREAM_CONTROL_PLANE_RUN_EVENTS
    x-delivery:
      mode: AT_LEAST_ONCE
      orderingKey: rootRunRef
      sequenceField: sequence
      duplicate: CLIENT_IGNORES_SEQUENCE_NOT_GREATER_THAN_APPLIED
      gap: CLIENT_SENDS_RESUME
      unavailableCatchUp: SERVER_SENDS_RESYNC_THEN_AUTHORITATIVE_SNAPSHOT
      reconnect: CLIENT_SENDS_LAST_APPLIED_SEQUENCE
      overflow: PROBLEM_AND_CLOSE_1013
      progress: COALESCED_AND_BOUNDED
      maximumFrameBytes: 65536
    x-redaction:
      forbidden:
        - secret values
        - raw provider payloads
        - raw stdout or stderr
        - arbitrary tool payloads
        - file bodies
components:
  securitySchemes:
    OwnerSession:
      type: httpApiKey
      in: cookie
      name: __Host-mattercodex-session
  messages:
    Resume:
      name: resume
      contentType: application/json
      payload: { $ref: '#/components/schemas/ResumeEnvelope' }
    Snapshot:
      name: graph_snapshot
      contentType: application/json
      payload: { $ref: '#/components/schemas/SnapshotEnvelope' }
    Event:
      name: run_event
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    Resync:
      name: resync_required
      contentType: application/json
      payload: { $ref: '#/components/schemas/ResyncEnvelope' }
    Heartbeat:
      name: heartbeat
      contentType: application/json
      payload: { $ref: '#/components/schemas/HeartbeatEnvelope' }
    Problem:
      name: problem
      contentType: application/problem+json
      payload: { $ref: '#/components/schemas/ProblemEnvelope' }
  schemas:
    OpaqueRef:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,96}$'
    Timestamp:
      type: string
      format: date-time
    ResumeEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, afterSequence]
      properties:
        type: { type: string, const: RESUME }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        afterSequence: { type: integer, format: int64, minimum: 0 }
    SnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, sequence, snapshot]
      properties:
        type: { type: string, const: GRAPH_SNAPSHOT }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 0 }
        snapshot:
          $ref: '#/components/schemas/RunGraph'
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, sequence, event]
      properties:
        type: { type: string, const: RUN_EVENT }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        event:
          $ref: '#/components/schemas/RunEvent'
    ResyncEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, expectedAfterSequence, reason]
      properties:
        type: { type: string, const: RESYNC_REQUIRED }
        requestRef: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        expectedAfterSequence: { type: integer, format: int64, minimum: 0 }
        reason: { $ref: '#/components/schemas/ResyncReason' }
    HeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [type, serverTime, latestSequence]
      properties:
        type: { type: string, const: HEARTBEAT }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        latestSequence: { type: integer, format: int64, minimum: 0 }
    ProblemEnvelope:
      type: object
      additionalProperties: false
      required: [type, status, code, title, retryable]
      properties:
        type: { type: string, const: PROBLEM }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ProblemCode' }
        title: { type: string, maxLength: 200 }
        retryable: { type: boolean }
    ResyncReason:
      type: string
      enum: [RETENTION_EXPIRED, GAP_DETECTED, PROJECTION_RECOVERED]
    ProblemCode:
      type: string
      enum: [UNAUTHORIZED, FORBIDDEN, RUN_NOT_FOUND, RATE_LIMITED, GAP_UNRECOVERABLE, BACKPRESSURE, INTERNAL]
    RunGraph:
      type: object
      additionalProperties: false
      required: [runRef, revision, sequence, nodes, edges]
      properties:
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        revision: { type: integer, format: int64, minimum: 1 }
        sequence: { type: integer, format: int64, minimum: 0 }
        nodes:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RunNode' }
        edges:
          type: array
          maxItems: 4000
          items: { $ref: '#/components/schemas/RunEdge' }
    RunNode:
      type: object
      additionalProperties: false
      required: [ref, runRef, type, state, displayName, attempt, artifactRefs, childRunRefs, createdAt, nextActions]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        parentNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        type: { $ref: '#/components/schemas/RunNodeType' }
        state: { $ref: '#/components/schemas/RunNodeState' }
        displayName: { type: string, maxLength: 160 }
        role: { type: string, maxLength: 500 }
        agentRef: { $ref: '#/components/schemas/OpaqueRef' }
        turnRef: { $ref: '#/components/schemas/OpaqueRef' }
        attempt: { type: integer, minimum: 1 }
        inputSummary: { type: string, maxLength: 2000 }
        progressSummary: { type: string, maxLength: 2000 }
        integrationNames:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 160 }
        artifactRefs:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/OpaqueRef' }
        childRunRefs:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/OpaqueRef' }
        callbackSummary: { type: string, maxLength: 2000 }
        safeErrorCode: { type: string, maxLength: 100 }
        safeErrorMessage: { type: string, maxLength: 2000 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: '#/components/schemas/NextAction' }
    RunNodeType:
      type: string
      enum: [ROOT_PROCESS, AGENT_EXECUTION, HUMAN_GATE, EXTERNAL_ACTION]
    RunNodeState:
      type: string
      enum: [QUEUED, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED, SKIPPED]
    NextAction:
      type: string
      enum: [OPEN, EDIT, ARCHIVE, ENABLE, DISABLE, VALIDATE, PUBLISH, ROLLBACK, LAUNCH, ADD_TURN, CANCEL, RETRY, RESOLVE_GATE, DOWNLOAD, BIND, TEST, REVOKE, APPLY_PLAN, RECOVER]
    RunEdge:
      type: object
      additionalProperties: false
      required: [ref, runRef, sourceNodeRef, targetNodeRef, type, label]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sourceNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        targetNodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        type: { $ref: '#/components/schemas/RunEdgeType' }
        label: { type: string, maxLength: 160 }
    RunEdgeType:
      type: string
      enum: [DELEGATED_TO, CALLBACK_TO, RETRY_OF, CONTINUES, WAITING_FOR]
    RunEvent:
      type: object
      additionalProperties: false
      required: [ref, runRef, sequence, type, summary, occurredAt]
      properties:
        ref: { $ref: '#/components/schemas/OpaqueRef' }
        runRef: { $ref: '#/components/schemas/OpaqueRef' }
        sequence: { type: integer, format: int64, minimum: 1 }
        type: { $ref: '#/components/schemas/RunEventType' }
        nodeRef: { $ref: '#/components/schemas/OpaqueRef' }
        edgeRef: { $ref: '#/components/schemas/OpaqueRef' }
        gateRef: { $ref: '#/components/schemas/OpaqueRef' }
        artifactRef: { $ref: '#/components/schemas/OpaqueRef' }
        summary: { type: string, maxLength: 2000 }
        progress: { type: string, maxLength: 2000 }
        runState: { $ref: '#/components/schemas/RunState' }
        nodeState: { $ref: '#/components/schemas/RunNodeState' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
    RunEventType:
      type: string
      enum: [RUN_CREATED, RUN_STATE_CHANGED, NODE_ADDED, NODE_STATE_CHANGED, EDGE_ADDED, TURN_QUEUED, TURN_STARTED, TURN_PROGRESS, TURN_COMPLETED, DELEGATION_CREATED, CALLBACK_DELIVERED, OWNER_GATE_OPENED, OWNER_GATE_RESOLVED, ARTIFACT_AVAILABLE, INCIDENT_LINKED]
    RunState:
      type: string
      enum: [QUEUED, RUNNING, WAITING_HUMAN, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
