asyncapi: 3.0.0
info:
  title: Kodex browser session stream
  version: 3.0.0
  description: |
    Один защищённый owner-scoped WebSocket обслуживает bounded platform
    snapshots и набор точных Run subscriptions одной browser session. Gateway
    использует NATS только как wake-сигнал, а каждый browser snapshot строит из
    авторитетного control-plane read path в проверенном project scope.
    Browser атомарно заменяет соответствующую проекцию Pinia и не выполняет
    повторный HTTP readback при обычном событии.
    При reconnect с полным локальным snapshot и совпадающим platform cursor
    gateway подтверждает готовность без повторной передачи каталогов. Gap,
    смена scope и незавершённый bootstrap всегда требуют нового полного snapshot.
    Ошибка или gap одного Run не закрывает и не повреждает остальные streams.
defaultContentType: application/json
servers:
  owner:
    host: control-center.kodex.local
    pathname: /api/v1
    protocol: wss
    security: [{ $ref: "#/components/securitySchemes/OwnerSession" }]
    x-origin-policy: EXACT_HTTPS_ALLOWLIST
    x-channel-subprotocols:
      sessionStream:
        [kodex.session.v2, csrf.<csrf-token>, ticket.<one-time-ticket>]
    x-legacy-transition:
      subprotocol: kodex.session.v1
      authorization: EXISTING_COOKIE_AND_CSRF_BOUNDARY
      enabledUntil: KODEX_WS_LEGACY_UNTIL
      default: DISABLED
      maximumWindowHours: 24
      clientFallback: FORBIDDEN
    x-ticket-policy:
      issue: POST /api/v1/session/ticket
      owner: CONTROL_API_GATEWAY_BROWSER_FAMILY
      consume: ATOMIC_DURABLE_CAS_BEFORE_UPGRADE
      binding: FAMILY_BROWSER_SESSION_VERSION_AND_CSRF
      maximumLifetimeSeconds: 30
      maximumLiveTicketsPerFamily: 16
      bearerInURL: FORBIDDEN
    x-locale-query:
      name: locale
      values: [ru, en]
      fallback: VERIFIED_ACCEPT_LANGUAGE
      purpose: Локализация безопасного Problem.title в выбранной пользователем локали.
channels:
  sessionStream:
    address: /session/stream
    messages:
      sessionResume: { $ref: "#/components/messages/SessionResume" }
      subscribeRun: { $ref: "#/components/messages/SubscribeRun" }
      unsubscribeRun: { $ref: "#/components/messages/UnsubscribeRun" }
      sessionReady: { $ref: "#/components/messages/SessionReady" }
      platformSnapshot: { $ref: "#/components/messages/PlatformSnapshot" }
      platformCursor: { $ref: "#/components/messages/PlatformCursor" }
      platformReady: { $ref: "#/components/messages/PlatformReady" }
      platformResync: { $ref: "#/components/messages/PlatformResync" }
      runSnapshot: { $ref: "#/components/messages/RunSnapshot" }
      runEvent: { $ref: "#/components/messages/RunEvent" }
      runReady: { $ref: "#/components/messages/RunReady" }
      runResync: { $ref: "#/components/messages/RunResync" }
      runUnsubscribed: { $ref: "#/components/messages/RunUnsubscribed" }
      streamHeartbeat: { $ref: "#/components/messages/StreamHeartbeat" }
      streamProblem: { $ref: "#/components/messages/StreamProblem" }
      sessionProblem: { $ref: "#/components/messages/SessionProblem" }
operations:
  receiveSessionCommands:
    action: receive
    channel: { $ref: "#/channels/sessionStream" }
    messages:
      - { $ref: "#/channels/sessionStream/messages/sessionResume" }
      - { $ref: "#/channels/sessionStream/messages/subscribeRun" }
      - { $ref: "#/channels/sessionStream/messages/unsubscribeRun" }
    summary: Инициализировать browser session и изменять bounded Run subscriptions.
    x-authority: VERIFIED_OWNER_SESSION_AND_EXACT_CONTROL_PLANE_RUN_ELIGIBILITY
    x-rate-limit: OWNER_SESSION_AND_RUN_SCOPED
  publishSessionStream:
    action: send
    channel: { $ref: "#/channels/sessionStream" }
    messages:
      - { $ref: "#/channels/sessionStream/messages/sessionReady" }
      - { $ref: "#/channels/sessionStream/messages/platformSnapshot" }
      - { $ref: "#/channels/sessionStream/messages/platformCursor" }
      - { $ref: "#/channels/sessionStream/messages/platformReady" }
      - { $ref: "#/channels/sessionStream/messages/platformResync" }
      - { $ref: "#/channels/sessionStream/messages/runSnapshot" }
      - { $ref: "#/channels/sessionStream/messages/runEvent" }
      - { $ref: "#/channels/sessionStream/messages/runReady" }
      - { $ref: "#/channels/sessionStream/messages/runResync" }
      - { $ref: "#/channels/sessionStream/messages/runUnsubscribed" }
      - { $ref: "#/channels/sessionStream/messages/streamHeartbeat" }
      - { $ref: "#/channels/sessionStream/messages/streamProblem" }
      - { $ref: "#/channels/sessionStream/messages/sessionProblem" }
    summary: Мультиплексировать platform и точные Run streams одним writer.
    x-source:
      platformCursor: controlplane.v1.PlatformQueryService.GetPlatformEventCursor
      platformSnapshot: CONTROL_PLANE_TYPED_QUERY_FOR_EXACT_RESOURCE_KIND_AND_SCOPE
      runEligibilityAndSnapshot: controlplane.v1.PlatformQueryService.GetRunGraph
      runCatchUp: controlplane.v1.PlatformQueryService.ListRunEvents
      liveWakeSignal: CORE_NATS_CONTROL_PLANE_PLATFORM_AND_RUN_EVENTS
      durableRunSource: CONTROL_PLANE_RUN_EVENT_STORE
    x-delivery:
      mode: AT_LEAST_ONCE
      orderingKey: streamKind+streamRef
      cursorField: cursor
      duplicate: CLIENT_IGNORES_CURSOR_NOT_GREATER_THAN_APPLIED
      runGap: SERVER_RESYNCS_ONLY_THE_AFFECTED_RUN
      reconnect: CLIENT_SENDS_PLATFORM_CURSOR_AND_ALL_ACTIVE_RUN_CURSORS
      sameCursorResume: PLATFORM_READY_WITHOUT_REPEATED_SNAPSHOTS
      cursorMismatchOrIncompleteCache: FULL_BOUNDED_PLATFORM_BOOTSTRAP
      missedWakeSignal: HEARTBEAT_READS_AUTHORITATIVE_CURSOR_OR_EVENT_STORE
      overflow: SESSION_FAILS_CLOSED_WITH_1013
      maximumRunSubscriptions: 32
      maximumFrameBytes: 1048576
    x-redaction:
      forwarded:
        [eventName, kind, cursor, streamKind, streamRef, projectRef, snapshot]
      forbidden:
        - secret values
        - raw provider payloads
        - raw stdout or stderr
        - arbitrary tool payloads
        - file bodies
        - organizationRef
        - aggregateRef
        - safeSummary
        - arbitrary event data
components:
  securitySchemes:
    OwnerSession:
      type: httpApiKey
      in: cookie
      name: __Host-kodex-session
  messages:
    SessionResume:
      name: session_resume
      contentType: application/json
      payload: { $ref: "#/components/schemas/SessionResumeEnvelope" }
    SubscribeRun:
      name: subscribe_run
      contentType: application/json
      payload: { $ref: "#/components/schemas/SubscribeRunEnvelope" }
    UnsubscribeRun:
      name: unsubscribe_run
      contentType: application/json
      payload: { $ref: "#/components/schemas/UnsubscribeRunEnvelope" }
    SessionReady:
      name: session_ready
      contentType: application/json
      payload: { $ref: "#/components/schemas/SessionReadyEnvelope" }
    RunSnapshot:
      name: run_graph_snapshot
      contentType: application/json
      payload: { $ref: "#/components/schemas/RunSnapshotEnvelope" }
    RunEvent:
      name: run_event
      contentType: application/json
      payload: { $ref: "#/components/schemas/RunEventEnvelope" }
    RunReady:
      name: run_stream_ready
      contentType: application/json
      payload: { $ref: "#/components/schemas/RunReadyEnvelope" }
    RunResync:
      name: run_resync_required
      contentType: application/json
      payload: { $ref: "#/components/schemas/RunResyncEnvelope" }
    RunUnsubscribed:
      name: run_unsubscribed
      contentType: application/json
      payload: { $ref: "#/components/schemas/RunUnsubscribedEnvelope" }
    PlatformSnapshot:
      name: platform_snapshot
      contentType: application/json
      payload: { $ref: "#/components/schemas/PlatformSnapshotEnvelope" }
    PlatformCursor:
      name: platform_cursor
      contentType: application/json
      payload: { $ref: "#/components/schemas/PlatformCursorEnvelope" }
    PlatformReady:
      name: platform_ready
      contentType: application/json
      payload: { $ref: "#/components/schemas/PlatformReadyEnvelope" }
    PlatformResync:
      name: platform_resync_required
      contentType: application/json
      payload: { $ref: "#/components/schemas/PlatformResyncEnvelope" }
    StreamHeartbeat:
      name: stream_heartbeat
      contentType: application/json
      payload: { $ref: "#/components/schemas/StreamHeartbeatEnvelope" }
    StreamProblem:
      name: stream_problem
      contentType: application/problem+json
      payload: { $ref: "#/components/schemas/StreamProblemEnvelope" }
    SessionProblem:
      name: session_problem
      contentType: application/problem+json
      payload: { $ref: "#/components/schemas/SessionProblemEnvelope" }
  schemas:
    OpaqueRef:
      type: string
      pattern: "^[A-Za-z0-9_-]{8,96}$"
    Timestamp:
      type: string
      format: date-time
    StreamKind:
      type: string
      enum: [PLATFORM, RUN]
    RunResumeCursor:
      type: object
      additionalProperties: false
      required: [runRef, afterSequence]
      properties:
        runRef: { $ref: "#/components/schemas/OpaqueRef" }
        afterSequence: { type: integer, format: int64, minimum: 0 }
    StreamCursor:
      type: object
      additionalProperties: false
      required: [streamKind, streamRef, cursor]
      properties:
        streamKind: { $ref: "#/components/schemas/StreamKind" }
        streamRef: { $ref: "#/components/schemas/OpaqueRef" }
        cursor: { type: integer, format: int64, minimum: 0 }
    SessionResumeEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          type,
          requestRef,
          platformAfterSequence,
          platformSnapshotRequired,
          runs,
        ]
      properties:
        type: { type: string, const: SESSION_RESUME }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        platformAfterSequence: { type: integer, format: int64, minimum: 0 }
        platformSnapshotRequired:
          type: boolean
          description: true, если у browser нет полного snapshot текущего project scope.
        projectRef: { $ref: "#/components/schemas/OpaqueRef" }
        runs:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { $ref: "#/components/schemas/RunResumeCursor" }
    SubscribeRunEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef, afterSequence]
      properties:
        type: { type: string, const: SUBSCRIBE_RUN }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        runRef: { $ref: "#/components/schemas/OpaqueRef" }
        afterSequence: { type: integer, format: int64, minimum: 0 }
    UnsubscribeRunEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, runRef]
      properties:
        type: { type: string, const: UNSUBSCRIBE_RUN }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        runRef: { $ref: "#/components/schemas/OpaqueRef" }
    SessionReadyEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, streams]
      properties:
        type: { type: string, const: SESSION_READY }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        streams:
          type: array
          maxItems: 33
          uniqueItems: true
          items: { $ref: "#/components/schemas/StreamCursor" }
    RunSnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, streamKind, streamRef, cursor, snapshot]
      properties:
        type: { type: string, const: RUN_GRAPH_SNAPSHOT }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        streamKind: { type: string, const: RUN }
        streamRef: { $ref: "#/components/schemas/OpaqueRef" }
        cursor: { type: integer, format: int64, minimum: 0 }
        snapshot: { $ref: "#/components/schemas/RunGraph" }
    RunEventEnvelope:
      type: object
      additionalProperties: false
      required: [type, requestRef, streamKind, streamRef, cursor, event]
      properties:
        type: { type: string, const: RUN_EVENT }
        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        streamKind: { type: string, const: RUN }
        streamRef: { $ref: "#/components/schemas/OpaqueRef" }
        cursor: { type: integer, format: int64, minimum: 1 }
        event: { $ref: "#/components/schemas/RunEvent" }
    RunReadyEnvelope:
