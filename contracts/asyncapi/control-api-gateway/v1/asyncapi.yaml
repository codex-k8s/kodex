        requestRef: { $ref: "#/components/schemas/OpaqueRef" }
        streamKind: { type: string, const: RUN }
        streamRef: { $ref: "#/components/schemas/OpaqueRef" }
        cursor: { type: integer, format: int64, minimum: 0 }
    RunResyncEnvelope:
      type: object
      additionalProperties: false
      required:
