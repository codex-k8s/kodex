        kind:
          type: string
          enum: [SYNTHETIC_JOURNAL, GITHUB_REPOSITORY, MATTERMOST_CHANNEL, GITLAB_PROJECT, JIRA_PROJECT, CONFLUENCE_SPACE, EMAIL_SENDER, HTTPS_RESOURCE]
        values: { type: object, maxProperties: 8, additionalProperties: { type: string, maxLength: 2048 } }
        digest: { type: string, pattern: "^[a-f0-9]{64}$" }
    OwnerGateState:
      type: string
      enum: [OPEN, APPROVED, REJECTED, CHANGES_REQUESTED, CANCELLED, EXPIRED]
    OwnerGateDecision:
      type: string
      enum: [APPROVE, REJECT, REQUEST_CHANGES, CANCEL]
    UserSummary:
      type: object
      additionalProperties: false
      required: [ref, displayName]
      properties:
        ref: { $ref: "#/components/schemas/OpaqueRef" }
        displayName: { type: string, maxLength: 160 }
    Artifact:
      type: object
      additionalProperties: false
      required:
        [
          ref,
          version,
          projectRef,
          fileName,
          mediaType,
          sizeBytes,
          scanState,
          source,
          revision,
          agentBindings,
          previewAvailable,
          createdAt,
          nextActions,
        ]
      properties:
        ref: { $ref: "#/components/schemas/OpaqueRef" }
        version: { type: integer, format: int64, minimum: 1 }
        projectRef: { $ref: "#/components/schemas/OpaqueRef" }
        runRef: { $ref: "#/components/schemas/OpaqueRef" }
        fileName: { type: string, maxLength: 255 }
        mediaType: { type: string, maxLength: 160 }
        sizeBytes:
          { type: integer, format: int64, minimum: 0, maximum: 1073741824 }
        scanState: { $ref: "#/components/schemas/ArtifactScanState" }
        source: { $ref: "#/components/schemas/ArtifactSource" }
        revision: { type: integer, minimum: 1 }
        agentBindings:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 240 }
        previewAvailable: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        nextActions:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { $ref: "#/components/schemas/NextAction" }
    ArtifactScanState:
      type: string
      enum: [PENDING, SCANNING, CLEAN, QUARANTINED, FAILED]
    ArtifactSource:
      type: string
      enum:
        [
          CONTROL_CENTER,
          AGENT_RESULT,
          INTEGRATION_RESULT,
          KNOWLEDGE_SOURCE,
          INTERACTION_ATTACHMENT,
        ]
    Incident:
      type: object
      additionalProperties: false
      required:
        [
          ref,
          category,
          severity,
          state,
          safeSummary,
          safeNextStep,
          coreAffected,
          createdAt,
        ]
      properties:
        ref: { $ref: "#/components/schemas/OpaqueRef" }
        projectRef: { $ref: "#/components/schemas/OpaqueRef" }
        runRef: { $ref: "#/components/schemas/OpaqueRef" }
        category: { type: string, maxLength: 80 }
        severity: { $ref: "#/components/schemas/IncidentSeverity" }
        state: { $ref: "#/components/schemas/IncidentState" }
        safeSummary: { type: string, maxLength: 1000 }
        safeNextStep: { type: string, maxLength: 1000 }
        coreAffected: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    IncidentSeverity:
      type: string
      enum: [INFO, WARNING, ERROR, CRITICAL]
    IncidentState:
      type: string
      enum: [OPEN, RECOVERING, RESOLVED]
