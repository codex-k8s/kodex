syntax = "proto3";

package internalrpcauthority.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/codex-k8s/kodex/libs/go/internalrpcauth/gen/internalrpcauthority/v1;internalrpcauthorityv1";

// AuthorizationIssuerService выпускает один короткоживущий authorization
// context для одной попытки точного downstream RPC.
service AuthorizationIssuerService {
  // IssueAuthorizationContext выводит workload, RPC, audience, permission,
  // TTL и ревизии из загруженной машинной policy. Request не может
  // переопределить эти значения.
  rpc IssueAuthorizationContext(IssueAuthorizationContextRequest) returns (IssueAuthorizationContextResponse);

  // IssueContinuationAuthorizationContext выпускает child context только из
  // уже принятого локальным verifier parent context. Actor/tenant/project и
  // provenance наследуются; request не может их переопределить.
  rpc IssueContinuationAuthorizationContext(IssueContinuationAuthorizationContextRequest) returns (IssueAuthorizationContextResponse);

  // CheckReadiness проверяет тот же UDS peer-binding и фактически загруженный
  // signing/policy snapshot, которые использует рабочий выпуск.
  rpc CheckReadiness(AuthorizationIssuerServiceCheckReadinessRequest) returns (AuthorizationIssuerServiceCheckReadinessResponse);
}

// AuthorizationVerifierService проверяет JWS и атомарно резервирует jti до
// возврата проверенного нейтрального контекста целевому workload.
service AuthorizationVerifierService {
  // VerifyAuthorizationContext связывает token с локальным target workload,
  // фактическим full RPC и уже проверенным downstream mTLS peer.
  rpc VerifyAuthorizationContext(VerifyAuthorizationContextRequest) returns (VerifyAuthorizationContextResponse);

  // CheckReadiness проверяет тот же UDS peer-binding, snapshot и persistent
  // replay path, которые использует рабочая проверка.
  rpc CheckReadiness(AuthorizationVerifierServiceCheckReadinessRequest) returns (AuthorizationVerifierServiceCheckReadinessResponse);
}

// AuthorityProofResolverService — versioned preflight boundary доменного
// владельца. Его первый вызов не требует internal authorization context:
// transport interceptor проверяет exact mTLS caller, а application credential
// поступает только в metadata и разрешается сервером в actor/tenant/project.
// Request может нести project locator, но не авторитетный project scope.
service AuthorityProofResolverService {
  // ResolveAuthorityProof возвращает proof только после server-side проверки
  // actor membership и ownership целевого tenant/project. Request не содержит
  // actor, tenant, авторитетный project scope, SPIFFE ID, audience или
  // permission.
  rpc ResolveAuthorityProof(ResolveAuthorityProofRequest) returns (ResolveAuthorityProofResponse);

  // CheckReadiness криптографически проверяет фактически обслуживаемые policy,
  // proof signer и trust readback, а также доменный read path.
  rpc CheckReadiness(AuthorityProofResolverServiceCheckReadinessRequest) returns (AuthorityProofResolverServiceCheckReadinessResponse);
}

// RestoreControllerService — исполняемый интерфейс quarantine/PITR capability.
// Он доступен только exact operator и workload mTLS identities и никогда не
// принимает internal authorization context как замену transport binding.
service RestoreControllerService {
  rpc PrepareRestore(PrepareRestoreRequest) returns (PrepareRestoreResponse);
  // GetRestoreDirective позволяет каждой role-bound workload identity узнать
  // exact QUIESCING epoch/restore ID до PREPARED. Роль выводится только из
  // проверенных mTLS peer и отдельного signed role credential.
  rpc GetRestoreDirective(GetRestoreDirectiveRequest) returns (GetRestoreDirectiveResponse);
  rpc AcknowledgeQuiescence(AcknowledgeQuiescenceRequest) returns (AcknowledgeQuiescenceResponse);
  rpc CompleteRestore(CompleteRestoreRequest) returns (CompleteRestoreResponse);
  rpc CheckReadiness(RestoreControllerServiceCheckReadinessRequest) returns (RestoreControllerServiceCheckReadinessResponse);
}

// AuthorityReadbackAttestorService независимо проверяет role-bound
// cryptographic possession и фактически обслуживаемое pinned state. Он
// возвращает immutable одноразовый receipt; publisher не может вызвать этот
// интерфейс или создать receipt.
service AuthorityReadbackAttestorService {
  // IssueAttestationChallenge после mTLS и проверки отдельного normal-readback
  // credential атомарно выпускает durable single-use challenge. Request не
  // принимает workload, role, generation, audience, nonce или TTL.
  rpc IssueAttestationChallenge(IssueAttestationChallengeRequest) returns (IssueAttestationChallengeResponse);
  rpc AttestServedState(AttestServedStateRequest) returns (AttestServedStateResponse);
  rpc CheckReadiness(AuthorityReadbackAttestorServiceCheckReadinessRequest) returns (AuthorityReadbackAttestorServiceCheckReadinessResponse);
}

// RestoreRoleCredentialPublisherService — controller-authenticated issuance
// boundary publisher. Controller передаёт только signed issuance directive;
// publisher server-side разрешает exact target registry, генерирует ACK key,
// доставляет private часть exact role и возвращает signed delivery receipt.
service RestoreRoleCredentialPublisherService {
  rpc PublishRoleCredential(PublishRoleCredentialRequest) returns (PublishRoleCredentialResponse);
  rpc CheckReadiness(RestoreRoleCredentialPublisherServiceCheckReadinessRequest) returns (RestoreRoleCredentialPublisherServiceCheckReadinessResponse);
}

// ActorKind является закрытым техническим классом actor. Бизнесовые роли в
// этом enum отсутствуют.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_HUMAN = 1;
  ACTOR_KIND_AGENT = 2;
  ACTOR_KIND_SERVICE = 3;
  ACTOR_KIND_AUTOMATION = 4;
}

// AuthoritySource фиксирует вид источника полномочия, подтвержденного
// авторитетным issuer authority proof. Само значение enum не является
// доказательством полномочия.
enum AuthoritySource {
  AUTHORITY_SOURCE_UNSPECIFIED = 0;
  AUTHORITY_SOURCE_OIDC_SESSION = 1;
  AUTHORITY_SOURCE_MATTERMOST_EVENT = 2;
  AUTHORITY_SOURCE_DOMAIN_STATE = 3;
  AUTHORITY_SOURCE_AGENT_SESSION = 4;
  AUTHORITY_SOURCE_PROCESS_RUN = 5;
  AUTHORITY_SOURCE_AUTOMATION_OCCURRENCE = 6;
  AUTHORITY_SOURCE_INTEGRATION_CONTINUATION = 7;
  AUTHORITY_SOURCE_IMAGE_BUILD = 8;
  AUTHORITY_SOURCE_IMAGE_ARTIFACT = 9;
  AUTHORITY_SOURCE_IMAGE_PROMOTION_CLAIM = 10;
  AUTHORITY_SOURCE_LEGACY_MIGRATION = 11;
  AUTHORITY_SOURCE_WORKLOAD_READINESS = 12;
  AUTHORITY_SOURCE_PROVIDER_READBACK = 13;
  AUTHORITY_SOURCE_GIT_RECONCILIATION = 14;
  AUTHORITY_SOURCE_RUNTIME_EXECUTION = 15;
}

// WorkloadAuthorityRole задаёт закрытую роль одного authority sidecar либо
// resolver. Каждая роль получает отдельную workload-bound identity.
enum WorkloadAuthorityRole {
  WORKLOAD_AUTHORITY_ROLE_UNSPECIFIED = 0;
  WORKLOAD_AUTHORITY_ROLE_AUTHORIZATION_ISSUER = 1;
  WORKLOAD_AUTHORITY_ROLE_AUTHORIZATION_VERIFIER = 2;
  WORKLOAD_AUTHORITY_ROLE_AUTHORITY_PROOF_RESOLVER = 3;
}

// RestorePhase — закрытое состояние controller; переходы задаёт capability
// registry, а не caller.
enum RestorePhase {
  RESTORE_PHASE_UNSPECIFIED = 0;
  RESTORE_PHASE_OPEN = 1;
  RESTORE_PHASE_QUIESCING = 2;
  RESTORE_PHASE_PREPARED = 3;
  RESTORE_PHASE_RESTORING = 4;
  RESTORE_PHASE_COMPLETED = 5;
  RESTORE_PHASE_FENCED_SAFE_WINDOW = 6;
}

enum ReadbackAttestationKind {
  READBACK_ATTESTATION_KIND_UNSPECIFIED = 0;
  READBACK_ATTESTATION_KIND_KEY_DELIVERY = 1;
  READBACK_ATTESTATION_KIND_SNAPSHOT = 2;
}

// AuthorityProvenance связывает идентификатор с immutable snapshot,
// подписанным авторитетным issuer authority proof.
message AuthorityProvenance {
  AuthoritySource source = 1;
  string reference = 2;
  // revision ограничена JSON safe integer: 1..9007199254740991.
  uint64 revision = 3;
  string digest_sha256 = 4;
}

// AuthorityIdentity переносит нейтральный идентификатор и его происхождение.
message AuthorityIdentity {
  string id = 1;
  AuthorityProvenance provenance = 2;
}

// CallerAuthority содержит actor и tenant, а также project, когда exact
// operation policy требует project scope. Issuer заполняет сообщение только
// из строго проверенного authority proof; application не передает эти поля
// напрямую.
message CallerAuthority {
  ActorKind actor_kind = 1;
  AuthorityIdentity actor = 2;
  AuthorityIdentity tenant = 3;
  AuthorityIdentity project = 4;
}

message IssueAuthorizationContextRequest {
  // operation_id выбирает ровно одну зарегистрированную policy binding.
  // Неизвестное значение закрыто отклоняется; full RPC и permission request
  // не принимает.
  string operation_id = 1;
  reserved 2;
  reserved "authority";
  string correlation_id = 3;
  // authority_proof_compact_jws выпущен зарегистрированным авторитетным
  // resolver и криптографически связан с caller workload, operation_id,
  // downstream audience, actor/tenant/project и коротким сроком действия.
  // Синтаксически корректные claims без допустимой подписи не принимаются.
  string authority_proof_compact_jws = 4;
  // request_digest_sha256 вычислен client interceptor из фактического unary
  // protobuf request. Для STREAM_SESSION он обязан отсутствовать.
  string request_digest_sha256 = 5;
}

message IssueContinuationAuthorizationContextRequest {
  string operation_id = 1;
  // parent_authorization_context_compact_jws получен только из контекста,
  // сформированного локальным verifier interceptor после durable acceptance.
  string parent_authorization_context_compact_jws = 2;
  string request_id = 3;
  string correlation_id = 4;
  string request_digest_sha256 = 5;
}

message IssueAuthorizationContextResponse {
  string compact_jws = 1;
  google.protobuf.Timestamp expires_at = 2;
  // Все revision/generation ограничены JSON safe integer:
  // 1..9007199254740991.
  uint64 source_revision = 3;
  string source_digest_sha256 = 4;
  uint64 key_set_revision = 5;
  uint64 policy_revision = 6;
  uint64 signer_generation = 7;
  uint32 authority_abi_version = 8;
}

message ResolveAuthorityProofRequest {
  // operation_id выбирает exact preflight policy. application credential
  // передаётся interceptor через metadata; его значение не дублируется здесь.
  string operation_id = 1;
  // resource_reference — lookup key доменного владельца, а не authority.
  // tenant/project/owner всегда выводятся server-side.
  string resource_reference = 2;
  string idempotency_key = 3;
  string correlation_id = 4;
  // project_reference — выбранный вызывающим locator рабочей области. Он не
  // является authority: resolver обязан повторно проверить принадлежность
  // project к tenant, actor membership и exact operation permission.
  string project_reference = 5;
  string request_digest_sha256 = 6;
}

message ResolveAuthorityProofResponse {
  string authority_proof_compact_jws = 1;
  google.protobuf.Timestamp expires_at = 2;
  uint64 proof_revision = 3;
  string proof_digest_sha256 = 4;
  uint64 policy_revision = 5;
  uint64 signer_generation = 6;
}

message AuthorityProofResolverServiceCheckReadinessRequest {}

message AuthorityProofResolverServiceCheckReadinessResponse {
  bool ready = 1;
  uint64 policy_revision = 2;
  string policy_digest_sha256 = 3;
  uint64 signer_generation = 4;
  string served_public_jwk_thumbprint_sha256 = 5;
  bool domain_read_path_ready = 6;
}

// DownstreamTransportPeer формируется target gRPC interceptor только после
// успешной mTLS-проверки. Verifier дополнительно связывает assertion с
// локальным UDS peer и машинной policy.
message DownstreamTransportPeer {
  string spiffe_id = 1;
  string certificate_sha256 = 2;
}

message VerifyAuthorizationContextRequest {
  string compact_jws = 1;
  string observed_full_method = 2;
  DownstreamTransportPeer downstream_peer = 3;
  string correlation_id = 4;
  // observed_request_digest_sha256 вычисляет target interceptor из
  // фактически принятого unary protobuf request.
  string observed_request_digest_sha256 = 5;
}

message VerifyAuthorizationContextResponse {
  VerifiedAuthorizationContext context = 1;
}

// VerifiedAuthorizationContext является transport-neutral результатом.
// Domain adapter отдельно разрешает aggregate ownership и бизнесовые правила.
message VerifiedAuthorizationContext {
  uint32 contract_version = 1;
  string issuer = 2;
  string audience = 3;
  string subject = 4;
  string caller_workload_id = 5;
  string caller_spiffe_id = 6;
  string target_workload_id = 7;
  string target_spiffe_id = 8;
  string full_method = 9;
  string operation_id = 10;
  CallerAuthority authority = 11;
  string permission = 12;
  string jti = 13;
  // JSON integer seconds преобразуются без потери; nanos всегда равны 0.
  google.protobuf.Timestamp issued_at = 14;
  google.protobuf.Timestamp not_before = 15;
  google.protobuf.Timestamp expires_at = 16;
  // Все revision/generation ограничены JSON safe integer:
  // 1..9007199254740991.
  uint64 source_revision = 17;
  string source_digest_sha256 = 18;
  uint64 key_set_revision = 19;
  uint64 policy_revision = 20;
  uint64 signer_generation = 21;
  // Ревизия проверенной application credential caller: session revision для
  // человека либо grant revision для service workload. Caller её не задаёт.
  uint64 caller_credential_revision = 22;
  // Проверенное OIDC auth_time. Для service workload поля 23-25 отсутствуют.
  google.protobuf.Timestamp credential_authenticated_at = 23;
  string credential_acr = 24;
  repeated string credential_amr = 25;
  string request_digest_sha256 = 26;
  ContinuationLineage continuation = 27;
  uint32 authority_abi_version = 28;
  string request_binding_mode = 29;
}

// ContinuationLineage связывает child context с принятым parent и исходным
// root. Поля полностью выводятся issuer из подписанного parent context.
message ContinuationLineage {
  string root_jti = 1;
  string root_operation_id = 2;
  string root_full_method = 3;
  uint64 root_source_revision = 4;
  string root_source_digest_sha256 = 5;
  string parent_jti = 6;
  string parent_operation_id = 7;
  string parent_full_method = 8;
  string request_id = 9;
  string correlation_id = 10;
}

message AuthorizationIssuerServiceCheckReadinessRequest {}

// AuthorizationIssuerServiceCheckReadinessResponse не содержит key material. snapshot_digest_sha256
// нужен для exact readback фактически обслуживаемого snapshot.
message AuthorizationIssuerServiceCheckReadinessResponse {
  bool ready = 1;
  uint64 source_revision = 2;
  string snapshot_digest_sha256 = 3;
  uint64 key_set_revision = 4;
  uint64 policy_revision = 5;
  uint64 signer_generation = 6;
  uint32 authority_abi_version = 7;
}

message AuthorizationVerifierServiceCheckReadinessRequest {}

// AuthorizationVerifierServiceCheckReadinessResponse дополнительно подтверждает рабочий
// persistent replay path и restore fence.
message AuthorizationVerifierServiceCheckReadinessResponse {
  bool ready = 1;
  uint64 source_revision = 2;
  string snapshot_digest_sha256 = 3;
  uint64 key_set_revision = 4;
  uint64 policy_revision = 5;
  uint64 signer_generation = 6;
  bool replay_store_ready = 7;
  uint32 authority_abi_version = 8;
}

message PrepareRestoreRequest {
  string restore_id = 1;
  string database_cluster_id = 2;
  string backup_manifest_digest_sha256 = 3;
  google.protobuf.Timestamp recovery_target_time = 4;
  string idempotency_key = 5;
  string correlation_id = 6;
}

message GetRestoreDirectiveRequest {
  // role_credential_compact_jws доставляется отдельно для точной
  // (workload,role,generation) и связывается с фактическим workload SPIFFE.
  // Request не переносит caller-controlled workload, role или generation.
  string role_credential_compact_jws = 1;
  // observed_coordination_revision позволяет идемпотентный versioned poll.
  // Значение не является authority и только выбирает no-change response.
  uint64 observed_coordination_revision = 2;
  string correlation_id = 3;
}

message NoRestoreDirective {
  uint64 coordination_revision = 1;
  uint64 restore_epoch = 2;
  google.protobuf.Timestamp retry_not_before = 3;
  // verified_transition — controller-owned внешний restore state. Отсутствие,
  // unknown phase, stale epoch/revision либо небезопасная фаза запрещают
  // workload открывать admission после startup/replacement.
  RestoreTransition verified_transition = 4;
}

message RoleBoundRestoreDirective {
  // directive_compact_jws выпущен controller для одной проверенной
  // (workload,role,generation), exact role credential digest и restore ID.
  string directive_compact_jws = 1;
  RestoreTransition transition = 2;
  uint64 coordination_revision = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetRestoreDirectiveResponse {
  oneof result {
    NoRestoreDirective no_directive = 1;
    RoleBoundRestoreDirective directive = 2;
  }
}

message AcknowledgeQuiescenceRequest {
  reserved 1, 2, 3;
  reserved "restore_id", "workload_generation", "served_snapshot_digest_sha256";
  string correlation_id = 4;
  // Controller выводит ровно одну роль из mTLS peer + role credential, затем
  // проверяет signed directive, связанный с credential digest и restore ID.
  string role_credential_compact_jws = 5;
  string directive_compact_jws = 6;
  // quiescence_ack_compact_jws подписан ES256-ключом роли, thumbprint
  // которого связан role credential. Claims доказывают exact directive JTI,
  // stop-accepting, inflight=0 и served snapshot digest.
  string quiescence_ack_compact_jws = 7;
  // idempotency_key сохраняется вместе с canonical semantic digest, JTI и
  // принятым результатом. Повтор exact request возвращает тот же receipt;
  // тот же ключ либо JTI с другим digest является security replay.
  string idempotency_key = 8;
}

message CompleteRestoreRequest {
  string restore_id = 1;
  string database_cluster_id = 2;
  string backup_manifest_digest_sha256 = 3;
  google.protobuf.Timestamp recovery_target_time = 4;
  string idempotency_key = 5;
  string correlation_id = 6;
}

message RestoreTransition {
  string restore_id = 1;
  RestorePhase phase = 2;
  uint64 anchor_revision = 3;
  uint64 restore_epoch = 4;
  string evidence_digest_sha256 = 5;
  google.protobuf.Timestamp safe_window_not_before = 6;
}

message PrepareRestoreResponse {
  RestoreTransition transition = 1;
}

message AcknowledgeQuiescenceResponse {
  RestoreTransition transition = 1;
  QuiescenceAckReceipt receipt = 2;
}

// QuiescenceAckReceipt — сохранённый controller-owned результат одной
// semantic ACK transaction. Он не является credential и не заменяет
// проверку publisher credential, directive и ACK signatures.
message QuiescenceAckReceipt {
  string receipt_id = 1;
  string idempotency_key = 2;
  string ack_jti = 3;
  string semantic_request_digest_sha256 = 4;
  string accepted_ack_digest_sha256 = 5;
  uint64 coordination_revision = 6;
  RestorePhase resulting_phase = 7;
  google.protobuf.Timestamp accepted_at = 8;
}

message CompleteRestoreResponse {
  RestoreTransition transition = 1;
}

message RestoreControllerServiceCheckReadinessRequest {}

message RestoreControllerServiceCheckReadinessResponse {
  bool ready = 1;
  uint64 anchor_revision = 2;
  uint64 restore_epoch = 3;
  string served_evidence_digest_sha256 = 4;
  uint64 signer_generation = 5;
  bool admission_policy_observed = 6;
  uint64 role_credential_trust_source_revision = 7;
  string role_credential_trust_digest_sha256 = 8;
  uint64 role_credential_trust_signer_generation = 9;
  bool role_credential_trust_readback_ready = 10;
  bool ack_verification_registry_ready = 11;
  uint64 role_credential_trust_key_set_revision = 12;
}

message AttestServedStateRequest {
  // pinned_intent_id — lookup reference publisher-owned immutable intent, а
  // не authority. Workload, role, revisions и generations выводятся после
  // проверки mTLS, normal-readback credential, durable challenge и signed
  // attestation.
  string pinned_intent_id = 1;
  string readback_credential_compact_jws = 2;
  string served_state_attestation_compact_jws = 3;
  string idempotency_key = 4;
  string correlation_id = 5;
  // challenge_id получен через IssueAttestationChallenge. Сам идентификатор
  // не является authority: attestor server-side блокирует и проверяет
  // сохранённую exact binding до атомарного consume+receipt.
  string challenge_id = 6;
}

message AttestServedStateResponse {
  string attestation_receipt_id = 1;
  ReadbackAttestationKind kind = 2;
  google.protobuf.Timestamp expires_at = 3;
  string evidence_digest_sha256 = 4;
  uint64 verifier_generation = 5;
}

message IssueAttestationChallengeRequest {
  // pinned_intent_id — только lookup key. Exact intent kind/revision/digest,
  // workload, role и generations разрешаются server-side.
  string pinned_intent_id = 1;
  // Credential имеет отдельный typ/audience/purpose для normal readback и
  // никогда не принимается RestoreControllerService.
  string readback_credential_compact_jws = 2;
  // Повтор того же key с тем же canonical request digest возвращает
  // сохранённый challenge; иной digest закрыто отклоняется.
  string idempotency_key = 3;
  string correlation_id = 4;
}

message IssueAttestationChallengeResponse {
  string challenge_id = 1;
  string challenge_jti = 2;
  string challenge_nonce = 3;
  string challenge_digest_sha256 = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  ReadbackAttestationKind kind = 7;
  uint64 pinned_intent_revision = 8;
  string pinned_intent_digest_sha256 = 9;
  uint64 workload_generation = 10;
  uint64 credential_generation = 11;
  uint64 possession_key_generation = 12;
  string readback_credential_digest_sha256 = 13;
}

message AuthorityReadbackAttestorServiceCheckReadinessRequest {}

message AuthorityReadbackAttestorServiceCheckReadinessResponse {
  reserved 4, 5;
  reserved "role_credential_trust_source_revision", "role_credential_trust_digest_sha256";

  bool ready = 1;
  uint64 pinned_intent_revision = 2;
  string pinned_intent_digest_sha256 = 3;
  uint64 verifier_generation = 6;
  bool receipt_store_ready = 7;
  bool challenge_store_ready = 8;
  uint64 readback_credential_trust_source_revision = 9;
  string readback_credential_trust_digest_sha256 = 10;
  uint64 readback_credential_trust_key_set_revision = 11;
  uint64 readback_credential_trust_signer_generation = 12;
  bool readback_credential_trust_readback_ready = 13;
  string readback_manifest_root_id = 14;
  string readback_manifest_root_fingerprint_sha256 = 15;
  uint64 readback_manifest_bundle_revision = 16;
  string readback_manifest_bundle_digest_sha256 = 17;
  uint64 readback_manifest_signer_generation = 18;
  bool readback_manifest_root_served_readback_ready = 19;
}

message PublishRoleCredentialRequest {
  string issuance_directive_compact_jws = 1;
  string idempotency_key = 2;
  string correlation_id = 3;
}

message PublishRoleCredentialResponse {
  string delivery_receipt_compact_jws = 1;
  string role_credential_digest_sha256 = 2;
  uint64 credential_generation = 3;
  uint64 ack_key_generation = 4;
}

message RestoreRoleCredentialPublisherServiceCheckReadinessRequest {}

message RestoreRoleCredentialPublisherServiceCheckReadinessResponse {
  bool ready = 1;
  uint64 target_registry_revision = 2;
  string target_registry_digest_sha256 = 3;
  uint64 controller_trust_generation = 4;
  uint64 credential_signer_generation = 5;
  bool secret_exact_target_readback_ready = 6;
}

// AuthorizationFailureStage ограничивает наблюдаемую стадию отказа.
enum AuthorizationFailureStage {
  AUTHORIZATION_FAILURE_STAGE_UNSPECIFIED = 0;
  AUTHORIZATION_FAILURE_STAGE_UDS = 1;
  AUTHORIZATION_FAILURE_STAGE_REQUEST = 2;
  AUTHORIZATION_FAILURE_STAGE_JWS_HEADER = 3;
