syntax = "proto3";

package secretbroker.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/codex-k8s/kodex/libs/go/secretbrokerapi/gen/secretbroker/v1;secretbrokerv1";

// SecretBrokerService является единственной plaintext boundary Runtime Secrets.
// operation_grant одноразовый и не должен возвращаться browser-клиенту.
service SecretBrokerService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
  rpc RevokeSecret(RevokeSecretRequest) returns (RevokeSecretResponse);
  rpc CheckReadiness(CheckReadinessRequest) returns (CheckReadinessResponse);
  rpc SaveSecretDraft(SaveSecretDraftRequest) returns (SaveSecretDraftResponse);
  rpc ValidateSecretDraft(ValidateSecretDraftRequest) returns (ValidateSecretDraftResponse);
  rpc PublishSecretDraft(PublishSecretDraftRequest) returns (PublishSecretDraftResponse);
  rpc DiscardSecretDraft(DiscardSecretDraftRequest) returns (DiscardSecretDraftResponse);
  rpc CheckSecretDraftReadiness(CheckSecretDraftReadinessRequest) returns (CheckSecretDraftReadinessResponse);
}

// Grant назначает owner; plaintext существует только в bounded SAVE request.
// Ни grant, ни encrypted descriptor не возвращаются публичному клиенту.
message SaveSecretDraftRequest {
  string operation_grant = 1;
  bytes value = 2;
}
message ValidateSecretDraftRequest {
  string operation_grant = 1;
}
message PublishSecretDraftRequest {
  string operation_grant = 1;
}
message DiscardSecretDraftRequest {
  string operation_grant = 1;
}
message SaveSecretDraftResponse {
  RuntimeSecretDraftMetadata draft = 1;
}
message ValidateSecretDraftResponse {
  RuntimeSecretDraftMetadata draft = 1;
}
message PublishSecretDraftResponse {
  RuntimeSecretDraftMetadata draft = 1;
  RuntimeSecretMetadata secret = 2;
}
message DiscardSecretDraftResponse {
  RuntimeSecretDraftMetadata draft = 1;
}
message CheckSecretDraftReadinessRequest {}
message CheckSecretDraftReadinessResponse {
  bool ready = 1;
}

enum RuntimeSecretDraftState {
  RUNTIME_SECRET_DRAFT_STATE_UNSPECIFIED = 0;
  RUNTIME_SECRET_DRAFT_STATE_PREPARING = 1;
  RUNTIME_SECRET_DRAFT_STATE_DRAFT = 2;
  RUNTIME_SECRET_DRAFT_STATE_VALID = 3;
  RUNTIME_SECRET_DRAFT_STATE_PUBLISHING = 4;
  RUNTIME_SECRET_DRAFT_STATE_PUBLISHED = 5;
  RUNTIME_SECRET_DRAFT_STATE_DISCARDED = 6;
  RUNTIME_SECRET_DRAFT_STATE_EXPIRED = 7;
  RUNTIME_SECRET_DRAFT_STATE_FAILED = 8;
}

// Безопасная metadata не содержит value digest, hint, ciphertext или locators.
message RuntimeSecretDraftMetadata {
  string ref = 1;
  int64 version = 2;
  int64 generation = 3;
  string project_ref = 4;
  string secret_ref = 5;
  string name = 6;
  string description = 7;
  RuntimeSecretValueType value_type = 8;
  RuntimeSecretDraftState state = 9;
  int64 published_revision = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp expires_at = 13;
  int64 secret_version = 14;
}

// RuntimeCredentialProjectionService материализует один immutable Secret,
// ограниченный exact execution lease. Payload является locator; authority
// берётся только из проверенного mTLS+bearer context.
service RuntimeCredentialProjectionService {
  rpc MaterializeRuntimeCredentials(MaterializeRuntimeCredentialsRequest) returns (MaterializeRuntimeCredentialsResponse);
  rpc MaterializeSystemAssistantCredentials(MaterializeSystemAssistantCredentialsRequest) returns (MaterializeSystemAssistantCredentialsResponse);
  rpc CheckRuntimeCredentialProjectionReadiness(CheckRuntimeCredentialProjectionReadinessRequest) returns (CheckRuntimeCredentialProjectionReadinessResponse);
}

message MaterializeRuntimeCredentialsRequest {
  string workload_instance = 1;
  string lease_ref = 2;
  string fence = 3;
  int64 generation = 4;
  string runtime_revision_ref = 5;
  string runtime_revision_digest = 6;
  string session_ref = 7;
  string turn_ref = 8;
  int32 attempt = 9;
  string input_digest = 10;
}

message MaterializeSystemAssistantCredentialsRequest {
  MaterializeRuntimeCredentialsRequest execution = 1;
}
message MaterializeSystemAssistantCredentialsResponse {
  RuntimeCredentialProjectionDescriptor projection = 1;
}

message RuntimeCredentialProjectionDescriptor {
  string namespace = 1;
  string secret_name = 2;
  string secret_uid = 3;
  string secret_resource_version = 4;
  string content_sha256 = 5;
  string provider_auth_key = 6;
  repeated RuntimeCredentialProjectionKey runtime_secret_keys = 7;
  string lease_ref = 8;
  int64 generation = 9;
  string runtime_revision_ref = 10;
  string runtime_revision_digest = 11;
  string session_ref = 12;
  string turn_ref = 13;
  int32 attempt = 14;
  string input_digest = 15;
  google.protobuf.Timestamp expires_at = 16;
}

message RuntimeCredentialProjectionKey {
  string name = 1;
  string secret_key = 2;
}

message MaterializeRuntimeCredentialsResponse {
  RuntimeCredentialProjectionDescriptor projection = 1;
}

message CheckRuntimeCredentialProjectionReadinessRequest {}
message CheckRuntimeCredentialProjectionReadinessResponse {
  bool ready = 1;
}

message CreateSecretRequest {
  string operation_grant = 1;
  bytes value = 2;
}
message RotateSecretRequest {
  string operation_grant = 1;
  bytes value = 2;
}
message RevealSecretRequest {
  string operation_grant = 1;
}
message RevokeSecretRequest {
  string operation_grant = 1;
}

message CreateSecretResponse {
  RuntimeSecretMetadata secret = 1;
}
message RotateSecretResponse {
  RuntimeSecretMetadata secret = 1;
}
message RevealSecretResponse {
  bytes value = 1;
  RuntimeSecretValueType value_type = 2;
}
message RevokeSecretResponse {
  RuntimeSecretMetadata secret = 1;
}
message CheckReadinessRequest {}
message CheckReadinessResponse {
  bool ready = 1;
}

enum RuntimeSecretValueType {
  RUNTIME_SECRET_VALUE_TYPE_UNSPECIFIED = 0;
  RUNTIME_SECRET_VALUE_TYPE_STRING = 1;
  RUNTIME_SECRET_VALUE_TYPE_BINARY = 2;
  RUNTIME_SECRET_VALUE_TYPE_JSON = 3;
}

enum RuntimeSecretStatus {
  RUNTIME_SECRET_STATUS_UNSPECIFIED = 0;
  RUNTIME_SECRET_STATUS_ACTIVE = 1;
  RUNTIME_SECRET_STATUS_REVOKED = 2;
}

message RuntimeSecretDisplayHint {
  string prefix = 1;
  string suffix = 2;
}

message RuntimeSecretMetadata {
  string secret_ref = 1;
  string project_ref = 2;
  string name = 3;
  RuntimeSecretValueType value_type = 4;
  RuntimeSecretStatus status = 5;
  uint64 revision = 6;
  RuntimeSecretDisplayHint display_hint = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string description = 10;
  int64 version = 11;
}
