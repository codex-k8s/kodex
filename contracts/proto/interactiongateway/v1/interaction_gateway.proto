  string operation_id = 1;
  AgentMattermostBotIdentityAction action = 2;
  AgentMattermostBotIdentityOperationState state = 3;
  string agent_ref = 4;
  uint64 expected_agent_version = 5;
  uint64 predecessor_generation = 6;
  string request_sha256 = 7;
  string failure_code = 8;
  google.protobuf.Timestamp retry_not_before = 9;
  google.protobuf.Timestamp recovery_deadline = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  AgentMattermostBotIdentityBindingView result = 13;
}

