message AgentMattermostBotIdentityView {
  string identity_ref = 1;
  string selector = 2;
  string username = 3;
  string display_name = 4;
  AgentMattermostBotIdentityStatus status = 5;
  uint64 provider_version = 6;
  uint64 provider_generation = 7;
  string provider_snapshot_sha256 = 8;
  reserved 9;
  google.protobuf.Timestamp observed_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message AgentMattermostBotIdentityBindingView {
  string agent_ref = 1;
  uint64 agent_version = 2;
  AgentMattermostBotIdentityView identity = 3;
  string receipt_sha256 = 4;
  google.protobuf.Timestamp updated_at = 5;
}

