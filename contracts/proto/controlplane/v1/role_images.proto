syntax = "proto3";

package controlplane.v1;

import "controlplane/v1/control_plane.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/codex-k8s/kodex/libs/go/controlplaneapi/gen/controlplane/v1;controlplanev1";

// RoleImageService владеет специализированным lifecycle окружений ролей.
// Caller не назначает organization, owner, policy, generation или promotion target.
service RoleImageService {
  rpc ListRoleEnvironments(ListRoleEnvironmentsRequest) returns (ListRoleEnvironmentsResponse);
  rpc ListRoleImageRecipes(ListRoleImageRecipesRequest) returns (ListRoleImageRecipesResponse);
  rpc GetRoleImageRecipe(GetRoleImageRecipeRequest) returns (GetRoleImageRecipeResponse);
  rpc ManageRoleImageRecipe(ManageRoleImageRecipeRequest) returns (ManageRoleImageRecipeResponse);

  // Организационная область назначается сервером. Project/role locators не
  // принимаются; права владельца проверяются до version и receipt replay.
  rpc ListOrganizationRoleImageRecipes(ListOrganizationRoleImageRecipesRequest) returns (ListOrganizationRoleImageRecipesResponse);
  rpc GetOrganizationRoleImageRecipe(GetOrganizationRoleImageRecipeRequest) returns (GetOrganizationRoleImageRecipeResponse);
  rpc ListOrganizationRoleImageRecipeRevisions(ListOrganizationRoleImageRecipeRevisionsRequest) returns (ListOrganizationRoleImageRecipeRevisionsResponse);
  rpc ManageOrganizationRoleImageRecipe(ManageOrganizationRoleImageRecipeRequest) returns (ManageOrganizationRoleImageRecipeResponse);
  rpc RequestOrganizationRoleImagePromotion(RequestOrganizationRoleImagePromotionRequest) returns (RequestOrganizationRoleImagePromotionResponse);

  // Human OWNER/ADMIN читает только owner-resolved полный безопасный report.
  rpc GetOrganizationImageVulnerabilityReport(GetOrganizationImageVulnerabilityReportRequest) returns (GetOrganizationImageVulnerabilityReportResponse);
  rpc GetImageVulnerabilityReport(GetImageVulnerabilityReportRequest) returns (GetImageVulnerabilityReportResponse);
  // Approval создаёт immutable decision и новую attempt, но не переписывает REJECTED receipt.
  rpc DecideOrganizationImageAdmissionRisk(DecideOrganizationImageAdmissionRiskRequest) returns (DecideOrganizationImageAdmissionRiskResponse);
  rpc DecideImageAdmissionRisk(DecideImageAdmissionRiskRequest) returns (DecideImageAdmissionRiskResponse);

  rpc ClaimImageBuild(ClaimImageBuildRequest) returns (ClaimImageBuildResponse);
  rpc RenewImageBuild(RenewImageBuildRequest) returns (RenewImageBuildResponse);
  rpc ReportImageBuildProgress(ReportImageBuildProgressRequest) returns (ReportImageBuildProgressResponse);
  rpc CompleteImageBuild(CompleteImageBuildRequest) returns (CompleteImageBuildResponse);
  rpc FailImageBuild(FailImageBuildRequest) returns (FailImageBuildResponse);

  rpc GetImageSupplyWorkAvailability(GetImageSupplyWorkAvailabilityRequest) returns (GetImageSupplyWorkAvailabilityResponse);
  rpc ClaimImageAdmission(ClaimImageAdmissionRequest) returns (ClaimImageAdmissionResponse);
  rpc RecordImageAdmission(RecordImageAdmissionRequest) returns (RecordImageAdmissionResponse);
  rpc FailImageAdmission(FailImageAdmissionRequest) returns (FailImageAdmissionResponse);
  rpc ExpireImageAdmissionClaim(ExpireImageAdmissionClaimRequest) returns (ExpireImageAdmissionClaimResponse);
  rpc GetImageAdmissionTerminal(GetImageAdmissionTerminalRequest) returns (GetImageAdmissionTerminalResponse);
  rpc GetImageAdmissionRecoveryTerminal(GetImageAdmissionRecoveryTerminalRequest) returns (GetImageAdmissionRecoveryTerminalResponse);
  rpc ClaimImagePromotion(ClaimImagePromotionRequest) returns (ClaimImagePromotionResponse);
  rpc AuthorizeImagePromotion(AuthorizeImagePromotionRequest) returns (AuthorizeImagePromotionResponse);
  rpc CompleteImagePromotion(CompleteImagePromotionRequest) returns (CompleteImagePromotionResponse);
}

message RoleImagePlatform {
  string os = 1;
  string architecture = 2;
  string variant = 3;
}

message ListOrganizationRoleImageRecipeRevisionsRequest {
  string recipe_ref = 1;
  PageRequest page = 2;
}

message ListOrganizationRoleImageRecipeRevisionsResponse {
  repeated RoleImageRecipeRevision revisions = 1;
  PageInfo page = 2;
}

message RoleImagePackage {
  string manager = 1;
  string name = 2;
  string version = 3;
  string digest = 4;
  string source_ref = 5;
}

message RoleImageTool {
  string name = 1;
  string version = 2;
  string source_ref = 3;
  string sha256 = 4;
}

// RoleEnvironment является безопасным owner-facing элементом каталога. Exact
// OCI locators и supply-chain digests остаются внутри control-plane и build
// claim, поэтому browser выбирает stable key, а не вводит внутренние значения.
message RoleEnvironment {
  string key = 1;
  string name_message_key = 2;
  string description_message_key = 3;
  repeated string software_message_keys = 4;
  repeated RoleImagePlatform platforms = 5;
  bool recommended = 6;
  bool available = 7;
  string unavailable_message_key = 8;
  bool custom_installation_allowed = 9;
  string dockerfile_template = 10;
}

message RoleEnvironmentSelection {
  string environment_key = 1;
  repeated string package_keys = 2;
  repeated string tool_keys = 3;
  string installation_block = 4;
  string dockerfile = 5;
}

message ListRoleEnvironmentsRequest {}

message ListRoleEnvironmentsResponse {
  repeated RoleEnvironment environments = 1;
}

message RoleImageRecipeInput {
  string base_image_reference = 1;
  string base_image_digest = 2;
  string source_ref = 3;
  string source_revision = 4;
  string source_sha256 = 5;
  string context_ref = 6;
  string context_sha256 = 7;
  string builder_sha256 = 8;
  string frontend_sha256 = 9;
  repeated RoleImagePlatform platforms = 10;
  repeated RoleImagePackage packages = 11;
  repeated RoleImageTool tools = 12;
  string installation_block = 13;
  string toolchain_sha256 = 14;
  string environment_key = 15;
  repeated string package_keys = 16;
  repeated string tool_keys = 17;
  string dockerfile = 18;
}

message RoleImageRecipe {
  reserved 6;
  reserved "input";
  string ref = 1;
  uint64 version = 2;
  string role_definition_ref = 3;
  string name = 4;
  string state = 5;
  uint64 generation = 7;
  string spec_sha256 = 8;
  uint64 policy_revision = 9;
  string policy_sha256 = 10;
  uint64 role_runtime_contract_revision = 11;
  string role_runtime_contract_sha256 = 12;
  string active_image_artifact_ref = 13;
  string promoted_image_reference = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  repeated string next_actions = 17;
  RoleEnvironmentSelection environment = 18;
  string project_ref = 19;
  RoleImageManagedLineage managed_lineage = 20;
  bool source_available = 21;
  RuntimeResourceScopeKind scope_kind = 22;
  string organization_ref = 23;
}

message RoleImageManagedLineage {
  string configuration_ref = 1;
  string revision_ref = 2;
  int64 revision = 3;
  string managed_by = 4;
  string source_ref = 5;
  string source_revision = 6;
  string origin = 7;
}

enum ImageBuildStage {
  IMAGE_BUILD_STAGE_UNSPECIFIED = 0;
  IMAGE_BUILD_STAGE_QUEUED = 1;
  IMAGE_BUILD_STAGE_CONTEXT_VALIDATION = 2;
  IMAGE_BUILD_STAGE_BASE_PULL = 3;
  IMAGE_BUILD_STAGE_SOLVING = 4;
  IMAGE_BUILD_STAGE_STAGING_PUSH = 5;
  IMAGE_BUILD_STAGE_PROVENANCE = 6;
  IMAGE_BUILD_STAGE_COMPLETED = 7;
  IMAGE_BUILD_STAGE_FAILED = 8;
  IMAGE_BUILD_STAGE_CANCELLED = 9;
  IMAGE_BUILD_STAGE_EXPIRED = 10;
  IMAGE_BUILD_STAGE_DEAD_LETTER = 11;
  IMAGE_BUILD_STAGE_MATERIALIZATION = 12;
  IMAGE_BUILD_STAGE_INSTALLATION = 13;
  IMAGE_BUILD_STAGE_TRUSTED_RUNTIME_FINALIZATION = 14;
}

message ImageBuild {
  string ref = 1;
  uint64 version = 2;
  string recipe_ref = 3;
  uint64 recipe_version = 4;
  uint64 recipe_generation = 5;
  string spec_sha256 = 6;
  uint32 attempt = 7;
  uint64 fence = 8;
  ImageBuildStage stage = 9;
  uint32 progress_percent = 10;
  string staging_reference = 11;
  string manifest_digest = 12;
  string provenance_sha256 = 13;
  string immutable_build_sha256 = 14;
  string safe_error_code = 15;
  string diagnostic_code = 16;
  string diagnostic_summary = 17;
  google.protobuf.Timestamp lease_expires_at = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  string dockerfile = 21;
  string configuration_revision_ref = 22;
  bool source_available = 23;
  RuntimeResourceScopeKind scope_kind = 24;
  string organization_ref = 25;
  string project_ref = 26;
}

enum ImageAdmissionVerdict {
  IMAGE_ADMISSION_VERDICT_UNSPECIFIED = 0;
  IMAGE_ADMISSION_VERDICT_ACCEPTED = 1;
  IMAGE_ADMISSION_VERDICT_REJECTED = 2;
  // Только публичная текущая risk-bound PENDING/CLAIMED projection; Record не принимает.
  IMAGE_ADMISSION_VERDICT_PENDING = 3;
}

enum ImagePromotionState {
  IMAGE_PROMOTION_STATE_UNSPECIFIED = 0;
  IMAGE_PROMOTION_STATE_PENDING = 1;
  IMAGE_PROMOTION_STATE_CLAIMED = 2;
  IMAGE_PROMOTION_STATE_AUTHORIZED = 3;
  IMAGE_PROMOTION_STATE_PROMOTED = 4;
  IMAGE_PROMOTION_STATE_REJECTED = 5;
}

message ImageArtifact {
  string ref = 1;
  uint64 version = 2;
  string recipe_ref = 3;
  uint64 recipe_version = 4;
  uint64 recipe_generation = 5;
  string spec_sha256 = 6;
  string build_ref = 7;
  uint64 build_version = 8;
  uint32 build_attempt = 9;
  string staging_reference = 10;
  string manifest_digest = 11;
  string immutable_build_sha256 = 12;
  string provenance_sha256 = 13;
  string base_image_digest = 14;
  string source_sha256 = 15;
  string context_sha256 = 16;
  string builder_sha256 = 17;
  string frontend_sha256 = 18;
  string toolchain_sha256 = 19;
  repeated RoleImagePlatform platforms = 20;
  uint64 policy_revision = 21;
  string policy_sha256 = 22;
  string sbom_sha256 = 23;
  string vulnerability_evidence_sha256 = 24;
  ImageAdmissionVerdict admission_verdict = 25;
  string signature_identity = 26;
  string signature_sha256 = 27;
  uint64 admission_revision = 28;
  string admission_receipt_sha256 = 29;
  string admission_receipt_oci_manifest_digest = 30;
  string promoted_reference = 31;
  string promotion_readback_sha256 = 32;
  uint64 role_runtime_contract_revision = 33;
  string role_runtime_contract_sha256 = 34;
  google.protobuf.Timestamp promoted_at = 35;
  google.protobuf.Timestamp created_at = 36;
  google.protobuf.Timestamp updated_at = 37;
  repeated RoleImageTool declared_tools = 38;
  ImagePromotionState promotion_state = 39;
  bool promotion_requested = 40;
  RuntimeResourceScopeKind scope_kind = 41;
  string organization_ref = 42;
  string project_ref = 43;
  ImageToolInventory verified_tool_inventory = 44;
  // Текущая attempt projection не переписывает immutable terminal history.
  ImageAdmissionAttempt admission_attempt = 45;
  // Exact owner risk decision не является admission verdict.
  ImageAdmissionRiskDecision risk_decision = 46;
}

enum RoleImageRecipeAction {
  ROLE_IMAGE_RECIPE_ACTION_UNSPECIFIED = 0;
  ROLE_IMAGE_RECIPE_ACTION_CREATE = 1;
  ROLE_IMAGE_RECIPE_ACTION_UPDATE = 2;
  ROLE_IMAGE_RECIPE_ACTION_ARCHIVE = 3;
  ROLE_IMAGE_RECIPE_ACTION_RESTORE = 4;
  ROLE_IMAGE_RECIPE_ACTION_REQUEST_BUILD = 5;
  ROLE_IMAGE_RECIPE_ACTION_CANCEL_BUILD = 6;
}

message ListRoleImageRecipesRequest {
  string project_ref = 1;
  string role_definition_ref = 2;
  PageRequest page = 3;
  string query = 4;
  string state = 5;
}

message ListRoleImageRecipesResponse {
  repeated RoleImageRecipe recipes = 1;
  PageInfo page = 2;
  int64 total = 3;
}

message GetRoleImageRecipeRequest {
  string recipe_ref = 1;
}

message GetRoleImageRecipeResponse {
  RoleImageRecipe recipe = 1;
  repeated ImageBuild builds = 2;
  ImageArtifact active_artifact = 3;
  ImageArtifact promotion_candidate = 4;
  RoleImageAdmissionFailure admission_failure = 5;
}

message ManageRoleImageRecipeRequest {
  reserved 6;
  reserved "input";
  MutationContext mutation = 1;
  RoleImageRecipeAction action = 2;
  string recipe_ref = 3;
  string role_definition_ref = 4;
  string name = 5;
  string project_ref = 7;
  RoleEnvironmentSelection environment = 8;
  string build_ref = 9;
}

message ManageRoleImageRecipeResponse {
  RoleImageRecipe recipe = 1;
  ImageBuild image_build = 2;
  ImageArtifact image_artifact = 3;
  bool reused = 4;
}

message ListOrganizationRoleImageRecipesRequest {
  PageRequest page = 1;
  string query = 2;
  string state = 3;
}
message ListOrganizationRoleImageRecipesResponse {
  repeated RoleImageRecipe recipes = 1;
  PageInfo page = 2;
  int64 total = 3;
}
message GetOrganizationRoleImageRecipeRequest {
  string recipe_ref = 1;
}
message GetOrganizationRoleImageRecipeResponse {
  RoleImageRecipe recipe = 1;
  repeated ImageBuild builds = 2;
  ImageArtifact active_artifact = 3;
  ImageArtifact promotion_candidate = 4;
  RoleImageAdmissionFailure admission_failure = 5;
}
message ManageOrganizationRoleImageRecipeRequest {
  MutationContext mutation = 1;
  RoleImageRecipeAction action = 2;
  string recipe_ref = 3;
  string name = 4;
  RoleEnvironmentSelection environment = 5;
  string build_ref = 6;
}
message ManageOrganizationRoleImageRecipeResponse {
  RoleImageRecipe recipe = 1;
  ImageBuild image_build = 2;
  ImageArtifact image_artifact = 3;
  bool reused = 4;
}
message RequestOrganizationRoleImagePromotionRequest {
  MutationContext mutation = 1;
  string recipe_ref = 2;
  string image_artifact_ref = 3;
  string expected_provenance_sha256 = 4;
}
message RequestOrganizationRoleImagePromotionResponse {
  RoleImagePromotionReceipt receipt = 1;
}

message RoleImageBuildInput {
  string recipe_ref = 1;
  uint64 recipe_version = 2;
  uint64 recipe_generation = 3;
  string spec_sha256 = 4;
  string base_image_reference = 5;
  string base_image_digest = 6;
  string source_ref = 7;
  string source_revision = 8;
  string source_sha256 = 9;
  string context_ref = 10;
  string context_sha256 = 11;
  string builder_sha256 = 12;
  string frontend_sha256 = 13;
  repeated RoleImagePlatform platforms = 14;
  repeated RoleImagePackage packages = 15;
  repeated RoleImageTool tools = 16;
  string installation_block = 17;
  string toolchain_sha256 = 18;
  uint64 policy_revision = 19;
  string policy_sha256 = 20;
  string immutable_build_sha256 = 21;
  uint64 role_runtime_contract_revision = 22;
  string role_runtime_contract_sha256 = 23;
  string dockerfile = 24;
  RuntimeResourceScopeKind scope_kind = 25;
  string organization_ref = 26;
  string project_ref = 27;
}

message ClaimImageBuildRequest {
  string idempotency_key = 1;
}
message ClaimImageBuildResponse {
  ImageBuild image_build = 1;
  RoleImageBuildInput input = 2;
  string lease_token = 3;
  uint64 fence = 4;
  uint64 authority_generation = 5;
  google.protobuf.Timestamp lease_expires_at = 6;
}
message RenewImageBuildRequest {
  string idempotency_key = 1;
  string image_build_ref = 2;
  uint64 expected_version = 3;
  uint32 expected_attempt = 4;
  uint64 expected_fence = 5;
  string lease_token = 6;
}
message RenewImageBuildResponse {
  ImageBuild image_build = 1;
  string lease_token = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}
message ReportImageBuildProgressRequest {
  string idempotency_key = 1;
  string image_build_ref = 2;
  uint64 expected_version = 3;
  uint32 expected_attempt = 4;
  uint64 expected_fence = 5;
  string lease_token = 6;
  ImageBuildStage stage = 7;
  uint32 progress_percent = 8;
}
message ReportImageBuildProgressResponse {
  ImageBuild image_build = 1;
}
message CompleteImageBuildRequest {
  string idempotency_key = 1;
  string image_build_ref = 2;
  uint64 expected_version = 3;
  uint32 expected_attempt = 4;
  uint64 expected_fence = 5;
  string lease_token = 6;
  string staging_reference = 7;
  string manifest_digest = 8;
  string provenance_sha256 = 9;
  string immutable_build_sha256 = 10;
}
message CompleteImageBuildResponse {
  ImageBuild image_build = 1;
  ImageArtifact image_artifact = 2;
}
message FailImageBuildRequest {
  string idempotency_key = 1;
  string image_build_ref = 2;
  uint64 expected_version = 3;
  uint32 expected_attempt = 4;
  uint64 expected_fence = 5;
  string lease_token = 6;
  string error_code = 7;
  string diagnostic_code = 8;
  string diagnostic_summary = 9;
}
message FailImageBuildResponse {
  ImageBuild image_build = 1;
}

// Availability является авторитетным read-only preflight. Он не резервирует
// work и не заменяет fenced ClaimImageAdmission/ClaimImagePromotion.
message GetImageSupplyWorkAvailabilityRequest {}
message GetImageSupplyWorkAvailabilityResponse {
  bool admission_available = 1;
  bool promotion_available = 2;
}

message ClaimImageAdmissionRequest {
  string idempotency_key = 1;
}
message ClaimImageAdmissionResponse {
  ImageArtifact image_artifact = 1;
  string claim_token = 2;
  uint64 fence = 3;
  uint64 authority_generation = 4;
  google.protobuf.Timestamp claim_expires_at = 5;
  // Свежая server-owned attempt; этот pin не назначает authority.
  string admission_attempt_ref = 6;
  // Монотонная admission attempt, отличная от build attempt.
  uint32 admission_attempt = 7;
  // Exact canonical owner binding либо пусто только для обычной admission.
  string risk_acceptance_json = 8;
  // SHA256 binding, signer подписывает исходные bytes.
  string risk_acceptance_sha256 = 9;
  // Immutable original REJECTED receipt; не заменяется новым verdict.
  string source_admission_receipt_sha256 = 10;
  // Exact durable source evidence, никакого latest tag lookup.
  string source_evidence_manifest_digest = 11;
  // Original terminal revision; не новая attempt number.
  uint64 source_admission_revision = 12;
}
message RecordImageAdmissionRequest {
  string idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  uint64 expected_fence = 4;
  string claim_token = 5;
  string manifest_digest = 6;
  string immutable_build_sha256 = 7;
  string provenance_sha256 = 8;
  string sbom_sha256 = 9;
  string vulnerability_evidence_sha256 = 10;
  uint64 policy_revision = 11;
  string policy_sha256 = 12;
  ImageAdmissionVerdict verdict = 13;
  string signature_identity = 14;
  string signature_sha256 = 15;
  string admission_receipt_sha256 = 16;
  string admission_receipt_oci_manifest_digest = 17;
  // Exact signed payload; закрытый decoder проверяет digest и immutable tuple.
  string tool_inventory_json = 18;
  string tool_inventory_sha256 = 19;
  // Exact свежая attempt, сверяемая с заблокированным owner state.
  string expected_admission_attempt_ref = 20;
  // Exact монотонная attempt number, не caller authority.
  uint32 expected_admission_attempt = 21;
  // Полная safe projection всех matches; canonical decoder общий с worker.
  string vulnerability_report_json = 22;
  // SHA256 exact canonical projection bytes; bound 4MiB, без truncation.
  string vulnerability_report_projection_sha256 = 23;
  // Exact server-owned risk binding либо пусто для normal admission.
  string risk_acceptance_sha256 = 24;
}
message RecordImageAdmissionResponse {
  ImageArtifact image_artifact = 1;
}

// Технический отказ не создаёт verdict или evidence receipt.
message RoleImageAdmissionFailure {
  string image_artifact_ref = 1;
  uint64 version = 2;
  string recipe_ref = 3;
  uint64 recipe_generation = 4;
  string build_ref = 5;
  uint32 build_attempt = 6;
  RuntimeResourceScopeKind scope_kind = 7;
  string organization_ref = 8;
  string project_ref = 9;
  string state = 10;
  string error_code = 11;
}
message FailImageAdmissionRequest {
  string idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  uint64 expected_fence = 4;
  string claim_token = 5;
  string manifest_digest = 6;
  string immutable_build_sha256 = 7;
  string provenance_sha256 = 8;
  uint64 policy_revision = 9;
  string policy_sha256 = 10;
  string build_ref = 11;
  uint32 expected_build_attempt = 12;
  uint64 recipe_generation = 13;
  string spec_sha256 = 14;
  uint64 expected_authority_generation = 15;
  string error_code = 16;
  // Exact attempt locator дополняет полный fence tuple, не является authority.
  string expected_admission_attempt_ref = 17;
  // Монотонная admission attempt number, не build attempt.
  uint32 expected_admission_attempt = 18;
}
message FailImageAdmissionResponse {
  RoleImageAdmissionFailure admission_failure = 1;
}
// Старый fence является OCC locator, не полномочием. Expiry назначает DBclock владельца.
message ExpireImageAdmissionClaimRequest {
  string idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  uint64 expected_fence = 4;
  string manifest_digest = 5;
  string immutable_build_sha256 = 6;
  string provenance_sha256 = 7;
  uint64 policy_revision = 8;
  string policy_sha256 = 9;
  string build_ref = 10;
  uint32 expected_build_attempt = 11;
  uint64 recipe_generation = 12;
  string spec_sha256 = 13;
  uint64 expected_authority_generation = 14;
  // Exact attempt locator, expiry назначается owner DBclock.
  string expected_admission_attempt_ref = 15;
  // Монотонная admission attempt, закрываемая одним terminal receipt.
  uint32 expected_admission_attempt = 16;
}
message ExpireImageAdmissionClaimResponse {
  RoleImageAdmissionFailure admission_failure = 1;
}
// Ключ исходной claim и полный immutable tuple являются locator, не authority.
// Controller передаёт только managed run locator; actor/tenant и исходный tuple
// назначает владелец по canonical claim receipt, не из payload.
message GetImageAdmissionRecoveryTerminalRequest {
  string admission_run_id = 1;
}
message GetImageAdmissionRecoveryTerminalResponse {
  GetImageAdmissionTerminalResponse terminal_proof = 1;
}
message GetImageAdmissionTerminalRequest {
  string claim_idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  uint64 expected_fence = 4;
  string manifest_digest = 5;
  string immutable_build_sha256 = 6;
  string provenance_sha256 = 7;
  uint64 policy_revision = 8;
  string policy_sha256 = 9;
  string build_ref = 10;
  uint32 expected_build_attempt = 11;
  uint64 recipe_generation = 12;
  string spec_sha256 = 13;
  uint64 expected_authority_generation = 14;
  string expected_admission_attempt_ref = 15;
  uint32 expected_admission_attempt = 16;
  string risk_acceptance_sha256 = 17;
  uint64 source_admission_revision = 18;
  string source_admission_receipt_sha256 = 19;
  string source_evidence_manifest_digest = 20;
}
enum ImageAdmissionTerminalState {
  IMAGE_ADMISSION_TERMINAL_STATE_UNSPECIFIED = 0;
  IMAGE_ADMISSION_TERMINAL_STATE_ACCEPTED = 1;
  IMAGE_ADMISSION_TERMINAL_STATE_REJECTED = 2;
  IMAGE_ADMISSION_TERMINAL_STATE_FAILED = 3;
  IMAGE_ADMISSION_TERMINAL_STATE_CANCELLED = 4;
}
message GetImageAdmissionTerminalResponse {
  ImageAdmissionTerminalState terminal_state = 1;
  ImageArtifact claimed_artifact = 2;
  string admission_attempt_ref = 3;
  uint32 admission_attempt = 4;
  uint64 claim_fence = 5;
  uint64 claim_authority_generation = 6;
  uint64 terminal_artifact_version = 7;
  uint64 terminal_fence = 8;
  uint64 terminal_attempt_version = 9;
  string risk_acceptance_sha256 = 10;
  uint64 source_admission_revision = 11;
  string source_admission_receipt_sha256 = 12;
  string source_evidence_manifest_digest = 13;
}
message ClaimImagePromotionRequest {
  string idempotency_key = 1;
}
message ClaimImagePromotionResponse {
  ImageArtifact image_artifact = 1;
  string promotion_claim = 2;
  uint64 fence = 3;
  uint64 authority_generation = 4;
  google.protobuf.Timestamp claim_expires_at = 5;
}
message AuthorizeImagePromotionRequest {
  string idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  string promotion_claim = 4;
  string manifest_digest = 5;
}
message AuthorizeImagePromotionResponse {
  ImageArtifact image_artifact = 1;
  string authorization_token = 2;
  google.protobuf.Timestamp authorization_expires_at = 3;
}
message CompleteImagePromotionRequest {
  string idempotency_key = 1;
  string image_artifact_ref = 2;
  uint64 expected_version = 3;
  string authorization_token = 4;
  string promoted_reference = 5;
  string manifest_digest = 6;
  string promotion_readback_sha256 = 7;
}
message CompleteImagePromotionResponse {
  ImageArtifact image_artifact = 1;
}

// Severity безопасного отчёта; UNKNOWN сохраняет исходные нераспознанные совпадения.
enum ImageVulnerabilitySeverity {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_VULNERABILITY_SEVERITY_UNSPECIFIED = 0;
  // Критическая уязвимость.
  IMAGE_VULNERABILITY_SEVERITY_CRITICAL = 1;
  // Высокая severity.
  IMAGE_VULNERABILITY_SEVERITY_HIGH = 2;
  // Средняя severity, не блокирующая baseline.
  IMAGE_VULNERABILITY_SEVERITY_MEDIUM = 3;
  // Низкая severity, не блокирующая baseline.
  IMAGE_VULNERABILITY_SEVERITY_LOW = 4;
  // Минимальная severity.
  IMAGE_VULNERABILITY_SEVERITY_NEGLIGIBLE = 5;
  // Нераспознанная severity, не удаляемая из отчёта.
  IMAGE_VULNERABILITY_SEVERITY_UNKNOWN = 6;
}
// Закрытый вид advisory; OTHER не получает внешнюю ссылку.
enum ImageVulnerabilityAdvisoryKind {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_VULNERABILITY_ADVISORY_KIND_UNSPECIFIED = 0;
  // Канонический CVE ID и NVD URL.
  IMAGE_VULNERABILITY_ADVISORY_KIND_CVE = 1;
  // Канонический GHSA ID и GitHub URL.
  IMAGE_VULNERABILITY_ADVISORY_KIND_GHSA = 2;
  // Канонический GO ID и Go vulnerability URL.
  IMAGE_VULNERABILITY_ADVISORY_KIND_GO = 3;
  // Безопасный текст иного ID, без raw URL.
  IMAGE_VULNERABILITY_ADVISORY_KIND_OTHER = 4;
}
// Состояние исправления из полного scanner report.
enum ImageVulnerabilityFixState {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_VULNERABILITY_FIX_STATE_UNSPECIFIED = 0;
  // База содержит выпущенное исправление.
  IMAGE_VULNERABILITY_FIX_STATE_FIXED = 1;
  // Выпущенное исправление отсутствует.
  IMAGE_VULNERABILITY_FIX_STATE_NOT_FIXED = 2;
  // Scanner сообщает отсутствие планируемого исправления.
  IMAGE_VULNERABILITY_FIX_STATE_WONT_FIX = 3;
  // Состояние не распознано; запись сохраняется.
  IMAGE_VULNERABILITY_FIX_STATE_UNKNOWN = 4;
}
// Полнота owner-bound безопасной проекции.
enum ImageVulnerabilityReportState {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_VULNERABILITY_REPORT_STATE_UNSPECIFIED = 0;
  // Полная валидированная проекция всех совпадений.
  IMAGE_VULNERABILITY_REPORT_STATE_READY = 1;
  // Исторический artifact не имеет typed projection; нужна новая сборка.
  IMAGE_VULNERABILITY_REPORT_STATE_UNAVAILABLE = 2;
  // Техническая ошибка не разрешает принятие риска.
  IMAGE_VULNERABILITY_REPORT_STATE_FAILED = 3;
}
// Явное решение человека с проверенной административной authority.
enum ImageAdmissionRiskAction {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_ADMISSION_RISK_ACTION_UNSPECIFIED = 0;
  // Разрешить новую подписанную attempt для exact image/report tuple, не выставлять verdict.
  IMAGE_ADMISSION_RISK_ACTION_ACCEPT_RISK = 1;
  // Сохранить аудируемый отказ; существующий REJECTED остаётся.
  IMAGE_ADMISSION_RISK_ACTION_REJECT_RISK = 2;
}
// Lifecycle отдельной admission attempt; terminal receipt не переписывается.
enum ImageAdmissionAttemptState {
  // Неизвестное значение закрыто отклоняется на boundary.
  IMAGE_ADMISSION_ATTEMPT_STATE_UNSPECIFIED = 0;
  // Свежая attempt ожидает workload claim.
  IMAGE_ADMISSION_ATTEMPT_STATE_PENDING = 1;
  // Одна точная lease с fence и expiry.
  IMAGE_ADMISSION_ATTEMPT_STATE_CLAIMED = 2;
  // Новый подписанный допуск успешно записан владельцем.
  IMAGE_ADMISSION_ATTEMPT_STATE_ACCEPTED = 3;
  // Технические или baseline guards не разрешили допуск.
  IMAGE_ADMISSION_ATTEMPT_STATE_REJECTED = 4;
  // Технический terminal без выдуманного verdict.
  IMAGE_ADMISSION_ATTEMPT_STATE_FAILED = 5;
  // Owner graph отменил queued/live attempt.
  IMAGE_ADMISSION_ATTEMPT_STATE_CANCELLED = 6;
}
// Число исходных совпадений severity, включая suppressed occurrences.
message ImageVulnerabilitySeverityCount {
  // Закрытая severity, UNKNOWN имеет собственный bucket.
  ImageVulnerabilitySeverity severity = 1;
  // Сумма occurrences этой severity, не число grouped rows.
  uint32 match_count = 2;
}
// Полная безопасная grouped строка; locations и raw URLs отсутствуют.
message ImageVulnerabilityFinding {
  // SHA256 canonical grouping tuple, стабильный внутри pinned report.
  string ref = 1;
  // Безопасное имя пакета без paths и управляющих символов.
  string package_name = 2;
  // Версия или bounded range как данные, не shell или новый pin.
  string installed_version = 3;
  // Безопасный тип пакета из scanner report.
  string ecosystem = 4;
  // Bounded CVE/GHSA/GO либо OTHER ID, без потери исходных совпадений.
  string advisory_id = 5;
  // Вид определён серверным canonical decoder.
  ImageVulnerabilityAdvisoryKind advisory_kind = 6;
  // Только построенный сервером canonical HTTPS URL; OTHER пуст.
  string advisory_url = 7;
  // Severity всех объединённых исходных совпадений.
  ImageVulnerabilitySeverity severity = 8;
  // Состояние исправления по immutable report.
  ImageVulnerabilityFixState fix_state = 9;
  // Sorted unique bounded версии/ranges; не команда и не pin.
  repeated string fixed_versions = 10;
  // Baseline blocker назначается validator, suppressed false.
  bool blocking = 11;
  // Совпадения исходного ignoredMatches сохраняются явно.
  bool ignored = 12;
  // Положительное число grouped исходных совпадений.
  uint32 occurrences = 13;
}
// Owner-facing metadata полного immutable report; actual page rows выдаются отдельно.
message ImageVulnerabilityReport {
  // Область разрешена владельцем из сохранённого artifact.
  RuntimeResourceScopeKind scope_kind = 1;
  // Проверенная организация, не actor input.
  string organization_ref = 2;
  // Точный PROJECT locator; пустой только для ORGANIZATION.
  string project_ref = 3;
  // Owner-resolved рецепт.
  string recipe_ref = 4;
  // Exact версия рецепта для owner OCC.
  uint64 recipe_version = 5;
  // Неизменяемое поколение recipe/build snapshot.
  uint64 recipe_generation = 6;
  // Latest COMPLETED build, разрешённый owner eligibility.
  string build_ref = 7;
  // Версия сохранённого immutable build snapshot.
  uint64 build_version = 8;
  // Точная attempt исходной сборки.
  uint32 build_attempt = 9;
  // Принадлежащий той же scope artifact.
  string artifact_ref = 10;
  // Текущая версия artifact; If-Match относится к ней.
  uint64 artifact_version = 11;
  // Exact image digest sha256:; tag не является authority.
  string manifest_digest = 12;
  // Текущая owner revision admission projection.
  uint64 admission_revision = 13;
  // Original REJECTED terminal revision, закреплённая report.
  uint64 source_admission_revision = 14;
  // SHA256 immutable предыдущей receipt.
  string prior_admission_receipt_sha256 = 15;
  // Exact OCI manifest предыдущего evidence bundle.
  string prior_evidence_manifest_digest = 16;
  // SHA256 исходных полных scanner bytes.
  string vulnerability_evidence_sha256 = 17;
  // SHA256 исходных полных SBOM bytes.
  string sbom_sha256 = 18;
  // Version-pinned baseline policy.
  uint64 policy_revision = 19;
  // Exact baseline policy digest.
  string policy_sha256 = 20;
  // READY только после полного canonical validation.
  ImageVulnerabilityReportState state = 21;
  // Неизменяемая версия безопасной report projection.
  uint64 version = 22;
  // SHA256 исходных canonical projection bytes.
  string projection_sha256 = 23;
  // Server validator доказал полноту; caller flag не принимается.
  bool complete = 24;
  // Все active и suppressed occurrences.
  uint32 match_count = 25;
  // Число уникальных advisory ID полного отчёта.
  uint32 unique_advisory_count = 26;
  // Baseline active High/Critical с доступным исправлением.
  uint32 blocking_match_count = 27;
  // Active High/Critical без доступного исправления.
  uint32 unresolved_no_fix_match_count = 28;
  // Все исходные ignoredMatches occurrences.
  uint32 suppressed_match_count = 29;
  // Все закрытые severity buckets, включая UNKNOWN.
  repeated ImageVulnerabilitySeverityCount severity_counts = 30;
  // Server-only ACCEPT_RISK, REJECT_RISK либо REBUILD_FOR_REPORT по current eligibility.
  repeated string next_actions = 31;
}
// Append-only человеческое решение; оно не является admission verdict.
message ImageAdmissionRiskDecision {
  // Server-owned identity решения.
  string ref = 1;
  // Неизменяемая revision решения.
  uint64 version = 2;
  // Точное ACCEPT_RISK либо REJECT_RISK.
  ImageAdmissionRiskAction action = 3;
  // Обязательная причина, 1..2048 UTF8 bytes без controls.
  string reason = 4;
  // Проверенный human OWNER/ADMIN actor из transport/domain.
  string decided_by_actor_ref = 5;
  // Время решения назначено owner PostgreSQL.
  google.protobuf.Timestamp decided_at = 6;
  // Digest canonical owner decision binding, подписываемого signer.
  string binding_sha256 = 7;
  // Область разрешена владельцем из сохранённого artifact.
  RuntimeResourceScopeKind scope_kind = 8;
  // Проверенная организация, не actor input.
  string organization_ref = 9;
  // Точный PROJECT locator; пустой только для ORGANIZATION.
  string project_ref = 10;
  // Owner-resolved рецепт.
  string recipe_ref = 11;
  // Exact версия рецепта для owner OCC.
  uint64 recipe_version = 12;
  // Неизменяемое поколение recipe/build snapshot.
  uint64 recipe_generation = 13;
  // Latest COMPLETED build, разрешённый owner eligibility.
  string build_ref = 14;
  // Версия сохранённого immutable build snapshot.
  uint64 build_version = 15;
  // Точная attempt исходной сборки.
  uint32 build_attempt = 16;
  // Принадлежащий той же scope artifact.
  string artifact_ref = 17;
  // Версия artifact в неизменном snapshot решения, не текущая версия после Record.
  uint64 artifact_version = 18;
  // Exact image digest sha256:; tag не является authority.
  string manifest_digest = 19;
  // Owner revision admission projection в snapshot решения.
  uint64 admission_revision = 20;
  // Original REJECTED terminal revision, закреплённая report.
  uint64 source_admission_revision = 21;
  // SHA256 immutable предыдущей receipt.
  string prior_admission_receipt_sha256 = 22;
  // Exact OCI manifest предыдущего evidence bundle.
  string prior_evidence_manifest_digest = 23;
  // SHA256 исходных полных scanner bytes.
  string vulnerability_evidence_sha256 = 24;
  // SHA256 исходных полных SBOM bytes.
  string sbom_sha256 = 25;
  // Version-pinned baseline policy.
  uint64 policy_revision = 26;
  // Exact baseline policy digest.
  string policy_sha256 = 27;
}
// Отдельная новая attempt; прежняя terminal history сохраняется.
message ImageAdmissionAttempt {
  // Server-owned attempt identity.
  string ref = 1;
  // OCC lifecycle этой attempt.
  uint64 version = 2;
  // Монотонная attempt number, не build attempt или admission revision.
  uint32 number = 3;
  // Точное lifecycle state, неизвестное закрыто отклоняется.
  ImageAdmissionAttemptState state = 4;
  // Exact исходный image artifact.
  string artifact_ref = 5;
  // Owner risk decision либо пусто для обычной admission.
  string decision_ref = 6;
  // Server-owned claim fence; не caller authority.
  uint64 fence = 7;
  // Новая immutable terminal receipt либо пусто до Record.
  string admission_receipt_sha256 = 8;
  // Новый immutable OCI evidence manifest либо пусто до Record.
  string evidence_manifest_digest = 9;
}
// Организация назначается verified context; GET не выполняет transitions.
message GetOrganizationImageVulnerabilityReportRequest {
  // Locator разрешается в owner scope до pins.
  string recipe_ref = 1;
  // Locator существующего owner artifact.
  string artifact_ref = 2;
  // Страница до 100 строк; cursor закрепляет report и filters.
  PageRequest page = 3;
  // Bounded фильтр безопасного имени пакета.
  string package_query = 4;
  // Presence отличает отсутствие filter от explicit UNKNOWN.
  optional ImageVulnerabilitySeverity severity = 5;
  // Bounded advisory search, не URL.
  string advisory_query = 6;
  // Presence отличает отсутствие фильтра от false.
  optional bool blocking_only = 7;
  // Exact raw report SHA256 обязателен при продолжении cursor.
  string expected_report_sha256 = 8;
}
// PROJECT report использует owner/project eligibility того же artifact.
message GetImageVulnerabilityReportRequest {
