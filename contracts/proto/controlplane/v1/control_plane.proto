  string name = 1;
  string description = 2;
  repeated SkillBundleFileInput files = 3;
}
message SkillBundleRevision {
  string ref = 1;
  int64 revision = 2;
  SkillRevisionState state = 3;
  string name = 4;
  string description = 5;
  repeated SkillBundleFile files = 6;
  string digest = 7;
  string parent_revision_ref = 8;
  ContextProvenance provenance = 9;
  SkillScanState scan_state = 10;
  string scan_engine = 11;
  string scan_digest = 12;
  google.protobuf.Timestamp scanned_at = 13;
  string reviewed_by = 14;
  google.protobuf.Timestamp reviewed_at = 15;
  repeated string diagnostics = 16;
}
message SkillBundle {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  ContextResourceState state = 4;
  SkillBundleRevision current_revision = 5;
  SkillBundleRevision draft_revision = 6;
  google.protobuf.Timestamp created_at = 7;
