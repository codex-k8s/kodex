// IntegrationApprovalState — единственное решение по approval.
enum IntegrationApprovalState {
  INTEGRATION_APPROVAL_STATE_UNSPECIFIED = 0;
  INTEGRATION_APPROVAL_STATE_PENDING = 1;
  INTEGRATION_APPROVAL_STATE_APPROVED = 2;
  INTEGRATION_APPROVAL_STATE_REJECTED = 3;
  INTEGRATION_APPROVAL_STATE_EXPIRED = 4;
  INTEGRATION_APPROVAL_STATE_CANCELLED = 5;
}

// IntegrationExecutionState — отдельный terminal execution result.
enum IntegrationExecutionState {
  INTEGRATION_EXECUTION_STATE_UNSPECIFIED = 0;
  INTEGRATION_EXECUTION_STATE_NOT_STARTED = 1;
  INTEGRATION_EXECUTION_STATE_EXECUTING = 2;
  INTEGRATION_EXECUTION_STATE_SUCCEEDED = 3;
  INTEGRATION_EXECUTION_STATE_FAILED = 4;
  INTEGRATION_EXECUTION_STATE_NOT_APPLICABLE = 5;
}

// IntegrationContinuationState — durable suspension/rejoin lifecycle.
enum IntegrationContinuationState {
  INTEGRATION_CONTINUATION_STATE_UNSPECIFIED = 0;
  INTEGRATION_CONTINUATION_STATE_SUSPENDED = 1;
  INTEGRATION_CONTINUATION_STATE_READY = 2;
  INTEGRATION_CONTINUATION_STATE_REJOINED = 3;
}

// IntegrationExecutionBinding — server-owned tuple приостановленного исполнения.
message IntegrationExecutionBinding {
  string organization_id = 1;
  string project_id = 2;
  string process_id = 3;
  string session_id = 4;
  uint64 session_version = 5;
  string thread_id = 6;
  string role_id = 7;
  string turn_id = 8;
  uint64 turn_version = 9;
  uint32 attempt = 10;
  string runtime_revision_id = 11;
  uint64 runtime_revision_version = 12;
  string runtime_revision_sha256 = 13;
  string immutable_input_sha256 = 14;
  uint64 grant_generation = 15;
  uint64 fence = 16;
  IntegrationApprovalBinding integration_binding = 17;
}

// PinnedIntegrationResource связывает owner resource с exact version/digest.
message PinnedIntegrationResource {
  string resource_id = 1;
  uint64 version = 2;
  string projection_sha256 = 3;
}

// IntegrationApprovalBinding — выбранная gateway связка, которую owner
// повторно разрешает из RuntimeRevision; caller fields не являются authority.
message IntegrationApprovalBinding {
  PinnedIntegrationResource integration = 1;
  repeated PinnedIntegrationResource credential_bindings = 2;
}

// IntegrationContinuation — typed durable suspension и structured result/error.
message IntegrationContinuation {
  string continuation_id = 1;
  IntegrationExecutionBinding binding = 2;
  string invocation_id = 3;
  string approval_id = 4;
  string integration_id = 5;
  string request_sha256 = 6;
  IntegrationApprovalState approval_state = 7;
  IntegrationExecutionState execution_state = 8;
  IntegrationContinuationState continuation_state = 9;
  uint64 version = 10;
  uint64 fence = 11;
  google.protobuf.Timestamp approval_expires_at = 12;
  string decision_reference = 13;
  string decision_sha256 = 14;
  string result_reference = 15;
  string result_sha256 = 16;
  string error_code = 17;
  string error_reference = 18;
  string error_sha256 = 19;
  string continuation_turn_id = 20;
  uint64 continuation_turn_version = 21;
  string continuation_runtime_revision_id = 22;
  uint64 continuation_runtime_revision_version = 23;
  string continuation_input_sha256 = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  // continuation_attempt — текущая server-owned delivery attempt; retry
  // перепривязывает тот же immutable outcome и увеличивает version/fence.
  uint32 continuation_attempt = 27;
  // transition_grant — свежая узкая authority для следующего gateway transition.
  string transition_grant = 28;
  google.protobuf.Timestamp transition_grant_expires_at = 29;
  // Удалённый legacy result-access contract не может быть переиспользован.
  reserved 30, 31;
}

message ResolveIntegrationSessionRequest {}

message ResolveIntegrationSessionResponse {
  IntegrationSessionContext context = 1;
}

// IntegrationSessionContext материализует только exact RuntimeRevision-bound
// integration metadata; request не выбирает tenant/session/turn/role.
message IntegrationSessionContext {
  string organization_id = 1;
  string project_id = 2;
  string owner_actor_id = 3;
  string session_id = 4;
  uint64 session_version = 5;
  string turn_id = 6;
  uint64 turn_version = 7;
  uint32 attempt = 8;
  string input_sha256 = 9;
  string runtime_revision_id = 10;
  uint64 runtime_revision_version = 11;
  string runtime_manifest_sha256 = 12;
  string role_id = 13;
  uint64 role_version = 14;
  repeated string role_capabilities = 15;
  uint64 grant_generation = 16;
  repeated IntegrationSessionBinding integrations = 17;
  string process_id = 18;
  string thread_id = 19;
  string runtime_revision_sha256 = 20;
}

// IntegrationSessionBinding содержит одну exact integration projection.
message IntegrationSessionBinding {
  string integration_id = 1;
  uint64 integration_version = 2;
  string projection_sha256 = 3;
  string definition_ref = 4;
  uint64 definition_version = 5;
  repeated string capabilities = 6;
  string endpoint_ref = 7;
  repeated IntegrationCredentialBinding credential_bindings = 8;
}

// IntegrationCredentialBinding содержит только metadata-ссылку, не secret value.
message IntegrationCredentialBinding {
  string credential_binding_id = 1;
  uint64 credential_binding_version = 2;
  string projection_sha256 = 3;
  string purpose = 4;
  string secret_ref = 5;
  string principal_ref = 6;
  uint64 credential_revision = 7;
  google.protobuf.Timestamp expires_at = 8;
}

