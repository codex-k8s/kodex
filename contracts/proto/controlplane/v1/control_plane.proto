// RuntimeRevisionSpec описывает версионированное сообщение контракта control-plane.
message RuntimeRevisionSpec {
  // manifest_sha256 — вычисленный сервером digest полного эффективного снимка.
  string manifest_sha256 = 1;
  reserved 2;
  reserved "image_digest";
  string prompt_profile_id = 3;
  uint64 prompt_revision = 4;
  repeated string credential_binding_ids = 5;
  repeated string integration_ids = 6;
  string predecessor_revision_id = 7;
  uint64 authority_policy_revision = 8;
  string authority_policy_sha256 = 9;
  repeated EffectiveResourceRef components = 10;
  google.protobuf.Timestamp created_at = 11;
  string session_id = 12;
  string role_id = 13;
  string chat_id = 14;
  string provider_credential_binding_id = 15;
  string effective_runtime_sha256 = 16;
  string codex_model = 17;
  string codex_sandbox = 18;
  string codex_approval_policy = 19;
  // provider_account_name — публичное server-owned имя той же logical OpenAI
  // account для verified `/agents openai auth`; identifier привязки не
  // раскрывается пользователю и не принимается от runner.
  string provider_account_name = 20;
  // scheduled_result_contract заполняется owner-side только для scheduled
  // revision и входит в immutable manifest digest.
  ScheduledResultContract scheduled_result_contract = 21;
  // image_reference — единственный exact promoted repository@sha256 source для runtime.
  string image_reference = 22;
  string role_image_recipe_id = 23;
  uint64 role_image_recipe_version = 24;
  string role_image_spec_sha256 = 25;
  string image_build_id = 26;
  uint64 image_build_version = 27;
  uint32 image_build_attempt = 28;
  string image_artifact_id = 29;
  uint64 image_artifact_version = 30;
  string image_manifest_digest = 31;
  uint64 image_admission_revision = 32;
  string image_admission_receipt_sha256 = 33;
  uint64 image_policy_revision = 34;
  string image_policy_sha256 = 35;
  string image_signature_sha256 = 36;
  string image_promotion_readback_sha256 = 37;
  // Digest фактически прочитанного OCI evidence manifest, слой которого
  // содержит exact receipt и полный bounded admission evidence bundle.
  string image_admission_receipt_oci_manifest_digest = 38;
  // role_runtime_contract_* закрепляют проверенный runtime ABI promoted image.
  uint64 role_runtime_contract_revision = 39;
  string role_runtime_contract_sha256 = 40;
}

// RoleImagePackage — exact typed package input. Version и digest обязательны.
message RoleImagePackage {
  string manager = 1;
  string name = 2;
  string version = 3;
  string digest = 4;
  // source_ref — immutable OCI artifact reference, материализуемый trusted fetch path.
  string source_ref = 5;
}

// RoleImageTool — exact external tool input without secret material.
message RoleImageTool {
  string name = 1;
  string version = 2;
  string source_ref = 3;
  string sha256 = 4;
}

// RoleImagePlatform — closed OCI target platform tuple.
message RoleImagePlatform {
  string os = 1;
  string architecture = 2;
  string variant = 3;
}

// RoleImageRecipeInput — owner declarative input. Server-computed generation,
// spec hash and policy binding deliberately do not exist in caller payload.
message RoleImageRecipeInput {
  string base_image_reference = 1;
  string base_image_digest = 2;
  string source_ref = 3;
  string source_revision = 4;
  string source_sha256 = 5;
  string context_ref = 6;
  string context_sha256 = 7;
  string builder_sha256 = 8;
  string frontend_sha256 = 9;
  repeated RoleImagePlatform platforms = 10;
  repeated RoleImagePackage packages = 11;
  repeated RoleImageTool tools = 12;
  // Пустая строка — каноническое значение отсутствующего аварийного блока.
  string installation_block = 13;
  string toolchain_sha256 = 15;
}

// RoleImageRecipeSpec — durable owner state with canonical server bindings.
message RoleImageRecipeSpec {
  RoleImageRecipeInput input = 1;
  uint64 generation = 2;
  string spec_sha256 = 3;
  uint64 policy_revision = 4;
  string policy_sha256 = 5;
  uint64 role_runtime_contract_revision = 6;
  string role_runtime_contract_sha256 = 7;
}

// ImageBuildSpec contains bounded status only; installation block, context
// contents and secret values are never persisted here.
message ImageBuildSpec {
  string recipe_id = 1;
  uint64 recipe_version = 2;
  uint64 recipe_generation = 3;
  string spec_sha256 = 4;
  uint32 attempt = 5;
  string claimant_workload_id = 6;
  string claimant_spiffe_id = 7;
  uint64 authority_generation = 8;
  uint64 fence = 9;
  google.protobuf.Timestamp lease_expires_at = 10;
  ImageBuildStage stage = 11;
  uint32 progress_percent = 12;
  string staging_reference = 13;
  string manifest_digest = 14;
  string provenance_sha256 = 15;
  string immutable_build_sha256 = 16;
  string error_code = 17;
  google.protobuf.Timestamp available_at = 18;
  uint32 maximum_attempts = 19;
  string lease_token_sha256 = 20;
  string claim_jti_sha256 = 21;
  // diagnostic_code/summary — только закрытая redacted диагностика без raw output.
  string diagnostic_code = 22;
  string diagnostic_summary = 23;
}

enum ImageBuildStage {
  IMAGE_BUILD_STAGE_UNSPECIFIED = 0;
  IMAGE_BUILD_STAGE_QUEUED = 1;
  IMAGE_BUILD_STAGE_CONTEXT_VALIDATION = 2;
  IMAGE_BUILD_STAGE_BASE_PULL = 3;
  IMAGE_BUILD_STAGE_SOLVING = 4;
  IMAGE_BUILD_STAGE_STAGING_PUSH = 5;
  IMAGE_BUILD_STAGE_PROVENANCE = 6;
  IMAGE_BUILD_STAGE_COMPLETED = 7;
  IMAGE_BUILD_STAGE_FAILED = 8;
  IMAGE_BUILD_STAGE_CANCELLED = 9;
  IMAGE_BUILD_STAGE_EXPIRED = 10;
  IMAGE_BUILD_STAGE_DEAD_LETTER = 11;
  IMAGE_BUILD_STAGE_MATERIALIZATION = 12;
  IMAGE_BUILD_STAGE_INSTALLATION = 13;
  IMAGE_BUILD_STAGE_TRUSTED_RUNTIME_FINALIZATION = 14;
}

// ImageArtifactSpec binds all independent admission evidence to one digest.
message ImageArtifactSpec {
  string recipe_id = 1;
  uint64 recipe_version = 2;
  uint64 recipe_generation = 3;
  string spec_sha256 = 4;
  string build_id = 5;
  uint64 build_version = 6;
  uint32 build_attempt = 7;
  string staging_reference = 8;
  string manifest_digest = 9;
  string provenance_sha256 = 10;
  string immutable_build_sha256 = 11;
  string sbom_sha256 = 12;
  string vulnerability_evidence_sha256 = 13;
  uint64 policy_revision = 14;
  string policy_sha256 = 15;
  ImageAdmissionVerdict admission_verdict = 16;
  string signature_identity = 17;
  string signature_sha256 = 18;
  uint64 admission_revision = 19;
  string admission_receipt_sha256 = 20;
  string promotion_claim_jti_sha256 = 21;
  google.protobuf.Timestamp promotion_claim_expires_at = 22;
  string promoted_reference = 23;
  string promotion_readback_sha256 = 24;
  google.protobuf.Timestamp promoted_at = 25;
  string admission_claimant_workload_id = 26;
  uint64 admission_authority_generation = 27;
  uint64 admission_fence = 28;
  string admission_claim_token_sha256 = 29;
  google.protobuf.Timestamp admission_claim_expires_at = 30;
  string base_image_digest = 31;
  string source_sha256 = 32;
  string context_sha256 = 33;
  string builder_sha256 = 34;
  string frontend_sha256 = 35;
  string toolchain_sha256 = 36;
  repeated RoleImagePlatform platforms = 37;
  string promotion_claimant_workload_id = 38;
  string promotion_claimant_spiffe_id = 39;
  uint64 promotion_authority_generation = 40;
  uint64 promotion_fence = 41;
  // Реальный OCI evidence manifest digest; digest локального JSON запрещён.
  string admission_receipt_oci_manifest_digest = 42;
  uint64 role_runtime_contract_revision = 43;
  string role_runtime_contract_sha256 = 44;
  string promotion_authorization_token_sha256 = 45;
  google.protobuf.Timestamp promotion_authorization_expires_at = 46;
}

enum ImageAdmissionVerdict {
  IMAGE_ADMISSION_VERDICT_UNSPECIFIED = 0;
  IMAGE_ADMISSION_VERDICT_ACCEPTED = 1;
  IMAGE_ADMISSION_VERDICT_REJECTED = 2;
}

// ScheduledResultContract — закрытый immutable contract результата scheduled
