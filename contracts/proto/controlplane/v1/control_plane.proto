// Отдельный owner work для Git-конфигураций; не создаёт runtime Run/Turn/grant.
service ManagedConfigurationSourceWorkService {
  rpc ClaimManagedConfigurationSourceWork(ClaimManagedConfigurationSourceWorkRequest) returns (ClaimManagedConfigurationSourceWorkResponse);
  rpc RenewManagedConfigurationSourceWork(RenewManagedConfigurationSourceWorkRequest) returns (RenewManagedConfigurationSourceWorkResponse);
  rpc CompleteManagedConfigurationSourceWork(CompleteManagedConfigurationSourceWorkRequest) returns (CompleteManagedConfigurationSourceWorkResponse);
  rpc FailManagedConfigurationSourceWork(FailManagedConfigurationSourceWorkRequest) returns (FailManagedConfigurationSourceWorkResponse);
}

// RuntimeSecretWorkService доступен только secret-broker workload. Одноразовый
// grant связывает actor, Проект, вид операции и exact Secret revision.
// Единственный consumer — secret-broker. Ни plaintext, ни ciphertext не проходят CP.
service RuntimeSecretDraftWorkService {
  rpc CheckRuntimeSecretDraftWorkReadiness(CheckRuntimeSecretDraftWorkReadinessRequest) returns (CheckRuntimeSecretDraftWorkReadinessResponse);
  rpc ConsumeRuntimeSecretDraftOperation(ConsumeRuntimeSecretDraftOperationRequest) returns (ConsumeRuntimeSecretDraftOperationResponse);
  rpc CompleteRuntimeSecretDraftOperation(CompleteRuntimeSecretDraftOperationRequest) returns (CompleteRuntimeSecretDraftOperationResponse);
  rpc FailRuntimeSecretDraftOperation(FailRuntimeSecretDraftOperationRequest) returns (FailRuntimeSecretDraftOperationResponse);
  rpc ListRuntimeSecretDraftRecoveryWork(ListRuntimeSecretDraftRecoveryWorkRequest) returns (ListRuntimeSecretDraftRecoveryWorkResponse);
  rpc RecoverRuntimeSecretDraftMaterialization(RecoverRuntimeSecretDraftMaterializationRequest) returns (RecoverRuntimeSecretDraftMaterializationResponse);
  rpc CompleteRuntimeSecretDraftCleanup(CompleteRuntimeSecretDraftCleanupRequest) returns (CompleteRuntimeSecretDraftCleanupResponse);
}

