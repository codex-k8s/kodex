syntax = "proto3";

package controlplane.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/codex-k8s/matter-codex/libs/go/controlplaneapi/gen/controlplane/v1;controlplanev1";

// ControlPlaneService владеет желаемым бизнес-состоянием MatterCodex.
// Actor, организация, область проекта и полномочия не принимаются в нагрузке:
// транспорт получает их только из проверенного контекста авторизации #186.
service ControlPlaneService {
  // CreateProject выполняет версионированную операцию ControlPlaneService.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // ListProjects выполняет версионированную операцию ControlPlaneService.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // UpdateProject изменяет только exact owner project после tenant resolution.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // DeleteProject атомарно завершает lifecycle пустого owner project.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // CreateResource выполняет версионированную операцию ControlPlaneService.
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
  // UpdateResource выполняет версионированную операцию ControlPlaneService.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse);
  // TransitionResource выполняет версионированную операцию ControlPlaneService.
  rpc TransitionResource(TransitionResourceRequest) returns (TransitionResourceResponse);
  // DeleteResource выполняет версионированную операцию ControlPlaneService.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
  // ManageAccessResource — закрытая административная команда для TEAM/ROLE/PROMPT_PROFILE.
  rpc ManageAccessResource(ManageAccessResourceRequest) returns (ManageAccessResourceResponse);
  // DetachAccessResource атомарно переводит Git-owned TEAM/ROLE/PROMPT_PROFILE
  // в UI ownership без принятия spec или source от вызывающего.
  rpc DetachAccessResource(DetachAccessResourceRequest) returns (DetachAccessResourceResponse);
  // CopyAccessResource создаёт UI-owned копию Git-owned TEAM/ROLE/PROMPT_PROFILE
  // из авторитетной закреплённой версии источника.
  rpc CopyAccessResource(CopyAccessResourceRequest) returns (CopyAccessResourceResponse);
  // GetResource выполняет версионированную операцию ControlPlaneService.
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  // ListResources выполняет версионированную операцию ControlPlaneService.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  // SearchResources выполняет версионированную операцию ControlPlaneService.
  rpc SearchResources(SearchResourcesRequest) returns (SearchResourcesResponse);
  // SearchMemoryRecords выполняет версионированную операцию ControlPlaneService.
  rpc SearchMemoryRecords(SearchMemoryRecordsRequest) returns (SearchMemoryRecordsResponse);
  // ListAuditEvents выполняет версионированную операцию ControlPlaneService.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  // ListRuntimeIncidents возвращает typed watchdog evidence в owner boundary.
  rpc ListRuntimeIncidents(ListRuntimeIncidentsRequest) returns (ListRuntimeIncidentsResponse);
  // ListTombstones выполняет версионированную операцию ControlPlaneService.
  rpc ListTombstones(ListTombstonesRequest) returns (ListTombstonesResponse);
  // GetDiagnostics выполняет версионированную операцию ControlPlaneService.
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (GetDiagnosticsResponse);
  // ListOutboxFailures возвращает ограниченный terminal repair contour.
  rpc ListOutboxFailures(ListOutboxFailuresRequest) returns (ListOutboxFailuresResponse);
  // RepairOutboxEvent повторно открывает только exact заблокировавший predecessor.
  rpc RepairOutboxEvent(RepairOutboxEventRequest) returns (RepairOutboxEventResponse);

  // AdmitOwnerSession фиксирует current OIDC session revision и credential digest
  // после специализированного proof, не принимая actor/tenant/session из payload.
  rpc AdmitOwnerSession(AdmitOwnerSessionRequest) returns (AdmitOwnerSessionResponse);
  // RevokeOwnerSession закрывает только exact current browser session.
  rpc RevokeOwnerSession(RevokeOwnerSessionRequest) returns (RevokeOwnerSessionResponse);
  // PrepareGatewayPublicTLS сохраняет candidate как PENDING, не продвигая
  // обслуживаемое APPLIED generation.
  rpc PrepareGatewayPublicTLS(PrepareGatewayPublicTLSRequest) returns (PrepareGatewayPublicTLSResponse);
  // ConfirmGatewayPublicTLS продвигает только exact PENDING после local served
  // peer readback и оставляет predecessor в bounded PREVIOUS overlap.
  rpc ConfirmGatewayPublicTLS(ConfirmGatewayPublicTLSRequest) returns (ConfirmGatewayPublicTLSResponse);
  // CheckGatewayPublicTLS выполняет read-only exact served-state readback.
  rpc CheckGatewayPublicTLS(CheckGatewayPublicTLSRequest) returns (CheckGatewayPublicTLSResponse);

  // EnqueueTurn атомарно резервирует следующий порядковый номер FIFO сессии.
  rpc EnqueueTurn(EnqueueTurnRequest) returns (EnqueueTurnResponse);
  // ClaimTurn выдаёт одну попытку точной рабочей нагрузке и использует
  // ограниченную аренду.
  rpc ClaimTurn(ClaimTurnRequest) returns (ClaimTurnResponse);
  // RenewTurn продлевает только аренду текущей попытки, fence и поколения.
  rpc RenewTurn(RenewTurnRequest) returns (RenewTurnResponse);
  // ReportRuntimeProgress создаёт durable owner delivery, не завершая Turn.
  rpc ReportRuntimeProgress(ReportRuntimeProgressRequest) returns (ReportRuntimeProgressResponse);
  // CompleteTurn завершает только текущую аренду и фиксирует конечный исход.
  rpc CompleteTurn(CompleteTurnRequest) returns (CompleteTurnResponse);
  // RetryTurn выполняет версионированную операцию ControlPlaneService.
  rpc RetryTurn(RetryTurnRequest) returns (RetryTurnResponse);
  // CancelTurn выполняет версионированную операцию ControlPlaneService.
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  // ManageSession — единственный путь жизненного цикла SESSION; привязку
  // провайдера выбирает сервер.
  rpc ManageSession(ManageSessionRequest) returns (ManageSessionResponse);
  // BindSessionMCP закрепляет bot-service-owned session token как свежую
  // immutable credential binding exact control Session.
  rpc BindSessionMCP(BindSessionMCPRequest) returns (BindSessionMCPResponse);
  // ManageConversationLifecycle — закрытый Mattermost Channel/Thread
  // delete/restore/finalize path без доступа gateway к generic transition.
  rpc ManageConversationLifecycle(ManageConversationLifecycleRequest) returns (ManageConversationLifecycleResponse);
  // ManageMemoryRecord связывает область и владельца с проверенным actor.
  rpc ManageMemoryRecord(ManageMemoryRecordRequest) returns (ManageMemoryRecordResponse);
  // ManageWorkClaim связывает получение работы с точными процессом, сессией,
  // ходом, попыткой и рабочей нагрузкой.
  rpc ManageWorkClaim(ManageWorkClaimRequest) returns (ManageWorkClaimResponse);

  // ManageSchedule изменяет расписание только через закрытые действия сервера.
  rpc ManageSchedule(ManageScheduleRequest) returns (ManageScheduleResponse);
  // RunScheduleNow создаёт отдельную немедленную occurrence, не сдвигая
  // плановый watermark расписания.
  rpc RunScheduleNow(RunScheduleNowRequest) returns (RunScheduleNowResponse);
  // ClaimDueSchedules материализует наступившие QUEUED-запуски без запуска
  // среды исполнения.
  rpc ClaimDueSchedules(ClaimDueSchedulesRequest) returns (ClaimDueSchedulesResponse);
  // ClaimScheduleOccurrence выполняет версионированную операцию ControlPlaneService.
  rpc ClaimScheduleOccurrence(ClaimScheduleOccurrenceRequest) returns (ClaimScheduleOccurrenceResponse);
  // MaterializeScheduleOccurrence расходует одноразовую exact-occurrence capability.
  rpc MaterializeScheduleOccurrence(MaterializeScheduleOccurrenceRequest) returns (MaterializeScheduleOccurrenceResponse);
  // CompleteScheduleOccurrence выполняет версионированную операцию ControlPlaneService.
  rpc CompleteScheduleOccurrence(CompleteScheduleOccurrenceRequest) returns (CompleteScheduleOccurrenceResponse);
  // CancelScheduleOccurrence выполняет версионированную операцию ControlPlaneService.
  rpc CancelScheduleOccurrence(CancelScheduleOccurrenceRequest) returns (CancelScheduleOccurrenceResponse);
  // ListScheduleOccurrences выполняет версионированную операцию ControlPlaneService.
  rpc ListScheduleOccurrences(ListScheduleOccurrencesRequest) returns (ListScheduleOccurrencesResponse);
  // ResolveScheduleRecovery — единственный owner repair/cancel/skip path RECOVERY_BLOCKED.
  rpc ResolveScheduleRecovery(ResolveScheduleRecoveryRequest) returns (ResolveScheduleRecoveryResponse);

  // StartProcess выполняет версионированную операцию ControlPlaneService.
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  // CancelProcess выполняет версионированную операцию ControlPlaneService.
  rpc CancelProcess(CancelProcessRequest) returns (CancelProcessResponse);
  // CompleteProcess завершает процесс по авторитетному terminal-ходу.
  rpc CompleteProcess(CompleteProcessRequest) returns (CompleteProcessResponse);
  // RequestOwnerGate выполняет версионированную операцию ControlPlaneService.
  rpc RequestOwnerGate(RequestOwnerGateRequest) returns (RequestOwnerGateResponse);
  // ClaimOwnerGateDelivery выдаёт gateway одно ограниченное право доставки
  // сервером выбранной ожидающей карточки.
  rpc ClaimOwnerGateDelivery(ClaimOwnerGateDeliveryRequest) returns (ClaimOwnerGateDeliveryResponse);
  // ExpireOwnerGate автономно закрывает одну выбранную PostgreSQL
  // просроченную карточку и весь её execution graph.
  rpc ExpireOwnerGate(ExpireOwnerGateRequest) returns (ExpireOwnerGateResponse);
  // RecordOwnerGateDelivery фиксирует устойчивое подтверждение точной карточки,
  // принадлежащей серверу.
  rpc RecordOwnerGateDelivery(RecordOwnerGateDeliveryRequest) returns (RecordOwnerGateDeliveryResponse);
  // ClaimInteractionDelivery потребляет owner-produced durable work final/status/artifact path.
  rpc ClaimInteractionDelivery(ClaimInteractionDeliveryRequest) returns (ClaimInteractionDeliveryResponse);
  // IssueInteractionDeliveryReadbackGrant выдаёт и сохраняет exact delivery-scoped application credential.
  rpc IssueInteractionDeliveryReadbackGrant(IssueInteractionDeliveryReadbackGrantRequest) returns (IssueInteractionDeliveryReadbackGrantResponse);
  // ValidateInteractionDeliveryReadbackGrant проверяет durable issue/revocation state тем же owner path.
  rpc ValidateInteractionDeliveryReadbackGrant(ValidateInteractionDeliveryReadbackGrantRequest) returns (ValidateInteractionDeliveryReadbackGrantResponse);
  // RecordInteractionDelivery фиксирует exact provider receipt под lease/fence.
  rpc RecordInteractionDelivery(RecordInteractionDeliveryRequest) returns (RecordInteractionDeliveryResponse);
  // ResolveOwnerGate связывает решение с точными шлюзом, процессом, сессией,
  // ходом и попыткой.
  rpc ResolveOwnerGate(ResolveOwnerGateRequest) returns (ResolveOwnerGateResponse);

  // ListBackups возвращает безопасную owner-проекцию runtime archive evidence.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // GetBackup возвращает exact version backup без storage/worker authority.
  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse);
  // RestoreBackup создаёт отдельную server-owned restore operation.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  // GetRestoreOperation возвращает единый versioned readback restore graph.
  rpc GetRestoreOperation(GetRestoreOperationRequest) returns (GetRestoreOperationResponse);
  // ListRestoreOperations возвращает owner-scoped discovery/rejoin path,
  // включая фильтр по backup после потери HTTP Location.
  rpc ListRestoreOperations(ListRestoreOperationsRequest) returns (ListRestoreOperationsResponse);

  // RegisterArtifact выполняет версионированную операцию ControlPlaneService.
  rpc RegisterArtifact(RegisterArtifactRequest) returns (RegisterArtifactResponse);
  // RecordArtifactScan выполняет версионированную операцию ControlPlaneService.
  rpc RecordArtifactScan(RecordArtifactScanRequest) returns (RecordArtifactScanResponse);

  // ManageRoleImageRecipe — единственный owner path create/update/archive/restore/delete
  // и запуска сборки. Actor, tenant, owner, generation и policy назначает сервер.
  rpc ManageRoleImageRecipe(ManageRoleImageRecipeRequest) returns (ManageRoleImageRecipeResponse);
  // GetRoleImageRecipe возвращает владельцу exact version полной редактируемой
  // спецификации; secret references остаются ссылками, а значения не возвращаются.
  rpc GetRoleImageRecipe(GetRoleImageRecipeRequest) returns (GetRoleImageRecipeResponse);
  // ClaimImageBuild выдаёт builder одну exact fenced attempt без идентификаторов
  // из payload и возвращает секретный installation block только в этом ответе.
  rpc ClaimImageBuild(ClaimImageBuildRequest) returns (ClaimImageBuildResponse);
  // RenewImageBuild продлевает только current attempt/fence/grant generation.
  rpc RenewImageBuild(RenewImageBuildRequest) returns (RenewImageBuildResponse);
  // ReportImageBuildProgress фиксирует только bounded stage/progress без build input.
  rpc ReportImageBuildProgress(ReportImageBuildProgressRequest) returns (ReportImageBuildProgressResponse);
  // CompleteImageBuild закрепляет staging digest и provenance exact immutable tuple.
  rpc CompleteImageBuild(CompleteImageBuildRequest) returns (CompleteImageBuildResponse);
  // FailImageBuild закрывает current attempt безопасным error code без log payload.
  rpc FailImageBuild(FailImageBuildRequest) returns (FailImageBuildResponse);
  // ManageImageBuild — закрытый owner path cancel/retry/expiry/dead-letter.
  rpc ManageImageBuild(ManageImageBuildRequest) returns (ManageImageBuildResponse);
  // ClaimImageAdmission выдаёт independent admission workload exact staging tuple.
  rpc ClaimImageAdmission(ClaimImageAdmissionRequest) returns (ClaimImageAdmissionResponse);
  // RecordImageAdmission сохраняет SBOM/vulnerability/signature evidence.
  rpc RecordImageAdmission(RecordImageAdmissionRequest) returns (RecordImageAdmissionResponse);
  // ClaimImagePromotion выдаёт promotion workload новый fenced one-time claim
  // для server-selected accepted artifact; истёкший claim заменяется.
  rpc ClaimImagePromotion(ClaimImagePromotionRequest) returns (ClaimImagePromotionResponse);
  // AuthorizeImagePromotion атомарно расходует current claim до любого
  // pull-visible side effect и фиксирует durable exact publish authorization.
  rpc AuthorizeImagePromotion(AuthorizeImagePromotionRequest) returns (AuthorizeImagePromotionResponse);
  // CompleteImagePromotion принимает только предварительно сохранённую publish
  // authorization после exact promoted readback.
  rpc CompleteImagePromotion(CompleteImagePromotionRequest) returns (CompleteImagePromotionResponse);
  // GetRoleImageBuild выполняет авторитетный version-pinned readback без secret input.
  rpc GetRoleImageBuild(GetRoleImageBuildRequest) returns (GetRoleImageBuildResponse);
  // GetRuntimeRevision — авторитетное чтение закреплённой версии для
  // runtime-controller.
  rpc GetRuntimeRevision(GetRuntimeRevisionRequest) returns (GetRuntimeRevisionResponse);
  // RecordMemoryEmbedding фиксирует локальную перестраиваемую проекцию, а не
  // источник истины.
  rpc RecordMemoryEmbedding(RecordMemoryEmbeddingRequest) returns (RecordMemoryEmbeddingResponse);

  // ClaimRuntimeExecution материализует server-owned immutable snapshot для
  // точной попытки из проверенного runtime grant; request не принимает IDs.
  rpc ClaimRuntimeExecution(ClaimRuntimeExecutionRequest) returns (ClaimRuntimeExecutionResponse);
  // SetResourceRetentionPolicy атомарно создаёт следующую owner version.
  rpc SetResourceRetentionPolicy(SetResourceRetentionPolicyRequest) returns (SetResourceRetentionPolicyResponse);
  // RetireResourceRetentionPolicy закрывает exact current policy version.
  rpc RetireResourceRetentionPolicy(RetireResourceRetentionPolicyRequest) returns (RetireResourceRetentionPolicyResponse);
  // GetResourceRetentionPolicy читает current owner policy без local default.
  rpc GetResourceRetentionPolicy(GetResourceRetentionPolicyRequest) returns (GetResourceRetentionPolicyResponse);
  // HoldRuntimeRetention устанавливает server-owned manual/legal hold сессии.
  rpc HoldRuntimeRetention(HoldRuntimeRetentionRequest) returns (HoldRuntimeRetentionResponse);
  // ReleaseRuntimeRetention снимает exact versioned hold.
  rpc ReleaseRuntimeRetention(ReleaseRuntimeRetentionRequest) returns (ReleaseRuntimeRetentionResponse);
  // GetRuntimeExecution повторно читает snapshot только внутри проверенной boundary.
  rpc GetRuntimeExecution(GetRuntimeExecutionRequest) returns (GetRuntimeExecutionResponse);
  // GetRuntimeMaterialization подтверждает один exact execution-bound object
  // для mediation через interaction-gateway без S3 credential у runner.
  rpc GetRuntimeMaterialization(GetRuntimeMaterializationRequest) returns (GetRuntimeMaterializationResponse);
  // AuthorizeRuntimeOutput разрешает gateway один bounded content-addressed put
  // для exact active execution до обращения к private object store.
  rpc AuthorizeRuntimeOutput(AuthorizeRuntimeOutputRequest) returns (AuthorizeRuntimeOutputResponse);
  // RegisterRuntimeOutput атомарно закрепляет проверенный object readback как
  // server-owned Artifact exact execution; caller не назначает owner.
  rpc RegisterRuntimeOutput(RegisterRuntimeOutputRequest) returns (RegisterRuntimeOutputResponse);
  // AdmitRuntimeExecution выдаёт одну fenced lease точному runtime-controller.
  rpc AdmitRuntimeExecution(AdmitRuntimeExecutionRequest) returns (AdmitRuntimeExecutionResponse);
  // AuthorizeRuntimeRestoreEffect атомарно сверяет current restore generation
  // с durable revoke watermark и расходует exact effect slot до внешнего эффекта.
  rpc AuthorizeRuntimeRestoreEffect(AuthorizeRuntimeRestoreEffectRequest) returns (AuthorizeRuntimeRestoreEffectResponse);
  // HeartbeatRuntimeExecution продлевает только текущую lease/fence.
  rpc HeartbeatRuntimeExecution(HeartbeatRuntimeExecutionRequest) returns (HeartbeatRuntimeExecutionResponse);
  // RecordRuntimeIncident сохраняет bounded watchdog incident без смены authority.
  rpc RecordRuntimeIncident(RecordRuntimeIncidentRequest) returns (RecordRuntimeIncidentResponse);
  // CompleteRuntimeExecution фиксирует единственный terminal result/error.
  rpc CompleteRuntimeExecution(CompleteRuntimeExecutionRequest) returns (CompleteRuntimeExecutionResponse);
  // CancelRuntimeExecution закрывает весь graph исполнения одной owner transaction.
  rpc CancelRuntimeExecution(CancelRuntimeExecutionRequest) returns (CancelRuntimeExecutionResponse);
  // RetryRuntimeExecution закрывает прежнюю попытку и создаёт новую fenced attempt.
  rpc RetryRuntimeExecution(RetryRuntimeExecutionRequest) returns (RetryRuntimeExecutionResponse);
  // ManageRuntimeAction разрешает Stop/Retry только из проверенного interaction
  // callback и сам выбирает current Turn/RuntimeExecution tuple внутри owner boundary.
  rpc ManageRuntimeAction(ManageRuntimeActionRequest) returns (ManageRuntimeActionResponse);
  // RescheduleRuntimeExecution заменяет stale PENDING попытку свежими
  // attempt/RuntimeRevision/provider observation без мутации старого snapshot.
  rpc RescheduleRuntimeExecution(RescheduleRuntimeExecutionRequest) returns (RescheduleRuntimeExecutionResponse);
  // ExpireRuntimeExecution выбирает одну истёкшую lease по database clock.
  rpc ExpireRuntimeExecution(ExpireRuntimeExecutionRequest) returns (ExpireRuntimeExecutionResponse);
  // RecordRuntimeArchive закрепляет неизменяемые archive reference и checksum.
  rpc RecordRuntimeArchive(RecordRuntimeArchiveRequest) returns (RecordRuntimeArchiveResponse);
  // VerifyRuntimeRestore сохраняет независимое доказательство восстановления.
  rpc VerifyRuntimeRestore(VerifyRuntimeRestoreRequest) returns (VerifyRuntimeRestoreResponse);
  // BindRuntimeRestoreTarget одноразово связывает restore с exact новой PVC.
  rpc BindRuntimeRestoreTarget(BindRuntimeRestoreTargetRequest) returns (BindRuntimeRestoreTargetResponse);
  // CompleteRuntimeRehydrate потребляет restore assignment после durable proof
  // и до запуска role Pod.
  rpc CompleteRuntimeRehydrate(CompleteRuntimeRehydrateRequest) returns (CompleteRuntimeRehydrateResponse);
  // AuthorizeRuntimeCleanup выдаёт ровно одну bounded cleanup authorization.
  rpc AuthorizeRuntimeCleanup(AuthorizeRuntimeCleanupRequest) returns (AuthorizeRuntimeCleanupResponse);
  // ConsumeRuntimeCleanupAuthorization завершает ровно одну действующую authorization.
  rpc ConsumeRuntimeCleanupAuthorization(ConsumeRuntimeCleanupAuthorizationRequest) returns (ConsumeRuntimeCleanupAuthorizationResponse);
  // ExpireRuntimeCleanupAuthorization закрывает просроченную authorization по PostgreSQL clock.
  rpc ExpireRuntimeCleanupAuthorization(ExpireRuntimeCleanupAuthorizationRequest) returns (ExpireRuntimeCleanupAuthorizationResponse);

  // ResolveIntegrationSession возвращает server-owned execution tuple без IDs запроса.
  rpc ResolveIntegrationSession(ResolveIntegrationSessionRequest) returns (ResolveIntegrationSessionResponse);
  // SuspendForIntegrationApproval атомарно переводит точный graph в WAITING_EXTERNAL.
  rpc SuspendForIntegrationApproval(SuspendForIntegrationApprovalRequest) returns (SuspendForIntegrationApprovalResponse);
  // ApproveIntegrationInvocation фиксирует единственное положительное решение.
  rpc ApproveIntegrationInvocation(ApproveIntegrationInvocationRequest) returns (ApproveIntegrationInvocationResponse);
  // RejectIntegrationInvocation фиксирует отказ и один continuation turn.
  rpc RejectIntegrationInvocation(RejectIntegrationInvocationRequest) returns (RejectIntegrationInvocationResponse);
  // ExpireIntegrationInvocation использует только database clock и server state.
  rpc ExpireIntegrationInvocation(ExpireIntegrationInvocationRequest) returns (ExpireIntegrationInvocationResponse);
  // CancelIntegrationInvocation закрывает ожидающий или approved intent.
  rpc CancelIntegrationInvocation(CancelIntegrationInvocationRequest) returns (CancelIntegrationInvocationResponse);
  // BeginIntegrationExecution ограждает исполнение одобренного invocation.
  rpc BeginIntegrationExecution(BeginIntegrationExecutionRequest) returns (BeginIntegrationExecutionResponse);
  // CompleteIntegrationExecution фиксирует structured result и continuation.
  rpc CompleteIntegrationExecution(CompleteIntegrationExecutionRequest) returns (CompleteIntegrationExecutionResponse);
  // FailIntegrationExecution фиксирует structured error и continuation.
  rpc FailIntegrationExecution(FailIntegrationExecutionRequest) returns (FailIntegrationExecutionResponse);
  // GetIntegrationContinuation разрешает version-pinned structured rejoin по
  // проверенному current turn; request не принимает continuation IDs.
  rpc GetIntegrationContinuation(GetIntegrationContinuationRequest) returns (GetIntegrationContinuationResponse);
  // AcknowledgeIntegrationContinuation фиксирует одно server-owned rejoin ACK.
  rpc AcknowledgeIntegrationContinuation(AcknowledgeIntegrationContinuationRequest) returns (AcknowledgeIntegrationContinuationResponse);
  // CheckReadiness проверяет полномочия, PostgreSQL, кэш и издателя outbox.
  rpc CheckReadiness(CheckReadinessRequest) returns (CheckReadinessResponse);
}

// CreateProjectRequest описывает версионированное сообщение контракта control-plane.
message CreateProjectRequest {
  string idempotency_key = 1;
  string name = 2;
  ProjectSpec spec = 3;
}

// CreateProjectResponse описывает версионированное сообщение контракта control-plane.
message CreateProjectResponse {
  Resource project = 1;
}

// ListProjectsRequest описывает версионированное сообщение контракта control-plane.
message ListProjectsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

// ListProjectsResponse описывает версионированное сообщение контракта control-plane.
message ListProjectsResponse {
  repeated Resource projects = 1;
  string next_page_token = 2;
}

message UpdateProjectRequest {
  string idempotency_key = 1;
  string project_id = 2;
  uint64 expected_version = 3;
  string name = 4;
  ProjectSpec spec = 5;
}

message UpdateProjectResponse {
  Resource project = 1;
}

message DeleteProjectRequest {
  string idempotency_key = 1;
  string project_id = 2;
  uint64 expected_version = 3;
}

message DeleteProjectResponse {
  Resource project = 1;
}

// ResourceKind — закрытый перечень агрегатов, принадлежащих control-plane.
enum ResourceKind {
  // RESOURCE_KIND_UNSPECIFIED — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_UNSPECIFIED = 0;
  // RESOURCE_KIND_PROJECT — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_PROJECT = 1;
  // RESOURCE_KIND_TEAM — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_TEAM = 2;
  // RESOURCE_KIND_CHAT — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_CHAT = 3;
  // RESOURCE_KIND_ROLE — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_ROLE = 4;
  // RESOURCE_KIND_PROMPT_PROFILE — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_PROMPT_PROFILE = 5;
  // RESOURCE_KIND_CREDENTIAL_BINDING — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_CREDENTIAL_BINDING = 6;
  // RESOURCE_KIND_REPOSITORY_WORKSPACE — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_REPOSITORY_WORKSPACE = 7;
  // RESOURCE_KIND_INTEGRATION — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_INTEGRATION = 8;
  // RESOURCE_KIND_RUNTIME_REVISION — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_RUNTIME_REVISION = 9;
  // RESOURCE_KIND_SESSION — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_SESSION = 10;
  // RESOURCE_KIND_TURN — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_TURN = 11;
  // RESOURCE_KIND_PROCESS_RUN — значение закрытого перечисления ResourceKind.
  RESOURCE_KIND_PROCESS_RUN = 12;
