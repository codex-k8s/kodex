message ScheduledResultContract {
  string schema = 1;
  string path = 2;
  string format = 3;
  string schema_sha256 = 4;
  uint64 maximum_bytes = 5;
}

// EffectiveResourceRef описывает версионированное сообщение контракта control-plane.
message EffectiveResourceRef {
  ResourceKind kind = 1;
  string resource_id = 2;
  uint64 version = 3;
  string projection_sha256 = 4;
}

// SessionSpec описывает версионированное сообщение контракта control-plane.
message SessionSpec {
