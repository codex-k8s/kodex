// Точное поручение broker. AEAD AAD связывает draft ref/generation,
// project/secret/value type/expected digest из этого проверенного ответа.
message RuntimeSecretDraftWork {
  string operation_ref = 1;
  RuntimeSecretDraftOperationKind kind = 2;
  RuntimeSecretDraft draft = 3;
  string expected_content_sha256 = 4;
  string namespace = 5;
  string staged_secret_name = 6;
  string staged_secret_key = 7;
  int64 target_revision = 8;
  RuntimeSecretDraftEncryptedDescriptor encrypted = 9;
  string claimant_id = 10;
  int64 claim_generation = 11;
  google.protobuf.Timestamp lease_deadline = 12;
  google.protobuf.Timestamp expires_at = 13;
  // Staging принадлежит namespace broker; namespace=5 — runtime publication.
  string staged_namespace = 14;
  // Durable cleanup intent сохраняет exact UID/RV после удаления и потерянного ACK.
  RuntimeSecretMaterialization recovery_materialization = 15;
  RuntimeSecretDraftEncryptedDescriptor recovery_encrypted = 16;
}

