  rpc ClaimIntegrationInvocations(ClaimIntegrationInvocationsRequest) returns (ClaimIntegrationInvocationsResponse);
  rpc GetIntegrationInvocation(GetIntegrationInvocationRequest) returns (GetIntegrationInvocationResponse);
  rpc CompleteIntegrationInvocation(CompleteIntegrationInvocationRequest) returns (CompleteIntegrationInvocationResponse);
}

// SessionArchiveWorkService обслуживает только fenced lifecycle долговечного
// состояния Codex session. Workload не выбирает tenant, session, PVC или
// object key: все координаты назначает control-plane.
service SessionArchiveWorkService {
  rpc ClaimSessionArchiveTasks(ClaimSessionArchiveTasksRequest) returns (ClaimSessionArchiveTasksResponse);
  rpc RenewSessionArchiveTask(RenewSessionArchiveTaskRequest) returns (RenewSessionArchiveTaskResponse);
  rpc CompleteSessionSnapshot(CompleteSessionSnapshotRequest) returns (CompleteSessionSnapshotResponse);
  rpc CompleteSessionRestore(CompleteSessionRestoreRequest) returns (CompleteSessionRestoreResponse);
  rpc CompleteSessionPVCDeletion(CompleteSessionPVCDeletionRequest) returns (CompleteSessionPVCDeletionResponse);
  rpc CompleteSessionObjectDeletion(CompleteSessionObjectDeletionRequest) returns (CompleteSessionObjectDeletionResponse);
  rpc FailSessionArchiveTask(FailSessionArchiveTaskRequest) returns (FailSessionArchiveTaskResponse);
}

// InteractionWorkService обслуживает только необязательные каналы общения.
// Внешние channel/user/post ID являются locator metadata и никогда не
// определяют organization, Project, target или право Human Gate.
service InteractionWorkService {
  rpc ListInteractionSources(ListInteractionSourcesRequest) returns (ListInteractionSourcesResponse);
  rpc ClaimInteractionDeliveries(ClaimInteractionDeliveriesRequest) returns (ClaimInteractionDeliveriesResponse);
  rpc CompleteInteractionDelivery(CompleteInteractionDeliveryRequest) returns (CompleteInteractionDeliveryResponse);
  rpc AcceptInteractionMessage(AcceptInteractionMessageRequest) returns (AcceptInteractionMessageResponse);
}

// ProviderCredentialMaterializerService изолирует Codex app-server и право
// create immutable Kubernetes Secret от основного control-plane. Ни один ответ
// этого сервиса не содержит credential value.
service ProviderCredentialMaterializerService {
  rpc CheckProviderCredentialMaterializerReadiness(CheckProviderCredentialMaterializerReadinessRequest) returns (CheckProviderCredentialMaterializerReadinessResponse);
  rpc StartDeviceAuthorization(ProviderCredentialMaterializerServiceStartDeviceAuthorizationRequest) returns (ProviderCredentialMaterializerServiceStartDeviceAuthorizationResponse);
  rpc ObserveDeviceAuthorization(ProviderCredentialMaterializerServiceObserveDeviceAuthorizationRequest) returns (ProviderCredentialMaterializerServiceObserveDeviceAuthorizationResponse);
  rpc MaterializeAPIKey(ProviderCredentialMaterializerServiceMaterializeAPIKeyRequest) returns (ProviderCredentialMaterializerServiceMaterializeAPIKeyResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc DiscardProviderCredentialMaterialization(ProviderCredentialMaterializerServiceDiscardMaterializationRequest) returns (ProviderCredentialMaterializerServiceDiscardMaterializationResponse);
  // CleanupProviderCredential удаляет только exact credential material,
  // закреплённый durable task и текущим lease generation. Raw credential
  // отсутствует в запросе и ответе.
  rpc CleanupProviderCredential(ProviderCredentialMaterializerServiceCleanupProviderCredentialRequest) returns (ProviderCredentialMaterializerServiceCleanupProviderCredentialResponse);
}

