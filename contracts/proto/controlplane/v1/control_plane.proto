  ProviderCredentialBinding provider_credential = 1;
  google.protobuf.Timestamp expires_at = 2;
}

enum ManagedConfigurationSourceState {
  MANAGED_CONFIGURATION_SOURCE_STATE_UNSPECIFIED = 0;
  MANAGED_CONFIGURATION_SOURCE_STATE_QUEUED = 1;
  MANAGED_CONFIGURATION_SOURCE_STATE_CLAIMED = 2;
  MANAGED_CONFIGURATION_SOURCE_STATE_READY = 3;
  MANAGED_CONFIGURATION_SOURCE_STATE_SYNC_BLOCKED = 4;
  MANAGED_CONFIGURATION_SOURCE_STATE_DETACHED = 5;
}

// Публичная проекция без credential descriptor и содержимого файла.
message ManagedConfigurationGitSource {
  string ref = 1;
  int64 version = 2;
  int64 generation = 3;
  string connection_ref = 4;
  string provider_key = 5;
  string repository_ref = 6;
  string ref_name = 7;
  string path = 8;
  ManagedConfigurationSourceState state = 9;
  string accepted_commit_sha = 10;
  string accepted_content_sha256 = 11;
  string accepted_revision_ref = 12;
  google.protobuf.Timestamp synced_at = 13;
  ManagedConfigurationSourceFailure failure_code = 14;
}

message ManagedConfigurationGitSourceInput {
  string connection_ref = 1;
  int64 expected_connection_version = 2;
  string repository_ref = 3;
  string ref_name = 4;
  string path = 5;
  string content_format = 6;
}
message ConfigureRoleImageGitSourceRequest {
  MutationContext mutation = 1;
  string configuration_ref = 2;
  ManagedConfigurationGitSourceInput source = 3;
}
message ConfigureRoleImageGitSourceResponse { ManagedConfigurationSet configuration = 1; }
message ConfigureIntegrationDefinitionGitSourceRequest {
  MutationContext mutation = 1;
  string configuration_ref = 2;
  ManagedConfigurationGitSourceInput source = 3;
}
message ConfigureIntegrationDefinitionGitSourceResponse { ManagedConfigurationSet configuration = 1; }
message RefreshRoleImageGitSourceRequest {
  MutationContext mutation = 1;
  string configuration_ref = 2;
}
message RefreshRoleImageGitSourceResponse { ManagedConfigurationSet configuration = 1; }
message RefreshIntegrationDefinitionGitSourceRequest {
  MutationContext mutation = 1;
  string configuration_ref = 2;
}
message RefreshIntegrationDefinitionGitSourceResponse { ManagedConfigurationSet configuration = 1; }

message ManagedConfigurationSourceLease {
  string work_ref = 1;
  int64 source_generation = 2;
  int64 attempt = 3;
  int64 claim_generation = 4;
  string claimant = 5;
  string fence = 6;
  google.protobuf.Timestamp expires_at = 7;
}
// Private worker snapshot: locator и credential descriptor запрещены public DTO.
message ManagedConfigurationSourceWork {
  ManagedConfigurationSourceLease lease = 1;
  string source_ref = 2;
  string configuration_ref = 3;
  ManagedConfigurationKind kind = 4;
  string connection_ref = 5;
  int64 connection_version = 6;
  string definition_key = 7;
  string definition_version = 8;
  string definition_digest = 9;
  google.protobuf.Struct public_configuration = 10;
  IntegrationCredentialRevision credential_revision = 11;
  string repository_ref = 12;
  string ref_name = 13;
  string path = 14;
  string previous_commit_sha = 15;
  string content_format = 16;
  int32 maximum_content_bytes = 17;
  google.protobuf.Timestamp deadline = 18;
}
message ClaimManagedConfigurationSourceWorkRequest {
  string claimant = 1;
  int32 limit = 2;
}
message ClaimManagedConfigurationSourceWorkResponse { repeated ManagedConfigurationSourceWork work = 1; }
message RenewManagedConfigurationSourceWorkRequest { ManagedConfigurationSourceLease lease = 1; }
message RenewManagedConfigurationSourceWorkResponse { ManagedConfigurationSourceLease lease = 1; }
enum ManagedConfigurationSourceAncestry {
  MANAGED_CONFIGURATION_SOURCE_ANCESTRY_UNSPECIFIED = 0;
  MANAGED_CONFIGURATION_SOURCE_ANCESTRY_INITIAL = 1;
  MANAGED_CONFIGURATION_SOURCE_ANCESTRY_UNCHANGED = 2;
  MANAGED_CONFIGURATION_SOURCE_ANCESTRY_FAST_FORWARD = 3;
}
enum ManagedConfigurationSourceFailure {
  MANAGED_CONFIGURATION_SOURCE_FAILURE_UNSPECIFIED = 0;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_UNAVAILABLE = 1;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_CREDENTIAL_REJECTED = 2;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_ACCESS_DENIED = 3;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_NOT_FOUND = 4;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_DIVERGED = 5;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_CONTENT_INVALID = 6;
  MANAGED_CONFIGURATION_SOURCE_FAILURE_RESPONSE_INVALID = 7;
}
message CompleteManagedConfigurationSourceWorkRequest {
  ManagedConfigurationSourceLease lease = 1;
  string commit_sha = 2;
  string content_sha256 = 3;
  bytes content = 4;
  ManagedConfigurationSourceAncestry ancestry = 5;
}
message CompleteManagedConfigurationSourceWorkResponse { ManagedConfigurationGitSource source = 1; }
message FailManagedConfigurationSourceWorkRequest {
  ManagedConfigurationSourceLease lease = 1;
  ManagedConfigurationSourceFailure failure_code = 2;
}
message FailManagedConfigurationSourceWorkResponse { ManagedConfigurationGitSource source = 1; }
