  BACKUP_STATE_UNSPECIFIED = 0;
  BACKUP_STATE_VERIFYING = 1;
  BACKUP_STATE_RETENTION_PENDING = 2;
  BACKUP_STATE_AVAILABLE = 3;
  BACKUP_STATE_RESTORING = 4;
  BACKUP_STATE_RESTORED = 5;
  BACKUP_STATE_EXPIRED = 6;
  BACKUP_STATE_UNAVAILABLE = 7;
  BACKUP_STATE_RESTORE_FAILED = 8;
  BACKUP_STATE_RESTORE_CANCELLED = 9;
  BACKUP_STATE_RESTORE_EXPIRED = 10;
}

// Backup — безопасная проекция immutable runtime archive. Storage locator,
// credential, worker proof/evidence и grant намеренно отсутствуют.
message Backup {
  string backup_id = 1;
  uint64 source_version = 2;
  string source_runtime_revision_sha256 = 3;
  string source_immutable_input_sha256 = 4;
  string archive_sha256 = 5;
  string provenance_sha256 = 6;
  BackupState state = 7;
  string scope = 8;
  string scope_id = 9;
  bool restorable = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp available_at = 12;
  google.protobuf.Timestamp retain_until = 13;
  google.protobuf.Timestamp updated_at = 14;
  string restore_operation_id = 15;
  // version — монотонная версия публичной проекции, отдельная от immutable
  // source_version. Она меняется вместе с generation/target lifecycle.
  uint64 version = 16;
}

