  string continuation_gate_id = 26;
  string continuation_turn_id = 27;
  uint64 continuation_turn_version = 28;
  uint32 continuation_attempt = 29;
  string continuation_runtime_revision_id = 30;
  uint64 continuation_runtime_revision_version = 31;
  string continuation_input_sha256 = 32;
  string owner_feedback_sha256 = 33;
  string current_session_id = 34;
  uint64 current_session_version = 35;
  string current_turn_id = 36;
  uint64 current_turn_version = 37;
  uint32 current_attempt = 38;
  string current_runtime_revision_id = 39;
  uint64 current_runtime_revision_version = 40;
