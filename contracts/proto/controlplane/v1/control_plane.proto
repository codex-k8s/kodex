  string mattermost_channel_id = 20;
  string mattermost_root_post_id = 21;
  google.protobuf.Timestamp delivered_at = 22;
  google.protobuf.Timestamp delivery_claim_expires_at = 23;
  string schedule_id = 24;
  string occurrence_id = 25;
  string decision_receipt_sha256 = 26;
  string continuation_turn_id = 27;
