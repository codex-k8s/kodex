  uint64 agent_session_binding_version = 8;
  string agent_session_binding_sha256 = 9;
}

// TurnSpec описывает версионированное сообщение контракта control-plane.
message TurnSpec {
  string session_id = 1;
  uint64 sequence = 2;
  string source_ref = 3;
  string prompt_artifact_id = 4;
  string runtime_revision_id = 5;
  string process_run_id = 6;
  uint32 attempt = 7;
  string outcome = 8;
  string result_artifact_id = 9;
  string effective_input_sha256 = 10;
  string predecessor_turn_id = 11;
  string owner_feedback = 12;
  string owner_feedback_gate_id = 13;
  uint64 owner_feedback_gate_version = 14;
  string owner_feedback_sha256 = 15;
  int64 agent_session_turn_id = 16;
  string agent_run_id = 17;
  uint64 agent_turn_binding_version = 18;
  string agent_turn_binding_sha256 = 19;
  // result_artifact_version фиксирует версию результата в owner-транзакции завершения.
  uint64 result_artifact_version = 20;
  // result_artifact_sha256 фиксирует digest той же версии результата.
  string result_artifact_sha256 = 21;
  repeated EffectiveArtifactRef input_artifacts = 22;
  ScheduledResultContract scheduled_result_contract = 23;
  // Restore binding назначается только специализированной owner-командой.
  string restore_operation_id = 24;
  string restore_source_execution_id = 25;
  uint64 restore_source_version = 26;
  string restore_source_archive_sha256 = 27;
  string restore_source_provenance_sha256 = 28;
  uint64 restore_operation_generation = 29;
  // restore_source_authority_sha256 — digest полного server-owned source
  // locator/version/fence/proof tuple; приватные locator значения не выдаются.
  string restore_source_authority_sha256 = 30;
}

message EffectiveArtifactRef {
  string artifact_id = 1;
  uint64 version = 2;
  string sha256 = 3;
  string relative_path = 4;
  string media_type = 5;
  uint64 size_bytes = 6;
