syntax = "proto3";

package controlplane.v1;

option go_package = "github.com/codex-k8s/matter-codex/libs/go/controlplaneapi/gen/controlplane/v1;controlplanev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Control-plane является единственным владельцем web-first предметной модели.
// Actor, organization и permissions поступают только из проверенного transport
// context и никогда не выбираются полями этих запросов.

service PlatformQueryService {
  rpc GetBootstrapState(GetBootstrapStateRequest) returns (GetBootstrapStateResponse);
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc ListPlatformCapabilities(ListPlatformCapabilitiesRequest) returns (ListPlatformCapabilitiesResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjectMemberships(ListProjectMembershipsRequest) returns (ListProjectMembershipsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);
  rpc ListRunEvents(ListRunEventsRequest) returns (ListRunEventsResponse);
  rpc ListOwnerGates(ListOwnerGatesRequest) returns (ListOwnerGatesResponse);
  rpc GetOwnerGate(GetOwnerGateRequest) returns (GetOwnerGateResponse);
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc ListIntegrationDefinitions(ListIntegrationDefinitionsRequest) returns (ListIntegrationDefinitionsResponse);
  rpc ListIntegrationConnections(ListIntegrationConnectionsRequest) returns (ListIntegrationConnectionsResponse);
  rpc GetIntegrationConnection(GetIntegrationConnectionRequest) returns (GetIntegrationConnectionResponse);
  rpc GetAdministration(GetAdministrationRequest) returns (GetAdministrationResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

service PlatformCommandService {
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (CompleteOnboardingResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc AddProjectMembership(AddProjectMembershipRequest) returns (AddProjectMembershipResponse);
  rpc ChangeProjectMembership(ChangeProjectMembershipRequest) returns (ChangeProjectMembershipResponse);
  rpc RemoveProjectMembership(RemoveProjectMembershipRequest) returns (RemoveProjectMembershipResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc SetAgentEnabled(SetAgentEnabledRequest) returns (SetAgentEnabledResponse);
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
  rpc CreateInstructionDraft(CreateInstructionDraftRequest) returns (CreateInstructionDraftResponse);
  rpc ValidateInstructionDraft(ValidateInstructionDraftRequest) returns (ValidateInstructionDraftResponse);
  rpc PublishInstructionDraft(PublishInstructionDraftRequest) returns (PublishInstructionDraftResponse);
  rpc RollbackInstructions(RollbackInstructionsRequest) returns (RollbackInstructionsResponse);
  rpc ChangeAgentCapability(ChangeAgentCapabilityRequest) returns (ChangeAgentCapabilityResponse);
  rpc ChangeAgentIntegrationGrant(ChangeAgentIntegrationGrantRequest) returns (ChangeAgentIntegrationGrantResponse);
  rpc ChangeAgentKnowledgeBinding(ChangeAgentKnowledgeBindingRequest) returns (ChangeAgentKnowledgeBindingResponse);
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc UpdateWorkflowDraft(UpdateWorkflowDraftRequest) returns (UpdateWorkflowDraftResponse);
  rpc ValidateWorkflowDraft(ValidateWorkflowDraftRequest) returns (ValidateWorkflowDraftResponse);
  rpc PublishWorkflowDraft(PublishWorkflowDraftRequest) returns (PublishWorkflowDraftResponse);
  rpc ArchiveWorkflow(ArchiveWorkflowRequest) returns (ArchiveWorkflowResponse);
  rpc LaunchRun(LaunchRunRequest) returns (LaunchRunResponse);
  rpc AddSessionTurn(AddSessionTurnRequest) returns (AddSessionTurnResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc RetryRun(RetryRunRequest) returns (RetryRunResponse);
  rpc ResolveOwnerGate(ResolveOwnerGateRequest) returns (ResolveOwnerGateResponse);
  rpc UploadArtifact(stream UploadArtifactRequest) returns (UploadArtifactResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream DownloadArtifactResponse);
  rpc ChangeArtifactBinding(ChangeArtifactBindingRequest) returns (ChangeArtifactBindingResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (SetScheduleEnabledResponse);
  rpc CreateIntegrationConnection(CreateIntegrationConnectionRequest) returns (CreateIntegrationConnectionResponse);
  rpc TestIntegrationConnection(TestIntegrationConnectionRequest) returns (TestIntegrationConnectionResponse);
  rpc SetIntegrationConnectionEnabled(SetIntegrationConnectionEnabledRequest) returns (SetIntegrationConnectionEnabledResponse);
  rpc ChangeIntegrationGrant(ChangeIntegrationGrantRequest) returns (ChangeIntegrationGrantResponse);
}

service SystemAssistantService {
  rpc GetSystemAssistant(GetSystemAssistantRequest) returns (GetSystemAssistantResponse);
  rpc ListAssistantConversations(ListAssistantConversationsRequest) returns (ListAssistantConversationsResponse);
  rpc CreateAssistantConversation(CreateAssistantConversationRequest) returns (CreateAssistantConversationResponse);
  rpc AddAssistantTurn(AddAssistantTurnRequest) returns (AddAssistantTurnResponse);
  rpc ApplyAssistantPlan(ApplyAssistantPlanRequest) returns (ApplyAssistantPlanResponse);
  rpc UpdateAssistantOwnerInstructions(UpdateAssistantOwnerInstructionsRequest) returns (UpdateAssistantOwnerInstructionsResponse);
  rpc RecoverSystemAssistant(RecoverSystemAssistantRequest) returns (RecoverSystemAssistantResponse);
}

service RuntimeWorkService {
  rpc ClaimExecution(ClaimExecutionRequest) returns (ClaimExecutionResponse);
  rpc RenewExecution(RenewExecutionRequest) returns (RenewExecutionResponse);
  rpc ReportExecutionProgress(ReportExecutionProgressRequest) returns (ReportExecutionProgressResponse);
  rpc CompleteExecution(CompleteExecutionRequest) returns (CompleteExecutionResponse);
  rpc DelegateExecution(DelegateExecutionRequest) returns (DelegateExecutionResponse);
  rpc DeliverCallback(DeliverCallbackRequest) returns (DeliverCallbackResponse);
  rpc ReconcileWarmRuntime(ReconcileWarmRuntimeRequest) returns (ReconcileWarmRuntimeResponse);
  rpc ReportWarmRuntime(ReportWarmRuntimeRequest) returns (ReportWarmRuntimeResponse);
  rpc ClaimDueSchedules(ClaimDueSchedulesRequest) returns (ClaimDueSchedulesResponse);
  rpc MaterializeScheduleOccurrence(MaterializeScheduleOccurrenceRequest) returns (MaterializeScheduleOccurrenceResponse);
  rpc CompleteScheduleOccurrence(CompleteScheduleOccurrenceRequest) returns (CompleteScheduleOccurrenceResponse);
  rpc ResolveIntegrationInvocation(ResolveIntegrationInvocationRequest) returns (ResolveIntegrationInvocationResponse);
  rpc CompleteIntegrationInvocation(CompleteIntegrationInvocationRequest) returns (CompleteIntegrationInvocationResponse);
}

message MutationContext {
  string idempotency_key = 1;
  optional int64 expected_version = 2;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
}

enum PlatformRole {
  PLATFORM_ROLE_UNSPECIFIED = 0;
  PLATFORM_ROLE_OWNER = 1;
  PLATFORM_ROLE_ADMINISTRATOR = 2;
  PLATFORM_ROLE_OPERATOR = 3;
  PLATFORM_ROLE_MEMBER = 4;
  PLATFORM_ROLE_AUDITOR = 5;
}

enum ProjectPermission {
  PROJECT_PERMISSION_UNSPECIFIED = 0;
  PROJECT_PERMISSION_VIEW = 1;
  PROJECT_PERMISSION_MANAGE = 2;
  PROJECT_PERMISSION_MANAGE_MEMBERS = 3;
  PROJECT_PERMISSION_MANAGE_AGENTS = 4;
  PROJECT_PERMISSION_MANAGE_WORKFLOWS = 5;
  PROJECT_PERMISSION_LAUNCH_RUNS = 6;
  PROJECT_PERMISSION_CANCEL_RUNS = 7;
  PROJECT_PERMISSION_RESOLVE_GATES = 8;
  PROJECT_PERMISSION_MANAGE_ARTIFACTS = 9;
  PROJECT_PERMISSION_MANAGE_SCHEDULES = 10;
  PROJECT_PERMISSION_MANAGE_INTEGRATIONS = 11;
  PROJECT_PERMISSION_VIEW_AUDIT = 12;
}

enum NextAction {
  NEXT_ACTION_UNSPECIFIED = 0;
  NEXT_ACTION_OPEN = 1;
  NEXT_ACTION_EDIT = 2;
  NEXT_ACTION_ARCHIVE = 3;
  NEXT_ACTION_ENABLE = 4;
  NEXT_ACTION_DISABLE = 5;
  NEXT_ACTION_VALIDATE = 6;
  NEXT_ACTION_PUBLISH = 7;
  NEXT_ACTION_ROLLBACK = 8;
  NEXT_ACTION_LAUNCH = 9;
  NEXT_ACTION_ADD_TURN = 10;
  NEXT_ACTION_CANCEL = 11;
  NEXT_ACTION_RETRY = 12;
  NEXT_ACTION_RESOLVE_GATE = 13;
  NEXT_ACTION_DOWNLOAD = 14;
  NEXT_ACTION_BIND = 15;
  NEXT_ACTION_TEST = 16;
  NEXT_ACTION_REVOKE = 17;
  NEXT_ACTION_APPLY_PLAN = 18;
  NEXT_ACTION_RECOVER = 19;
}

enum EntityLifecycle {
  ENTITY_LIFECYCLE_UNSPECIFIED = 0;
  ENTITY_LIFECYCLE_DRAFT = 1;
  ENTITY_LIFECYCLE_ACTIVE = 2;
  ENTITY_LIFECYCLE_ARCHIVED = 3;
}

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_DRAFT = 1;
  AGENT_STATE_READY = 2;
  AGENT_STATE_RUNNING = 3;
  AGENT_STATE_DISABLED = 4;
  AGENT_STATE_ARCHIVED = 5;
}

enum InstructionState {
  INSTRUCTION_STATE_UNSPECIFIED = 0;
  INSTRUCTION_STATE_DRAFT = 1;
  INSTRUCTION_STATE_VALID = 2;
  INSTRUCTION_STATE_INVALID = 3;
  INSTRUCTION_STATE_PUBLISHED = 4;
}

enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_DRAFT = 1;
  WORKFLOW_STATE_VALID = 2;
  WORKFLOW_STATE_PUBLISHED = 3;
  WORKFLOW_STATE_ARCHIVED = 4;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_WAITING_HUMAN = 3;
  RUN_STATE_CANCELLING = 4;
  RUN_STATE_SUCCEEDED = 5;
  RUN_STATE_FAILED = 6;
  RUN_STATE_CANCELLED = 7;
}

enum RunSource {
  RUN_SOURCE_UNSPECIFIED = 0;
  RUN_SOURCE_CONTROL_CENTER = 1;
  RUN_SOURCE_SYSTEM_ASSISTANT = 2;
  RUN_SOURCE_SCHEDULE = 3;
  RUN_SOURCE_INTEGRATION = 4;
  RUN_SOURCE_AGENT_DELEGATION = 5;
  RUN_SOURCE_MATTERMOST = 6;
}

enum RunNodeType {
  RUN_NODE_TYPE_UNSPECIFIED = 0;
  RUN_NODE_TYPE_ROOT_PROCESS = 1;
  RUN_NODE_TYPE_AGENT_EXECUTION = 2;
  RUN_NODE_TYPE_HUMAN_GATE = 3;
  RUN_NODE_TYPE_EXTERNAL_ACTION = 4;
}

enum RunNodeState {
  RUN_NODE_STATE_UNSPECIFIED = 0;
  RUN_NODE_STATE_QUEUED = 1;
  RUN_NODE_STATE_RUNNING = 2;
  RUN_NODE_STATE_WAITING = 3;
  RUN_NODE_STATE_SUCCEEDED = 4;
  RUN_NODE_STATE_FAILED = 5;
  RUN_NODE_STATE_CANCELLED = 6;
  RUN_NODE_STATE_SKIPPED = 7;
}

enum RunEdgeType {
  RUN_EDGE_TYPE_UNSPECIFIED = 0;
  RUN_EDGE_TYPE_DELEGATED_TO = 1;
  RUN_EDGE_TYPE_CALLBACK_TO = 2;
  RUN_EDGE_TYPE_RETRY_OF = 3;
  RUN_EDGE_TYPE_CONTINUES = 4;
  RUN_EDGE_TYPE_WAITING_FOR = 5;
}

enum RunEventType {
  RUN_EVENT_TYPE_UNSPECIFIED = 0;
  RUN_EVENT_TYPE_RUN_CREATED = 1;
  RUN_EVENT_TYPE_RUN_STATE_CHANGED = 2;
  RUN_EVENT_TYPE_NODE_ADDED = 3;
  RUN_EVENT_TYPE_NODE_STATE_CHANGED = 4;
  RUN_EVENT_TYPE_EDGE_ADDED = 5;
  RUN_EVENT_TYPE_TURN_QUEUED = 6;
  RUN_EVENT_TYPE_TURN_STARTED = 7;
  RUN_EVENT_TYPE_TURN_PROGRESS = 8;
  RUN_EVENT_TYPE_TURN_COMPLETED = 9;
  RUN_EVENT_TYPE_DELEGATION_CREATED = 10;
  RUN_EVENT_TYPE_CALLBACK_DELIVERED = 11;
  RUN_EVENT_TYPE_OWNER_GATE_OPENED = 12;
  RUN_EVENT_TYPE_OWNER_GATE_RESOLVED = 13;
  RUN_EVENT_TYPE_ARTIFACT_AVAILABLE = 14;
  RUN_EVENT_TYPE_INCIDENT_LINKED = 15;
}

enum OwnerGateState {
  OWNER_GATE_STATE_UNSPECIFIED = 0;
  OWNER_GATE_STATE_OPEN = 1;
  OWNER_GATE_STATE_APPROVED = 2;
  OWNER_GATE_STATE_REJECTED = 3;
  OWNER_GATE_STATE_CHANGES_REQUESTED = 4;
  OWNER_GATE_STATE_CANCELLED = 5;
  OWNER_GATE_STATE_EXPIRED = 6;
}

enum OwnerGateDecision {
  OWNER_GATE_DECISION_UNSPECIFIED = 0;
  OWNER_GATE_DECISION_APPROVE = 1;
  OWNER_GATE_DECISION_REJECT = 2;
  OWNER_GATE_DECISION_REQUEST_CHANGES = 3;
  OWNER_GATE_DECISION_CANCEL = 4;
}

enum ArtifactScanState {
  ARTIFACT_SCAN_STATE_UNSPECIFIED = 0;
  ARTIFACT_SCAN_STATE_PENDING = 1;
  ARTIFACT_SCAN_STATE_SCANNING = 2;
  ARTIFACT_SCAN_STATE_CLEAN = 3;
  ARTIFACT_SCAN_STATE_QUARANTINED = 4;
  ARTIFACT_SCAN_STATE_FAILED = 5;
}

enum ScheduleState {
  SCHEDULE_STATE_UNSPECIFIED = 0;
  SCHEDULE_STATE_ACTIVE = 1;
  SCHEDULE_STATE_PAUSED = 2;
  SCHEDULE_STATE_NEEDS_ATTENTION = 3;
  SCHEDULE_STATE_ARCHIVED = 4;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_NOT_CONNECTED = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_UNAVAILABLE = 4;
  CONNECTION_STATE_DISABLED = 5;
}

enum AssistantRuntimeState {
  ASSISTANT_RUNTIME_STATE_UNSPECIFIED = 0;
  ASSISTANT_RUNTIME_STATE_PROVISIONING = 1;
  ASSISTANT_RUNTIME_STATE_READY = 2;
  ASSISTANT_RUNTIME_STATE_BUSY = 3;
  ASSISTANT_RUNTIME_STATE_RECOVERING = 4;
  ASSISTANT_RUNTIME_STATE_FAILED = 5;
}

message UserSummary {
  string ref = 1;
  string display_name = 2;
  string email_hint = 3;
}

message Membership {
  string ref = 1;
  int64 version = 2;
  UserSummary user = 3;
  PlatformRole platform_role = 4;
  repeated ProjectPermission project_permissions = 5;
  bool active = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated NextAction next_actions = 8;
}

message Project {
  string ref = 1;
  int64 version = 2;
  string name = 3;
  string purpose = 4;
  string language = 5;
  EntityLifecycle lifecycle = 6;
  int32 agent_count = 7;
  int32 workflow_count = 8;
  int32 active_run_count = 9;
  int32 pending_gate_count = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  repeated NextAction next_actions = 13;
}

message PlatformCapability {
  string key = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  bool available_without_integration = 5;
}

message RuntimeSelection {
  string ref = 1;
  string name = 2;
  string revision = 3;
  bool ready = 4;
}

message InstructionVersion {
  string ref = 1;
  int64 version = 2;
  int32 revision = 3;
  InstructionState state = 4;
  string content = 5;
  repeated string validation_messages = 6;
  UserSummary changed_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp published_at = 9;
}

message Agent {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string name = 4;
  string purpose = 5;
  string role_description = 6;
  string avatar_url = 7;
  AgentState state = 8;
  bool enabled = 9;
  bool system = 10;
  RuntimeSelection runtime = 11;
  InstructionVersion published_instructions = 12;
  InstructionVersion draft_instructions = 13;
  repeated PlatformCapability capabilities = 14;
  repeated string integration_grant_refs = 15;
  repeated string knowledge_artifact_refs = 16;
  string current_activity = 17;
  google.protobuf.Timestamp updated_at = 18;
  repeated NextAction next_actions = 19;
}

message WorkflowInputField {
  string key = 1;
  string label = 2;
  string description = 3;
  string value_type = 4;
  bool required = 5;
  repeated string options = 6;
}

message WorkflowStep {
  string ref = 1;
  int32 position = 2;
  string name = 3;
  string purpose = 4;
  string agent_ref = 5;
  bool parallel = 6;
  int32 parallel_group = 7;
  int32 timeout_seconds = 8;
  string expected_result = 9;
  bool human_gate = 10;
  repeated OwnerGateDecision gate_decisions = 11;
  repeated string required_capability_keys = 12;
}

message WorkflowVersion {
  string ref = 1;
  int64 version = 2;
  int32 revision = 3;
  WorkflowState state = 4;
  string name = 5;
  string purpose = 6;
  string coordinator_agent_ref = 7;
  repeated WorkflowInputField input_fields = 8;
  repeated WorkflowStep steps = 9;
  int32 max_concurrency = 10;
  int32 timeout_seconds = 11;
  string completion_criteria = 12;
  repeated string validation_messages = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp published_at = 15;
}

message Workflow {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string name = 4;
  string purpose = 5;
  WorkflowState state = 6;
  WorkflowVersion published_version = 7;
  WorkflowVersion draft_version = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated NextAction next_actions = 10;
}

message RunTarget {
  oneof target {
    string agent_ref = 1;
    string workflow_ref = 2;
  }
  string display_name = 3;
  int64 target_version = 4;
}

message Run {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string session_ref = 4;
  string root_run_ref = 5;
  string parent_run_ref = 6;
  RunTarget target = 7;
  string title = 8;
  string input_summary = 9;
  RunState state = 10;
  RunSource source = 11;
  UserSummary initiator = 12;
  int32 attempt = 13;
  int64 graph_revision = 14;
  int64 last_event_sequence = 15;
  string current_activity = 16;
  string result_summary = 17;
  string safe_error_code = 18;
  string safe_error_message = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp started_at = 21;
  google.protobuf.Timestamp finished_at = 22;
  repeated NextAction next_actions = 23;
}

message RunNode {
  string ref = 1;
  string run_ref = 2;
  string parent_node_ref = 3;
  RunNodeType type = 4;
  RunNodeState state = 5;
  string display_name = 6;
  string role = 7;
  string agent_ref = 8;
  string turn_ref = 9;
  int32 attempt = 10;
  string input_summary = 11;
  string progress_summary = 12;
  repeated string integration_names = 13;
  repeated string artifact_refs = 14;
  repeated string child_run_refs = 15;
  string callback_summary = 16;
  string safe_error_code = 17;
  string safe_error_message = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp started_at = 20;
  google.protobuf.Timestamp finished_at = 21;
  repeated NextAction next_actions = 22;
}

message RunEdge {
  string ref = 1;
  string run_ref = 2;
  string source_node_ref = 3;
  string target_node_ref = 4;
  RunEdgeType type = 5;
  string label = 6;
}

message RunEvent {
  string ref = 1;
  string run_ref = 2;
  int64 sequence = 3;
  RunEventType type = 4;
  string node_ref = 5;
  string edge_ref = 6;
  string gate_ref = 7;
  string artifact_ref = 8;
  string summary = 9;
  string progress = 10;
  RunState run_state = 11;
  RunNodeState node_state = 12;
  google.protobuf.Timestamp occurred_at = 13;
}

message RunGraph {
  string run_ref = 1;
  int64 revision = 2;
  int64 sequence = 3;
  repeated RunNode nodes = 4;
  repeated RunEdge edges = 5;
}

message OwnerGate {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string run_ref = 4;
  string node_ref = 5;
  string title = 6;
  string context_summary = 7;
  string consequences_summary = 8;
  UserSummary requested_by = 9;
  OwnerGateState state = 10;
  repeated OwnerGateDecision allowed_decisions = 11;
  OwnerGateDecision decision = 12;
  string decision_comment = 13;
  UserSummary decided_by = 14;
  google.protobuf.Timestamp opened_at = 15;
  google.protobuf.Timestamp expires_at = 16;
  google.protobuf.Timestamp decided_at = 17;
  repeated string artifact_refs = 18;
  repeated NextAction next_actions = 19;
}

message Artifact {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string run_ref = 4;
  string session_ref = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  ArtifactScanState scan_state = 9;
  string source = 10;
  int32 revision = 11;
  repeated string agent_bindings = 12;
  bool preview_available = 13;
  google.protobuf.Timestamp created_at = 14;
  repeated NextAction next_actions = 15;
}

message Schedule {
  string ref = 1;
  int64 version = 2;
  string project_ref = 3;
  string name = 4;
  RunTarget target = 5;
  ScheduleState state = 6;
  string preset = 7;
  string cron_expression = 8;
  string timezone = 9;
  google.protobuf.Struct input = 10;
  string session_policy = 11;
  string notification_policy = 12;
  google.protobuf.Timestamp next_run_at = 13;
  string last_outcome = 14;
  repeated NextAction next_actions = 15;
}

message IntegrationCapability {
  string key = 1;
  string name = 2;
  string description = 3;
  string risk = 4;
  bool approval_required = 5;
}

message IntegrationDefinition {
  string key = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  bool built_in = 5;
  bool available = 6;
  repeated IntegrationCapability capabilities = 7;
}

message IntegrationGrant {
  string ref = 1;
  int64 version = 2;
  string connection_ref = 3;
  string capability_key = 4;
  string agent_ref = 5;
  string workflow_ref = 6;
  bool enabled = 7;
  google.protobuf.Timestamp created_at = 8;
}

message IntegrationConnection {
  string ref = 1;
  int64 version = 2;
  string definition_key = 3;
  string name = 4;
  ConnectionState state = 5;
  bool credentials_configured = 6;
  string credentials_hint = 7;
  google.protobuf.Timestamp last_tested_at = 8;
  string last_test_outcome = 9;
  repeated IntegrationCapability capabilities = 10;
  repeated IntegrationGrant grants = 11;
  repeated NextAction next_actions = 12;
}

message AssistantPlanOperation {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_CREATE_PROJECT = 1;
    TYPE_CREATE_AGENT = 2;
    TYPE_CREATE_WORKFLOW = 3;
    TYPE_CHANGE_CAPABILITY = 4;
    TYPE_CHANGE_INTEGRATION_GRANT = 5;
    TYPE_CREATE_SCHEDULE = 6;
    TYPE_LAUNCH_RUN = 7;
  }
  string ref = 1;
  Type type = 2;
  string title = 3;
  string summary = 4;
  google.protobuf.Struct bounded_input = 5;
  bool permitted = 6;
  string unavailable_reason = 7;
}

message AssistantPlan {
  string ref = 1;
  int64 version = 2;
  string conversation_ref = 3;
  string project_ref = 4;
  repeated AssistantPlanOperation operations = 5;
  string audit_summary = 6;
  bool applied = 7;
  repeated NextAction next_actions = 8;
}

message AssistantTurn {
  string ref = 1;
  int64 sequence = 2;
  string role = 3;
  string content = 4;
  string state = 5;
  AssistantPlan plan = 6;
  google.protobuf.Timestamp created_at = 7;
}

message AssistantConversation {
  string ref = 1;
  int64 version = 2;
  string title = 3;
  string project_ref = 4;
  repeated AssistantTurn turns = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SystemAssistant {
  string ref = 1;
  int64 version = 2;
  string name = 3;
  string system_label = 4;
  string core_prompt_revision = 5;
  string owner_instructions = 6;
  int32 owner_instructions_revision = 7;
  AssistantRuntimeState runtime_state = 8;
  string runtime_revision = 9;
  string warm_session_ref = 10;
  string readiness_summary = 11;
  google.protobuf.Timestamp last_heartbeat_at = 12;
  repeated NextAction next_actions = 13;
}

message AuditEvent {
  string ref = 1;
  string project_ref = 2;
  UserSummary initiator = 3;
  string executor = 4;
  string source = 5;
  string action = 6;
  string resource_type = 7;
  string resource_ref = 8;
  string resource_name = 9;
  string outcome = 10;
  string safe_summary = 11;
  string safe_error_code = 12;
