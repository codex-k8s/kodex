// ListPlatformMembershipsRequest ограничивает размер авторитетного organization-scoped списка.
message ListPlatformMembershipsRequest {
  // page задаёт только bounded pagination и не выбирает organization.
  PageRequest page = 1;
}
// ListPlatformMembershipsResponse содержит platform roles и назначенные сервером next actions.
message ListPlatformMembershipsResponse {
  // memberships не включает project memberships и системные identities.
  repeated Membership memberships = 1;
  // page содержит непрозрачный cursor следующей страницы.
  PageInfo page = 2;
  // next_actions назначается control-plane и разрешает organization-scoped CTA без локального вывода полномочий.
  repeated NextAction next_actions = 3;
}
// ListPlatformMembershipCandidatesRequest ищет только уже проверенные OIDC identities без membership.
message ListPlatformMembershipCandidatesRequest {
  // page задаёт bounded pagination.
  PageRequest page = 1;
  // query сопоставляется только с безопасными display fields внутри organization.
  string query = 2;
}
// ListPlatformMembershipCandidatesResponse не выдаёт внутренние UUID или OIDC subject identifiers.
message ListPlatformMembershipCandidatesResponse {
  // users содержит только opaque refs и безопасные display fields.
  repeated UserSummary users = 1;
  // page содержит непрозрачный cursor следующей страницы.
  PageInfo page = 2;
}
// AddPlatformMembershipRequest создаёт отдельное organization membership с server-owned owner scope.
message AddPlatformMembershipRequest {
  // mutation задаёт idempotency key; actor и organization выводятся из signed context.
  MutationContext mutation = 1;
  // user_ref выбирается из ListPlatformMembershipCandidates и остаётся только locator.
  string user_ref = 2;
  // role проверяется по полномочиям actor; Administrator не может назначить Owner.
  PlatformRole role = 3;
}
// AddPlatformMembershipResponse возвращает авторитетный versioned readback.
message AddPlatformMembershipResponse {
  // membership содержит актуальную role, version и next actions.
  Membership membership = 1;
}
// ChangePlatformMembershipRequest изменяет существующее organization membership по OCC.
message ChangePlatformMembershipRequest {
  // mutation содержит idempotency key и expected version.
  MutationContext mutation = 1;
  // membership_ref разрешается только внутри organization до проверки expected version.
  string membership_ref = 2;
  // role не позволяет обходить защиту Owner и полномочия actor.
  PlatformRole role = 3;
  // active=false атомарно приостанавливает project memberships того же User.
  bool active = 4;
}
// ChangePlatformMembershipResponse возвращает победившее авторитетное состояние.
message ChangePlatformMembershipResponse {
  // membership содержит новую version и допустимые следующие действия.
  Membership membership = 1;
}
// RemovePlatformMembershipRequest отзывает активное organization membership по OCC.
message RemovePlatformMembershipRequest {
  // mutation содержит idempotency key и expected version.
  MutationContext mutation = 1;
  // membership_ref разрешается server-side и не доказывает владение.
  string membership_ref = 2;
}
// RemovePlatformMembershipResponse возвращает inactive membership вместо скрытого удаления истории.
message RemovePlatformMembershipResponse {
  // membership содержит inactive readback и новую version.
  Membership membership = 1;
}

