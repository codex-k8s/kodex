syntax = "proto3";

package controlplane.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/codex-k8s/matter-codex/libs/go/controlplaneapi/gen/controlplane/v1;controlplanev1";

// ControlPlaneService владеет желаемым бизнес-состоянием MatterCodex.
// Actor, organization, project scope и permissions не принимаются в payload:
// transport получает их только из проверенного authorization context #186.
service ControlPlaneService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse);
  rpc TransitionResource(TransitionResourceRequest) returns (TransitionResourceResponse);
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
  // ManageAccessResource — закрытая administrative command для TEAM/ROLE/PROMPT_PROFILE.
  rpc ManageAccessResource(ManageAccessResourceRequest) returns (ManageAccessResourceResponse);
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc SearchResources(SearchResourcesRequest) returns (SearchResourcesResponse);
  rpc SearchMemoryRecords(SearchMemoryRecordsRequest) returns (SearchMemoryRecordsResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListTombstones(ListTombstonesRequest) returns (ListTombstonesResponse);
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (GetDiagnosticsResponse);

  // EnqueueTurn атомарно резервирует следующую FIFO sequence сессии.
  rpc EnqueueTurn(EnqueueTurnRequest) returns (EnqueueTurnResponse);
  // ClaimTurn выдает одну попытку exact workload и использует bounded lease.
  rpc ClaimTurn(ClaimTurnRequest) returns (ClaimTurnResponse);
  // RenewTurn продлевает только текущую attempt/fence/generation lease.
  rpc RenewTurn(RenewTurnRequest) returns (RenewTurnResponse);
  // CompleteTurn завершает только текущую lease и фиксирует terminal outcome.
  rpc CompleteTurn(CompleteTurnRequest) returns (CompleteTurnResponse);
  rpc RetryTurn(RetryTurnRequest) returns (RetryTurnResponse);
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  // ManageSession — единственный lifecycle path SESSION; provider binding выбирает сервер.
  rpc ManageSession(ManageSessionRequest) returns (ManageSessionResponse);
  // ManageMemoryRecord связывает scope и owner с проверенным actor.
  rpc ManageMemoryRecord(ManageMemoryRecordRequest) returns (ManageMemoryRecordResponse);
  // ManageWorkClaim связывает claim с exact process/session/turn/attempt/workload.
  rpc ManageWorkClaim(ManageWorkClaimRequest) returns (ManageWorkClaimResponse);

  // ManageSchedule изменяет schedule только через закрытые server-owned actions.
  rpc ManageSchedule(ManageScheduleRequest) returns (ManageScheduleResponse);
  // ClaimDueSchedules материализует наступившие QUEUED occurrence без запуска runtime.
  rpc ClaimDueSchedules(ClaimDueSchedulesRequest) returns (ClaimDueSchedulesResponse);
  rpc ClaimScheduleOccurrence(ClaimScheduleOccurrenceRequest) returns (ClaimScheduleOccurrenceResponse);
  rpc CompleteScheduleOccurrence(CompleteScheduleOccurrenceRequest) returns (CompleteScheduleOccurrenceResponse);
  rpc CancelScheduleOccurrence(CancelScheduleOccurrenceRequest) returns (CancelScheduleOccurrenceResponse);
  rpc ListScheduleOccurrences(ListScheduleOccurrencesRequest) returns (ListScheduleOccurrencesResponse);

  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc CancelProcess(CancelProcessRequest) returns (CancelProcessResponse);
  rpc RequestOwnerGate(RequestOwnerGateRequest) returns (RequestOwnerGateResponse);
  // RecordOwnerGateDelivery фиксирует durable receipt exact server-owned карточки.
  rpc RecordOwnerGateDelivery(RecordOwnerGateDeliveryRequest) returns (RecordOwnerGateDeliveryResponse);
  // ResolveOwnerGate связывает решение с exact gate/process/session/turn/attempt.
  rpc ResolveOwnerGate(ResolveOwnerGateRequest) returns (ResolveOwnerGateResponse);

  rpc RegisterArtifact(RegisterArtifactRequest) returns (RegisterArtifactResponse);
  rpc RecordArtifactScan(RecordArtifactScanRequest) returns (RecordArtifactScanResponse);
  // GetRuntimeRevision — version-pinned authoritative read для runtime-controller.
  rpc GetRuntimeRevision(GetRuntimeRevisionRequest) returns (GetRuntimeRevisionResponse);
  // RecordMemoryEmbedding фиксирует локальную перестраиваемую projection, не источник истины.
  rpc RecordMemoryEmbedding(RecordMemoryEmbeddingRequest) returns (RecordMemoryEmbeddingResponse);

  // CheckReadiness проверяет authority, PostgreSQL, cache и outbox publisher.
  rpc CheckReadiness(CheckReadinessRequest) returns (CheckReadinessResponse);
}

message CreateProjectRequest {
  string idempotency_key = 1;
  string name = 2;
  ProjectSpec spec = 3;
}

message CreateProjectResponse {
  Resource project = 1;
}

message ListProjectsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListProjectsResponse {
  repeated Resource projects = 1;
  string next_page_token = 2;
}

// ResourceKind — закрытый перечень агрегатов, принадлежащих control-plane.
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_PROJECT = 1;
  RESOURCE_KIND_TEAM = 2;
  RESOURCE_KIND_CHAT = 3;
  RESOURCE_KIND_ROLE = 4;
  RESOURCE_KIND_PROMPT_PROFILE = 5;
  RESOURCE_KIND_CREDENTIAL_BINDING = 6;
  RESOURCE_KIND_REPOSITORY_WORKSPACE = 7;
  RESOURCE_KIND_INTEGRATION = 8;
  RESOURCE_KIND_RUNTIME_REVISION = 9;
  RESOURCE_KIND_SESSION = 10;
  RESOURCE_KIND_TURN = 11;
  RESOURCE_KIND_PROCESS_RUN = 12;
  RESOURCE_KIND_SCHEDULE = 13;
  RESOURCE_KIND_OWNER_GATE = 14;
  RESOURCE_KIND_MEMORY_RECORD = 15;
  RESOURCE_KIND_WORK_CLAIM = 16;
  RESOURCE_KIND_ARTIFACT = 17;
}

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  LIFECYCLE_STATE_ACTIVE = 1;
  LIFECYCLE_STATE_PAUSED = 2;
  LIFECYCLE_STATE_ARCHIVED = 3;
  LIFECYCLE_STATE_DELETION_PENDING = 4;
  LIFECYCLE_STATE_DELETED = 5;
  LIFECYCLE_STATE_QUEUED = 6;
  LIFECYCLE_STATE_CLAIMED = 7;
  LIFECYCLE_STATE_RUNNING = 8;
  LIFECYCLE_STATE_WAITING_OWNER = 9;
  LIFECYCLE_STATE_WAITING_EXTERNAL = 10;
  LIFECYCLE_STATE_SUCCEEDED = 11;
  LIFECYCLE_STATE_FAILED = 12;
  LIFECYCLE_STATE_CANCELLED = 13;
  LIFECYCLE_STATE_EXPIRED = 14;
  LIFECYCLE_STATE_BLOCKED = 15;
}

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  ROOM_TYPE_USER = 1;
  ROOM_TYPE_COORDINATION = 2;
  ROOM_TYPE_WORK_CONTROL = 3;
  ROOM_TYPE_RUNS = 4;
}

enum ScheduleOverlapPolicy {
  SCHEDULE_OVERLAP_POLICY_UNSPECIFIED = 0;
  SCHEDULE_OVERLAP_POLICY_FORBID = 1;
  SCHEDULE_OVERLAP_POLICY_SKIP = 2;
  SCHEDULE_OVERLAP_POLICY_QUEUE = 3;
}

enum ScheduleMisfirePolicy {
  SCHEDULE_MISFIRE_POLICY_UNSPECIFIED = 0;
  SCHEDULE_MISFIRE_POLICY_SKIP = 1;
  SCHEDULE_MISFIRE_POLICY_RUN_ONCE = 2;
  SCHEDULE_MISFIRE_POLICY_CATCH_UP = 3;
  SCHEDULE_MISFIRE_POLICY_WITHIN_GRACE = 4;
}

enum OwnerGateDecision {
  OWNER_GATE_DECISION_UNSPECIFIED = 0;
  OWNER_GATE_DECISION_APPROVED = 1;
  OWNER_GATE_DECISION_REJECTED = 2;
  OWNER_GATE_DECISION_CHANGES_REQUESTED = 3;
  OWNER_GATE_DECISION_CANCELLED = 4;
}

enum AdministrativeAction {
  ADMINISTRATIVE_ACTION_UNSPECIFIED = 0;
  ADMINISTRATIVE_ACTION_CREATE = 1;
  ADMINISTRATIVE_ACTION_UPDATE = 2;
  ADMINISTRATIVE_ACTION_ACTIVATE = 3;
  ADMINISTRATIVE_ACTION_PAUSE = 4;
  ADMINISTRATIVE_ACTION_ARCHIVE = 5;
  ADMINISTRATIVE_ACTION_DELETE = 6;
}

enum ArtifactScanState {
  ARTIFACT_SCAN_STATE_UNSPECIFIED = 0;
  ARTIFACT_SCAN_STATE_PENDING = 1;
  ARTIFACT_SCAN_STATE_SCANNING = 2;
  ARTIFACT_SCAN_STATE_CLEAN = 3;
  ARTIFACT_SCAN_STATE_QUARANTINED = 4;
  ARTIFACT_SCAN_STATE_FAILED = 5;
}

enum ScheduleOccurrenceState {
  SCHEDULE_OCCURRENCE_STATE_UNSPECIFIED = 0;
  SCHEDULE_OCCURRENCE_STATE_QUEUED = 1;
  SCHEDULE_OCCURRENCE_STATE_CLAIMED = 2;
  SCHEDULE_OCCURRENCE_STATE_SUCCEEDED = 3;
  SCHEDULE_OCCURRENCE_STATE_FAILED = 4;
  SCHEDULE_OCCURRENCE_STATE_CANCELLED = 5;
  SCHEDULE_OCCURRENCE_STATE_SKIPPED = 6;
  SCHEDULE_OCCURRENCE_STATE_DEAD_LETTER = 7;
}

enum SessionAction {
  SESSION_ACTION_UNSPECIFIED = 0;
  SESSION_ACTION_CREATE = 1;
  SESSION_ACTION_CLOSE = 2;
  SESSION_ACTION_ARCHIVE = 3;
  SESSION_ACTION_CANCEL = 4;
  SESSION_ACTION_CLEANUP = 5;
}

enum MemoryAction {
  MEMORY_ACTION_UNSPECIFIED = 0;
  MEMORY_ACTION_CREATE = 1;
  MEMORY_ACTION_SUPERSEDE = 2;
  MEMORY_ACTION_ARCHIVE = 3;
}

enum WorkClaimAction {
  WORK_CLAIM_ACTION_UNSPECIFIED = 0;
  WORK_CLAIM_ACTION_CREATE = 1;
  WORK_CLAIM_ACTION_RENEW = 2;
  WORK_CLAIM_ACTION_RELEASE = 3;
}

enum ScheduleSessionPolicy {
  SCHEDULE_SESSION_POLICY_UNSPECIFIED = 0;
  SCHEDULE_SESSION_POLICY_NEW = 1;
  SCHEDULE_SESSION_POLICY_PERSISTENT = 2;
  SCHEDULE_SESSION_POLICY_ROLLING = 3;
}

enum ScheduleNotificationPolicy {
  SCHEDULE_NOTIFICATION_POLICY_UNSPECIFIED = 0;
  SCHEDULE_NOTIFICATION_POLICY_ALWAYS = 1;
  SCHEDULE_NOTIFICATION_POLICY_ON_ACTION = 2;
  SCHEDULE_NOTIFICATION_POLICY_ON_FAILURE = 3;
  SCHEDULE_NOTIFICATION_POLICY_ON_ACTION_OR_FAILURE = 4;
  SCHEDULE_NOTIFICATION_POLICY_AUDIT_ONLY = 5;
}

message ProjectSpec {
  string slug = 1;
  string description = 2;
  string locale = 3;
}

message TeamSpec {
  reserved 1;
  reserved "project_id";
  string stable_key = 2;
  string external_team_ref = 3;
  repeated string member_actor_ids = 4;
  repeated string role_ids = 5;
}

message ChatSpec {
  reserved 1;
  reserved "project_id";
  string stable_key = 2;
  RoomType room_type = 3;
  string default_agent_id = 4;
  string external_channel_ref = 5;
  string work_policy = 6;
}

message RoleSpec {
  string stable_key = 1;
  repeated string capabilities = 2;
  repeated string allowed_target_role_ids = 3;
  string prompt_profile_id = 4;
  repeated string provider_credential_binding_ids = 5;
  repeated string repository_workspace_ids = 6;
  repeated string integration_ids = 7;
}

message PromptProfileSpec {
  uint64 revision = 1;
  string content_sha256 = 2;
  string source_ref = 3;
  string locale = 4;
}

message CredentialBindingSpec {
  string purpose = 1;
  string secret_ref = 2;
  string principal_ref = 3;
  uint64 revision = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RepositoryWorkspaceSpec {
  string repository_ref = 1;
  string workspace_mode = 2;
  string default_branch = 3;
  string credential_binding_id = 4;
}

message IntegrationSpec {
  string definition_ref = 1;
  uint64 definition_version = 2;
  repeated string capabilities = 3;
  repeated string credential_binding_ids = 4;
  string endpoint_ref = 5;
}

message RuntimeRevisionSpec {
  // manifest_sha256 — server-generated digest полного effective snapshot.
  string manifest_sha256 = 1;
  string image_digest = 2;
  string prompt_profile_id = 3;
  uint64 prompt_revision = 4;
  repeated string credential_binding_ids = 5;
  repeated string integration_ids = 6;
  string predecessor_revision_id = 7;
  uint64 authority_policy_revision = 8;
  string authority_policy_sha256 = 9;
  repeated EffectiveResourceRef components = 10;
  google.protobuf.Timestamp created_at = 11;
  string session_id = 12;
  string role_id = 13;
  string chat_id = 14;
  string provider_credential_binding_id = 15;
}

message EffectiveResourceRef {
  ResourceKind kind = 1;
  string resource_id = 2;
  uint64 version = 3;
  string projection_sha256 = 4;
}

message SessionSpec {
  string agent_id = 1;
  string provider_account_binding_id = 2;
  string conversation_id = 3;
  string archive_ref = 4;
  uint64 last_turn_sequence = 5;
}

message TurnSpec {
  string session_id = 1;
  uint64 sequence = 2;
  string source_ref = 3;
  string prompt_artifact_id = 4;
  string runtime_revision_id = 5;
  string process_run_id = 6;
  uint32 attempt = 7;
  string outcome = 8;
  string result_artifact_id = 9;
  string effective_input_sha256 = 10;
  string predecessor_turn_id = 11;
}

message ProcessRunSpec {
  string parent_process_run_id = 1;
  string playbook_ref = 2;
  uint64 policy_revision = 3;
  string root_trigger_ref = 4;
  string result_artifact_id = 5;
  string root_initiator_actor_id = 6;
  string root_session_id = 7;
  string root_turn_id = 8;
  uint32 root_attempt = 9;
  string immutable_input_sha256 = 10;
  string runtime_revision_id = 11;
  string launching_process_run_id = 12;
  string launching_turn_id = 13;
  uint32 launching_attempt = 14;
}

message ScheduleSpec {
  string target_resource_id = 1;
  string cron = 2;
  google.protobuf.Duration interval = 3;
  string timezone = 4;
  ScheduleOverlapPolicy overlap_policy = 5;
  ScheduleMisfirePolicy misfire_policy = 6;
  google.protobuf.Duration misfire_grace = 7;
  google.protobuf.Timestamp next_run_at = 8;
  ResourceKind target_kind = 9;
  uint64 target_version = 10;
  string effective_input_sha256 = 11;
  string calendar = 12;
  string delivery_policy = 13;
  uint32 maximum_attempts = 14;
  google.protobuf.Duration initial_backoff = 15;
  google.protobuf.Duration maximum_backoff = 16;
  google.protobuf.Duration dead_letter_after = 17;
  string prompt_profile_id = 18;
  uint64 prompt_revision = 19;
  ScheduleSessionPolicy session_policy = 20;
  string room_id = 21;
  ScheduleNotificationPolicy notification_policy = 22;
  google.protobuf.Duration maximum_execution_duration = 23;
  bool coalesce = 24;
  string runtime_revision_id = 25;
}

message OwnerGateSpec {
  string process_run_id = 1;
  string result_ref = 2;
  string result_sha256 = 3;
  google.protobuf.Timestamp expires_at = 4;
  OwnerGateDecision decision = 5;
  string decision_reason = 6;
  string root_initiator_actor_id = 7;
  string session_id = 8;
  string turn_id = 9;
  uint32 attempt = 10;
  string immutable_input_sha256 = 11;
  string recipient_actor_id = 12;
  string delivery_workload_id = 13;
  string delivery_spiffe_id = 14;
  string delivery_id = 15;
  string delivery_payload_sha256 = 16;
  string delivery_claim_token_sha256 = 17;
  uint64 delivery_fence = 18;
  string mattermost_post_id = 19;
  string mattermost_channel_id = 20;
  string mattermost_root_post_id = 21;
  google.protobuf.Timestamp delivered_at = 22;
}

message MemoryRecordSpec {
  string scope = 1;
  string role_id = 2;
  string title = 3;
  string content = 4;
  string content_sha256 = 5;
  string provenance = 6;
  uint32 importance = 7;
}

message WorkClaimSpec {
  string process_run_id = 1;
  string turn_id = 2;
  string summary = 3;
  repeated string domains = 4;
  repeated string resource_keys = 5;
  string owner_actor_id = 6;
  string workload_id = 7;
  string session_id = 8;
  uint32 attempt = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message ArtifactSpec {
  string kind = 1;
  string direction = 2;
  string storage_ref = 3;
  uint64 size_bytes = 4;
  string media_type = 5;
  string sha256 = 6;
  ArtifactScanState scan_status = 7;
  string retention_policy_ref = 8;
  uint64 scan_policy_revision = 9;
  string scan_evidence_sha256 = 10;
  string scanner_workload_id = 11;
  google.protobuf.Timestamp scanned_at = 12;
}

message ResourceSpec {
  oneof value {
    ProjectSpec project = 1;
    TeamSpec team = 2;
    ChatSpec chat = 3;
    RoleSpec role = 4;
    PromptProfileSpec prompt_profile = 5;
    CredentialBindingSpec credential_binding = 6;
    RepositoryWorkspaceSpec repository_workspace = 7;
    IntegrationSpec integration = 8;
    RuntimeRevisionSpec runtime_revision = 9;
    SessionSpec session = 10;
    TurnSpec turn = 11;
    ProcessRunSpec process_run = 12;
    ScheduleSpec schedule = 13;
    OwnerGateSpec owner_gate = 14;
    MemoryRecordSpec memory_record = 15;
    WorkClaimSpec work_claim = 16;
    ArtifactSpec artifact = 17;
  }
}

message Resource {
  string id = 1;
  ResourceKind kind = 2;
  string name = 3;
  LifecycleState state = 4;
  uint64 version = 5;
  string project_id = 6;
  string parent_id = 7;
  ResourceSpec spec = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateResourceRequest {
  string idempotency_key = 1;
  // RESOURCE_KIND_PROJECT запрещён: tenant-scoped create имеет отдельный RPC.
  ResourceKind kind = 2;
  string name = 3;
  reserved 4;
  reserved "project_id";
  string parent_id = 5;
  ResourceSpec spec = 6;
}

message CreateResourceResponse {
  Resource resource = 1;
}

message UpdateResourceRequest {
  string idempotency_key = 1;
  string resource_id = 2;
  uint64 expected_version = 3;
  string name = 4;
  ResourceSpec spec = 5;
}

message UpdateResourceResponse {
  Resource resource = 1;
}

message TransitionResourceRequest {
  string idempotency_key = 1;
  string resource_id = 2;
  uint64 expected_version = 3;
  LifecycleState target_state = 4;
  string reason_code = 5;
}

message TransitionResourceResponse {
  Resource resource = 1;
}

message DeleteResourceRequest {
  string idempotency_key = 1;
  string resource_id = 2;
  uint64 expected_version = 3;
}

message DeleteResourceResponse {
  Resource resource = 1;
}

message ManageAccessResourceRequest {
  string idempotency_key = 1;
